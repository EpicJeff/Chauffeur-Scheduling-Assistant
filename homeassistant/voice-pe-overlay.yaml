# Home Assistant Voice PE -- server-side (streaming) wake word. WORKING CONFIG.
#
# A RECORD, NOT A SOURCE FILE. The real config lives only in ESPHome Builder
# inside Home Assistant; nothing here is deployed, pulled or included. This copy
# exists so the working setup survives a rebuilt device, and so the reasoning
# behind each line is written down somewhere the Builder's editor is not.
# Change ESPHome first, then update this to match.
#
# This is the whole device config as it appears in ESPHome Builder, and it is
# deliberately NOT a fork of home-assistant-voice.yaml. Upstream comes in as a
# package; everything under `voice_assistant:` is an overlay on it. Package
# merging replaces scalars with the value here and CONCATENATES lists, which is
# what lets ~1600 lines stay upstream's problem and keep working as its
# components move around inside ESPHome core.
#
# Forking that file instead is the trap: its components were upstreamed, so an
# old copy fails one at a time -- `aic3204` missing, then
# `microphone.nabu_microphone` missing, then the media player id, then the sound
# files -- and the finish line is a hand-built copy of upstream that drifts again.
#
# See homeassistant/README.md for why each piece is here and what to check when
# one of them misbehaves.

# The encryption key is a SECRET and this repo is public. Keep the real value in
# ESPHome's secrets.yaml; never paste it into a tracked file.
api:
  encryption:
    key: !secret api_encryption_key

substitutions:
  name: kitchen-voice-assistant
  friendly_name: Kitchen Voice Assistant

packages:
  Nabu Casa.Home Assistant Voice PE: github://esphome/home-assistant-voice-pe/home-assistant-voice.yaml

esphome:
  name: ${name}
  name_add_mac_suffix: false
  friendly_name: ${friendly_name}

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

# ── server-side wake word ──
voice_assistant:
  # Scalar: replaces upstream's `false`, so the pipeline runs a wake stage in
  # Home Assistant instead of on the device.
  use_wake_word: true

  # Left at upstream's defaults ON PURPOSE. The obvious move is to copy the
  # canonical streaming config (m5stack-atom-echo), which runs
  # noise_suppression_level: 2 / auto_gain: 31dBFS / volume_multiplier: 2.0 --
  # but those numbers exist for the ATOM Echo's raw, quiet microphone, which is
  # exactly what the Voice PE's XMOS chip already replaces. Home Assistant does
  # apply them (they reach MicroVadSpeexEnhancer), so on an already-conditioned
  # stream they stack a second AGC and noise suppressor on the first. Measured
  # here: no improvement. Over-driven audio presents identically to quiet audio.
  noise_suppression_level: 0
  auto_gain: 0 dbfs
  volume_multiplier: 1.0

  # List: CONCATENATED onto upstream's, which only starts micro_wake_word and
  # never opens a stream -- so nothing was ever sent to the server. These run
  # after upstream's actions. The delay lets the API server settle; without it
  # the request goes out while Home Assistant is still bringing the
  # voice-assistant subscription up, fails, and nothing retries. The lambda
  # re-asserts the wake stage because the YAML `use_wake_word` is only an
  # INITIAL value and any stop clears it -- a continuous stream started with it
  # false asks for speech-to-text with no wake stage, so openWakeWord is handed
  # no audio at all.
  on_client_connected:
    - delay: 2s
    - lambda: id(va).set_use_wake_word(true);
    - voice_assistant.start_continuous:

  # Reply finished playing -> back to idle.
  #
  # Upstream does this at the end of `on_end`, behind
  # `wait_until: not voice_assistant.is_running` -- which never completes in
  # continuous mode, because continuous mode IS the assistant never stopping.
  # The ring then spins forever while the device is in fact still listening.
  # on_tts_stream_end would be the natural trigger and cannot be used: it
  # requires a `speaker:` and this device drives a `media_player:`. on_tts_end
  # fires when the speech is READY rather than heard, so bracket the actual
  # playback instead. Both waits are bounded -- an unbounded one is the bug
  # being worked around.
  on_tts_end:
    - wait_until:
        condition:
          media_player.is_announcing:
            id: external_media_player
        timeout: 3s
    - wait_until:
        condition:
          not:
            media_player.is_announcing:
              id: external_media_player
        timeout: 60s
    - lambda: id(voice_assistant_phase) = ${voice_assist_idle_phase_id};
    - script.execute: control_leds

  # Same for failures -- upstream lights the error phase and relies on that
  # same unreachable code to clear it. The delay lets the error be seen first.
  on_error:
    - delay: 2s
    - lambda: id(voice_assistant_phase) = ${voice_assist_idle_phase_id};
    - script.execute: control_leds

