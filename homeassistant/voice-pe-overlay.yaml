# Home Assistant Voice PE — server-side (streaming) wake word.
#
# This is the WHOLE device config, as it appears in ESPHome Builder. It is not
# a fork of home-assistant-voice.yaml: the upstream config comes in as a
# package and everything below `voice_assistant:` is an overlay on it. Package
# merging replaces scalars with the value here and concatenates lists, so the
# ~1600-line upstream file stays upstream's problem and keeps working as its
# components move around in ESPHome core.
#
# See homeassistant/README.md for why each piece is here and what to check when
# one of them misbehaves.

substitutions:
  name: kitchen-voice-assistant
  friendly_name: Kitchen Voice Assistant

packages:
  Nabu Casa.Home Assistant Voice PE: github://esphome/home-assistant-voice-pe/home-assistant-voice.yaml@dev

esphome:
  name: ${name}
  name_add_mac_suffix: false
  friendly_name: ${friendly_name}

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

voice_assistant:
  # ── scalars: each REPLACES upstream's value ──────────────────────────────
  # Run the wake stage in Home Assistant instead of on the device.
  use_wake_word: true

  # Upstream zeroes these three: the XMOS chip conditions the audio and the
  # wake word was decided ON the device, where a quiet stream is fine. Once the
  # server has to find the start of speech in it, that same stream is too cold
  # for voice-activity detection and the command is cut off before it starts.
  # These match the canonical server-side config (esphome m5stack-atom-echo).
  #
  # Try the device's "finished speaking detection: relaxed" setting FIRST — it
  # needs no reflash. Only add these if it is still intermittent.
  noise_suppression_level: 2
  auto_gain: 31dBFS
  volume_multiplier: 2.0

  # ── lists: each CONCATENATES onto upstream's ─────────────────────────────
  # Upstream only starts micro_wake_word here and never opens a stream, so
  # nothing was ever sent to the server. These run after upstream's actions.
  on_client_connected:
    - delay: 2s                                   # let the API server settle
    - lambda: id(va).set_use_wake_word(true);     # the flag does not survive a stop
    - voice_assistant.start_continuous:

  # Put the LED ring back to idle when the reply has finished PLAYING.
  # Upstream does this at the end of on_end, behind
  # `wait_until: not voice_assistant.is_running` — which never completes in
  # continuous mode, because continuous mode is the assistant never stopping.
  # on_tts_stream_end would be the obvious trigger and cannot be used: it
  # requires a `speaker:`, and this device drives a `media_player:`.
  # Both waits are bounded, because an unbounded one is the bug being fixed.
  on_tts_end:
    - wait_until:
        condition:
          media_player.is_announcing:
            id: external_media_player
        timeout: 3s
    - wait_until:
        condition:
          not:
            media_player.is_announcing:
              id: external_media_player
        timeout: 60s
    - lambda: id(voice_assistant_phase) = ${voice_assist_idle_phase_id};
    - script.execute: control_leds

  # Same for the failure path, which upstream clears in that same unreachable
  # code. The delay lets the error actually be seen first.
  on_error:
    - delay: 2s
    - lambda: id(voice_assistant_phase) = ${voice_assist_idle_phase_id};
    - script.execute: control_leds
