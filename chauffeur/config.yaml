name: "Chauffeur"
description: "A smart Graph-based Calendar Assistant for mapping overlapping family driving routes."
version: "2.20.3"
slug: "chauffeur"
init: false
arch:
  - aarch64
  - amd64
  - armv7
  - i386
startup: application
boot: auto
hassio_api: true
homeassistant_api: true
map:
  - config:rw
ports:
  8000/tcp: null
options:
  google_service_account_json: ""
  mapbox_api_key: ""
  unsplash_api_key: ""
  serpapi_api_key: ""
  # Cached durations are Mapbox free-flow 'driving' times between fixed
  # addresses; they do not go stale. A short TTL only re-buys identical
  # numbers - at 10 minutes this blew past the 100k/month Matrix allowance.
  route_cache_duration_mins: 43200
schema:
  google_service_account_json: str
  mapbox_api_key: str?
  unsplash_api_key: str?
  serpapi_api_key: str?
  route_cache_duration_mins: int
ingress: true
ingress_port: 8000
panel_icon: mdi:car-multiple
panel_title: "Chauffeur"
