name: "Chauffeur"
description: "A smart Graph-based Calendar Assistant for mapping overlapping family driving routes."
version: "1.2.4"
slug: "chauffeur"
init: false
arch:
  - aarch64
  - amd64
  - armv7
  - i386
startup: application
boot: auto
map:
  - config:rw
ports:
  8000/tcp: null
options:
  google_service_account_json: ""
  google_maps_api_key: ""
  route_cache_duration_mins: 10
schema:
  google_service_account_json: str
  google_maps_api_key: str?
  route_cache_duration_mins: int
ingress: true
ingress_port: 8000
panel_icon: mdi:car-multiple
panel_title: "Chauffeur"
