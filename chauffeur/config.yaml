name: "Chauffeur"
description: "A smart Graph-based Calendar Assistant for mapping overlapping family driving routes."
version: "2.226.1"
slug: "chauffeur"
init: false
arch:
  - aarch64
  - amd64
  - armv7
  - i386
startup: application
boot: auto
hassio_api: true
homeassistant_api: true
map:
  - config:rw
  # Moment media can live outside /data (the VM's virtual disk). HA network
  # storage mounts land under these, so media_root can point at a NAS or a
  # share off the host's big drive without ever resizing the VM.
  - media:rw
  - share:rw
ports:
  8000/tcp: null
options:
  google_service_account_json: ""
  mapbox_api_key: ""
  unsplash_api_key: ""
  serpapi_api_key: ""
  # Where moment photos/clips are stored. Empty = beside the database on
  # /data. Point it at a mounted share (e.g. /media/family or /share/family)
  # to keep a growing archive off the add-on's data volume. Files already
  # stored are relocated in the background and never stop being served.
  media_root: ""
  # Cached durations are Mapbox free-flow 'driving' times between fixed
  # addresses; they do not go stale. A short TTL only re-buys identical
  # numbers - at 10 minutes this blew past the 100k/month Matrix allowance.
  route_cache_duration_mins: 43200
  # Walmart I/O (arc W1). Only needed for SEARCH — building the cart itself is
  # an unauthenticated URL and works without any of this. The private key is
  # the PEM text of the key whose public half you uploaded to walmart.io.
  walmart_consumer_id: ""
  walmart_key_version: "1"
  walmart_private_key: ""
schema:
  google_service_account_json: str
  mapbox_api_key: str?
  unsplash_api_key: str?
  serpapi_api_key: str?
  route_cache_duration_mins: int
  media_root: str?
  walmart_consumer_id: str?
  walmart_key_version: str?
  walmart_private_key: str?
ingress: true
ingress_port: 8000
panel_icon: mdi:car-multiple
panel_title: "Chauffeur"
