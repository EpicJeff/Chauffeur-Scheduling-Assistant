name: "Chauffeur"
description: "A smart Graph-based Calendar Assistant for mapping overlapping family driving routes."
version: "v1.8.206"
slug: "chauffeur"
init: false
arch:
  - aarch64
  - amd64
  - armv7
  - i386
startup: application
boot: auto
hassio_api: true
map:
  - config:rw
ports:
  8000/tcp: null
options:
  google_service_account_json: ""
  mapbox_api_key: ""
  route_cache_duration_mins: 10
  disable_mapbox_matrix: false
  disable_mapbox_directions: false
  mapbox_matrix_limit: 90000
  mapbox_directions_limit: 90000
  mapbox_geocode_limit: 90000
schema:
  google_service_account_json: str
  mapbox_api_key: str?
  route_cache_duration_mins: int
  disable_mapbox_matrix: bool?
  disable_mapbox_directions: bool?
  mapbox_matrix_limit: int?
  mapbox_directions_limit: int?
  mapbox_geocode_limit: int?
ingress: true
ingress_port: 8000
panel_icon: mdi:car-multiple
panel_title: "Chauffeur"
