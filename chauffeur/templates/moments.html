<!DOCTYPE html>
<html lang="en" class="dark">

<!-- The Moments gallery — the wall-panel surface for looking BACK (the hearth
     rail only ever shows the last few). Two levels: a card per EVENT, then
     that event's moments. No time limit — moments are exempt from the chat
     retention cap, so this is the family's whole history; both levels page
     on scroll and load media by URL (never inline data URLs) so opening it
     is cheap no matter how many seasons pile up. -->

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Moments</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script>
        tailwind = {
            config: {
                darkMode: 'class',
                theme: {
                    extend: {
                        fontFamily: { sans: ['Inter', 'sans-serif'] },
                        colors: { gray: { 900: '#111827', 800: '#1F2937', 700: '#374151', 600: '#4B5563' } }
                    }
                }
            }
        };
    </script>
    {% include 'ha_theme.html' %}
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #111827; color: #e5e7eb; }
        .tile-media { width: 100%; height: 100%; object-fit: cover; background: #000; }
    </style>
</head>

<body class="flex flex-col h-screen overflow-hidden">
    {% include 'nav.html' %}

    <div class="flex-1 overflow-y-auto bg-gray-900/50" id="moments-scroll">
        <div class="mx-auto p-6 lg:p-10 w-full max-w-7xl">
            <header id="moments-header" class="mb-6">
                <div id="events-header">
                    <h2 class="text-3xl font-bold text-white mb-2">📸 Moments</h2>
                    <p class="text-gray-400" id="moments-sub">Every moment the family has shared, by activity.</p>
                </div>
                <div id="event-header" style="display:none">
                    <button onclick="showEvents()"
                        class="text-sm text-pink-300 hover:text-pink-200 font-bold mb-2">← All moments</button>
                    <h2 class="text-3xl font-bold text-white" id="event-title"></h2>
                    <p class="text-gray-400 text-sm mt-1" id="event-sub"></p>
                </div>
            </header>

            <div id="moments-body"><div class="text-gray-500">Loading…</div></div>
            <div id="scroll-sentinel" class="h-12"></div>
            <div id="loading-more" class="text-center text-gray-600 text-sm pb-6" style="display:none">Loading more…</div>
        </div>
    </div>

    {% include 'components/control_center.html' %}

    <script>
        (function () {
            const params = new URLSearchParams(window.location.search);
            const isKiosk = params.get('kiosk') === 'true';
            const hideTitle = ['none', 'off', '0', 'false', 'hide'].includes(
                (params.get('title') || '').toLowerCase());
            const apiBase = window.location.pathname.endsWith('/') ? '../' : '';
            const EVENTS_PAGE = 24, MOMENTS_PAGE = 30;

            let view = 'events';
            let evOffset = 0, evMore = true, evItems = [];
            let mOffset = 0, mMore = true, mItems = [], mChannel = null;
            let loading = false;

            function esc(s) {
                const d = document.createElement('div');
                d.textContent = s == null ? '' : String(s);
                return d.innerHTML;
            }
            function url(u) { return `${apiBase}${String(u || '').replace(/^\//, '')}`; }

            function dayLabel(ts) {
                const d = new Date(ts * 1000), now = new Date();
                const startOf = x => new Date(x.getFullYear(), x.getMonth(), x.getDate()).getTime();
                const diff = Math.round((startOf(now) - startOf(d)) / 86400000);
                if (diff === 0) return 'Today';
                if (diff === 1) return 'Yesterday';
                if (diff > 1 && diff < 7) return d.toLocaleDateString([], { weekday: 'long' });
                if (d.getFullYear() === now.getFullYear())
                    return d.toLocaleDateString([], { weekday: 'short', month: 'short', day: 'numeric' });
                return d.toLocaleDateString([], { month: 'short', day: 'numeric', year: 'numeric' });
            }
            function timeLabel(ts) {
                return new Date(ts * 1000).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
            }

            // A soft play glyph, not the OS emoji (which renders differently
            // on every panel and looks like a sticker).
            const PLAY_BADGE = `
                <span class="absolute inset-0 flex items-center justify-center pointer-events-none">
                    <span class="flex items-center justify-center w-12 h-12 rounded-full bg-black/55 backdrop-blur-sm ring-1 ring-white/25">
                        <svg viewBox="0 0 24 24" class="w-6 h-6 translate-x-[1px]" fill="white" opacity="0.95">
                            <path d="M8 5.5v13a1 1 0 001.53.85l10-6.5a1 1 0 000-1.7l-10-6.5A1 1 0 008 5.5z"/>
                        </svg>
                    </span>
                </span>`;

            // Tiles ALWAYS render a still image — never a <video> element.
            // Clips carry an ffmpeg-extracted poster frame, so a grid of 200
            // clips costs 200 thumbnails, not 200 video streams (and never
            // shows the black box browsers paint for preload=metadata).
            function thumb(posterUrl, kind, fullUrl) {
                return `<img src="${url(posterUrl)}" loading="lazy" data-fallback="${url(fullUrl || posterUrl)}"
                            onerror="momentThumbFallback(this)" class="tile-media">`
                    + (kind === 'video' ? PLAY_BADGE : '');
            }

            // A thumbnail that fails (missing poster frame) must never leave
            // an empty tile — fall back to the media itself.
            window.momentThumbFallback = function (img) {
                const src = img.getAttribute('data-fallback');
                if (!src || img.dataset.fellBack) return;
                img.dataset.fellBack = '1';
                const v = document.createElement('video');
                v.src = src; v.muted = true; v.playsInline = true;
                v.preload = 'metadata'; v.className = img.className;
                img.replaceWith(v);
            };

            function reactionPills(m) {
                const r = m.reactions || {};
                const keys = Object.keys(r).filter(e => (r[e] || []).length);
                if (!keys.length) return '';
                // Display-only: a wall panel has no signed-in identity to
                // attribute a tap to (reacting lives in the PWA).
                return `<div class="flex gap-1 flex-wrap mt-1">` + keys.map(e =>
                    `<span class="text-[11px] leading-none px-1.5 py-0.5 rounded-full bg-gray-800 border border-gray-700">${e}${r[e].length > 1 ? `<span class="text-[10px] text-gray-400 ml-0.5">${r[e].length}</span>` : ''}</span>`
                ).join('') + `</div>`;
            }

            window.openMomentLightbox = function (id) {
                const m = mItems.find(x => x.id === id);
                if (!m) return;
                const media = m.kind === 'video'
                    ? `<video src="${url(m.media_url)}" poster="${url(m.poster_url)}" autoplay muted loop playsinline controls class="max-h-[68vh] rounded-2xl mx-auto"></video>`
                    : `<img src="${url(m.media_url)}" class="max-h-[68vh] rounded-2xl mx-auto object-contain">`;
                const overlay = document.createElement('div');
                overlay.className = 'fixed inset-0 z-[210] flex items-center justify-center p-6';
                overlay.style.background = 'rgba(0,0,0,0.88)';
                overlay.innerHTML = `
                    <div class="relative text-center bg-gray-900 border border-pink-500/40 rounded-3xl shadow-2xl p-6 max-w-4xl">
                        <div class="text-[12px] font-black uppercase tracking-widest text-pink-300 mb-2">📸 ${esc(m.event_title)}</div>
                        ${media}
                        ${m.body ? `<div class="text-xl text-white font-bold mt-3">${esc(m.body)}</div>` : ''}
                        <div class="text-sm text-gray-400 mt-2">from ${esc(m.sender_name)} · ${dayLabel(m.ts)} ${timeLabel(m.ts)}</div>
                    </div>`;
                overlay.addEventListener('click', () => overlay.remove());
                document.body.appendChild(overlay);
            };

            const tileMin = isKiosk ? '300px' : '220px';
            function gridOpen() {
                return `<div class="grid gap-4" style="grid-template-columns: repeat(auto-fill, minmax(${tileMin}, 1fr))">`;
            }

            function renderEvents() {
                const body = document.getElementById('moments-body');
                if (!evItems.length) {
                    body.innerHTML = `<div class="bg-gray-800/60 rounded-2xl border border-gray-700 p-8 text-center">
                        <div class="text-4xl mb-3">📸</div>
                        <div class="text-white font-bold mb-1">No moments yet</div>
                        <div class="text-gray-400 text-sm">When someone's at a game or a recital, Chauffeur asks them
                            to share a moment — it'll show up here for everyone who couldn't be there.</div>
                    </div>`;
                    return;
                }
                body.innerHTML = gridOpen() + evItems.map(e => `
                    <button onclick="showEvent('${e.channel_id}')"
                        class="text-left bg-gray-800/60 rounded-2xl border border-pink-900/40 overflow-hidden hover:border-pink-500/60 transition-colors">
                        <div class="relative w-full" style="aspect-ratio: 4/3">
                            ${thumb(e.cover_url, e.cover_kind, e.cover_media_url)}
                            <span class="absolute top-2 right-2 text-[11px] font-bold bg-black/70 text-white px-2 py-0.5 rounded-full">
                                ${e.count} moment${e.count !== 1 ? 's' : ''}</span>
                        </div>
                        <div class="p-3">
                            <div class="font-bold text-white text-sm truncate">${esc(e.event_title)}</div>
                            <div class="text-[11px] text-gray-500 mt-1">${dayLabel(e.latest_ts)}${e.sender_names.length ? ' · ' + esc(e.sender_names.join(', ')) : ''}</div>
                        </div>
                    </button>`).join('') + `</div>`;
            }

            function renderMoments() {
                const body = document.getElementById('moments-body');
                body.innerHTML = gridOpen() + mItems.map(m => `
                    <button onclick="openMomentLightbox('${m.id}')"
                        class="text-left bg-gray-800/60 rounded-2xl border border-pink-900/40 overflow-hidden hover:border-pink-500/60 transition-colors">
                        <div class="relative w-full" style="aspect-ratio: 4/3">${thumb(m.poster_url, m.kind, m.media_url)}</div>
                        <div class="p-3">
                            ${m.body ? `<div class="text-[13px] text-gray-200">${esc(m.body)}</div>` : ''}
                            <div class="text-[11px] text-gray-500 mt-1">from ${esc(m.sender_name)} · ${dayLabel(m.ts)} ${timeLabel(m.ts)}</div>
                            ${reactionPills(m)}
                        </div>
                    </button>`).join('') + `</div>`;
            }

            async function loadEventsPage() {
                if (loading || !evMore) return;
                loading = true;
                document.getElementById('loading-more').style.display = evOffset ? 'block' : 'none';
                try {
                    const res = await fetch(`${apiBase}api/presence/moment-events?offset=${evOffset}&limit=${EVENTS_PAGE}`);
                    if (res.ok) {
                        const data = await res.json();
                        evItems = evItems.concat(data.items || []);
                        evMore = !!data.has_more;
                        evOffset += EVENTS_PAGE;
                        if (view === 'events') renderEvents();
                        const sub = document.getElementById('moments-sub');
                        if (sub && data.total) {
                            sub.textContent = `${data.total} activit${data.total !== 1 ? 'ies' : 'y'} with moments — everything, all the way back.`;
                        }
                    }
                } catch (e) { }
                document.getElementById('loading-more').style.display = 'none';
                loading = false;
            }

            async function loadMomentsPage() {
                if (loading || !mMore || !mChannel) return;
                loading = true;
                document.getElementById('loading-more').style.display = mOffset ? 'block' : 'none';
                try {
                    const res = await fetch(`${apiBase}api/presence/event-moments?channel_id=${encodeURIComponent(mChannel)}&offset=${mOffset}&limit=${MOMENTS_PAGE}`);
                    if (res.ok) {
                        const data = await res.json();
                        mItems = mItems.concat(data.items || []);
                        mMore = !!data.has_more;
                        mOffset += MOMENTS_PAGE;
                        document.getElementById('event-title').textContent = data.event_title || 'Moments';
                        document.getElementById('event-sub').textContent =
                            `${data.total} moment${data.total !== 1 ? 's' : ''}`;
                        if (view === 'event') renderMoments();
                    }
                } catch (e) { }
                document.getElementById('loading-more').style.display = 'none';
                loading = false;
            }

            window.showEvent = function (channelId) {
                view = 'event';
                mChannel = channelId; mItems = []; mOffset = 0; mMore = true;
                document.getElementById('events-header').style.display = 'none';
                document.getElementById('event-header').style.display = hideTitle ? 'none' : 'block';
                document.getElementById('moments-body').innerHTML = '<div class="text-gray-500">Loading…</div>';
                document.getElementById('moments-scroll').scrollTop = 0;
                loadMomentsPage();
            };

            window.showEvents = function () {
                view = 'events';
                mChannel = null; mItems = [];
                document.getElementById('event-header').style.display = 'none';
                document.getElementById('events-header').style.display = hideTitle ? 'none' : 'block';
                renderEvents();
                document.getElementById('moments-scroll').scrollTop = 0;
            };

            // Infinite scroll for whichever level is showing.
            new IntersectionObserver(entries => {
                if (!entries.some(e => e.isIntersecting)) return;
                if (view === 'events') loadEventsPage(); else loadMomentsPage();
            }, { root: document.getElementById('moments-scroll'), rootMargin: '400px' })
                .observe(document.getElementById('scroll-sentinel'));

            if (hideTitle) document.getElementById('moments-header').style.display = 'none';
            loadEventsPage();
            // Kiosk panels are unattended: keep the top level current, but
            // never yank the view out from under someone browsing an event.
            if (isKiosk) {
                setInterval(() => {
                    if (view !== 'events' || loading) return;
                    evItems = []; evOffset = 0; evMore = true;
                    loadEventsPage();
                }, 60000);
            }
        })();
    </script>
</body>

</html>
