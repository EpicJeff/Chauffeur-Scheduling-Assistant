<!DOCTYPE html>
<html lang="en" class="dark">

<!-- The Moments gallery — the wall-panel surface for looking BACK (the hearth
     rail only ever shows the last few). Two levels: a card per EVENT, then
     that event's moments. No time limit — moments are exempt from the chat
     retention cap, so this is the family's whole history; both levels page
     on scroll and load media by URL (never inline data URLs) so opening it
     is cheap no matter how many seasons pile up. -->

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Moments</title>
    <link href="{{ 'static/vendor/fonts/inter/inter.css'|ver }}" rel="stylesheet">
    {% include 'ha_theme.html' %}
    <style>
        body { background-color: #111827; color: #e5e7eb; }
        .tile-media { width: 100%; height: 100%; object-fit: cover; background: #000; }
    </style>
    <link rel="stylesheet" href="{{ 'static/tailwind.css'|ver }}">
</head>

<body class="flex flex-col h-screen overflow-hidden">
    {% include 'nav.html' %}

    <div class="flex-1 overflow-y-auto bg-gray-900/50" id="moments-scroll">
        <div class="panel-page mx-auto p-6 lg:p-10 w-full max-w-7xl">
            <header id="moments-header" class="mb-6">
                <div id="events-header">
                    <h2 class="panel-page-title">Moments</h2>
                    <p class="text-gray-400" id="moments-sub">Every moment the family has shared, by activity.</p>
                </div>
                <div id="event-header" style="display:none">
                    <h2 class="text-3xl font-bold text-white" id="event-title"></h2>
                    <p class="text-gray-400 text-sm mt-1" id="event-sub"></p>
                </div>
            </header>

            <!-- The gallery itself is components/moments_gallery.html now, and
                 this page is one of its two callers — the Moments BOARD is the
                 other. Everything that used to live here (both levels, both
                 paging cursors, the lightbox, the in-place refresh, the way
                 back up) moved there unchanged; what stays is this page's own
                 chrome, kept in step through the component's onView. -->
            <div id="moments-body"></div>
        </div>
    </div>

    {% include 'components/moments_gallery.html' %}
    {% include 'components/control_center.html' %}

    <script>
        (function () {
            const params = new URLSearchParams(window.location.search);
            const isKiosk = params.get('kiosk') === 'true';
            const hideTitle = ['none', 'off', '0', 'false', 'hide'].includes(
                (params.get('title') || '').toLowerCase());
            const apiBase = window.location.pathname.endsWith('/') ? '../' : '';

            if (hideTitle) document.getElementById('moments-header').style.display = 'none';

            const gallery = MomentsGallery.mount(document.getElementById('moments-body'), {
                apiBase: apiBase,
                scroller: document.getElementById('moments-scroll'),
                // A kiosk is read from further away than a laptop.
                tileMin: isKiosk ? '300px' : '220px',
                // The PAGE pushes history, so a phone's back swipe and
                // Android's back button pop a level like any other screen. A
                // board card deliberately does not.
                history: true,
                // Unattended panels keep themselves current.
                poll: isKiosk ? 60 : 0,
                // The page's content column is inset; the sticky bar bleeds
                // back out to the edges so it covers what scrolls under it.
                backBleed: '-mx-6 lg:-mx-10 px-6 lg:px-10',
                onView: function (s) {
                    document.getElementById('events-header').style.display =
                        (s.view === 'events' && !hideTitle) ? 'block' : 'none';
                    document.getElementById('event-header').style.display =
                        (s.view === 'event' && !hideTitle) ? 'block' : 'none';
                    if (s.view === 'event') {
                        document.getElementById('event-title').textContent = s.title || 'Moments';
                        document.getElementById('event-sub').textContent =
                            `${s.total} moment${s.total !== 1 ? 's' : ''}`;
                    } else {
                        const sub = document.getElementById('moments-sub');
                        if (sub && s.total) {
                            sub.textContent = `${s.total} activit${s.total !== 1 ? 'ies' : 'y'} with moments — everything, all the way back.`;
                        }
                    }
                },
            });
            // The control centre's delete flow reaches for this by name.
            window.momentsGallery = gallery;
        })();
    </script>
</body>

</html>
