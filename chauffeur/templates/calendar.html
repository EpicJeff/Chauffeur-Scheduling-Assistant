<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chauffeur - Calendar</title>
    <script>
        tailwind = {
            config: {
                darkMode: 'class',
                theme: {
                    extend: {}
                }
            }
        };
    </script>
    {% include 'ha_theme.html' %}
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.15/index.global.min.js"></script>
    <style>
        body { 
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%); /* slate-900 to slate-800 */
            color: white; 
            min-height: 100vh;
        }
        
        /* Premium Glassmorphic Calendar Base */
        .fc-theme-standard td, .fc-theme-standard th, .fc-theme-standard .fc-scrollgrid { 
            border-color: rgba(255, 255, 255, 0.08) !important; 
        }
        .fc-daygrid-day-number, .fc-col-header-cell-cushion { 
            color: #cbd5e1 !important; /* slate-300 */
            text-decoration: none !important; 
            font-weight: 600; 
            font-size: 0.95rem;
            padding: 8px !important;
        }
        .fc-day-other .fc-daygrid-day-number {
            color: #475569 !important; /* slate-600 */
        }
        
        /* Cell Backgrounds */
        .fc-day { background-color: rgba(30, 41, 59, 0.3) !important; } /* transparent slate-800 */
        .fc-day-today { background-color: rgba(51, 65, 85, 0.6) !important; } /* slate-700 */
        
        /* Event Resets */
        .fc-event { 
            border: none !important; 
            margin: 2px !important; 
            background: transparent !important; 
            box-shadow: none !important;
        }
        
        .fc-timegrid-slot { height: 2.5em !important; border-bottom: 1px solid rgba(255,255,255,0.03) !important; }
        
        /* Toolbar */
        .fc .fc-toolbar-title { 
            font-size: 1.75rem !important; 
            font-weight: 800; 
            color: #f8fafc; 
            letter-spacing: -0.025em; 
        }
        .fc .fc-button-primary { 
            background-color: rgba(51, 65, 85, 0.8) !important; 
            border-color: rgba(255, 255, 255, 0.1) !important; 
            backdrop-filter: blur(8px); 
            -webkit-backdrop-filter: blur(8px);
            transition: all 0.2s; 
            color: #cbd5e1 !important;
            font-weight: 600 !important;
            text-transform: capitalize !important;
        }
        .fc .fc-button-primary:hover { 
            background-color: rgba(71, 85, 105, 0.9) !important; 
            color: white !important;
        }
        .fc .fc-button-primary:not(:disabled):active, .fc .fc-button-primary:not(:disabled).fc-button-active { 
            background-color: #3b82f6 !important; /* Blue-500 */
            color: white !important; 
            border-color: #2563eb !important;
        }
        
        .glass-panel {
            background: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }
        
        /* Popover (+ more) as a Centered Modal */
        .fc-popover {
            position: fixed !important;
            top: 50% !important;
            left: 50% !important;
            transform: translate(-50%, -50%) !important;
            width: 90% !important;
            max-width: 360px !important;
            background: rgba(15, 23, 42, 0.85) !important;
            backdrop-filter: blur(16px) !important;
            -webkit-backdrop-filter: blur(16px) !important;
            border: 1px solid rgba(255, 255, 255, 0.15) !important;
            border-radius: 12px !important;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5) !important;
            z-index: 100 !important;
            overflow: hidden !important;
        }
        .fc-popover-header {
            background: rgba(255, 255, 255, 0.05) !important;
            padding: 12px !important;
        }
        .fc-popover-title {
            color: #f8fafc !important;
            font-weight: 700 !important;
            font-size: 1.1rem !important;
        }
        .fc-popover-body {
            max-height: 60vh !important;
            overflow-y: auto !important;
            padding: 8px !important;
        }

        /* Custom scrollbar for events and popovers */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.2); border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(255, 255, 255, 0.3); }

        /* HA Theme Overrides */
        body.ha-theme {
            background: var(--ha-bg) !important;
        }
        body.ha-theme .glass-panel {
            background: color-mix(in srgb, var(--ha-card-bg) 80%, transparent) !important;
            border-color: var(--ha-divider) !important;
            box-shadow: none !important;
        }
        body.ha-theme .fc-popover {
            background: var(--ha-card-bg) !important;
            border-color: var(--ha-divider) !important;
        }
        body.ha-theme .fc-theme-standard td, 
        body.ha-theme .fc-theme-standard th, 
        body.ha-theme .fc-theme-standard .fc-scrollgrid { 
            border-color: var(--ha-divider) !important; 
        }
        body.ha-theme .fc-day { background-color: transparent !important; }
        body.ha-theme .fc-day-today { background-color: color-mix(in srgb, var(--ha-primary-color) 20%, transparent) !important; }
        body.ha-theme .fc .fc-toolbar-title,
        body.ha-theme .fc-daygrid-day-number, 
        body.ha-theme .fc-col-header-cell-cushion {
            color: var(--ha-primary-text) !important;
        }
        body.ha-theme .fc .fc-button-primary { 
            background-color: var(--ha-card-bg) !important; 
            border-color: var(--ha-divider) !important; 
            color: var(--ha-primary-text) !important;
        }
        body.ha-theme .fc .fc-button-primary:not(:disabled):active, 
        body.ha-theme .fc .fc-button-primary:not(:disabled).fc-button-active { 
            background-color: var(--ha-primary-color) !important; 
            color: var(--ha-primary-text) !important; 
            border-color: var(--ha-primary-color) !important;
        }
        body.ha-theme .ambient-glow { display: none !important; }
    </style>
</head>
<body class="flex flex-col">
    {% include 'nav.html' %}

    <main class="flex-1 w-full p-2 sm:p-4 lg:p-6 flex flex-col h-[calc(100vh-64px)]">
        <div class="glass-panel rounded-3xl p-4 sm:p-6 flex-1 flex flex-col overflow-hidden relative">
            <!-- Decorative ambient glow -->
            <div class="ambient-glow absolute top-0 left-1/4 w-96 h-96 bg-blue-500/10 rounded-full mix-blend-screen filter blur-[100px] pointer-events-none"></div>
            <div class="ambient-glow absolute bottom-0 right-1/4 w-96 h-96 bg-purple-500/10 rounded-full mix-blend-screen filter blur-[100px] pointer-events-none"></div>
            
            <div id="filter-legend" class="flex flex-wrap gap-2 mb-4 z-20 relative empty:hidden"></div>

            <div id="calendar" class="flex-1 relative z-10 w-full"></div>
        </div>
    </main>

    <!-- FullCalendar Popover Backdrop -->
    <div id="fc-popover-backdrop" class="hidden fixed inset-0 bg-black/60 backdrop-blur-sm z-40 transition-opacity duration-300"></div>

    <!-- Glassmorphic Event Modal -->
    <div id="simple-event-modal" class="hidden fixed inset-0 bg-black/60 backdrop-blur-sm flex items-center justify-center z-50 p-4 transition-opacity duration-300">
        <div class="glass-panel p-0 rounded-2xl w-full max-w-lg border border-white/10 overflow-hidden transform transition-transform duration-300 scale-95 opacity-0 flex flex-col max-h-[90vh]" id="modal-content-container">
            
            <!-- Modal Header (Dynamic Color) -->
            <div id="modal-header" class="px-6 py-5 border-b border-white/10 relative overflow-hidden flex-shrink-0">
                <div class="absolute inset-0 opacity-20" id="modal-header-bg"></div>
                <div class="relative z-10 flex justify-between items-start">
                    <div>
                        <h3 id="modal-title" class="text-2xl font-extrabold text-white tracking-tight"></h3>
                        <div class="flex items-center text-white/80 text-sm mt-1 font-medium">
                            <span id="modal-time"></span>
                        </div>
                    </div>
                    <button onclick="closeModal()" class="text-white/60 hover:text-white bg-black/20 hover:bg-black/40 rounded-full p-1.5 transition-colors">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
                        </svg>
                    </button>
                </div>
            </div>

            <!-- Modal Body -->
            <div class="p-6 space-y-6 overflow-y-auto custom-scrollbar flex-1">
                <!-- Status Banner -->
                <div id="modal-status-banner" class="hidden rounded-lg p-3 text-sm font-semibold flex items-center gap-2"></div>
                
                <div class="grid grid-cols-2 gap-4">
                    <!-- Passengers -->
                    <div class="bg-white/5 rounded-xl p-4 border border-white/5">
                        <div class="text-xs font-semibold text-white/50 uppercase tracking-wider mb-2">Passengers</div>
                        <div id="modal-passengers" class="flex flex-wrap gap-1.5"></div>
                    </div>
                    
                    <!-- Driver -->
                    <div class="bg-white/5 rounded-xl p-4 border border-white/5">
                        <div class="text-xs font-semibold text-white/50 uppercase tracking-wider mb-2">Driver</div>
                        <div id="modal-driver" class="flex items-center gap-2"></div>
                    </div>
                </div>

                <!-- Location -->
                <div class="flex items-start text-gray-300 bg-white/5 rounded-xl p-4 border border-white/5">
                    <div class="bg-white/10 p-2 rounded-lg mr-3">
                        <svg class="w-5 h-5 text-blue-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"></path>
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"></path>
                        </svg>
                    </div>
                    <div class="flex-1">
                        <div class="text-xs font-semibold text-white/50 uppercase tracking-wider mb-0.5">Location</div>
                        <span id="modal-location" class="break-words font-medium text-white text-sm"></span>
                    </div>
                </div>

                <!-- Description -->
                <div id="modal-description-container" class="flex items-start text-gray-300 bg-white/5 rounded-xl p-4 border border-white/5">
                    <div class="bg-white/10 p-2 rounded-lg mr-3">
                        <svg class="w-5 h-5 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h7"></path>
                        </svg>
                    </div>
                    <div class="flex-1">
                        <div class="text-xs font-semibold text-white/50 uppercase tracking-wider mb-0.5">Description</div>
                        <div id="modal-description" class="whitespace-pre-wrap break-words italic text-gray-300 text-sm"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <script>
        function closeModal() {
            const modal = document.getElementById('simple-event-modal');
            const content = document.getElementById('modal-content-container');
            content.classList.remove('scale-100', 'opacity-100');
            content.classList.add('scale-95', 'opacity-0');
            setTimeout(() => {
                modal.classList.add('hidden');
            }, 300);
        }

        window.hiddenMembers = new Set();
        let allLegendMembers = new Map(); // Store {id, name, color, type}

        function renderLegend() {
            const container = document.getElementById('filter-legend');
            container.innerHTML = '';
            Array.from(allLegendMembers.values()).forEach(member => {
                const btn = document.createElement('button');
                const isHidden = window.hiddenMembers.has(member.id);
                btn.className = `px-3 py-1.5 rounded-full text-xs font-bold text-white shadow-sm transition-all border ${isHidden ? 'opacity-40 grayscale border-transparent' : 'border-white/20 hover:scale-[1.03]'}`;
                btn.style.backgroundColor = member.color;
                
                let icon = '';
                if (member.type === 'driver') {
                    icon = '<svg class="w-3 h-3 inline-block mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"></path></svg>';
                } else {
                    icon = '<svg class="w-3 h-3 inline-block mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>';
                }
                
                btn.innerHTML = `${icon}${member.name}`;
                btn.onclick = () => {
                    if (isHidden) window.hiddenMembers.delete(member.id);
                    else window.hiddenMembers.add(member.id);
                    renderLegend();
                    if (window.calendar) window.calendar.refetchEvents();
                };
                container.appendChild(btn);
            });
        }

        document.addEventListener('DOMContentLoaded', async function() {
            var calendarEl = document.getElementById('calendar');
            window.calendar = new FullCalendar.Calendar(calendarEl, {
                initialView: 'dayGridMonth',
                headerToolbar: {
                    left: 'prev,next today',
                    center: 'title',
                    right: 'dayGridMonth,timeGridWeek,timeGridDay'
                },
                height: '100%',
                slotMinTime: '06:00:00', // Start view slightly later for focus
                slotMaxTime: '23:00:00',
                nowIndicator: true,
                dayMaxEvents: true, // Allow "more" link when too many events
                
                // Custom Event Rendering for modern look
                eventContent: function(arg) {
                    const props = arg.event.extendedProps;
                    const isMonth = arg.view.type === 'dayGridMonth';
                    const isUnassigned = props.isUnassigned;
                    const isErrand = props.isErrand;
                    
                    let outerWrap = document.createElement('div');
                    outerWrap.className = `flex flex-col w-full h-full overflow-hidden rounded-md border backdrop-blur-md transition-transform hover:scale-[1.02] cursor-pointer ${isMonth ? 'p-1 gap-0.5' : 'p-2 gap-1'}`;
                    
                    // Base Colors & Borders
                    let baseColor = arg.event.backgroundColor || '#3b82f6';
                    if (isUnassigned) {
                        outerWrap.style.background = 'linear-gradient(135deg, rgba(239, 68, 68, 0.2), rgba(220, 38, 38, 0.4))';
                        outerWrap.style.borderColor = 'rgba(239, 68, 68, 0.6)';
                        outerWrap.style.boxShadow = '0 0 8px rgba(239, 68, 68, 0.4)';
                    } else if (isErrand) {
                        outerWrap.style.background = 'linear-gradient(135deg, rgba(245, 158, 11, 0.15), rgba(217, 119, 6, 0.25))';
                        outerWrap.style.borderColor = 'rgba(245, 158, 11, 0.5)';
                        outerWrap.style.borderStyle = 'dashed';
                    } else {
                        outerWrap.style.background = `linear-gradient(135deg, ${baseColor}aa, ${baseColor}dd)`;
                        outerWrap.style.borderColor = 'rgba(255, 255, 255, 0.15)';
                    }

                    // Header Row (Title & Time)
                    let headerRow = document.createElement('div');
                    headerRow.className = 'flex items-start justify-between w-full leading-tight';
                    
                    let titleEl = document.createElement('div');
                    titleEl.className = `font-bold text-white drop-shadow-md truncate ${isMonth ? 'text-xs' : 'text-sm mb-1'}`;
                    titleEl.innerText = arg.event.title;
                    
                    let timeEl = document.createElement('div');
                    timeEl.className = `font-semibold text-white/90 drop-shadow flex-shrink-0 ${isMonth ? 'text-[9px] ml-1' : 'text-xs'}`;
                    timeEl.innerText = arg.timeText || '';
                    
                    headerRow.appendChild(titleEl);
                    if (!isMonth || timeEl.innerText) {
                        if(isMonth) headerRow.appendChild(timeEl);
                        else outerWrap.appendChild(timeEl); // Put time on own line for timeGrid
                    }
                    if(!isMonth) outerWrap.appendChild(headerRow);
                    else outerWrap.appendChild(headerRow);
                    

                    // Meta Row (Pax & Driver)
                    let metaRow = document.createElement('div');
                    metaRow.className = 'flex items-center justify-between mt-auto w-full gap-1 pt-0.5';
                    
                    // Passengers
                    let paxContainer = document.createElement('div');
                    paxContainer.className = 'flex -space-x-1.5 overflow-hidden';
                    if (props.passengers && props.passengers.length > 0) {
                        props.passengers.forEach(p => {
                            let dot = document.createElement('div');
                            const isPaxHidden = window.hiddenMembers && window.hiddenMembers.has(p.name);
                            dot.className = `${isMonth ? 'w-2.5 h-2.5' : 'w-4 h-4'} rounded-full border border-white/20 shadow-sm flex items-center justify-center text-[8px] font-bold text-white uppercase transition-all ${isPaxHidden ? 'opacity-30 grayscale border-transparent' : ''}`;
                            dot.style.backgroundColor = p.color;
                            dot.title = p.name;
                            if(!isMonth && p.name) dot.innerText = p.name.charAt(0);
                            paxContainer.appendChild(dot);
                        });
                    }
                    metaRow.appendChild(paxContainer);
                    
                    // Driver Badge
                    let rightBadge = document.createElement('div');
                    if (isUnassigned) {
                        rightBadge.className = 'text-[9px] font-bold bg-red-500 text-white px-1.5 py-0.5 rounded flex items-center gap-0.5 shadow-sm';
                        rightBadge.innerHTML = '⚠️ Unassigned';
                    } else if (props.driverName) {
                        const isDrHidden = window.hiddenMembers && window.hiddenMembers.has(props.driverName);
                        rightBadge.className = `text-[9px] font-bold bg-black/40 text-white px-1.5 py-0.5 rounded backdrop-blur-sm truncate max-w-[60px] shadow-sm transition-all ${isMonth ? '' : 'text-[10px] px-2'} ${isDrHidden ? 'opacity-30 grayscale border-transparent' : ''}`;
                        rightBadge.innerText = props.driverName;
                    } else if (isErrand) {
                        rightBadge.className = 'text-[9px] font-bold bg-amber-500/80 text-white px-1.5 py-0.5 rounded shadow-sm';
                        rightBadge.innerText = 'Errand';
                    }
                    metaRow.appendChild(rightBadge);
                    outerWrap.appendChild(metaRow);

                    // Location (TimeGrid only)
                    if (!isMonth && props.location) {
                        let locRow = document.createElement('div');
                        locRow.className = 'text-[10px] text-white/80 truncate flex items-center mt-1 font-medium bg-black/10 rounded px-1 py-0.5';
                        locRow.innerHTML = `<svg class="w-3 h-3 mr-1 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"></path></svg><span class="truncate">${props.location.split(',')[0]}</span>`;
                        outerWrap.appendChild(locRow);
                    }

                    return { domNodes: [outerWrap] };
                },

                events: async function(info, successCallback, failureCallback) {
                    try {
                        const apiBase = window.location.pathname.endsWith('/') ? '../' : '';
                        const res = await fetch(`${apiBase}api/schedule?start_date=${encodeURIComponent(info.startStr)}&end_date=${encodeURIComponent(info.endStr)}&force_refresh=false`);
                        if (!res.ok) throw new Error('Network response was not ok');
                        const data = await res.json();
                        
                        let eventsMap = new Map();
                        const assignments = data.assignments || {};
                        const true_unassigned = data.true_unassigned || [];
                        const drivers = data.drivers || [];
                        
                        // Parse standard events
                        if (data.events && data.events.length > 0) {
                            data.events.forEach(ev => {
                                if (ev.event_type !== 'background_trip') {
                                    let baseId = ev.id;
                                    let rawTitle = ev.title;
                                    if (ev.id.includes('_unrolled_')) {
                                        baseId = ev.id.split('_unrolled_')[0];
                                    } else if (ev.id.includes('_dropoff')) {
                                        baseId = ev.id.split('_dropoff')[0];
                                        rawTitle = rawTitle.replace('Dropoff: ', '');
                                    } else if (ev.id.includes('_pickup')) {
                                        baseId = ev.id.split('_pickup')[0];
                                        rawTitle = rawTitle.replace('Pickup: ', '');
                                    }

                                    let color = '#3B82F6'; 
                                    if (ev.calendar_ids && ev.calendar_ids.length > 0 && data.calendar_metadata && data.calendar_metadata[ev.calendar_ids[0]]) {
                                        color = data.calendar_metadata[ev.calendar_ids[0]].backgroundColor;
                                    }
                                    
                                    let paxMap = {};
                                    if (ev.calendar_ids) {
                                        ev.calendar_ids.forEach(cid => {
                                            const meta = data.calendar_metadata && data.calendar_metadata[cid];
                                            const name = meta ? meta.summary : cid;
                                            const cColor = meta ? meta.backgroundColor : '#3B82F6';
                                            paxMap[name] = cColor;
                                        });
                                    }
                                    
                                    const mRulesForPax = data.matched_rules && data.matched_rules[ev.id] ? data.matched_rules[ev.id] : [];
                                    if (data.passengers && mRulesForPax.length > 0) {
                                        mRulesForPax.forEach(r => {
                                            if (r.passenger_ids) {
                                                r.passenger_ids.forEach(pId => {
                                                    const pax = data.passengers.find(p => p.id === pId);
                                                    if (pax && !paxMap[pax.name]) {
                                                        let cColor = '#3B82F6';
                                                        if (pax.calendar_ids && pax.calendar_ids.length > 0) {
                                                            const meta = data.calendar_metadata && data.calendar_metadata[pax.calendar_ids[0]];
                                                            if (meta) cColor = meta.backgroundColor;
                                                        }
                                                        paxMap[pax.name] = cColor;
                                                    }
                                                });
                                            }
                                        });
                                    }
                                    
                                    const paxNames = Object.keys(paxMap);
                                    const passengerPills = paxNames.map(name => ({
                                        name: name,
                                        color: paxMap[name]
                                    }));
                                    
                                    const isUnassigned = true_unassigned.includes(ev.id);
                                    let driverName = null;
                                    if (!isUnassigned && assignments[ev.id]) {
                                        const d = drivers.find(d => d.id === assignments[ev.id]);
                                        if (d) driverName = d.name;
                                    }
                                    
                                    if (eventsMap.has(baseId)) {
                                        let existing = eventsMap.get(baseId);
                                        // Merge times
                                        if (new Date(ev.start) < new Date(existing.start)) existing.start = ev.start;
                                        if (new Date(ev.end) > new Date(existing.end)) existing.end = ev.end;
                                        
                                        // Merge passengers
                                        passengerPills.forEach(p => {
                                            if (!existing.extendedProps.passengers.find(x => x.name === p.name)) {
                                                existing.extendedProps.passengers.push(p);
                                            }
                                        });
                                        
                                        // Merge drivers
                                        if (isUnassigned) {
                                            existing.extendedProps.isUnassigned = true;
                                            existing.extendedProps.driverName = null;
                                        } else if (driverName) {
                                            if (!existing.extendedProps.isUnassigned) {
                                                if (!existing.extendedProps.driverName) {
                                                    existing.extendedProps.driverName = driverName;
                                                } else if (existing.extendedProps.driverName !== driverName) {
                                                    existing.extendedProps.driverName = 'Multiple Drivers';
                                                }
                                            }
                                        }
                                    } else {
                                        eventsMap.set(baseId, {
                                            id: baseId,
                                            title: rawTitle,
                                            start: ev.start,
                                            end: ev.end,
                                            backgroundColor: color,
                                            extendedProps: { 
                                                location: ev.location,
                                                description: ev.description,
                                                passengers: [...passengerPills],
                                                isUnassigned: isUnassigned,
                                                driverName: driverName,
                                                isErrand: false,
                                                rawColor: color
                                            }
                                        });
                                    }
                                }
                            });
                        }
                        
                        // Populate legend data
                        if (data.passengers) {
                            data.passengers.forEach(p => {
                                let cColor = '#3B82F6';
                                if (p.calendar_ids && p.calendar_ids.length > 0) {
                                    const meta = data.calendar_metadata && data.calendar_metadata[p.calendar_ids[0]];
                                    if (meta) cColor = meta.backgroundColor;
                                }
                                allLegendMembers.set(p.name, { id: p.name, name: p.name, color: cColor, type: 'passenger' });
                            });
                        }
                        if (data.drivers) {
                            data.drivers.forEach(d => {
                                allLegendMembers.set(d.name, { id: d.name, name: d.name, color: '#1F2937', type: 'driver' });
                            });
                        }
                        renderLegend();

                        let fcEvents = Array.from(eventsMap.values());

                        // Apply filtering
                        fcEvents = fcEvents.filter(ev => {
                            let participants = new Set();
                            if (ev.extendedProps.passengers) {
                                ev.extendedProps.passengers.forEach(p => participants.add(p.name));
                            }
                            if (ev.extendedProps.driverName && ev.extendedProps.driverName !== 'Multiple Drivers') {
                                participants.add(ev.extendedProps.driverName);
                            }
                            
                            // If event has no mapped participants, show it
                            if (participants.size === 0) return true;
                            
                            // If ALL participants are in hiddenMembers, hide event
                            let allHidden = true;
                            for (let p of participants) {
                                if (!window.hiddenMembers.has(p)) {
                                    allHidden = false;
                                    break;
                                }
                            }
                            return !allHidden;
                        });

                        // Add errands
                        if (data.scheduled_errands && data.scheduled_errands.length > 0) {
                            data.scheduled_errands.forEach(ev => {
                                let driverName = null;
                                if (assignments[ev.id]) {
                                    const d = drivers.find(d => d.id === assignments[ev.id]);
                                    if (d) driverName = d.name;
                                }
                            
                                fcEvents.push({
                                    id: ev.event_id || ev.id,
                                    title: ev.title,
                                    start: ev.start_time_iso || ev.start,
                                    end: ev.end_time_iso || ev.end,
                                    backgroundColor: '#F59E0B',
                                    extendedProps: { 
                                        location: ev.errand ? ev.errand.location : ev.location,
                                        description: ev.description || ('Duration: ' + (ev.end_mins - ev.start_mins) + ' mins'),
                                        isErrand: true,
                                        driverName: driverName,
                                        rawColor: '#F59E0B'
                                    }
                                });
                            });
                        }

                        successCallback(fcEvents);
                    } catch (error) {
                        console.error('Error fetching calendar data:', error);
                        failureCallback(error);
                    }
                },
                
                eventClick: function(info) {
                    const props = info.event.extendedProps;
                    
                    document.getElementById('modal-title').textContent = info.event.title;
                    document.getElementById('modal-header-bg').style.backgroundColor = props.rawColor || info.event.backgroundColor;
                    
                    const formatTime = (date) => {
                        return date.toLocaleString([], { weekday: 'long', month: 'long', day: 'numeric', hour: '2-digit', minute: '2-digit' });
                    };
                    
                    const startStr = info.event.start ? formatTime(info.event.start) : '';
                    const endStr = info.event.end ? ' - ' + info.event.end.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) : '';
                    document.getElementById('modal-time').textContent = startStr + endStr;
                    
                    document.getElementById('modal-location').textContent = props.location || 'No location provided.';
                    
                    // Passengers
                    const paxContainer = document.getElementById('modal-passengers');
                    if (props.passengers && props.passengers.length > 0) {
                        paxContainer.innerHTML = props.passengers.map(p => {
                            return `<span class="inline-flex items-center px-3 py-1 rounded-full text-xs font-bold text-white shadow-sm" style="background-color: ${p.color}">${p.name}</span>`;
                        }).join('');
                    } else {
                        paxContainer.innerHTML = '<span class="italic text-white/40 text-sm">No passengers</span>';
                    }
                    
                    // Driver
                    const driverContainer = document.getElementById('modal-driver');
                    if (props.driverName) {
                        driverContainer.innerHTML = `
                            <div class="w-8 h-8 rounded-full bg-blue-500/20 text-blue-400 flex items-center justify-center font-bold text-lg border border-blue-500/30">
                                ${props.driverName.charAt(0)}
                            </div>
                            <span class="font-bold text-white">${props.driverName}</span>
                        `;
                    } else if (props.isUnassigned) {
                        driverContainer.innerHTML = `<span class="text-red-400 font-bold italic">⚠️ Needs Driver</span>`;
                    } else {
                        driverContainer.innerHTML = '<span class="italic text-white/40 text-sm">Not assigned</span>';
                    }
                    
                    // Status Banner
                    const banner = document.getElementById('modal-status-banner');
                    if (props.isUnassigned) {
                        banner.className = 'rounded-lg p-3 text-sm font-bold flex items-center gap-2 bg-red-500/20 text-red-400 border border-red-500/30 mb-4';
                        banner.innerHTML = '<svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path></svg> This event has a scheduling conflict and needs a driver assigned.';
                    } else if (props.isErrand) {
                        banner.className = 'rounded-lg p-3 text-sm font-bold flex items-center gap-2 bg-amber-500/20 text-amber-400 border border-amber-500/30 mb-4';
                        banner.innerHTML = '<svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4"></path></svg> Automatically scheduled errand.';
                    } else {
                        banner.className = 'hidden';
                    }
                    
                    // Description
                    const descContainer = document.getElementById('modal-description-container');
                    if (props.description) {
                        descContainer.classList.remove('hidden');
                        document.getElementById('modal-description').textContent = props.description;
                    } else {
                        descContainer.classList.add('hidden');
                    }
                    
                    // Show Modal
                    const modal = document.getElementById('simple-event-modal');
                    const content = document.getElementById('modal-content-container');
                    modal.classList.remove('hidden');
                    // Slight delay for transition
                    setTimeout(() => {
                        content.classList.remove('scale-95', 'opacity-0');
                        content.classList.add('scale-100', 'opacity-100');
                    }, 10);
                }
            });

            // Observer for FullCalendar Popover to show backdrop
            const popoverBackdrop = document.getElementById('fc-popover-backdrop');
            const observer = new MutationObserver(() => {
                const popover = document.querySelector('.fc-popover');
                if (popover) {
                    popoverBackdrop.classList.remove('hidden');
                    // Move backdrop to be a sibling of popover so they share stacking context
                    if (popover.parentNode && popoverBackdrop.parentNode !== popover.parentNode) {
                        popover.parentNode.insertBefore(popoverBackdrop, popover);
                    }
                } else {
                    popoverBackdrop.classList.add('hidden');
                }
            });
            observer.observe(document.body, { childList: true, subtree: true });
            
            popoverBackdrop.addEventListener('click', () => {
                const closeBtn = document.querySelector('.fc-popover-close');
                if (closeBtn) closeBtn.click();
            });

            window.calendar.render();
        });
    </script>
</body>
