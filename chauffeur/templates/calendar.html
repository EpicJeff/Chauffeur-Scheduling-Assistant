<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chauffeur - Calendar</title>
    <script>
        tailwind = {
            config: {
                darkMode: 'class',
                theme: {
                    extend: {}
                }
            }
        };
    </script>
    {% include 'ha_theme.html' %}
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.15/index.global.min.js"></script>
    <style>
        body { background-color: #111827; color: white; }
        .fc-theme-standard td, .fc-theme-standard th, .fc-theme-standard .fc-scrollgrid { border-color: #374151 !important; }
        .fc-daygrid-day-number, .fc-col-header-cell-cushion { color: #D1D5DB !important; text-decoration: none !important; }
        .fc-event { border: none !important; margin: 1px 2px !important; padding: 2px 4px !important; border-radius: 4px !important; font-size: 0.75rem !important; }
        .fc .fc-toolbar-title { font-size: 1.25rem !important; font-weight: bold; color: #E5E7EB; }
        .fc .fc-button-primary { background-color: #2563EB !important; border-color: #1D4ED8 !important; }
        .fc .fc-button-primary:not(:disabled):active, .fc .fc-button-primary:not(:disabled).fc-button-active { background-color: #1D4ED8 !important; border-color: #1E40AF !important; }
        .fc-day-today { background-color: #1F2937 !important; }
    </style>
</head>
<body class="bg-gray-900 text-white min-h-screen flex flex-col">
    {% include 'nav.html' %}

    <main class="flex-1 max-w-7xl w-full mx-auto p-4 sm:p-6 lg:p-8 flex flex-col h-[calc(100vh-64px)]">
        <div class="bg-gray-800 rounded-2xl shadow-2xl border border-gray-700/50 p-6 flex-1 flex flex-col">
            <div id="calendar" class="flex-1"></div>
        </div>
    </main>

    <!-- Simple Event Modal -->
    <div id="simple-event-modal" class="hidden fixed inset-0 bg-black/80 flex items-center justify-center z-50 p-4">
        <div class="bg-gray-800 p-8 rounded-2xl w-full max-w-2xl border border-gray-600 shadow-2xl">
            <div class="flex justify-between items-start mb-6">
                <h3 id="modal-title" class="text-3xl font-bold text-blue-200"></h3>
                <button onclick="document.getElementById('simple-event-modal').classList.add('hidden')" class="text-gray-400 hover:text-white">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
                    </svg>
                </button>
            </div>
            <div class="space-y-4 text-lg">
                <div class="flex items-center text-gray-300">
                    <svg class="w-5 h-5 mr-3 text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                    </svg>
                    <span id="modal-time"></span>
                </div>
                <div class="flex items-start text-gray-300">
                    <svg class="w-5 h-5 mr-3 mt-1 text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"></path>
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"></path>
                    </svg>
                    <span id="modal-location" class="break-words flex-1"></span>
                </div>
                <div class="flex items-start text-gray-300">
                    <svg class="w-5 h-5 mr-3 mt-1 text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z"></path>
                    </svg>
                    <div id="modal-passengers" class="flex-1 flex flex-wrap gap-1"></div>
                </div>
                <div class="flex items-start text-gray-300 pt-2 border-t border-gray-700 mt-4">
                    <svg class="w-5 h-5 mr-3 mt-1 text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h7"></path>
                    </svg>
                    <div id="modal-description" class="whitespace-pre-wrap break-words flex-1 italic text-gray-400 text-base"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', async function() {
            var calendarEl = document.getElementById('calendar');
            var calendar = new FullCalendar.Calendar(calendarEl, {
                initialView: 'dayGridMonth',
                headerToolbar: {
                    left: 'prev,next today',
                    center: 'title',
                    right: 'dayGridMonth,timeGridWeek,timeGridDay'
                },
                height: '100%',
                events: async function(info, successCallback, failureCallback) {
                    try {
                        const apiBase = window.location.pathname.endsWith('/') ? '../' : '';
                        // Fetch schedule for the visible date range
                        const res = await fetch(`${apiBase}api/schedule?start_date=${encodeURIComponent(info.startStr)}&end_date=${encodeURIComponent(info.endStr)}&force_refresh=false`);
                        if (!res.ok) throw new Error('Network response was not ok');
                        const data = await res.json();
                        
                        let fcEvents = [];
                        
                        // Parse standard events
                        if (data.events && data.events.length > 0) {
                            data.events.forEach(ev => {
                                if (ev.event_type !== 'background_trip') {
                                    let color = '#3B82F6'; // Default blue
                                    if (ev.calendar_ids && ev.calendar_ids.length > 0 && data.calendar_metadata && data.calendar_metadata[ev.calendar_ids[0]]) {
                                        color = data.calendar_metadata[ev.calendar_ids[0]].backgroundColor;
                                    }
                                    
                                    let paxMap = {};
                                    if (ev.calendar_ids) {
                                        ev.calendar_ids.forEach(cid => {
                                            const meta = data.calendar_metadata && data.calendar_metadata[cid];
                                            const name = meta ? meta.summary : cid;
                                            const cColor = meta ? meta.backgroundColor : '#3B82F6';
                                            paxMap[name] = cColor;
                                        });
                                    }
                                    
                                    const mRulesForPax = data.matched_rules && data.matched_rules[ev.id] ? data.matched_rules[ev.id] : [];
                                    if (data.passengers && mRulesForPax.length > 0) {
                                        mRulesForPax.forEach(r => {
                                            if (r.passenger_ids) {
                                                r.passenger_ids.forEach(pId => {
                                                    const pax = data.passengers.find(p => p.id === pId);
                                                    if (pax && !paxMap[pax.name]) {
                                                        let cColor = '#3B82F6';
                                                        if (pax.calendar_ids && pax.calendar_ids.length > 0) {
                                                            const meta = data.calendar_metadata && data.calendar_metadata[pax.calendar_ids[0]];
                                                            if (meta) cColor = meta.backgroundColor;
                                                        }
                                                        paxMap[pax.name] = cColor;
                                                    }
                                                });
                                            }
                                        });
                                    }
                                    
                                    const paxNames = Object.keys(paxMap);
                                    const passengerPills = paxNames.map(name => ({
                                        name: name,
                                        color: paxMap[name]
                                    }));
                                    
                                    fcEvents.push({
                                        id: ev.id,
                                        title: ev.title,
                                        start: ev.start,
                                        end: ev.end,
                                        backgroundColor: color,
                                        extendedProps: { 
                                            location: ev.location,
                                            description: ev.description,
                                            passengers: passengerPills
                                        }
                                    });
                                }
                            });
                        }

                        // Add errands
                        if (data.scheduled_errands && data.scheduled_errands.length > 0) {
                            data.scheduled_errands.forEach(ev => {
                                fcEvents.push({
                                    id: ev.event_id,
                                    title: ev.title,
                                    start: ev.start_time_iso,
                                    end: ev.end_time_iso,
                                    backgroundColor: '#F59E0B',
                                    extendedProps: { 
                                        location: ev.errand ? ev.errand.location : '',
                                        description: 'Duration: ' + (ev.end_mins - ev.start_mins) + ' mins'
                                    }
                                });
                            });
                        }

                        successCallback(fcEvents);
                    } catch (error) {
                        console.error('Error fetching calendar data:', error);
                        failureCallback(error);
                    }
                },
                eventClick: function(info) {
                    document.getElementById('modal-title').textContent = info.event.title;
                    
                    const formatTime = (date) => {
                        return date.toLocaleString([], { weekday: 'short', month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });
                    };
                    
                    const startStr = info.event.start ? formatTime(info.event.start) : '';
                    const endStr = info.event.end ? ' - ' + formatTime(info.event.end) : '';
                    document.getElementById('modal-time').textContent = startStr + endStr;
                    
                    document.getElementById('modal-location').textContent = info.event.extendedProps.location || 'No location provided.';
                    
                    if (info.event.extendedProps.passengers && info.event.extendedProps.passengers.length > 0) {
                        document.getElementById('modal-passengers').innerHTML = info.event.extendedProps.passengers.map(p => {
                            return `<span class="inline-flex items-center px-2.5 py-1 rounded-full text-xs font-bold text-white mr-1" style="background-color: ${p.color}">${p.name}</span>`;
                        }).join('');
                    } else {
                        document.getElementById('modal-passengers').innerHTML = '<span class="italic text-gray-500">No passengers</span>';
                    }
                    
                    document.getElementById('modal-description').textContent = info.event.extendedProps.description || 'No description provided.';
                    
                    document.getElementById('simple-event-modal').classList.remove('hidden');
                }
            });
            calendar.render();
        });
    </script>
</body>
</html>
