<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chauffeur - Calendar</title>
    <script>
        tailwind = {
            config: {
                darkMode: 'class',
                theme: {
                    extend: {}
                }
            }
        };
    </script>
    {% include 'ha_theme.html' %}
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.15/index.global.min.js"></script>
    <style>
        body { 
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%); /* slate-900 to slate-800 */
            color: white; 
            min-height: 100vh;
        }
        
        /* Premium Glassmorphic Calendar Base */
        .fc-theme-standard td, .fc-theme-standard th, .fc-theme-standard .fc-scrollgrid { 
            border-color: rgba(255, 255, 255, 0.08) !important; 
        }
        .fc-daygrid-day-number, .fc-col-header-cell-cushion { 
            color: #cbd5e1 !important; /* slate-300 */
            text-decoration: none !important; 
            font-weight: 600; 
            font-size: 0.95rem;
            padding: 8px !important;
        }
        .fc-day-other .fc-daygrid-day-number {
            color: #475569 !important; /* slate-600 */
        }
        
        /* Cell Backgrounds */
        .fc-day { background-color: rgba(30, 41, 59, 0.3) !important; } /* transparent slate-800 */
        .fc-day-today { background-color: rgba(51, 65, 85, 0.6) !important; } /* slate-700 */
        
        /* Event Resets */
        .fc-event { 
            border: none !important; 
            margin: 2px !important; 
            background: transparent !important; 
            box-shadow: none !important;
        }
        
        .fc-timegrid-slot { height: 2.5em !important; border-bottom: 1px solid rgba(255,255,255,0.03) !important; }
        
        /* Toolbar */
        .fc .fc-toolbar-title { 
            font-size: 1.75rem !important; 
            font-weight: 800; 
            color: #f8fafc; 
            letter-spacing: -0.025em; 
        }
        .fc .fc-button-primary { 
            background-color: rgba(51, 65, 85, 0.8) !important; 
            border-color: rgba(255, 255, 255, 0.1) !important; 
            backdrop-filter: blur(8px); 
            -webkit-backdrop-filter: blur(8px);
            transition: all 0.2s; 
            color: #cbd5e1 !important;
            font-weight: 600 !important;
            text-transform: capitalize !important;
        }
        .fc .fc-button-primary:hover { 
            background-color: rgba(71, 85, 105, 0.9) !important; 
            color: white !important;
        }
        .fc .fc-button-primary:not(:disabled):active, .fc .fc-button-primary:not(:disabled).fc-button-active { 
            background-color: #3b82f6 !important; /* Blue-500 */
            color: white !important; 
            border-color: #2563eb !important;
        }
        
        .glass-panel {
            background: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }
        
        /* Popover (+ more) as a Centered Modal */
        .fc-popover {
            position: fixed !important;
            top: 50% !important;
            left: 50% !important;
            transform: translate(-50%, -50%) !important;
            width: 90% !important;
            max-width: 360px !important;
            background: rgba(15, 23, 42, 0.85) !important;
            backdrop-filter: blur(16px) !important;
            -webkit-backdrop-filter: blur(16px) !important;
            border: 1px solid rgba(255, 255, 255, 0.15) !important;
            border-radius: 12px !important;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5) !important;
            z-index: 100 !important;
            overflow: hidden !important;
        }
        .fc-popover-header {
            background: rgba(255, 255, 255, 0.05) !important;
            padding: 12px !important;
        }
        .fc-popover-title {
            color: #f8fafc !important;
            font-weight: 700 !important;
            font-size: 1.1rem !important;
        }
        .fc-popover-body {
            max-height: 60vh !important;
            overflow-y: auto !important;
            padding: 8px !important;
        }

        /* Custom scrollbar for events and popovers */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.2); border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(255, 255, 255, 0.3); }

        /* Force FullCalendar Event Wrappers to add absolutely no extra size */
        .fc-event, 
        .fc-event-main {
            border: none !important;
            padding: 0 !important;
            margin: 0 !important;
            background: transparent !important;
            box-shadow: none !important;
        }
        .fc-daygrid-event {
            margin: 2px 0 0 0 !important; /* exactly 2px gap between events */
            border: none !important;
            padding: 0 !important;
            background: transparent !important;
        }

        /* Nicer styling for the "+X more" buttons */
        .fc-daygrid-more-link {
            display: block;
            margin: 2px 4px !important;
            padding: 4px 6px !important;
            background: rgba(59, 130, 246, 0.15) !important;
            border: 1px solid rgba(59, 130, 246, 0.3) !important;
            border-radius: 6px !important;
            color: #60a5fa !important;
            font-size: 0.75rem !important;
            font-weight: 700 !important;
            text-align: center !important;
            backdrop-filter: blur(4px) !important;
            -webkit-backdrop-filter: blur(4px) !important;
            transition: all 0.2s !important;
        }
        .fc-daygrid-more-link:hover {
            background: rgba(59, 130, 246, 0.25) !important;
            color: #93c5fd !important;
        }

        /* HA Theme Overrides */
        body.ha-theme {
            background: var(--ha-bg) !important;
        }
        body.ha-theme .glass-panel {
            background: color-mix(in srgb, var(--ha-card-bg) 80%, transparent) !important;
            border-color: var(--ha-divider) !important;
            box-shadow: none !important;
        }
        body.ha-theme .fc-popover {
            background: var(--ha-card-bg) !important;
            border-color: var(--ha-divider) !important;
        }
        body.ha-theme .fc-theme-standard td, 
        body.ha-theme .fc-theme-standard th, 
        body.ha-theme .fc-theme-standard .fc-scrollgrid { 
            border-color: var(--ha-divider) !important; 
        }
        body.ha-theme .fc-day { background-color: transparent !important; }
        body.ha-theme .fc-day-today { background-color: color-mix(in srgb, var(--ha-primary-color) 20%, transparent) !important; }
        body.ha-theme .fc .fc-toolbar-title,
        body.ha-theme .fc-daygrid-day-number, 
        body.ha-theme .fc-col-header-cell-cushion {
            color: var(--ha-primary-text) !important;
        }
        body.ha-theme .fc .fc-button-primary { 
            background-color: var(--ha-card-bg) !important; 
            border-color: var(--ha-divider) !important; 
            color: var(--ha-primary-text) !important;
        }
        body.ha-theme .fc .fc-button-primary:not(:disabled):active, 
        body.ha-theme .fc .fc-button-primary:not(:disabled).fc-button-active { 
            background-color: var(--ha-primary-color) !important; 
            color: var(--ha-primary-text) !important; 
            border-color: var(--ha-primary-color) !important;
        }
        body.ha-theme .ambient-glow { display: none !important; }
        /* The event-details modal uses translucent-white text; ha_theme.html
           only remaps bare .text-white, so on a light HA theme these stayed
           near-white on the light glass panel. Remap them to the theme text
           color at similar opacities. Scoped to the modal — the calendar
           grid's text-white/NN chips sit on event-colored backgrounds and
           must stay white. */
        body.ha-theme #simple-event-modal .text-white\/80 { color: color-mix(in srgb, var(--ha-primary-text) 85%, transparent) !important; }
        body.ha-theme #simple-event-modal .text-white\/60 { color: color-mix(in srgb, var(--ha-primary-text) 70%, transparent) !important; }
        body.ha-theme #simple-event-modal .text-white\/50 { color: color-mix(in srgb, var(--ha-primary-text) 60%, transparent) !important; }
        body.ha-theme #simple-event-modal .text-white\/40 { color: color-mix(in srgb, var(--ha-primary-text) 55%, transparent) !important; }
        body.ha-theme #simple-event-modal .hover\:text-white:hover { color: var(--ha-primary-text) !important; }

        /* Agenda view */
        .agenda-btn {
            background-color: rgba(51, 65, 85, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #cbd5e1;
            font-weight: 600;
            font-size: 0.875rem;
            padding: 6px 12px;
            border-radius: 8px;
            transition: all 0.2s;
        }
        .agenda-btn:hover { background-color: rgba(71, 85, 105, 0.9); color: white; }
        .agenda-btn-active { background-color: #3b82f6; color: white; border-color: #2563eb; }
        .agenda-day { background-color: rgba(30, 41, 59, 0.5); border: 1px solid rgba(255, 255, 255, 0.08); }
        .agenda-today { border-color: rgba(59, 130, 246, 0.6); box-shadow: 0 0 12px rgba(59, 130, 246, 0.15); }
        .agenda-event { background-color: rgba(51, 65, 85, 0.5); }
        .agenda-event:hover { background-color: rgba(71, 85, 105, 0.7); }

        body.ha-theme .agenda-btn {
            background-color: var(--ha-card-bg) !important;
            border-color: var(--ha-divider) !important;
            color: var(--ha-primary-text) !important;
        }
        body.ha-theme .agenda-btn-active {
            background-color: var(--ha-primary-color) !important;
            border-color: var(--ha-primary-color) !important;
        }
        body.ha-theme .agenda-day {
            background-color: var(--ha-card-bg) !important;
            border-color: var(--ha-divider) !important;
        }
        body.ha-theme .agenda-today { border-color: var(--ha-primary-color) !important; box-shadow: none !important; }
        body.ha-theme .agenda-event { background-color: color-mix(in srgb, var(--ha-primary-text) 8%, transparent) !important; }
        body.ha-theme .agenda-event:hover { background-color: color-mix(in srgb, var(--ha-primary-text) 14%, transparent) !important; }
    </style>
</head>
<body class="flex flex-col">
    {% include 'nav.html' %}

    <main class="flex-1 w-full p-2 sm:p-4 lg:p-6 flex flex-col h-[calc(100vh-64px)]">
        <div class="glass-panel rounded-3xl p-4 sm:p-6 flex-1 flex flex-col overflow-hidden relative">
            <!-- Decorative ambient glow -->
            <div class="ambient-glow absolute top-0 left-1/4 w-96 h-96 bg-blue-500/10 rounded-full mix-blend-screen filter blur-[100px] pointer-events-none"></div>
            <div class="ambient-glow absolute bottom-0 right-1/4 w-96 h-96 bg-purple-500/10 rounded-full mix-blend-screen filter blur-[100px] pointer-events-none"></div>
            
            <div id="filter-legend" class="flex flex-wrap gap-2 mb-4 z-20 relative empty:hidden"></div>

            <div id="calendar" class="flex-1 relative z-10 w-full"></div>

            <!-- Agenda view (display toggled via JS; hidden until entered) -->
            <div id="agenda-view" class="flex-1 flex-col z-10 w-full min-h-0" style="display:none">
                <div class="flex flex-wrap items-center justify-between gap-2 mb-4">
                    <div class="flex items-center gap-2">
                        <button onclick="agendaNav(-1)" class="agenda-btn px-3" aria-label="Previous">‹</button>
                        <button onclick="agendaNav(1)" class="agenda-btn px-3" aria-label="Next">›</button>
                        <button onclick="agendaToday()" class="agenda-btn">Today</button>
                        <h2 id="agenda-title" class="text-lg sm:text-2xl font-extrabold text-white ml-2 tracking-tight"></h2>
                    </div>
                    <div class="flex items-center gap-2">
                        <select id="agenda-days" onchange="setAgendaDays(this.value)" class="agenda-btn cursor-pointer">
                            <option value="3">3 days</option>
                            <option value="5">5 days</option>
                            <option value="7">7 days</option>
                            <option value="10">10 days</option>
                            <option value="14">14 days</option>
                        </select>
                        <div class="flex gap-0.5">
                            <button onclick="exitAgenda('dayGridMonth')" class="agenda-btn rounded-r-none">Month</button>
                            <button onclick="exitAgenda('timeGridWeek')" class="agenda-btn rounded-none">Week</button>
                            <button onclick="exitAgenda('timeGridDay')" class="agenda-btn rounded-none">Day</button>
                            <button class="agenda-btn agenda-btn-active rounded-l-none">Agenda</button>
                        </div>
                    </div>
                </div>
                <div id="agenda-grid" class="flex-1 min-h-0 overflow-y-auto grid gap-3 pb-2"
                     style="grid-template-columns: repeat(auto-fill, minmax(270px, 1fr)); align-items: start; align-content: start;"></div>
            </div>
        </div>
    </main>

    <!-- FullCalendar Popover Backdrop -->
    <div id="fc-popover-backdrop" class="hidden fixed inset-0 bg-black/60 backdrop-blur-sm z-40 transition-opacity duration-300"></div>

    <!-- Glassmorphic Event Modal -->
    <div id="simple-event-modal" class="hidden fixed inset-0 bg-black/60 backdrop-blur-sm flex items-center justify-center z-50 p-4 transition-opacity duration-300">
        <div class="glass-panel p-0 rounded-2xl w-full max-w-lg border border-white/10 overflow-hidden transform transition-transform duration-300 scale-95 opacity-0 flex flex-col max-h-[90vh]" id="modal-content-container">
            
            <!-- Modal Header (Dynamic Color) -->
            <div id="modal-header" class="px-6 py-5 border-b border-white/10 relative overflow-hidden flex-shrink-0">
                <div class="absolute inset-0 opacity-20" id="modal-header-bg"></div>
                <div class="relative z-10 flex justify-between items-start">
                    <div>
                        <h3 id="modal-title" class="text-2xl font-extrabold text-white tracking-tight"></h3>
                        <div class="flex items-center text-white/80 text-sm mt-1 font-medium">
                            <span id="modal-time"></span>
                        </div>
                    </div>
                    <button onclick="closeModal()" class="text-white/60 hover:text-white bg-black/20 hover:bg-black/40 rounded-full p-1.5 transition-colors">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
                        </svg>
                    </button>
                </div>
            </div>

            <!-- Modal Body -->
            <div class="p-6 space-y-6 overflow-y-auto custom-scrollbar flex-1">
                <!-- Status Banner -->
                <div id="modal-status-banner" class="hidden rounded-lg p-3 text-sm font-semibold flex items-center gap-2"></div>
                
                <div class="grid grid-cols-2 gap-4">
                    <!-- Passengers -->
                    <div class="bg-white/5 rounded-xl p-4 border border-white/5">
                        <div class="text-xs font-semibold text-white/50 uppercase tracking-wider mb-2">Passengers</div>
                        <div id="modal-passengers" class="flex flex-wrap gap-1.5"></div>
                    </div>
                    
                    <!-- Driver -->
                    <div class="bg-white/5 rounded-xl p-4 border border-white/5">
                        <div class="text-xs font-semibold text-white/50 uppercase tracking-wider mb-2">Driver</div>
                        <div id="modal-driver" class="flex items-center gap-2"></div>
                    </div>
                </div>

                <!-- Prep kit items -->
                <div id="modal-prep-container" class="hidden bg-white/5 rounded-xl p-4 border border-white/5">
                    <div class="text-xs font-semibold text-white/50 uppercase tracking-wider mb-2">🎒 Bring</div>
                    <div id="modal-prep" class="flex flex-wrap gap-1.5"></div>
                </div>

                <!-- Location -->
                <div class="flex items-start text-gray-300 bg-white/5 rounded-xl p-4 border border-white/5">
                    <div class="bg-white/10 p-2 rounded-lg mr-3">
                        <svg class="w-5 h-5 text-blue-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"></path>
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"></path>
                        </svg>
                    </div>
                    <div class="flex-1">
                        <div class="text-xs font-semibold text-white/50 uppercase tracking-wider mb-0.5">Location</div>
                        <span id="modal-location" class="break-words font-medium text-white text-sm"></span>
                    </div>
                </div>

                <!-- Description -->
                <div id="modal-description-container" class="flex items-start text-gray-300 bg-white/5 rounded-xl p-4 border border-white/5">
                    <div class="bg-white/10 p-2 rounded-lg mr-3">
                        <svg class="w-5 h-5 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h7"></path>
                        </svg>
                    </div>
                    <div class="flex-1">
                        <div class="text-xs font-semibold text-white/50 uppercase tracking-wider mb-0.5">Description</div>
                        <div id="modal-description" class="whitespace-pre-wrap break-words italic text-gray-300 text-sm"></div>
                    </div>
                </div>

                <div class="flex justify-end pt-1" id="modal-config-container">
                    <button id="modal-config-btn"
                        onclick="closeModal(); openCalConfigModal(window._modalEventId)"
                        class="inline-flex items-center gap-2 px-4 py-2 bg-blue-600/80 hover:bg-blue-500 text-white text-sm font-bold rounded-lg transition-colors shadow-md">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
                        Event Configuration
                    </button>
                </div>
            </div>
        </div>
    </div>
    
    <!-- Event Configuration Modal (in-page; sibling of the dashboard's edit
         mode — same api/events/config + api/events PATCH contracts) -->
    <div id="cal-config-modal" class="hidden fixed inset-0 bg-black/80 flex items-center justify-center z-[60] p-4">
        <div class="bg-gray-800 border border-gray-700 rounded-2xl w-full max-w-2xl shadow-2xl flex flex-col max-h-[90vh]">
            <div class="px-6 py-4 border-b border-gray-700 flex justify-between items-center shrink-0">
                <div>
                    <h3 id="cal-config-title" class="text-xl font-bold text-blue-200">Event Configuration</h3>
                    <p id="cal-config-subtitle" class="text-xs text-gray-400 mt-0.5"></p>
                </div>
                <button onclick="closeCalConfigModal()" class="text-gray-400 hover:text-white transition-colors">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                </button>
            </div>
            <div class="p-6 overflow-y-auto space-y-4">
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-gray-400 mb-1 text-sm">Start Time Override</label>
                        <input type="datetime-local" id="cal-edit-start" class="w-full bg-gray-900 border border-gray-600 rounded-lg p-2.5 text-white focus:outline-none focus:border-blue-500">
                    </div>
                    <div>
                        <label class="block text-gray-400 mb-1 text-sm">End Time Override</label>
                        <input type="datetime-local" id="cal-edit-end" class="w-full bg-gray-900 border border-gray-600 rounded-lg p-2.5 text-white focus:outline-none focus:border-blue-500">
                    </div>
                </div>
                <div>
                    <label class="block text-gray-400 mb-1 text-sm">Location Override</label>
                    <input type="text" id="cal-edit-location" class="w-full bg-gray-900 border border-gray-600 rounded-lg p-2.5 text-white focus:outline-none focus:border-blue-500">
                </div>
                <div>
                    <label class="block text-gray-400 mb-2 text-sm font-bold tracking-wider">Attendance Mode</label>
                    <select id="cal-edit-attendance-mode" class="w-full bg-gray-900 border border-gray-600 rounded-lg p-2.5 text-white focus:outline-none focus:border-blue-500">
                        <option value="scheduler">Let scheduler decide</option>
                        <option value="dropoff_pickup">Drop off and Pick up</option>
                        <option value="stay">Stay for entire event</option>
                    </select>
                </div>
                <div>
                    <label class="block text-gray-400 mb-2 text-sm font-bold tracking-wider">Passengers</label>
                    <div id="cal-edit-passengers" class="grid grid-cols-1 sm:grid-cols-2 gap-3 bg-gray-900 border border-gray-600 rounded-lg p-3"></div>
                </div>
                <div>
                    <label class="block text-gray-400 mb-2 text-sm font-bold tracking-wider">Drivers</label>
                    <div id="cal-edit-drivers" class="grid grid-cols-2 gap-3 bg-gray-900 border border-gray-600 rounded-lg p-3"></div>
                </div>
                <div class="flex flex-col bg-gray-900 border border-gray-600 rounded-lg p-3">
                    <div class="flex items-center mb-3">
                        <input type="checkbox" id="cal-edit-is-trip" class="w-5 h-5 rounded bg-gray-800 border-gray-600 text-blue-500 focus:ring-blue-500 cursor-pointer">
                        <label for="cal-edit-is-trip" class="ml-3 text-gray-300 font-bold cursor-pointer">Mark as pure Background Trip (No destination)</label>
                    </div>
                    <label for="cal-edit-trip-id" class="text-gray-400 mb-1 text-sm font-bold tracking-wider">Associated Trip</label>
                    <select id="cal-edit-trip-id" class="bg-gray-800 border border-gray-600 rounded p-2 text-white text-sm focus:border-blue-500">
                        <option value="">None</option>
                    </select>
                </div>
            </div>
            <div class="px-6 py-4 border-t border-gray-700 flex justify-between items-center shrink-0">
                <button id="cal-ignore-btn" onclick="calIgnoreEvent()" class="px-4 py-2 rounded-lg bg-gray-700 hover:bg-gray-600 text-red-400 hover:text-red-300 font-bold transition-colors text-sm">Ignore Event</button>
                <div class="space-x-3">
                    <button onclick="closeCalConfigModal()" class="px-4 py-2 rounded-lg bg-gray-700 hover:bg-gray-600 text-white transition-colors text-sm">Cancel</button>
                    <button id="cal-save-config-btn" onclick="saveCalEventConfig()" class="px-5 py-2 rounded-lg bg-blue-600 hover:bg-blue-500 text-white font-bold shadow-md transition-colors text-sm">Save Configuration</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        function closeModal() {
            const modal = document.getElementById('simple-event-modal');
            const content = document.getElementById('modal-content-container');
            content.classList.remove('scale-100', 'opacity-100');

        function _calFindRawEvent(baseId) {
            const evs = (window._schedData && window._schedData.events) || [];

        function _calToDateTimeLocal(iso) {
            if (!iso) return '';
            const d = new Date(iso);
            const p = n => String(n).padStart(2, '0');
            return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}T${p(d.getHours())}:${p(d.getMinutes())}`;
        }

        async function _calResolveGoogleId(ev) {
            const parts = ev.source_event_ids[0].split('::');
            let googleId = parts[parts.length - 1];
            if (ev.recurring_event_id) {
                const applyToSeries = await promptConfirm("Recurring Event", "This is a recurring event. Do you want to apply this configuration to ALL instances in the series?", "Entire Series", "This Instance");
                if (applyToSeries) googleId = ev.recurring_event_id;
            }
            return googleId;
        }

        async function saveCalEventConfig() {
            const ev = calConfigEvent;
            if (!ev) return;
            const btn = document.getElementById('cal-save-config-btn');
            btn.disabled = true; btn.textContent = 'Saving…';
            try {
                const passengerTimes = {};
                document.querySelectorAll('#cal-edit-passengers .cal-pax-time').forEach(inp => {
                    if (!inp.value) return;
                    const pId = inp.dataset.pax;
                    const cb = document.querySelector(`#cal-edit-passengers .cal-pax-checkbox[value="${pId}"]`);
                    if (!cb || (!cb.checked && !cb.disabled)) return;
                    if (!passengerTimes[pId]) passengerTimes[pId] = {};
                    passengerTimes[pId][inp.dataset.kind] = inp.value;
                });
                const configData = {
                    passenger_ids: Array.from(document.querySelectorAll('#cal-edit-passengers .cal-pax-checkbox:checked, #cal-edit-passengers .cal-pax-checkbox:disabled')).map(cb => cb.value),
                    passenger_times: passengerTimes,
                    driver_ids: Array.from(document.querySelectorAll('#cal-edit-drivers .cal-drv-checkbox:checked')).map(cb => cb.value),
                    driver_attendance_mode: document.getElementById('cal-edit-attendance-mode').value,
                    is_trip: document.getElementById('cal-edit-is-trip').checked,
                    trip_id: document.getElementById('cal-edit-trip-id').value,
                    location_override: document.getElementById('cal-edit-location').value
                };
                const googleId = await _calResolveGoogleId(ev);
                const apiBase = window.location.pathname.endsWith('/') ? '../' : '';
                await fetch(`${apiBase}api/events/config/${googleId}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(configData)
                });

                // Time override if changed
                const newStart = document.getElementById('cal-edit-start').value;
                const newEnd = document.getElementById('cal-edit-end').value;
                const newStartIso = newStart ? new Date(newStart).toISOString() : null;
                const newEndIso = newEnd ? new Date(newEnd).toISOString() : null;
                if ((newStartIso && newStartIso !== new Date(ev.start).toISOString()) ||
                    (newEndIso && newEndIso !== new Date(ev.end).toISOString())) {
                    await fetch(`${apiBase}api/events`, {
                        method: 'PATCH',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            source_event_ids: ev.source_event_ids,
                            start: newStartIso || ev.start,
                            end: newEndIso || ev.end,
                            location: configData.location_override || ev.location
                        })
                    });
                }
                closeCalConfigModal();
                if (window.calendar) window.calendar.refetchEvents();
            } catch (e) {
                showGlobalAlert('Failed to save configuration.');
            } finally {
                btn.disabled = false; btn.textContent = 'Save Configuration';
            }
        }

        // Shared event pipeline: builds the event objects from api/schedule
        // for BOTH FullCalendar and the Agenda view (filtering + legend incl.)
        async function fetchCalEvents(startStr, endStr) {
                        const apiBase = window.location.pathname.endsWith('/') ? '../' : '';
                        const res = await fetch(`${apiBase}api/schedule?start_date=${encodeURIComponent(startStr)}&end_date=${encodeURIComponent(endStr)}&force_refresh=false`);

                        if (!res.ok) throw new Error('Network response was not ok');
                        const data = await res.json();
                        // Stash for the in-page Event Configuration modal
                        window._schedData = data;

                        let eventsMap = new Map();
                        const assignments = data.assignments || {};
                        const carAssignments = data.car_assignments || {};
                        const carsById = new Map((data.cars || []).map(c => [c.id, c]));
                        const true_unassigned = data.true_unassigned || [];
                        const drivers = data.drivers || [];
                        
                        // Parse standard events
                        if (data.events && data.events.length > 0) {
                            data.events.forEach(ev => {
                                if (ev.event_type === 'background_trip') {
                                    let baseId = ev.id;
                                    if (baseId.includes('_slice_')) {
                                        baseId = baseId.split('_slice_')[0];
                                    }
                                    
                                    if (eventsMap.has(baseId)) {
                                        let existing = eventsMap.get(baseId);
                                        if (new Date(ev.end) > new Date(existing.end)) {
                                            existing.end = ev.end;
                                        }
                                        if (new Date(ev.start) < new Date(existing.start)) {
                                            existing.start = ev.start;
                                        }
                                    } else {
                                        eventsMap.set(baseId, {
                                            id: baseId,
                                            title: '✈️ ' + ev.title,
                                            start: ev.start,
                                            end: ev.end,
                                            allDay: true,
                                            backgroundColor: '#1e3a8a',
                                            borderColor: '#3b82f6',
                                            extendedProps: {
                                                isTrip: true,
                                                // Carry the page params (kiosk/theme/tabs) —
                                                // this link is built in JS after nav.html's
                                                // one-shot link rewrite already ran.
                                                tripUrl: 'trip?event_id=' + encodeURIComponent(baseId) + _calCarryParams,
                                                rawColor: '#1e3a8a'
                                            }
                                        });
                                    }
                                    return;
                                }
                                if (ev.event_type !== 'background_trip') {
                                    let baseId = ev.id;
                                    let rawTitle = ev.title;
                                    if (ev.id.includes('_unrolled_')) {
                                        baseId = ev.id.split('_unrolled_')[0];
                                    } else if (ev.id.includes('_dropoff')) {
                                        baseId = ev.id.split('_dropoff')[0];
                                        rawTitle = rawTitle.replace('Dropoff: ', '');
                                    } else if (ev.id.includes('_pickup')) {
                                        baseId = ev.id.split('_pickup')[0];
                                        rawTitle = rawTitle.replace('Pickup: ', '');
                                    }

                                    let color = '#3B82F6';
                                    if (ev.calendar_ids && ev.calendar_ids.length > 0 && data.calendar_metadata && data.calendar_metadata[ev.calendar_ids[0]]) {
                                        color = data.calendar_metadata[ev.calendar_ids[0]].backgroundColor;
                                    }
                                    if (ev.trip_suppressed) {
                                        color = '#6B7280'; // grayed: ignored for the driving schedule
                                    }
                                    
                                    let paxMap = {};
                                    if (ev.calendar_ids) {
                                        ev.calendar_ids.forEach(cid => {
                                            const meta = data.calendar_metadata && data.calendar_metadata[cid];
                                            const name = meta ? meta.summary : cid;
                                            const cColor = meta ? meta.backgroundColor : '#3B82F6';
                                            paxMap[name] = cColor;
                                        });
                                    }
                                    
                                    const mRulesForPax = data.matched_rules && data.matched_rules[ev.id] ? data.matched_rules[ev.id] : [];
                                    if (data.passengers && mRulesForPax.length > 0) {
                                        mRulesForPax.forEach(r => {
                                            if (r.passenger_ids) {
                                                r.passenger_ids.forEach(pId => {
                                                    const pax = data.passengers.find(p => p.id === pId);
                                                    if (pax && !paxMap[pax.name]) {
                                                        let cColor = '#3B82F6';
                                                        if (pax.calendar_ids && pax.calendar_ids.length > 0) {
                                                            const meta = data.calendar_metadata && data.calendar_metadata[pax.calendar_ids[0]];
                                                            if (meta) cColor = meta.backgroundColor;
                                                        }
                                                        paxMap[pax.name] = cColor;
                                                    }
                                                });
                                            }
                                        });
                                    }
                                    
                                    const paxNames = Object.keys(paxMap);
                                    const passengerPills = paxNames.map(name => ({
                                        name: name,
                                        color: paxMap[name]
                                    }));
                                    
                                    const isUnassigned = true_unassigned.includes(ev.id);
                                    // Unassignable vs. merely unassigned: when EVERY driver
                                    // is hard-blocked (no 'optimization' reasons), assigning
                                    // a driver isn't the fix — surface it as a conflict
                                    // instead of shouting "Needs driver".
                                    let isConflict = false;
                                    if (isUnassigned) {
                                        const reasons = Object.values((data.diagnostics || {})[ev.id] || {});
                                        isConflict = reasons.length > 0 && reasons.every(r => r && r.type !== 'optimization');
                                    }
                                    let driverName = null;
                                    if (!isUnassigned && assignments[ev.id]) {
                                        const d = drivers.find(d => d.id === assignments[ev.id]);
                                        if (d) driverName = d.name;
                                    }
                                    let carName = null, carSwap = false;
                                    if (!isUnassigned && carAssignments[ev.id]) {
                                        const car = carsById.get(carAssignments[ev.id]);
                                        if (car) {
                                            carName = (car.icon || '🚗') + ' ' + car.name;
                                            carSwap = !!(car.default_driver_id && car.default_driver_id !== assignments[ev.id]);
                                        }
                                    }
                                    
                                    if (eventsMap.has(baseId)) {
                                        let existing = eventsMap.get(baseId);
                                        // Merge times
                                        if (new Date(ev.start) < new Date(existing.start)) existing.start = ev.start;
                                        if (new Date(ev.end) > new Date(existing.end)) existing.end = ev.end;
                                        
                                        // Merge passengers
                                        passengerPills.forEach(p => {
                                            if (!existing.extendedProps.passengers.find(x => x.name === p.name)) {
                                                existing.extendedProps.passengers.push(p);
                                            }
                                        });

                                        // Merge prep-kit items (split legs / unrolled instances)
                                        ((data.prep_by_event || {})[ev.id] || []).forEach(item => {
                                            existing.extendedProps.prep = existing.extendedProps.prep || [];
                                            if (!existing.extendedProps.prep.includes(item)) {
                                                existing.extendedProps.prep.push(item);
                                            }
                                        });
                                        
                                        // Merge drivers
                                        if (isUnassigned) {
                                            // Conflict only if every unassigned leg is a conflict —
                                            // one assignable leg keeps the actionable red badge.
                                            existing.extendedProps.isConflict = existing.extendedProps.isUnassigned
                                                ? (existing.extendedProps.isConflict && isConflict) : isConflict;
                                            existing.extendedProps.isUnassigned = true;
                                            existing.extendedProps.driverName = null;
                                        } else if (driverName) {
                                            if (!existing.extendedProps.isUnassigned) {
                                                if (!existing.extendedProps.driverName) {
                                                    existing.extendedProps.driverName = driverName;
                                                } else if (existing.extendedProps.driverName !== driverName) {
                                                    existing.extendedProps.driverName = 'Multiple Drivers';
                                                }
                                            }
                                        }
                                        if (carName && !existing.extendedProps.isUnassigned) {
                                            if (!existing.extendedProps.carName) {
                                                existing.extendedProps.carName = carName;
                                            } else if (existing.extendedProps.carName !== carName) {
                                                existing.extendedProps.carName = 'Multiple cars';
                                            }
                                            if (carSwap) existing.extendedProps.carSwap = true;
                                        }
                                    } else {
                                        eventsMap.set(baseId, {
                                            id: baseId,
                                            title: rawTitle,
                                            start: ev.start,
                                            end: ev.end,
                                            allDay: ev.all_day,
                                            backgroundColor: color,
                                            extendedProps: {
                                                location: ev.location,
                                                description: ev.description,
                                                passengers: [...passengerPills],
                                                isUnassigned: isUnassigned,
                                                isConflict: isConflict,
                                                driverName: driverName,
                                                carName: carName,
                                                carSwap: carSwap,
                                                isErrand: false,
                                                tripSuppressed: !!ev.trip_suppressed,
                                                rawColor: color,
                                                prep: (data.prep_by_event || {})[ev.id] || []
                                            }
                                        });
                                    }
                                }
                            });
                        }
                        
                        // Populate legend data. People first: the legend is the
                        // family, not the roster of solver roles — someone who
                        // drives themselves and chauffeurs nobody has no driver
                        // or passenger record and used to be missing entirely.
                        // Their calendar summaries become aliases so events
                        // labelled "Jeff's Calendar" still filter under "Jeff".
                        if (data.members) {
                            data.members.forEach(m => {
                                const type = m.driver_id ? 'driver' : (m.passenger_id ? 'passenger' : 'member');
                                allLegendMembers.set(m.name, { id: m.name, name: m.name,
                                    color: m.color_code || '#3B82F6', type: type });
                                (m.calendar_ids || []).forEach(cid => {
                                    const meta = data.calendar_metadata && data.calendar_metadata[cid];
                                    if (meta && meta.summary && meta.summary !== m.name) {
                                        memberAliases.set(meta.summary, m.name);
                                    }
                                });
                            });
                        }
                        // Fall back to the solver records for anyone the member
                        // overlay hasn't caught up with yet.
                        if (data.passengers) {
                            data.passengers.forEach(p => {
                                if (allLegendMembers.has(p.name)) return;
                                let cColor = '#3B82F6';
                                if (p.calendar_ids && p.calendar_ids.length > 0) {
                                    const meta = data.calendar_metadata && data.calendar_metadata[p.calendar_ids[0]];
                                    if (meta) cColor = meta.backgroundColor;
                                }
                                allLegendMembers.set(p.name, { id: p.name, name: p.name, color: cColor, type: 'passenger' });
                            });
                        }
                        if (data.drivers) {
                            data.drivers.forEach(d => {
                                if (allLegendMembers.has(d.name)) return;
                                // Use the driver's real color — the old hardcoded
                                // #1F2937 (dark slate) was an unreadable blob on
                                // light HA themes.
                                allLegendMembers.set(d.name, { id: d.name, name: d.name,
                                    color: d.color_code || d.color || '#475569', type: 'driver' });
                            });
                        }
                        renderLegend();

                        let fcEvents = Array.from(eventsMap.values());

                        // Apply filtering. Passengers define who an event is
                        // "for"; the driver only counts when there are no
                        // passengers (their own event). Counting the driver on
                        // passenger events meant assigned events never hid —
                        // a visible parent-driver kept every ride on screen.
                        fcEvents = fcEvents.filter(ev => {
                            let participants = new Set();
                            if (ev.extendedProps.passengers) {
                                ev.extendedProps.passengers.forEach(p =>
                                    participants.add(memberAliases.get(p.name) || p.name));
                            }
                            if (participants.size === 0
                                && ev.extendedProps.driverName && ev.extendedProps.driverName !== 'Multiple Drivers') {
                                participants.add(ev.extendedProps.driverName);
                            }

                            // If event has no mapped participants, show it
                            if (participants.size === 0) return true;

                            // Hide only when EVERY person it's for is toggled off
                            let allHidden = true;
                            for (let p of participants) {
                                if (!window.hiddenMembers.has(p)) {
                                    allHidden = false;
                                    break;
                                }
                            }
                            return !allHidden;
                        });

                        // Add errands
                        if (data.scheduled_errands && data.scheduled_errands.length > 0) {
                            data.scheduled_errands.forEach(ev => {
                                let driverName = null;
                                if (assignments[ev.id]) {
                                    const d = drivers.find(d => d.id === assignments[ev.id]);
                                    if (d) driverName = d.name;
                                }
                            
                                fcEvents.push({
                                    id: ev.event_id || ev.id,
                                    title: ev.title,
                                    start: ev.start_time_iso || ev.start,
                                    end: ev.end_time_iso || ev.end,
                                    backgroundColor: '#F59E0B',
                                    extendedProps: { 
                                        location: ev.errand ? ev.errand.location : ev.location,
                                        description: ev.description || ('Duration: ' + (ev.end_mins - ev.start_mins) + ' mins'),
                                        isErrand: true,
                                        driverName: driverName,
                                        rawColor: '#F59E0B'
                                    }
                                });
                            });
                        }

                        return fcEvents;
        }

        // Shared details dialog: FullCalendar passes its EventApi, the Agenda
        // view passes plain event objects (start/end as ISO strings) — both
        // are normalized here.

                    };
                    
                    let timeText = '';
                    if (ev.allDay) {

                        timeText = ev.start ? formatDateUTC(ev.start) + ' (All Day)' : 'All Day';

                    // Status Banner

                        banner.innerHTML = '<svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3.055 11H5a2 2 0 012 2v1a2 2 0 002 2 2 2 0 012 2v2.945M8 3.935V5.5A2.5 2.5 0 0010.5 8h.5a2 2 0 012 2 2 2 0 104 0 2 2 0 012-2h1.064M15 20.488V18a2 2 0 012-2h3.064M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg> Ignored for the driving schedule — everyone attending is away on a trip during this event.';

                        banner.innerHTML = '<svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path></svg> Scheduling conflict — every driver is blocked for this event, so assigning one won\'t fix it.';
                    } else if (props.isUnassigned) {
                        banner.className = 'rounded-lg p-3 text-sm font-bold flex items-center gap-2 bg-red-500/20 text-red-400 border border-red-500/30 mb-4';
                        banner.innerHTML = '<svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path></svg> This event has a scheduling conflict and needs a driver assigned.';

        function _postCalendarInit() {
            // Observer for FullCalendar Popover to show backdrop
            const popoverBackdrop = document.getElementById('fc-popover-backdrop');
            const observer = new MutationObserver(() => {
                const popover = document.querySelector('.fc-popover');
                if (popover) {
                    popoverBackdrop.classList.remove('hidden');
                    // Move backdrop to be a sibling of popover so they share stacking context
                    if (popover.parentNode && popoverBackdrop.parentNode !== popover.parentNode) {
                        popover.parentNode.insertBefore(popoverBackdrop, popover);
                    }
                } else {
                    popoverBackdrop.classList.add('hidden');
                }
            });
            observer.observe(document.body, { childList: true, subtree: true });
            
            popoverBackdrop.addEventListener('click', () => {
                const closeBtn = document.querySelector('.fc-popover-close');
                if (closeBtn) closeBtn.click();
            });

            window.calendar.render();
            document.getElementById('agenda-days').value = String(agendaDays);
            if (_startView === 'agenda') enterAgenda();
        }

        // ===================== Agenda view =====================
        // A compact multi-day grid: each day is a card listing its events by
        // start time (all-day pinned first) — far denser than the timeline
        // views for a quick week scan, and the natural kiosk calendar card.
        window._agendaActive = false;
        let _agendaSeq = 0;
        let agendaAnchor = new Date();
        agendaAnchor.setHours(0, 0, 0, 0);
        let agendaDays = parseInt(_calUrlParams.get('agenda_days'))
            || parseInt(localStorage.getItem('chauffeur_agenda_days')) || 7;
        agendaDays = Math.min(Math.max(agendaDays, 1), 14);

        function _agIso(d) {
            return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
        }
        function _agEsc(s) {
            return String(s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;')
                .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
        }

        function enterAgenda() {
            window._agendaActive = true;
            if (!_viewForced) localStorage.setItem('chauffeur_cal_view', 'agenda');
            document.getElementById('calendar').style.display = 'none';
            document.getElementById('agenda-view').style.display = 'flex';
            renderAgenda();
        }

        function exitAgenda(viewType) {
            window._agendaActive = false;
            document.getElementById('agenda-view').style.display = 'none';
            document.getElementById('calendar').style.display = '';
            window.calendar.changeView(viewType);
            window.calendar.updateSize();
        }

        function agendaNav(dir) {
            agendaAnchor.setDate(agendaAnchor.getDate() + dir * agendaDays);
            renderAgenda();
        }

        function agendaToday() {
            agendaAnchor = new Date();
            agendaAnchor.setHours(0, 0, 0, 0);
            renderAgenda();
        }

        function setAgendaDays(n) {
            agendaDays = Math.min(Math.max(parseInt(n) || 7, 1), 14);
            if (!_daysForced) localStorage.setItem('chauffeur_agenda_days', String(agendaDays));
            renderAgenda();
        }

        async function renderAgenda() {
            const seq = ++_agendaSeq;
            const grid = document.getElementById('agenda-grid');
            const startStr = _agIso(agendaAnchor);
            const endD = new Date(agendaAnchor);
            endD.setDate(endD.getDate() + agendaDays);
            const endStr = _agIso(endD); // exclusive, same contract as FullCalendar

            const lastShown = new Date(endD);
            lastShown.setDate(lastShown.getDate() - 1);
            const fmt = { month: 'short', day: 'numeric' };
            document.getElementById('agenda-title').innerText = agendaDays === 1
                ? agendaAnchor.toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric' })
                : `${agendaAnchor.toLocaleDateString('en-US', fmt)} – ${lastShown.toLocaleDateString('en-US', { ...fmt, year: 'numeric' })}`;

            grid.innerHTML = '<p class="text-gray-400 col-span-full py-8 text-center font-medium">Loading…</p>';

            let events;
            try {
                events = await fetchCalEvents(startStr, endStr);
            } catch (e) {
                console.error('Agenda fetch failed:', e);
                if (seq === _agendaSeq) grid.innerHTML = '<p class="text-red-400 col-span-full py-8 text-center font-bold">Failed to load events.</p>';
                return;
            }

            // Weather chips are garnish — any failure just omits them.
            const weather = {};
            try {
                const apiBase = window.location.pathname.endsWith('/') ? '../' : '';
                const wres = await fetch(`${apiBase}api/weather/daily?days=${agendaDays}&start=${startStr}`);
                if (wres.ok) (await wres.json()).forEach(w => { weather[w.date] = w; });
            } catch (e) { /* no chips */ }

            if (seq !== _agendaSeq) return; // superseded by a newer render
            grid.innerHTML = '';

            const todayD = new Date(); todayD.setHours(0, 0, 0, 0);
            const todayIso = _agIso(todayD);
            todayD.setDate(todayD.getDate() + 1);
            const tomorrowIso = _agIso(todayD);
            const fmtTime = d => d.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' });

            for (let i = 0; i < agendaDays; i++) {
                const day = new Date(agendaAnchor);
                day.setDate(day.getDate() + i);
                const dayIso = _agIso(day);
                const dayStart = new Date(day);
                const dayEnd = new Date(day);
                dayEnd.setDate(dayEnd.getDate() + 1);

                const dayEvents = events.filter(ev => {
                    if (ev.allDay) {
                        // Compare on the ISO date part: all-day events parse as
                        // UTC midnight and would shift a day through local Date
                        // math. Google all-day ends are exclusive.
                        const s = String(ev.start).slice(0, 10);
                        const e = ev.end ? String(ev.end).slice(0, 10) : s;
                        return s === dayIso || (s <= dayIso && e > dayIso);
                    }
                    const s = new Date(ev.start);
                    const e = ev.end ? new Date(ev.end) : new Date(s.getTime() + 1);
                    return s < dayEnd && e > dayStart;
                }).sort((a, b) => (b.allDay ? 1 : 0) - (a.allDay ? 1 : 0)
                    || new Date(a.start) - new Date(b.start));

                const isToday = dayIso === todayIso;
                const label = isToday ? 'Today' : (dayIso === tomorrowIso ? 'Tomorrow'
                    : day.toLocaleDateString('en-US', { weekday: 'long' }));
                const w = weather[dayIso];
                const wChip = w ? `<span class="text-xs text-gray-400 font-semibold shrink-0">${w.high != null ? Math.round(w.high) + '°' : ''}${w.low != null ? ' / ' + Math.round(w.low) + '°' : ''} ${_agEsc(w.emoji)}</span>` : '';

                const card = document.createElement('div');
                card.className = `agenda-day rounded-2xl p-3 flex flex-col gap-2${isToday ? ' agenda-today' : ''}`;
                card.innerHTML = `
                    <div class="flex items-baseline justify-between gap-2 px-1">
                        <div class="flex items-baseline gap-2 min-w-0">
                            <span class="text-2xl font-extrabold text-white">${day.getDate()}</span>
                            <span class="text-sm font-bold text-gray-300 truncate">${label}</span>
                        </div>
                        ${wChip}
                    </div>`;

                if (dayEvents.length === 0) {
                    card.innerHTML += '<p class="text-xs text-gray-500 italic px-1 py-2">Nothing scheduled</p>';
                }

                dayEvents.forEach(ev => {
                    const props = ev.extendedProps || {};
                    const barColor = props.isUnassigned ? (props.isConflict ? '#f59e0b' : '#ef4444')
                        : (props.rawColor || ev.backgroundColor || '#3b82f6');
                    const timeLabel = ev.allDay ? 'Entire day'
                        : `${fmtTime(new Date(ev.start))}${ev.end ? ' – ' + fmtTime(new Date(ev.end)) : ''}`;

                    let badge = '';
                    if (props.tripSuppressed) {
                        badge = '<span class="text-[10px] font-bold text-gray-400 shrink-0">✈️ Trip conflict</span>';
                    } else if (props.isConflict) {
                        badge = '<span class="text-[10px] font-bold text-amber-400 shrink-0">⚠️ Conflict</span>';
                    } else if (props.isUnassigned) {
                        badge = '<span class="text-[10px] font-bold text-red-400 shrink-0">⚠️ Needs driver</span>';
                    } else if (props.driverName) {
                        badge = `<span class="text-[10px] font-bold px-1.5 py-0.5 rounded bg-gray-700 text-gray-300 shrink-0 max-w-[80px] truncate">${_agEsc(props.driverName)}</span>`;
                        if (props.carName) {
                            badge += `<span class="text-[10px] font-bold px-1.5 py-0.5 rounded shrink-0 max-w-[90px] truncate ${props.carSwap ? 'bg-amber-500/20 text-amber-300' : 'bg-gray-700 text-gray-400'}" title="${props.carSwap ? 'Car swap: not this driver&#39;s usual car' : 'Assigned car'}">${_agEsc(props.carName)}${props.carSwap ? ' ⇄' : ''}</span>`;
                        }
                    } else if (props.isErrand) {
                        badge = '<span class="text-[10px] font-bold text-amber-400 shrink-0">Errand</span>';
                    }

                    const row = document.createElement('div');
                    row.className = `agenda-event rounded-lg px-2.5 py-1.5 cursor-pointer transition-colors flex flex-col gap-0.5${props.tripSuppressed ? ' opacity-50' : ''}`;
                    row.style.borderLeft = `4px solid ${barColor}`;
                    row.innerHTML = `
                        <span class="text-[11px] font-semibold text-gray-400">${_agEsc(timeLabel)}</span>
                        <div class="flex items-center justify-between gap-2">
                            <span class="text-[13px] font-bold text-white truncate">${_agEsc(ev.title)}</span>
                            ${badge}
                        </div>`;
                    row.onclick = () => openEventModal(ev);
                    card.appendChild(row);
                });

                grid.appendChild(card);
            }
        }
    </script>
