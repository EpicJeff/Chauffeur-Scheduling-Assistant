<script>
    const urlParamsTheme = new URLSearchParams(window.location.search);
    const themeParam = urlParamsTheme.get('theme');
    const isHaTheme = themeParam && themeParam.startsWith('ha');

    window.tailwind = window.tailwind || {};
    const baseColors = {
        900: 'var(--ha-card-bg, #1c1c1c)',
        800: 'var(--ha-header-bg, #2b2b2b)',
        700: 'var(--ha-divider, #444444)',
        600: 'var(--ha-divider, #666666)',
        500: 'var(--ha-secondary-text, #888888)',
        400: 'var(--ha-secondary-text, #9e9e9e)',
        300: 'var(--ha-secondary-text, #b0b0b0)',
        200: 'var(--ha-primary-text, #cccccc)',
        100: 'var(--ha-primary-text, #e1e1e1)',
    };
    const config = window.tailwind.config || { darkMode: 'class', theme: { extend: {} } };
    if (!config.theme) config.theme = {};
    if (!config.theme.extend) config.theme.extend = {};
    if (!config.theme.extend.colors) config.theme.extend.colors = {};
    
    if (isHaTheme) {
        config.theme.extend.colors.gray = baseColors;
        config.theme.extend.colors.white = 'var(--ha-primary-text, #e1e1e1)';
        config.theme.extend.colors.blue = {
            100: 'var(--ha-primary-color, #1e3a8a)',
            200: 'var(--ha-primary-color, #1d4ed8)',
        };
    }
    window.tailwind.config = config;

    function syncHaTheme() {
        try {
            if (window.parent !== window && window.parent.document) {
                const style = window.getComputedStyle(window.parent.document.body);
                const bg = style.getPropertyValue('--primary-background-color');
                const card = style.getPropertyValue('--card-background-color') || style.getPropertyValue('--primary-background-color');
                const text = style.getPropertyValue('--primary-text-color');
                const sec = style.getPropertyValue('--secondary-text-color');
                const div = style.getPropertyValue('--divider-color');
                const primary = style.getPropertyValue('--primary-color');
                const secBg = style.getPropertyValue('--secondary-background-color') || card;

                if (bg) document.documentElement.style.setProperty('--ha-bg', bg.trim());
                if (card) document.documentElement.style.setProperty('--ha-card-bg', card.trim());
                if (text) document.documentElement.style.setProperty('--ha-primary-text', text.trim());
                if (sec) document.documentElement.style.setProperty('--ha-secondary-text', sec.trim());
                if (div) document.documentElement.style.setProperty('--ha-divider', div.trim());
                if (primary) document.documentElement.style.setProperty('--ha-primary-color', primary.trim());
                if (secBg) document.documentElement.style.setProperty('--ha-header-bg', secBg.trim());
            }
        } catch (e) {
            // Cross-origin fallback applied automatically via CSS variable defaults
        }
    }

    if (isHaTheme) {
        syncHaTheme();
        setInterval(syncHaTheme, 5000); // Check for day/night schedule changes
        
        document.addEventListener('DOMContentLoaded', () => {
            document.body.classList.add('ha-theme');
        });
    }
</script>
<style>
    body.ha-theme {
        background-color: var(--ha-bg, #111111) !important;
        color: var(--ha-primary-text, #e1e1e1) !important;
    }
    
    /* Hide scrollbar for a clean kiosk look */
    body.ha-theme ::-webkit-scrollbar {
        display: none;
    }
</style>
