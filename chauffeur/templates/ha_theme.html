<script>
    // --- Panel mode (?panel=true), resolved BEFORE anything reads the URL.
    //
    // A wall panel is a kiosk that you touch. Rather than teach ten pages a
    // second flag, panel mode WRITES kiosk=true into the address and lets
    // every existing `?kiosk=true` check light up unchanged — the flag is
    // already threaded through nav, dashboard, chores, routines, shopping,
    // moments and calendar, and re-deriving that in each of them would be
    // seven chances to disagree. This has to happen here because ha_theme is
    // the first thing in every page's <head>; by DOMContentLoaded the nav and
    // the Alpine components have already made up their minds.
    //
    // The param is then carried across links by nav.html's existing
    // propagation, so the whole panel stays in panel mode by walking around.
    (function () {
        const p = new URLSearchParams(window.location.search);
        if (p.get('panel') !== 'true') return;
        document.documentElement.setAttribute('data-panel', '');
        if (p.get('kiosk') !== 'true') {
            p.set('kiosk', 'true');
            history.replaceState(null, '',
                window.location.pathname + '?' + p.toString() + window.location.hash);
        }
    })();

    const urlParamsTheme = new URLSearchParams(window.location.search);
    const themeParam = urlParamsTheme.get('theme');
    const isKioskTheme = urlParamsTheme.get('kiosk') === 'true';
    const isHaTheme = (themeParam && themeParam.startsWith('ha')) || isKioskTheme;

    function syncHaTheme() {
        try {
            if (window.parent !== window && window.parent.document) {
                const style = window.getComputedStyle(window.parent.document.body);
                const bg = style.getPropertyValue('--primary-background-color');
                const card = style.getPropertyValue('--card-background-color') || style.getPropertyValue('--primary-background-color');
                const text = style.getPropertyValue('--primary-text-color');
                const sec = style.getPropertyValue('--secondary-text-color');
                const div = style.getPropertyValue('--divider-color');
                const primary = style.getPropertyValue('--primary-color');
                const secBg = style.getPropertyValue('--secondary-background-color') || card;

                if (bg) document.documentElement.style.setProperty('--ha-bg', bg.trim());
                if (card) document.documentElement.style.setProperty('--ha-card-bg', card.trim());
                if (text) document.documentElement.style.setProperty('--ha-primary-text', text.trim());
                if (sec) document.documentElement.style.setProperty('--ha-secondary-text', sec.trim());
                if (div) document.documentElement.style.setProperty('--ha-divider', div.trim());
                if (primary) document.documentElement.style.setProperty('--ha-primary-color', primary.trim());
                if (secBg) document.documentElement.style.setProperty('--ha-header-bg', secBg.trim());
            }
        } catch (e) {
            // Cross-origin fallback applied automatically via CSS variable defaults
        }
    }

    if (isHaTheme) {
        syncHaTheme();
        setInterval(syncHaTheme, 5000); // Check for day/night schedule changes

        document.addEventListener('DOMContentLoaded', () => {
            document.body.classList.add('ha-theme');
            document.documentElement.classList.add('ha-theme');
        });
    }
</script>
<style>
    /* --- Panel mode: the whole app, sized for a finger.
       The lever is the ROOT FONT SIZE, not a pile of per-control overrides.
       Tailwind's type scale and its padding scale are both in rem, so moving
       16px to 19px scales every button, every gap and every tap target
       together, and nothing reflows into a layout it was never tested in.
       Blanket `min-height: 44px` on every anchor was the alternative and it
       wrecks inline links on eleven pages. */
    html[data-panel] {
        font-size: 19px;
        -webkit-tap-highlight-color: transparent;
    }

    html[data-panel] body {
        /* A wall panel has no back button and nowhere to rubber-band to. */
        overscroll-behavior: none;
        -webkit-user-select: none;
        user-select: none;
        /* Room for the shelf, which is fixed over the bottom of the page. */
        padding-bottom: 5.5rem;
    }

    /* Typing still has to work — the no-select rule is about stray long
       presses on labels, not about the errand box. */
    html[data-panel] input,
    html[data-panel] textarea,
    html[data-panel] [contenteditable] {
        -webkit-user-select: text;
        user-select: text;
    }

    /* Controls that are still too small after the scale: a checkbox is 13px
       at any root size, and checking one off is the main thing a kid does at
       the panel. */
    html[data-panel] input[type="checkbox"],
    html[data-panel] input[type="radio"] {
        width: 1.5rem;
        height: 1.5rem;
    }

    html[data-panel] button,
    html[data-panel] [role="button"] {
        min-height: 2.75rem;
    }

    /* The top bar is gone in panel mode, so headers that stick BELOW it would
       otherwise float a nav-height gap down from the top. */
    html[data-panel] .sticky.top-\[4rem\] {
        top: 0 !important;
    }

    body.ha-theme {
        background-color: var(--ha-bg, #111111) !important;
        color: var(--ha-primary-text, #e1e1e1) !important;
    }

    /* Style scrollbar to match HA theme natively */
    html.ha-theme, html.ha-theme *, body.ha-theme * {
        scrollbar-color: var(--ha-divider, #333333) var(--ha-bg, #111111);
    }
    
    html.ha-theme::-webkit-scrollbar,
    body.ha-theme ::-webkit-scrollbar {
        width: 14px;
        height: 14px;
    }
    
    html.ha-theme::-webkit-scrollbar-track,

    }
    
    html.ha-theme::-webkit-scrollbar-thumb,

        border-radius: 8px;
        border: 4px solid var(--ha-bg, #111111);
    }
    
    html.ha-theme::-webkit-scrollbar-thumb:hover,
    body.ha-theme ::-webkit-scrollbar-thumb:hover {
        background-color: var(--ha-secondary-text, #9b9b9b);
    }

    /* Map Tailwind grays to HA Theme variables */
    body.ha-theme,
    body.ha-theme .bg-gray-950,
    body.ha-theme .bg-gray-900 {
        background-color: var(--ha-bg, #111111) !important;
    }

    body.ha-theme .bg-gray-800 {
        background-color: var(--ha-card-bg, #1c1c1c) !important;
    }

    body.ha-theme .bg-gray-700,

        background-color: var(--ha-header-bg, #333333) !important;

        border-color: var(--ha-divider, #333333) !important;

    body.ha-theme,
    body.ha-theme .text-gray-50,
    body.ha-theme .text-gray-100,
    body.ha-theme .text-gray-200,
    body.ha-theme .text-white {
        color: var(--ha-primary-text, #e1e1e1) !important;

    body.ha-theme .text-gray-300,
    body.ha-theme .text-gray-400,

    body.ha-theme .text-blue-100,

    body.ha-theme .text-blue-300 {

    /* Opacity-suffixed gray BORDERS (errands input frame / properties bar,

    body.ha-theme .border-gray-800\/50,

    /* Red-tinted constraint toggles (errands edit modal): mirror the blue

    /* Accent text used by the kid boards: blend toward the theme's text

    /* Pink is the Moments accent (gallery headings, hearth rail, strip label,

    /* NOTE for future work: only the opacity suffixes listed in this file are
