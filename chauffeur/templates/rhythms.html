<!DOCTYPE html>
<html lang="en" class="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rhythms</title>
    <link href="{{ 'static/vendor/fonts/inter/inter.css'|ver }}" rel="stylesheet">
    {% include 'ha_theme.html' %}
    <!-- The lesson player's device voice: this machine's own Music Assistant
         player (static/music_logic.js), the same script app.html and home.html
         load. Without it a lesson on an admin page could only ever speak through
         the browser, however many players the household had set up. -->
    <script src="{{ 'static/music_logic.js'|ver }}"></script>
    <script src="{{ 'static/vendor/alpine.min.js'|ver }}" defer></script>
    <style>
        body { background-color: #111827; color: #e5e7eb; }
        [x-cloak] { display: none !important; }
    </style>
    <link rel="stylesheet" href="{{ 'static/tailwind.css'|ver }}">
</head>

<body class="flex flex-col h-screen overflow-hidden">
    {% include 'nav.html' %}

    <!-- Routines holds the daily checklists, with Chores beside it in the
         Rhythms group (nav.html PAGE_GROUPS). Programs live in Projects;
         Growing up lives in Config > People (v2.499.285). -->
    <div class="flex-1 overflow-y-auto bg-gray-900/50">
        <div class="max-w-6xl mx-auto">
            <section id="routines" data-page-tab="routines" class="min-w-0">
                {% include 'components/routines_page.html' %}
            </section>
        </div>
    </div>
    <script>
        // Growing up lives on Config > People now; old links follow it.
        if ((window.location.hash || '') === '#growing-up') window.location.replace('config#growing-up');
        if (['#programs-settings', '#lessons', '#programs-pacing'].includes(window.location.hash)) {
            window.location.replace('work?tab=projects' + window.location.hash);
        }
    </script>
    {% include 'components/control_center.html' %}
    {% include 'components/moments_hearth.html' %}
</body>
</html>
