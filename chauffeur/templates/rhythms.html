<!DOCTYPE html>
<html lang="en" class="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rhythms</title>
    <link href="{{ 'static/vendor/fonts/inter/inter.css'|ver }}" rel="stylesheet">
    {% include 'ha_theme.html' %}
    <script src="{{ 'static/vendor/alpine.min.js'|ver }}" defer></script>
    <style>
        body { background-color: #111827; color: #e5e7eb; }
        [x-cloak] { display: none !important; }
    </style>
    <link rel="stylesheet" href="{{ 'static/tailwind.css'|ver }}">
</head>

<body class="flex flex-col h-screen overflow-hidden">
    {% include 'nav.html' %}

    <!-- The recurring shapes of family life on one page: routines (the daily
         checklists) and programs (the goal plans). A presentation-only merge —
         each column is the SAME component its standalone page serves, two
         independent Alpine islands; /routines and /programs keep working.
         One at a time (v2.499.247): each section is a tab of the Rhythms
         group (nav.html PAGE_GROUPS), with Chores beside them. Growing up
         moved to Config > People (v2.499.285). -->
    <div class="flex-1 overflow-y-auto bg-gray-900/50">
        <div class="max-w-6xl mx-auto">
            <section id="routines" data-page-tab="routines" class="min-w-0">
                {% include 'components/routines_page.html' %}
            </section>
            <section id="programs" data-page-tab="programs" class="min-w-0">
                {% include 'components/programs_page.html' %}
            </section>
        </div>
    </div>
    <script>
        // Growing up lives on Config > People now; old links follow it.
        if ((window.location.hash || '') === '#growing-up') window.location.replace('config#growing-up');
    </script>
    {% include 'components/control_center.html' %}
    {% include 'components/moments_hearth.html' %}
</body>
</html>
