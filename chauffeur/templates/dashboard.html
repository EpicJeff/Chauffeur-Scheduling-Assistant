<!DOCTYPE html>
<html lang="en" class="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Family Driver Schedule</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const themeParam = urlParams.get('theme');
        const isHaTheme = themeParam && themeParam.startsWith('ha');

        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: isHaTheme ? {
                        gray: {
                            900: 'var(--ha-card-bg, #1c1c1c)',
                            800: 'var(--ha-header-bg, #2b2b2b)',
                            700: 'var(--ha-divider, #444444)',
                            600: 'var(--ha-divider, #666666)',
                            500: 'var(--ha-secondary-text, #888888)',
                            400: 'var(--ha-secondary-text, #9e9e9e)',
                            300: 'var(--ha-secondary-text, #b0b0b0)',
                            200: 'var(--ha-primary-text, #cccccc)',
                            100: 'var(--ha-primary-text, #e1e1e1)',
                        },
                        white: 'var(--ha-primary-text, #e1e1e1)',
                        blue: {
                            100: 'var(--ha-primary-color, #1e3a8a)',
                            200: 'var(--ha-primary-color, #1d4ed8)',
                        }
                    } : {}
                }
            }
        }

        function syncHaTheme() {
            try {
                if (window.parent !== window && window.parent.document) {
                    const style = window.getComputedStyle(window.parent.document.body);
                    const bg = style.getPropertyValue('--primary-background-color');
                    const card = style.getPropertyValue('--card-background-color') || style.getPropertyValue('--primary-background-color');
                    const text = style.getPropertyValue('--primary-text-color');
                    const sec = style.getPropertyValue('--secondary-text-color');
                    const div = style.getPropertyValue('--divider-color');
                    const primary = style.getPropertyValue('--primary-color');
                    const secBg = style.getPropertyValue('--secondary-background-color') || card;

                    if (bg) document.documentElement.style.setProperty('--ha-bg', bg.trim());
                    if (card) document.documentElement.style.setProperty('--ha-card-bg', card.trim());
                    if (text) document.documentElement.style.setProperty('--ha-primary-text', text.trim());
                    if (sec) document.documentElement.style.setProperty('--ha-secondary-text', sec.trim());
                    if (div) document.documentElement.style.setProperty('--ha-divider', div.trim());
                    if (primary) document.documentElement.style.setProperty('--ha-primary-color', primary.trim());
                    if (secBg) document.documentElement.style.setProperty('--ha-header-bg', secBg.trim());
                }
            } catch (e) {
                // Cross-origin fallback applied automatically via CSS variable defaults
            }
        }

        if (isHaTheme) {
            syncHaTheme();
            setInterval(syncHaTheme, 5000); // Check for day/night schedule changes
        }
    </script>
    <style>
        body {
            background-color: #1a202c;
            color: #e2e8f0;
            font-family: 'Inter', sans-serif;
        }

        body.ha-theme {
            background-color: var(--ha-bg, #111111) !important;
            color: var(--ha-primary-text, #e1e1e1) !important;
        }

        /* Hide scrollbar for a clean kiosk look */
        ::-webkit-scrollbar {
            display: none;
        }
    </style>
</head>

<body class="p-2 md:p-4">
    <script>
        if (isHaTheme) document.body.classList.add('ha-theme');
    </script>

    <div id="schedule-container" class="space-y-12 pb-10">
        <p class="text-center text-gray-500 text-xl mt-20 animate-pulse">Loading schedule...</p>
    </div>

    <script>
        const isReadOnly = urlParams.get('readonly') === 'true' || urlParams.get('kiosk') === 'true';
        if (isReadOnly) {
            document.getElementById('header-buttons').classList.add('hidden');
            const pageHeader = document.getElementById('page-header');
            if (pageHeader) pageHeader.classList.add('hidden');
        }

        let routeEdges = {};
        let initialEdges = {};
        let conflictsMap = {};
        let assignmentsMap = {};

        async function fetchSchedule() {
            try {
                const driversRes = await fetch('api/drivers');
                const driversList = await driversRes.json();
                driversMap = {};
                driversList.filter(d => !d.is_disabled).forEach(d => { driversMap[d.id] = d; });

                const res = await fetch('api/schedule');
                const data = await res.json();

                if (data.error) {
                    showError(data.error);
                    return;
                }

                // Add ghost drivers to the map
                if (data.ghost_drivers) {
                    data.ghost_drivers.forEach(d => { driversMap[d.id] = d; });
                }

                routeEdges = data.route_edges || {};
                initialEdges = data.initial_edges || {};
                conflictsMap = data.conflicts || {};
                assignmentsMap = data.assignments || {};

                hideError();
                currentData = data;
                renderSchedule(data);
            } catch (err) {
                showError("Failed to connect to the server.");
            }
        }

        async function forceSync() {
            const btn = document.getElementById('sync-btn');
            const icon = document.getElementById('sync-icon');
            const text = document.getElementById('sync-text');

            btn.disabled = true;
            btn.classList.add('opacity-50', 'cursor-not-allowed');
            icon.classList.add('animate-spin');
            text.textContent = 'Syncing...';

            try {
                await fetch('api/schedule/refresh', { method: 'POST' });
                await fetchSchedule();
            } catch (e) {
                showError("Manual sync failed.");
            } finally {
                btn.disabled = false;
                btn.classList.remove('opacity-50', 'cursor-not-allowed');
                icon.classList.remove('animate-spin');
                text.textContent = 'Sync Now';
            }
        }

        function showError(msg) {
            const el = document.getElementById('error-container');
            el.textContent = msg;
            el.classList.remove('hidden');
        }
        function hideError() {
            document.getElementById('error-container').classList.add('hidden');
        }

        function formatTime(dateStr) {
            return new Date(dateStr).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        }

        function formatDateStr(dateStr) {
            return new Date(dateStr).toLocaleDateString([], { weekday: 'long', month: 'short', day: 'numeric' });
        }

        let currentEventsMap = {};
        let activeEventId = null;

        function toDateTimeLocal(isoStr) {
            if (!isoStr) return '';
            // HTML5 datetime-local expects YYYY-MM-DDThh:mm
            const d = new Date(isoStr);
            const pad = n => n.toString().padStart(2, '0');
            return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
        }

        function toIsoString(localStr) {
            if (!localStr) return null;
            // From YYYY-MM-DDThh:mm to proper ISO string with current timezone offset
            return new Date(localStr).toISOString();
        }

        function openEventModal(eventId, originLocationEnc) {
            activeEventId = eventId;
            const ev = currentEventsMap[eventId];
            if (!ev) return;

            // Populate View Mode
            document.getElementById('view-title').textContent = ev.title;
            const dateStr = formatDateStr(ev.start);
            const timeStr = `${formatTime(ev.start)} - ${formatTime(ev.end)}`;
            document.getElementById('view-time').textContent = `${dateStr} • ${timeStr}`;

            const locEl = document.getElementById('view-location');
            locEl.innerHTML = ev.location ? ev.location : '<span class="italic text-gray-500">No location</span>';

            const descEl = document.getElementById('view-description');
            descEl.innerHTML = ev.description ? ev.description : 'No description provided.';

            // Attendees
            const attendeesSection = document.getElementById('view-attendees-section');
            const attendeesEl = document.getElementById('view-attendees');
            const calMeta = currentData.calendar_metadata || {};
            if (ev.calendar_ids && ev.calendar_ids.length > 0) {
                attendeesEl.innerHTML = ev.calendar_ids.map(cid => {
                    const meta = calMeta[cid];
                    const name = meta ? meta.summary : cid;
                    const color = meta ? meta.backgroundColor : '#3B82F6';
                    return `<span class="inline-flex items-center px-2.5 py-1 rounded-full text-xs font-bold text-white" style="background-color: ${color}">${name}</span>`;
                }).join('');
                attendeesSection.classList.remove('hidden');
            } else {
                attendeesSection.classList.add('hidden');
            }

            // Map
            const mapSection = document.getElementById('view-map-section');
            const mapImg = document.getElementById('view-map-img');
            if (ev.location) {
                let originLocation = currentData.home_location || '';
                if (originLocationEnc !== undefined && originLocationEnc !== null && originLocationEnc !== '') {
                    originLocation = decodeURIComponent(originLocationEnc);
                }

                let isDark = false;
                const bodyBg = window.getComputedStyle(document.body).backgroundColor;
                const bgMatch = bodyBg.match(/rgba?\((\d+),\s*(\d+),\s*(\d+)/);
                if (bgMatch && bodyBg !== 'rgba(0, 0, 0, 0)') {
                    const r = parseInt(bgMatch[1]);
                    const g = parseInt(bgMatch[2]);
                    const b = parseInt(bgMatch[3]);
                    const brightness = (r * 299 + g * 587 + b * 114) / 1000;
                    isDark = brightness < 128;
                } else {
                    isDark = document.documentElement.classList.contains('dark') ||
                        window.matchMedia('(prefers-color-scheme: dark)').matches;
                }
                const theme = isDark ? 'dark' : 'light';
                let mapUrl = `api/maps/static?location=${encodeURIComponent(ev.location)}&theme=${theme}`;
                if (originLocation) {
                    mapUrl += `&origin=${encodeURIComponent(originLocation)}`;
                }
                mapImg.onerror = () => { mapSection.classList.add('hidden'); };
                mapImg.src = mapUrl;
                mapSection.classList.remove('hidden');

                // Fetch route info for the balloon overlay
                const balloon = document.getElementById('view-map-balloon');
                balloon.classList.add('hidden');
                if (originLocation) {
                    fetch(`api/maps/route_info?origin=${encodeURIComponent(originLocation)}&destination=${encodeURIComponent(ev.location)}`)
                        .then(r => r.json())
                        .then(data => {
                            if (data.duration && data.distanceMeters) {
                                // Convert duration string "1234s" to minutes
                                const seconds = parseInt(data.duration.replace('s', ''), 10);
                                const mins = Math.max(1, Math.floor(seconds / 60));
                                let timeText = `${mins} min`;
                                if (mins >= 60) {
                                    const hrs = Math.floor(mins / 60);
                                    const m = mins % 60;
                                    timeText = m > 0 ? `${hrs} hr ${m} min` : `${hrs} hr`;
                                }
                                document.getElementById('view-map-duration').textContent = timeText;

                                // Convert meters to miles
                                const miles = (data.distanceMeters * 0.000621371).toFixed(1);
                                document.getElementById('view-map-distance').textContent = `${miles} miles`;
                                balloon.classList.remove('hidden');
                            }
                        })
                        .catch(e => console.error("Error fetching route info for balloon", e));
                }
            } else {
                mapSection.classList.add('hidden');
            }

            const conflictsSection = document.getElementById('conflicts-section');
            const conflictsList = document.getElementById('conflicts-list');
            const conflicts = conflictsMap[eventId];

            if (conflicts && conflicts.length > 0) {
                const currentDriverId = assignmentsMap[eventId];
                conflictsList.innerHTML = conflicts.map(c => `
                    <div class="bg-gray-900 border border-red-900 p-4 rounded-lg flex justify-between items-center">
                        <span class="font-bold text-white">${c.title}</span>
                        ${isReadOnly ? '' : `<button onclick="forceSwap('${c.event_id}', '${currentDriverId}')" class="bg-red-600 hover:bg-red-500 text-white px-4 py-2 rounded shadow-sm text-sm font-bold transition-colors">Force Swap</button>`}
                    </div>
                `).join('');
                conflictsSection.classList.remove('hidden');
            } else {
                conflictsSection.classList.add('hidden');
            }

            const removeOverrideBtn = document.getElementById('remove-override-btn');
            if (currentData.overridden_events && currentData.overridden_events.includes(eventId) && !isReadOnly) {
                removeOverrideBtn.classList.remove('hidden');
            } else {
                removeOverrideBtn.classList.add('hidden');
            }

            const editDetailsBtn = document.getElementById('edit-details-btn');
            if (isReadOnly) {
                editDetailsBtn.classList.add('hidden');
            } else {
                editDetailsBtn.classList.remove('hidden');
            }

            switchToViewMode();
            document.getElementById('event-modal').classList.remove('hidden');
        }

        function switchToViewMode() {
            document.getElementById('modal-edit-mode').classList.add('hidden');
            document.getElementById('modal-view-mode').classList.remove('hidden');
        }

        function switchToEditMode() {
            const ev = currentEventsMap[activeEventId];
            if (!ev) return;

            document.getElementById('edit-title').value = ev.title || '';
            document.getElementById('edit-start').value = toDateTimeLocal(ev.start);
            document.getElementById('edit-end').value = toDateTimeLocal(ev.end);
            document.getElementById('edit-location').value = ev.location || '';
            document.getElementById('edit-description').value = ev.description || '';

            // Populate guests
            const guestsContainer = document.getElementById('edit-guests-container');
            const passengerCals = currentData.passenger_calendar_ids || [];

            if (passengerCals.length > 0) {
                guestsContainer.innerHTML = passengerCals.map(cal_id => {
                    const isChecked = ev.calendar_ids.includes(cal_id) ? 'checked' : '';
                    const calName = currentData.calendar_metadata[cal_id]?.summary || cal_id;
                    return `
                        <label class="flex items-center space-x-2 text-sm text-gray-300">
                            <input type="checkbox" value="${cal_id}" class="guest-checkbox rounded bg-gray-800 border-gray-600 text-blue-500 focus:ring-blue-500" ${isChecked}>
                            <span class="truncate" title="${calName}">${calName}</span>
                        </label>
                    `;
                }).join('');
            } else {
                guestsContainer.innerHTML = '<span class="text-sm text-gray-500 col-span-2">No calendars configured.</span>';
            }

            document.getElementById('autocomplete-dropdown').classList.add('hidden');

            document.getElementById('modal-view-mode').classList.add('hidden');
            document.getElementById('modal-edit-mode').classList.remove('hidden');
        }

        function closeEventModal() {
            document.getElementById('event-modal').classList.add('hidden');
            activeEventId = null;
        }

        let autocompleteTimeout = null;
        async function handleLocationInput() {
            const input = document.getElementById('edit-location').value;
            const dropdown = document.getElementById('autocomplete-dropdown');

            if (input.length < 3) {
                dropdown.classList.add('hidden');
                return;
            }

            clearTimeout(autocompleteTimeout);
            autocompleteTimeout = setTimeout(async () => {
                try {
                    const res = await fetch(`api/places/autocomplete?input=${encodeURIComponent(input)}`);
                    const data = await res.json();

                    if (data.suggestions && data.suggestions.length > 0) {
                        dropdown.innerHTML = data.suggestions.map(s =>
                            `<div onclick="selectLocation('${s.description.replace(/'/g, "\\'")}')" class="p-3 hover:bg-gray-600 cursor-pointer border-b border-gray-600 last:border-0 text-sm">${s.description}</div>`
                        ).join('');
                        dropdown.classList.remove('hidden');
                    } else {
                        dropdown.classList.add('hidden');
                    }
                } catch (e) {
                    console.error("Autocomplete failed", e);
                }
            }, 300); // 300ms debounce
        }

        function selectLocation(loc) {
            document.getElementById('edit-location').value = loc;
            document.getElementById('autocomplete-dropdown').classList.add('hidden');
        }

        async function saveEventDetails() {
            const ev = currentEventsMap[activeEventId];
            if (!ev) return;

            const guestCheckboxes = document.querySelectorAll('.guest-checkbox:checked');
            const attendees = Array.from(guestCheckboxes).map(cb => cb.value);

            const payload = {
                source_event_ids: ev.source_event_ids,
                title: document.getElementById('edit-title').value,
                location: document.getElementById('edit-location').value,
                description: document.getElementById('edit-description').value,
                start: toIsoString(document.getElementById('edit-start').value),
                end: toIsoString(document.getElementById('edit-end').value),
                attendees: attendees
            };

            closeEventModal();

            try {
                await fetch(`api/events`, {
                    method: 'PATCH',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                fetchSchedule();
            } catch (e) {
                alert("Failed to update event details");
            }
        }

        async function forceSwap(ghostEventId, driverId) {
            closeEventModal();
            try {
                await fetch('api/overrides', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ event_id: ghostEventId, driver_id: driverId })
                });
                fetchSchedule();
            } catch (e) {
                alert("Failed to force swap");
            }
        }

        async function removeOverride(eventId) {
            closeEventModal();
            try {
                await fetch(`api/overrides/event/${encodeURIComponent(eventId)}`, {
                    method: 'DELETE'
                });
                fetchSchedule();
            } catch (e) {
                alert("Failed to remove override");
            }
        }

        // Global escape key listener for modal
        document.addEventListener('keydown', function (e) {
            if (e.key === 'Escape') closeEventModal();
        });

        function drag(ev, eventId, sourceDriverId) {
            ev.dataTransfer.setData("text", eventId);
            ev.dataTransfer.setData("sourceDriver", sourceDriverId);
        }

        function allowDrop(ev) {
            ev.preventDefault();
        }

        async function drop(ev, driverId) {
            ev.preventDefault();
            const eventId = ev.dataTransfer.getData("text");
            const sourceDriverId = ev.dataTransfer.getData("sourceDriver");

            if (driverId === sourceDriverId) return;

            if (driverId === 'unassigned') {
                const elem = ev.target.closest('.bg-cardbg');
                if (elem) elem.style.opacity = '0.5';
                await removeOverride(eventId);
            } else if (driverId !== 'no_location' && !driverId.startsWith('g')) {
                // Change UI to reflect loading instantly
                const elem = ev.target.closest('.bg-cardbg');
                if (elem) elem.style.opacity = '0.5';
                await forceSwap(eventId, driverId);
            }
        }

        function renderSchedule(data) {
            const { events, assignments, ghost_assignments, unassigned, no_location, calendar_metadata, overridden_events, lateness_warnings } = data;

            const scheduleByDate = {};
            const overriddenEventsList = overridden_events || [];
            const latenessWarningsMap = lateness_warnings || {};

            currentEventsMap = {};
            events.forEach(ev => {
                currentEventsMap[ev.id] = ev;

                // An event can belong to multiple columns now.
                // It belongs to its assigned column, ghost_assigned column, unassigned/no_location, AND any driver_events column.
                let targetCols = [];
                if (no_location && no_location.includes(ev.id)) {
                    targetCols.push('no_location');
                } else {
                    if (assignments && assignments[ev.id]) targetCols.push(assignments[ev.id]);
                    if (ghost_assignments && ghost_assignments[ev.id]) targetCols.push(ghost_assignments[ev.id]);
                    if (unassigned && unassigned.includes(ev.id)) targetCols.push('unassigned');

                    // Add columns where the driver is attending the event
                    if (data.driver_events) {
                        for (const dId of Object.keys(data.driver_events)) {
                            if (data.driver_events[dId].includes(ev.id) && !targetCols.includes(dId)) {
                                targetCols.push(dId);
                            }
                        }
                    }
                }

                if (targetCols.length === 0) return;

                const dateKey = formatDateStr(ev.start);
                if (!scheduleByDate[dateKey]) scheduleByDate[dateKey] = {};

                targetCols.forEach(col_id => {
                    if (!scheduleByDate[dateKey][col_id]) scheduleByDate[dateKey][col_id] = [];
                    scheduleByDate[dateKey][col_id].push(ev);
                });
            });

            const scheduleContainer = document.getElementById('schedule-container');
            scheduleContainer.innerHTML = '';

            if (Object.keys(scheduleByDate).length === 0) {
                scheduleContainer.innerHTML = `<p class="text-center text-gray-500 text-xl mt-20">No scheduled activities for the next 7 days.</p>`;
                return;
            }

            // Sort dates
            const sortedDates = Object.keys(scheduleByDate).sort((a, b) => new Date(a) - new Date(b));

            sortedDates.forEach(date => {
                const colsObj = scheduleByDate[date];

                // Step 1: Compute min/max passenger event times for filtering driver-only events
                let minPassengerTime = Infinity;
                let maxPassengerTime = -Infinity;

                Object.values(colsObj).forEach(list => {
                    list.forEach(ev => {
                        const isAssignedPassenger = (assignments && assignments[ev.id]) || (ghost_assignments && ghost_assignments[ev.id]);
                        if (isAssignedPassenger) {
                            const st = new Date(ev.start).getTime();
                            const et = new Date(ev.end).getTime();
                            if (st < minPassengerTime) minPassengerTime = st;
                            if (et > maxPassengerTime) maxPassengerTime = et;
                        }
                    });
                });

                // Step 2: Filter out driver-only events that do not overlap with passenger events
                Object.keys(colsObj).forEach(c_id => {
                    colsObj[c_id] = colsObj[c_id].filter(ev => {
                        const isDriverOnly = !(assignments && assignments[ev.id]) && !(ghost_assignments && ghost_assignments[ev.id]) && !(unassigned && unassigned.includes(ev.id)) && !(no_location && no_location.includes(ev.id));
                        if (isDriverOnly) {
                            const st = new Date(ev.start).getTime();
                            const et = new Date(ev.end).getTime();
                            if (et <= minPassengerTime || st >= maxPassengerTime) {
                                return false; // completely outside
                            }
                        }
                        return true;
                    });
                });

                // Get all columns that should be rendered in the timeline
                let colIds = Object.keys(driversMap).sort((a, b) => {
                    if (a.startsWith('g') && !b.startsWith('g')) return 1;
                    if (b.startsWith('g') && !a.startsWith('g')) return -1;
                    return a.localeCompare(b);
                });

                if (isReadOnly) {
                    colIds = colIds.filter(id => !id.startsWith('g') && colsObj[id] && colsObj[id].length > 0);
                }

                if (colIds.length === 0) {
                    return; // Skip rendering this entire date block if there are no columns
                }

                const dateHtml = `<div class="bg-gray-800 border-t border-gray-700 py-1 px-3 mt-2 mb-0 shadow-sm rounded-t-lg"><h2 class="text-base font-bold text-blue-200 uppercase tracking-widest">${date}</h2></div>`;
                scheduleContainer.innerHTML += dateHtml;

                // --- Timeline Constants & Logic ---
                const PIXELS_PER_MINUTE = 1.3;
                const GAP_HEIGHT = 15; // 40px height for the "..." condensed gap

                // Helper: floor to hour
                function floorToHour(dateStr) {
                    const d = new Date(dateStr);
                    d.setMinutes(0, 0, 0);
                    return d;
                }

                // Helper: ceil to hour
                function ceilToHour(dateStr) {
                    const d = new Date(dateStr);
                    if (d.getMinutes() > 0 || d.getSeconds() > 0) {
                        d.setHours(d.getHours() + 1, 0, 0, 0);
                    }
                    return d;
                }

                // Helper: format duration
                function formatDuration(totalMins) {
                    if (totalMins < 60) return `${totalMins}m`;
                    const h = Math.floor(totalMins / 60);
                    const m = totalMins % 60;
                    return m > 0 ? `${h}h ${m}m` : `${h}h`;
                }

                let allEventsForDate = [];
                colIds.forEach(c_id => {
                    if (colsObj[c_id]) allEventsForDate.push(...colsObj[c_id]);
                });

                // Active periods
                let activePeriods = allEventsForDate.map(e => {
                    return {
                        start: floorToHour(e.start).getTime(),
                        end: ceilToHour(e.end).getTime()
                    };
                });

                // Extend timeline backward for initial travel from home
                allEventsForDate.forEach(ev => {
                    const initEdge = initialEdges[ev.id];
                    if (initEdge && initEdge.travel_mins > 0) {
                        const targetEvent = allEventsForDate.find(e => e.id === initEdge.to_event);
                        if (targetEvent) {
                            const departureTime = new Date(targetEvent.start).getTime() - (initEdge.travel_mins + 5) * 60000;
                            const departureHour = floorToHour(new Date(departureTime).toISOString()).getTime();
                            activePeriods.push({ start: departureHour, end: floorToHour(targetEvent.start).getTime() });
                        }
                    }
                });

                activePeriods.sort((a, b) => a.start - b.start);

                let blocks = [];
                if (activePeriods.length > 0) {
                    let currentBlock = activePeriods[0];
                    for (let i = 1; i < activePeriods.length; i++) {
                        let p = activePeriods[i];
                        if (p.start <= currentBlock.end) {
                            currentBlock.end = Math.max(currentBlock.end, p.end);
                        } else {
                            blocks.push(currentBlock);
                            currentBlock = p;
                        }
                    }
                    blocks.push(currentBlock);
                }

                let currentY = 0;
                blocks.forEach(b => {
                    b.startY = currentY;
                    const durationMins = (b.end - b.start) / 60000;
                    b.pixelHeight = durationMins * PIXELS_PER_MINUTE;
                    b.endY = b.startY + b.pixelHeight;
                    currentY = b.endY + GAP_HEIGHT;
                });

                const totalHeight = blocks.length > 0 ? blocks[blocks.length - 1].endY + 20 : 0;

                function getTimeY(dateStr) {
                    const t = new Date(dateStr).getTime();
                    for (let i = 0; i < blocks.length; i++) {
                        const b = blocks[i];
                        if (t >= b.start && t <= b.end) {
                            const offsetMins = (t - b.start) / 60000;
                            return b.startY + (offsetMins * PIXELS_PER_MINUTE);
                        }
                    }
                    return 0; // Fallback
                }

                // Build HTML
                const mainWrapper = document.createElement('div');
                mainWrapper.className = "flex flex-col gap-4 mt-0";

                const wrapper = document.createElement('div');
                wrapper.className = "flex-1 flex flex-wrap gap-3";

                colIds.forEach(c_id => {
                    let colInfo = { name: "Unknown", color_code: "#4a5568" };
                    if (driversMap[c_id]) colInfo = driversMap[c_id];

                    // Build absolute overlays for Time Lines inside THIS specific driver block!
                    let absoluteOverlays = '';
                    blocks.forEach((b, index) => {
                        let t = b.start;
                        while (t <= b.end) {
                            const y = b.startY + ((t - b.start) / 60000) * PIXELS_PER_MINUTE;
                            const d = new Date(t);
                            const timeLabel = d.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });

                            absoluteOverlays += `
                                <div class="absolute left-0 w-full flex items-center z-0 pointer-events-none" style="top: ${y}px; transform: translateY(-50%);">
                                    <div class="text-[10px] text-gray-400 absolute -top-2 left-1 bg-gray-800 px-1 rounded font-mono border border-gray-700 shadow-sm z-20">${timeLabel}</div>
                                    <div class="w-full border-t border-gray-700"></div>
                                </div>
                            `;
                            t += 3600000; // +1 hour
                        }

                        if (index < blocks.length - 1) {
                            const gapY = b.endY;
                            absoluteOverlays += `
                                <div class="absolute left-0 w-full flex items-center justify-center z-0 pointer-events-none bg-gray-700" style="top: ${gapY}px; height: ${GAP_HEIGHT}px;">
                                    <div class="text-gray-500 font-bold tracking-widest text-lg leading-none -mt-2">...</div>
                                </div>
                            `;
                        }
                    });

                    const colEvents = (colsObj[c_id] || []).sort((a, b) => new Date(a.start) - new Date(b.start));
                    const uniqueColEventsMap = {};
                    colEvents.forEach(e => uniqueColEventsMap[e.id] = e);
                    const uniqueColEvents = Object.values(uniqueColEventsMap);

                    let colEventsHtml = '';
                    uniqueColEvents.forEach((ev, index) => {
                        const startY = getTimeY(ev.start);
                        const endY = getTimeY(ev.end);
                        const height = Math.max(endY - startY, 20);

                        const isAssignedToThisColumn = (assignments && assignments[ev.id] === c_id) || (ghost_assignments && ghost_assignments[ev.id] === c_id) || (c_id === 'unassigned' && unassigned && unassigned.includes(ev.id)) || (c_id === 'no_location' && no_location && no_location.includes(ev.id));
                        const isDriverOnly = !isAssignedToThisColumn;

                        let overlapIndex = 0;
                        for (let i = 0; i < index; i++) {
                            const otherEv = uniqueColEvents[i];
                            if (new Date(otherEv.end) > new Date(ev.start)) {
                                overlapIndex++;
                            }
                        }
                        const leftOffset = 28 + (overlapIndex * 15); // leave room for time labels

                        const calMetas = ev.calendar_ids.map(c => calendar_metadata && calendar_metadata[c] ? calendar_metadata[c] : { backgroundColor: '#3B82F6', summary: 'Calendar' });
                        const evColor = calMetas[0].backgroundColor;
                        const colorDots = calMetas.map(m => `<div class="w-2.5 h-2.5 rounded-full mr-1 shadow-sm border border-black/20" style="background-color: ${m.backgroundColor};"></div>`).join('');
                        const summaries = calMetas.map(m => m.summary).join(' + ');

                        const dragAttr = isReadOnly ? '' : `draggable="true" ondragstart="drag(event, '${ev.id}', '${c_id}')"`;

                        let computedOrigin = currentData.home_location || '';
                        if (index > 0) {
                            const prevEv = uniqueColEvents[index - 1];
                            const edgeFromPrev = routeEdges[prevEv.id];
                            if (edgeFromPrev && edgeFromPrev.home_waypoint) {
                                computedOrigin = currentData.home_location || '';
                            } else if (edgeFromPrev && edgeFromPrev.pickup_waypoint) {
                                computedOrigin = edgeFromPrev.pickup_waypoint.pickup_location;
                            } else {
                                computedOrigin = prevEv.location;
                            }
                        }
                        const originLocationEnc = computedOrigin ? encodeURIComponent(computedOrigin).replace(/'/g, "\\'") : '';
                        const clickAttr = `onclick="openEventModal('${ev.id}', '${originLocationEnc}')"`;

                        if (isDriverOnly) {
                            colEventsHtml += `
                                <div class="absolute right-1 rounded-md overflow-hidden shadow-sm border-l-4 border-gray-600 border-dashed bg-gray-700 transition-colors flex flex-col z-10 opacity-70"
                                     style="top: ${startY}px; height: ${height}px; left: ${leftOffset}px; min-height: 20px;">
                                    <div class="px-1 py-1 flex-1 overflow-hidden pointer-events-none flex flex-col justify-center items-center text-center" style="background: repeating-linear-gradient(45deg, transparent, transparent 10px, rgba(0,0,0,0.3) 10px, rgba(0,0,0,0.3) 20px);">
                                        <div class="font-bold text-[9px] text-gray-400 uppercase tracking-widest mb-0.5 bg-gray-800 px-1 rounded">🚫 Unavailable</div>
                                        <div class="text-[8px] text-gray-500 truncate w-full bg-gray-800 px-1 rounded">${ev.title}</div>
                                    </div>
                                </div>
                            `;
                        } else {
                            const isShort = height <= 55;
                            const cursorClass = isReadOnly ? 'cursor-default' : 'cursor-pointer hover:bg-gray-700';
                            colEventsHtml += `
                                <div ${dragAttr} ${clickAttr} title="${ev.title}"
                                     class="absolute right-1 rounded-md overflow-hidden shadow-lg border-l-4 bg-gray-800 transition-colors group flex z-10 ${cursorClass}"
                                     style="top: ${startY}px; height: ${height}px; left: ${leftOffset}px; border-color: ${evColor}; min-height: 24px;">
                                    <div class="px-1.5 py-1 w-full overflow-hidden pointer-events-none ${isShort ? 'flex flex-row items-center gap-1.5' : 'flex flex-col'}">
                                        <div class="flex items-center pointer-events-none shrink-0">
                                            ${colorDots}
                                            <div class="text-[9px] uppercase tracking-wider font-bold opacity-70 ml-0.5 truncate ${isShort ? 'hidden' : ''}" style="color: ${evColor}">${summaries}</div>
                                            ${overriddenEventsList.includes(ev.id) ? '<span class="ml-1 text-yellow-500"><svg class="w-3 h-3" fill="currentColor" viewBox="0 0 20 20"><path d="M10 2a1 1 0 011 1v5.586l1.293-1.293a1 1 0 111.414 1.414l-3 3a1 1 0 01-1.414 0l-3-3a1 1 0 111.414-1.414L9 8.586V3a1 1 0 011-1z" /></svg></span>' : ''}
                                        </div>
                                        <div class="font-bold text-[12px] text-white leading-tight truncate pointer-events-none ${isShort ? 'flex-1 min-w-0' : 'mb-0.5 mt-0.5'}">${ev.title}</div>
                                        <div class="text-gray-400 text-[10px] font-medium truncate pointer-events-none shrink-0">${isShort ? formatTime(ev.start) : formatTime(ev.start) + ' - ' + formatTime(ev.end)}</div>
                                    </div>
                                </div>
                            `;
                        }

                        // Initial travel pill from home (before first event)
                        if (index === 0 && !isDriverOnly) {
                            const initEdge = initialEdges[ev.id];
                            if (initEdge && initEdge.to_event === ev.id && initEdge.travel_mins > 0) {
                                const bufferMins = 5; // Add a 5 minute buffer to all departures
                                const departureDate = new Date(new Date(ev.start).getTime() - (initEdge.travel_mins + bufferMins) * 60000);
                                const departureStr = formatTime(departureDate.toISOString());
                                const departureY = getTimeY(departureDate.toISOString());
                                const distance = startY - departureY;
                                const iconCar = `<svg class="w-3 h-3 inline-block mr-0.5" fill="currentColor" viewBox="0 0 24 24"><path d="M18.92 6.01C18.72 5.42 18.16 5 17.5 5h-11c-.66 0-1.21.42-1.42 1.01L3 12v8c0 .55.45 1 1 1h1c.55 0 1-.45 1-1v-1h12v1c0 .55.45 1 1 1h1c.55 0 1-.45 1-1v-8l-2.08-5.99zM6.85 7h10.29l1.08 3.11H5.77L6.85 7zM19 17H5v-5h14v5zM7.5 16c.83 0 1.5-.67 1.5-1.5S8.33 13 7.5 13 6 13.67 6 14.5 6.67 16 7.5 16zm9 0c.83 0 1.5-.67 1.5-1.5s-.67-1.5-1.5-1.5-1.5.67-1.5 1.5.67 1.5 1.5 1.5z"/></svg>`;
                                const iconHome = `<svg class="w-3 h-3 inline-block mx-0.5" fill="currentColor" viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>`;
                                const iconArrow = `<span class="mx-0.5 text-[8px] opacity-70">➔</span>`;
                                const trafficWarn = initEdge.delay_mins > 3 ? `<span class="ml-1 text-yellow-400 text-[9px] font-bold" title="${initEdge.delay_mins}min traffic delay">⚠</span>` : '';

                                if (distance > 10) {
                                    colEventsHtml += `
                                        <div class="absolute left-1/2 transform -translate-x-1/2 flex flex-col items-center justify-end pb-1.5 z-20 pointer-events-none"
                                             style="top: ${departureY}px; height: ${distance}px; width: 100%;">
                                            <div class="w-px h-full bg-blue-500/30 absolute top-0 z-0"></div>
                                            <div class="flex flex-col gap-0.5 items-center z-10 relative">
                                                <span class="text-[9px] text-gray-400 font-bold uppercase drop-shadow-sm">Leave at ${departureStr}</span>
                                                <span class="bg-gray-900 border border-blue-600 text-[10px] px-2 py-0.5 rounded-full text-blue-200 shadow-md font-mono uppercase flex items-center">
                                                    ${iconHome}${iconArrow}${iconCar}${formatDuration(initEdge.travel_mins)}${trafficWarn}
                                                </span>
                                            </div>
                                        </div>
                                    `;
                                }
                            }
                        }

                        // Routing pill between events
                        if (!isDriverOnly && index < uniqueColEvents.length - 1 && routeEdges[ev.id]) {
                            const edge = routeEdges[ev.id];
                            const nextEv = uniqueColEvents[index + 1];
                            const nextStartY = getTimeY(nextEv.start);
                            const distance = nextStartY - endY;

                            if (distance > 0) {
                                let pills = [];

                                const iconCar = `<svg class="w-3 h-3 inline-block mr-0.5" fill="currentColor" viewBox="0 0 24 24"><path d="M18.92 6.01C18.72 5.42 18.16 5 17.5 5h-11c-.66 0-1.21.42-1.42 1.01L3 12v8c0 .55.45 1 1 1h1c.55 0 1-.45 1-1v-1h12v1c0 .55.45 1 1 1h1c.55 0 1-.45 1-1v-8l-2.08-5.99zM6.85 7h10.29l1.08 3.11H5.77L6.85 7zM19 17H5v-5h14v5zM7.5 16c.83 0 1.5-.67 1.5-1.5S8.33 13 7.5 13 6 13.67 6 14.5 6.67 16 7.5 16zm9 0c.83 0 1.5-.67 1.5-1.5s-.67-1.5-1.5-1.5-1.5.67-1.5 1.5.67 1.5 1.5 1.5z"/></svg>`;
                                const iconHome = `<svg class="w-3 h-3 inline-block mx-0.5" fill="currentColor" viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>`;
                                const iconPerson = `<svg class="w-3 h-3 inline-block mr-0.5" fill="currentColor" viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>`;
                                const iconHourglass = `<svg class="w-3 h-3 inline-block mr-0.5" fill="currentColor" viewBox="0 0 24 24"><path d="M6 2v6h.01L6 8.01 10 12l-4 4 .01.01H6V22h12v-5.99h-.01L18 16l-4-4 4-3.99-.01-.01H18V2H6zm10 14.5V20H8v-3.5l4-4 4 4zm-4-5l-4-4V4h8v3.5l-4 4z"/></svg>`;
                                const iconArrow = `<span class="mx-0.5 text-[8px] opacity-70">➔</span>`;
                                const trafficWarn = edge.delay_mins > 3 ? `<span class="ml-1 text-yellow-400 text-[9px] font-bold" title="${edge.delay_mins}min traffic delay">⚠</span>` : '';

                                if (edge.home_waypoint && edge.pickup_waypoint) {
                                    pills.push(`
                                        <span class="bg-gray-900 border border-blue-500 text-[10px] px-2 py-0.5 rounded-full text-blue-300 shadow-sm font-mono uppercase flex items-center">
                                            ${iconCar}${formatDuration(edge.home_waypoint.to_home_mins)}${iconArrow}${iconHome}for ${formatDuration(edge.home_waypoint.layover_mins)}${iconArrow}${iconCar}${formatDuration(edge.home_waypoint.from_home_mins)}
                                        </span>
                                    `);
                                    pills.push(`
                                        <span class="bg-gray-900 border border-blue-600 text-[10px] px-2 py-0.5 rounded-full text-blue-300 shadow-sm font-mono uppercase flex items-center" title="Pickup at ${edge.pickup_waypoint.pickup_event_title}">
                                            ${iconPerson}Pickup${iconArrow}${iconCar}${formatDuration(edge.pickup_waypoint.from_pickup_mins)}
                                        </span>
                                    `);
                                } else if (edge.home_waypoint) {
                                    pills.push(`
                                        <span class="bg-gray-900 border border-blue-500 text-[10px] px-2 py-0.5 rounded-full text-blue-300 shadow-sm font-mono uppercase flex items-center">
                                            ${iconCar}${formatDuration(edge.home_waypoint.to_home_mins)}${iconArrow}${iconHome}for ${formatDuration(edge.home_waypoint.layover_mins)}${iconArrow}${iconCar}${formatDuration(edge.home_waypoint.from_home_mins)}
                                        </span>
                                    `);
                                } else if (edge.pickup_waypoint) {
                                    pills.push(`
                                        <span class="bg-gray-900 border border-blue-600 text-[10px] px-2 py-0.5 rounded-full text-blue-300 shadow-sm font-mono uppercase flex items-center" title="Pickup at ${edge.pickup_waypoint.pickup_event_title}">
                                            ${iconCar}${formatDuration(edge.pickup_waypoint.to_pickup_mins)}${iconArrow}${iconPerson}Pickup${iconArrow}${iconCar}${formatDuration(edge.pickup_waypoint.from_pickup_mins)}
                                        </span>
                                    `);
                                }

                                if (pills.length === 0) {
                                    const gapMinutes = Math.round((new Date(nextEv.start) - new Date(ev.end)) / 60000);
                                    const downTime = gapMinutes - edge.travel_mins;

                                    let pillText = `${iconCar}${formatDuration(edge.travel_mins)}${trafficWarn}`;
                                    if (downTime > 0) {
                                        pillText += ` <span class="text-blue-500 ml-1 text-[9px] font-bold">(${iconHourglass}${formatDuration(downTime)})</span>`;
                                    }

                                    pills.push(`
                                        <span class="bg-gray-900 border border-blue-600 text-[10px] px-2 py-0.5 rounded-full text-blue-300 shadow-sm font-mono uppercase flex items-center">
                                            ${pillText}
                                        </span>
                                    `);
                                }

                                colEventsHtml += `
                                    <div class="absolute left-1/2 transform -translate-x-1/2 flex flex-col items-center justify-center z-20 pointer-events-none" 
                                         style="top: ${endY}px; height: ${distance}px; width: 100%;">
                                        <div class="w-px h-full bg-blue-500/30 absolute z-0"></div>
                                        <div class="flex flex-col gap-1 items-center z-10 relative">
                                            ${pills.join('')}
                                        </div>
                                    </div>
                                `;
                            } else {
                                const iconCar = `<svg class="w-3 h-3 inline-block mr-0.5" fill="currentColor" viewBox="0 0 24 24"><path d="M18.92 6.01C18.72 5.42 18.16 5 17.5 5h-11c-.66 0-1.21.42-1.42 1.01L3 12v8c0 .55.45 1 1 1h1c.55 0 1-.45 1-1v-1h12v1c0 .55.45 1 1 1h1c.55 0 1-.45 1-1v-8l-2.08-5.99zM6.85 7h10.29l1.08 3.11H5.77L6.85 7zM19 17H5v-5h14v5zM7.5 16c.83 0 1.5-.67 1.5-1.5S8.33 13 7.5 13 6 13.67 6 14.5 6.67 16 7.5 16zm9 0c.83 0 1.5-.67 1.5-1.5s-.67-1.5-1.5-1.5-1.5.67-1.5 1.5.67 1.5 1.5 1.5z"/></svg>`;
                                colEventsHtml += `
                                    <div class="absolute left-1/2 transform -translate-x-1/2 -translate-y-1/2 flex items-center justify-center z-20 pointer-events-none" 
                                         style="top: ${endY}px;">
                                        <span class="bg-gray-900 border border-gray-600 text-[10px] px-2 py-0.5 rounded-full text-blue-200 shadow-sm font-mono uppercase flex items-center">
                                            ${iconCar}${formatDuration(edge.travel_mins)}
                                        </span>
                                    </div>
                                `;
                            }
                        }
                    });

                    const dropAttr = isReadOnly ? '' : `${isReadOnly ? '' : `ondragover="allowDrop(event)" ondrop="drop(event, '${c_id}')"`}`;
                    const driverHtml = `
                        <div class="flex-1 min-w-[200px] bg-gray-900 rounded-lg overflow-hidden shadow-xl border border-gray-700 flex flex-col" ${dropAttr}>
                            <div class="px-2 py-1.5 font-black text-sm text-white shadow-md flex justify-center items-center bg-gray-800 border-b-4" style="border-bottom-color: ${colInfo.color_code}">
                                <div class="w-2.5 h-2.5 rounded-full mr-2 shadow-[0_0_8px_currentColor]" style="background-color: ${colInfo.color_code}; color: ${colInfo.color_code}"></div>
                                ${colInfo.name}
                            </div>
                            <div class="relative w-full overflow-hidden" style="height: ${totalHeight}px;">
                                ${absoluteOverlays}
                                ${colEventsHtml}
                            </div>
                        </div>
                    `;
                    wrapper.innerHTML += driverHtml;
                });

                // --- Sidebar for Unassigned / No Location ---
                if (!isReadOnly) {
                    const sidebar = document.createElement('div');
                    sidebar.className = "w-full flex flex-col gap-2 mt-2";
                    let sidebarHtml = '';

                    ['unassigned', 'no_location'].forEach(c_id => {
                        if (!colsObj[c_id] || colsObj[c_id].length === 0) {
                            if (c_id === 'unassigned') {
                                sidebarHtml += `
                                    <div class="bg-gray-800 rounded-lg border border-dashed border-gray-600 p-3 flex flex-row items-center justify-center text-gray-500 font-bold transition-colors hover:bg-gray-700 text-sm"
                                         ondragover="allowDrop(event)" ondrop="drop(event, '${c_id}')">
                                        <svg class="w-4 h-4 mr-2 opacity-50" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
                                        Drop here to Unassign
                                    </div>
                                `;
                            }
                            return;
                        }

                        let colInfo = { name: "Unassigned", color_code: "#EF4444" };
                        if (c_id === 'no_location') colInfo = { name: "No Location", color_code: "#EAB308" };

                        let colEventsHtml = '';
                        colsObj[c_id].forEach((ev) => {
                            const calMetas = ev.calendar_ids.map(c => calendar_metadata && calendar_metadata[c] ? calendar_metadata[c] : { backgroundColor: '#3B82F6', summary: 'Calendar' });
                            const evColor = calMetas[0].backgroundColor;
                            const summaries = calMetas.map(m => m.summary).join(' + ');

                            colEventsHtml += `
                                <div draggable="true" ondragstart="drag(event, '${ev.id}', '${c_id}')" onclick="openEventModal('${ev.id}')" 
                                     class="px-2 py-1.5 border-l-4 rounded bg-gray-900 hover:bg-gray-800 transition-colors cursor-pointer group shadow-sm flex items-center justify-between"
                                     style="border-color: ${evColor}">
                                    <div class="flex items-center gap-2 overflow-hidden flex-1">
                                        <div class="text-[9px] uppercase tracking-wider font-bold opacity-70 whitespace-nowrap" style="color: ${evColor}">${summaries}</div>
                                        <div class="font-bold text-[11px] text-white leading-tight group-hover:text-blue-300 transition-colors truncate">${ev.title}</div>
                                    </div>
                                    <div class="text-gray-400 text-[10px] font-medium whitespace-nowrap ml-2">${formatTime(ev.start)} - ${formatTime(ev.end)}</div>
                                </div>
                            `;
                        });

                        sidebarHtml += `
                            <div class="bg-gray-800/80 rounded-lg border border-gray-700 overflow-hidden shadow-md"
                                 ondragover="allowDrop(event)" ondrop="drop(event, '${c_id}')">
                                <div class="px-2 py-1 text-[11px] font-black uppercase tracking-wider text-white bg-gray-800 border-b-2 flex items-center" style="border-bottom-color: ${colInfo.color_code}">
                                    <div class="w-1.5 h-1.5 rounded-full mr-1.5" style="background-color: ${colInfo.color_code}"></div>
                                    ${colInfo.name} <span class="ml-auto text-gray-500 font-mono">${colsObj[c_id].length}</span>
                                </div>
                                <div class="p-1.5 flex flex-col gap-1.5 min-h-[40px]">
                                    ${colEventsHtml}
                                </div>
                            </div>
                        `;
                    });

                    sidebar.innerHTML = sidebarHtml;
                    mainWrapper.appendChild(wrapper);
                    mainWrapper.appendChild(sidebar);
                } else {
                    mainWrapper.appendChild(wrapper);
                }

                scheduleContainer.appendChild(mainWrapper);
            });
        }

        // Fetch immediately (which will hit the cache instantly)
        fetchSchedule();

        // Polling every 15 seconds to fetch the latest CACHED schedule from the backend
        // (The backend itself polls Google Calendar every 5 minutes in the background)
        setInterval(fetchSchedule, 15000);
    </script>
</body>

</html>
