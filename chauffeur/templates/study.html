<!DOCTYPE html>
<html lang="en" class="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Study</title>
    <link href="{{ 'static/vendor/fonts/inter/inter.css'|ver }}" rel="stylesheet">
    {% include 'ha_theme.html' %}
    <script src="{{ 'static/vendor/alpine.min.js'|ver }}" defer></script>
    <style>
        body { background-color: #111827; color: #e5e7eb; }
        [x-cloak] { display: none !important; }
        #study-wrap { position: fixed; inset: 0; background: #120f0c; }
        #room, #room canvas { position: absolute; inset: 0; display: block; }
        #tip { position: fixed; pointer-events: none; background: rgba(24,20,15,.94);
          color: #e8dfc8; border: 1px solid #6b5a3e; border-radius: 8px; padding: 6px 10px;
          font: 13px/1.3 system-ui; opacity: 0; transition: opacity .15s; z-index: 40; max-width: 300px; }
        #chip { position: fixed; left: 50%; transform: translateX(-50%); bottom: 18px;
          background: rgba(24,20,15,.9); color: #e8dfc8; border: 1px solid #6b5a3e;
          border-radius: 10px; padding: 8px 14px; font: 14px system-ui; opacity: 0;
          transition: opacity .2s; z-index: 40; }
        /* 120px of floor, not 20: the control centre's Ask-Argyle bar is
           fixed to the bottom of every page, and at 20px the last row of the
           list sits underneath it — the row you scrolled all the way down to
           read is the one you cannot. */
        #fallback { position: absolute; inset: 0; overflow-y: auto; padding: 90px 20px 120px;
          color: #e8dfc8; font: 15px/1.5 system-ui; display: none; }
        #fallback h1 { font-size: 18px; margin: 0 0 14px; color: #d8c9a8; }
        /* The one-title-per-page convention (v2.117.0, enforced by
           test_panel_chrome.py::scenario_every_page_says_its_name_in_the_same_place):
           the heading is the only thing on screen saying which room you are
           in, so it stays even though the rest of this page is a full-bleed
           scene rather than the usual scrollable panel-page container.
           Tasks 3/4 may restyle this freely — position, colors, whatever the
           room scene wants — but the panel-page-title marker has to stay on
           SOMETHING in the page, or this test goes red again. */
        #study-title { position: fixed; top: 76px; left: 16px; z-index: 45; margin: 0;
          font: 600 15px system-ui; color: #d8c9a8; text-shadow: 0 1px 6px rgba(0,0,0,.6);
          pointer-events: none; }
        .frow { display: block; background: #1e1a15; border: 1px solid #3a332a;
          border-radius: 10px; padding: 10px 14px; margin-bottom: 8px; color: inherit;
          text-decoration: none; }
        .frow .sig { color: #e8b36a; font-size: 13px; }
        .frow.calm .sig { color: #8a9a7a; }
    </style>
    <link rel="stylesheet" href="{{ 'static/tailwind.css'|ver }}">
</head>

<body class="flex flex-col h-screen overflow-hidden">
    {% include 'nav.html' %}

    <div id="study-wrap" class="panel-page">
        <h1 id="study-title" class="panel-page-title">The Study</h1>
        <div id="room"></div>
        <div id="fallback"><div id="fallback-rows"></div></div>
        <div id="tip"></div><div id="chip"></div>
    </div>
    {% include 'components/control_center.html' %}
    {% include 'components/moments_hearth.html' %}

    <script>window.STUDY_STATE_URL = 'api/study/state';</script>
    <script src="{{ 'static/vendor/three.min.js'|ver }}"></script>
    <script src="{{ 'static/study.js'|ver }}"></script>
</body>
</html>
