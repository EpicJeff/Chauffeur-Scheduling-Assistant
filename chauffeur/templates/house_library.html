<!DOCTYPE html>
{% set _up = '../../' if request.url.path.endswith('/house/library/') else '../' %}
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Material library</title>
  {% include 'ha_theme.html' %}
  <script>
    window.chfBase = location.pathname.endsWith('/house/library/') ? '../../' : '../';
    window.twinManifest = {{ twin_manifest | tojson }};
    window.twinKit = {{ twin_kit | tojson }};
    window.twinSite = {{ twin_site | tojson }};
    for (const path of [{{ 'static/tailwind.css' | ver | tojson }}, {{ 'static/vendor/fonts/inter/inter.css' | ver | tojson }}, {{ 'static/twin/library_page/library.css' | ver | tojson }}]) {
      const link = document.createElement('link'); link.rel = 'stylesheet'; link.href = window.chfBase + path; document.head.appendChild(link);
    }
    const imports = {
      'three': window.chfBase + {{ 'static/vendor/three-r187/three.module.js' | ver | tojson }},
      'three/addons/': window.chfBase + 'static/vendor/three-r187/addons/'
    };
    {% for name in ['library_page/page', 'library_page/preview', 'library_page/properties', 'library_page/texture_slots', 'twin_library', 'import_loaders', 'objects', 'palette', 'model_lods', 'lod_worker', 'sky/ephemeris', 'sky/look'] %}
    imports[new URL(window.chfBase + 'static/twin/{{ name }}.js', location.href).href] = window.chfBase + {{ ('static/twin/' ~ name ~ '.js') | ver | tojson }};
    {% endfor %}
    imports[new URL(window.chfBase + 'static/vendor/lucide/icons.js', location.href).href] = window.chfBase + {{ 'static/vendor/lucide/icons.js' | ver | tojson }};
    imports[new URL(window.chfBase + 'static/vendor/meshoptimizer-1.3.0/meshopt_simplifier.js', location.href).href] = window.chfBase + {{ 'static/vendor/meshoptimizer-1.3.0/meshopt_simplifier.js' | ver | tojson }};
    const map = document.createElement('script'); map.type = 'importmap'; map.textContent = JSON.stringify({ imports }); document.head.appendChild(map);
    document.addEventListener('DOMContentLoaded', () => {
      const script = document.createElement('script'); script.src = window.chfBase + {{ 'static/vendor/alpine.min.js' | ver | tojson }}; document.head.appendChild(script);
    });
  </script>
</head>
<body class="bg-gray-900 text-gray-100">
  {% include 'nav.html' %}
  <main id="material-library" aria-label="Material library">
    <h1>Material library</h1>
    <a href="{{ _up }}house/editor">House editor</a>
    <p>Changes here apply everywhere this material is used.</p>
  </main>
  {% include 'components/control_center.html' %}
  <script type="module">
    import(window.chfBase + {{ 'static/twin/library_page/page.js' | ver | tojson }})
      .then(module => {
        window.materialLibraryPage = module.mountLibraryPage(document.getElementById('material-library'), {});
      }).catch(error => { window.showGlobalAlert(error.message || 'The Library could not open. Reload to try again.'); });
  </script>
</body>
</html>
