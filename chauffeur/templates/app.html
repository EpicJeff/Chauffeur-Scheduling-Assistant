<!DOCTYPE html>
<html lang="en" class="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Driver App</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        gray: {
                            950: '#0a0a0a',
                            900: '#171717',
                            800: '#262626',
                            700: '#404040',
                            600: '#525252',
                        }
                    }
                }
            }
        }
    </script>
    <style>
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }

        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        .snap-x-mandatory {
            scroll-snap-type: x mandatory;
        }

        .snap-center {
            scroll-snap-align: center;
        }

        body {
            -webkit-tap-highlight-color: transparent;
        }
    </style>
</head>

<body class="bg-gray-950 text-gray-100 font-sans h-screen flex flex-col overflow-hidden">

    <!-- Header -->
    <header
        class="bg-gray-900 border-b border-gray-800 p-4 flex items-center justify-between shrink-0 shadow-md relative z-20">
        <div class="flex items-center gap-3">
            <div id="driver-avatar"
                class="w-10 h-10 rounded-full flex items-center justify-center font-bold text-lg shadow-sm border-2 border-gray-700 bg-gray-800 text-gray-500">
                ?</div>
            <div class="flex flex-col">
                <h1 id="driver-name" class="text-lg font-bold text-white leading-tight">Select Driver</h1>
                <span id="date-subtitle" class="text-xs text-blue-400 font-medium tracking-wide uppercase">Today</span>
            </div>
        </div>
        <div class="flex items-center gap-2">
            <button id="btn-push" onclick="enableNotifications()"
                class="p-2 rounded-full bg-blue-800 text-blue-200 hover:text-white transition-colors relative hidden"
                title="Enable Push Notifications">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9">
                    </path>
                </svg>
                <span
                    class="absolute top-0 right-0 transform translate-x-1/4 -translate-y-1/4 bg-blue-500 rounded-full w-2 h-2 animate-ping"></span>
                <span
                    class="absolute top-0 right-0 transform translate-x-1/4 -translate-y-1/4 bg-blue-500 rounded-full w-2 h-2"></span>
            </button>
            <button id="btn-notif" onclick="toggleNotifications()"
                class="p-2 rounded-full bg-gray-800 text-gray-300 hover:text-white transition-colors relative hidden">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9">
                    </path>
                </svg>
                <span id="notif-badge"
                    class="absolute top-0 right-0 transform translate-x-1/4 -translate-y-1/4 bg-red-500 text-white text-[10px] font-bold px-1.5 py-0.5 rounded-full hidden">0</span>
            </button>
            <button id="btn-sync" onclick="fetchSchedule(true)"
                class="p-2 rounded-full bg-gray-800 text-gray-300 hover:text-white transition-colors">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15">
                    </path>
                </svg>
            </button>
            <button id="btn-switch-driver" onclick="clearDriver()"
                class="p-2 rounded-full bg-gray-800 text-gray-300 hover:text-white transition-colors hidden">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1">
                    </path>
                </svg>
            </button>
        </div>
    </header>

    <!-- Driver Selection Screen -->
    <div id="screen-select-driver" class="flex-1 flex flex-col p-6 overflow-y-auto">
        <h2 class="text-2xl font-black mb-6 text-center text-white drop-shadow-sm">Who's Driving?</h2>
        <div id="driver-list" class="flex flex-col gap-4">
            <p class="text-center text-gray-500 animate-pulse">Loading drivers...</p>
        </div>
    </div>

    <!-- Main Schedule Screen -->
    <div id="screen-schedule" class="flex-1 flex flex-col hidden overflow-hidden relative">

        <!-- Day Navigation -->
        <div
            class="flex items-center justify-between px-4 py-3 bg-gray-900 border-b border-gray-800 shrink-0 z-10 shadow-sm">
            <button onclick="prevDay()"
                class="p-2 rounded-full bg-gray-800 text-gray-300 active:bg-gray-700 disabled:opacity-30 disabled:active:bg-gray-800 transition-colors"
                id="btn-prev-day">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M15 19l-7-7 7-7"></path>
                </svg>
            </button>
            <div id="current-day-label" class="font-bold text-center text-white tracking-wide text-lg drop-shadow-md">
                Loading...</div>
            <button onclick="nextDay()"
                class="p-2 rounded-full bg-gray-800 text-gray-300 active:bg-gray-700 disabled:opacity-30 disabled:active:bg-gray-800 transition-colors"
                id="btn-next-day">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M9 5l7 7-7 7"></path>
                </svg>
            </button>
        </div>

        <!-- Schedule Container (Swipeable) -->
        <div id="days-container"
            class="flex-1 flex overflow-x-auto snap-x-mandatory no-scrollbar scroll-smooth relative">
            <!-- Day panes injected here -->
        </div>
    </div>

    <!-- Notifications Modal -->
    <div id="notif-modal"
        class="fixed inset-0 bg-black/60 z-50 hidden opacity-0 transition-opacity duration-300 flex flex-col justify-end">
        <div id="notif-modal-content"
            class="bg-gray-900 border-t border-gray-700 w-full rounded-t-2xl shadow-[0_-10px_40px_rgba(0,0,0,0.5)] transform translate-y-full transition-transform duration-300 p-6 flex flex-col h-[70vh]">
            <div class="flex justify-between items-center mb-6 shrink-0">
                <div class="flex justify-between items-center w-full pb-2 border-b border-gray-800">
                    <h2 class="text-xl font-bold text-white">Notifications</h2>
                    <button onclick="clearNotifications()"
                        class="text-sm font-bold text-red-400 bg-red-400/10 px-3 py-1 rounded-lg active:bg-red-400/20 transition-colors">Clear
                        All</button>
                </div>

                <!--<button onclick="testPushNotification()"
                    class="mb-4 w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-2 px-4 rounded-xl shadow-lg active:scale-95 transition-all">Send
                    Test Push Notification</button>-->
                <button onclick="toggleNotifications()"
                    class="text-gray-400 hover:text-white bg-gray-800 rounded-full p-1.5"><svg class="w-5 h-5"
                        fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12">
                        </path>
                    </svg></button>
            </div>
            <div id="notif-list" class="flex-1 overflow-y-auto space-y-3 no-scrollbar pb-6">
                <p class="text-center text-gray-500 italic py-4">No recent notifications</p>
            </div>
        </div>
    </div>

    <!-- Action Sheet Modal -->
    <div id="action-sheet"
        class="fixed inset-0 z-50 hidden flex-col justify-end bg-black/60 backdrop-blur-sm transition-opacity opacity-0">
        <div id="action-sheet-content"
            class="bg-gray-900 rounded-t-2xl p-6 w-full transform translate-y-full transition-transform duration-300 shadow-[0_-10px_40px_rgba(0,0,0,0.5)]">
            <div class="w-12 h-1.5 bg-gray-700 rounded-full mx-auto mb-6"></div>
            <h3 class="text-xl font-bold mb-4 text-white" id="sheet-title">Open in Maps</h3>
            <p class="text-sm text-gray-400 mb-6 font-medium" id="sheet-subtitle"></p>
            <div class="flex flex-col gap-3">
                <button onclick="openMaps('google')"
                    class="w-full flex items-center justify-center gap-3 py-4 rounded-xl bg-blue-600 active:bg-blue-700 text-white font-bold text-lg shadow-lg">
                    <svg class="w-6 h-6" viewBox="0 0 24 24" fill="currentColor">
                        <path
                            d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5a2.5 2.5 0 010-5 2.5 2.5 0 010 5z" />
                    </svg>
                    Google Maps
                </button>
                <button onclick="openMaps('apple')"
                    class="w-full flex items-center justify-center gap-3 py-4 rounded-xl bg-gray-800 border border-gray-700 active:bg-gray-700 text-white font-bold text-lg shadow-lg">
                    <svg class="w-6 h-6" viewBox="0 0 24 24" fill="currentColor">
                        <path
                            d="M17.05 20.28c-.98.95-2.05.8-3.08.35-1.09-.46-2.09-.48-3.24 0-1.44.62-2.2.44-3.06-.35C2.79 15.25 3.51 7.59 9.05 7.31c1.35.05 2.46.82 3.12.82.68 0 2.05-.92 3.57-.79 1.45.05 2.56.59 3.26 1.48-2.61 1.63-2.18 4.7.42 5.59-.62 1.77-1.48 3.32-2.37 4.22v1.65zM12.03 7.25c-.15-2.23 1.66-4.07 3.74-4.25.29 2.58-2.02 4.45-3.74 4.25z" />
                    </svg>
                    Apple Maps
                </button>
                <button onclick="openMaps('waze')"
                    class="w-full flex items-center justify-center gap-3 py-4 rounded-xl bg-cyan-600 active:bg-cyan-700 text-white font-bold text-lg shadow-lg">
                    <svg class="w-6 h-6" viewBox="0 0 24 24" fill="currentColor">
                        <path
                            d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1.5 13a1.5 1.5 0 110-3 1.5 1.5 0 010 3zm5 0a1.5 1.5 0 110-3 1.5 1.5 0 010 3zm-2.5-6.5a4 4 0 00-4 4h-2c0-3.31 2.69-6 6-6v2z" />
                    </svg>
                    Waze
                </button>
                <div class="w-full h-px bg-gray-800 my-2"></div>
                <button onclick="markCompleted()" id="btn-mark-completed"
                    class="w-full flex items-center justify-center gap-3 py-4 rounded-xl border-2 border-green-600/50 hover:bg-green-900/20 active:bg-green-600 text-green-500 font-bold text-lg shadow-lg transition-colors">
                    <svg class="w-6 h-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"
                        stroke-linecap="round" stroke-linejoin="round">
                        <path d="M20 6L9 17l-5-5" />
                    </svg>
                    Mark as Completed
                </button>
                <button onclick="closeActionSheet()"
                    class="w-full py-4 mt-2 rounded-xl bg-transparent text-gray-400 active:text-white font-bold text-lg">
                    Cancel
                </button>
            </div>
        </div>
    </div>

    <script>
        const apiBase = window.location.pathname.endsWith('/') ? '../' : '';
        let driversData = [];
        let scheduleData = null;
        let selectedDriverId = localStorage.getItem('chauffeur_driver_id');
        let currentDates = [];
        let activeDateIndex = 0;
        let routeContext = null;

        async function init() {
            await fetchDrivers();
            if (selectedDriverId && driversData.find(d => d.id === selectedDriverId)) {
                selectDriver(selectedDriverId);
            } else {
                showDriverSelection();
            }
        }

        async function fetchDrivers() {
            try {
                const res = await fetch(`${apiBase}api/drivers`);
                const data = await res.json();
                driversData = data.filter(d => !d.is_disabled);
            } catch (e) {
                console.error("Failed to fetch drivers", e);
            }
        }

        async function markErrandCompleted(id) {
            if (!confirm('Mark this errand as completed?')) return;
            try {
                // We need to fetch the existing errand first
                const res = await fetch(`${apiBase}api/errands`);
                if (!res.ok) return;
                const errands = await res.json();
                const errand = errands.find(e => e.id === id);
                if (!errand) return;

                errand.is_completed = true;

                await fetch(`${apiBase}api/errands/${errand.doc_id}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(errand)
                });
                fetchSchedule(true);
            } catch (err) {
                console.error(err);
                alert("Failed to complete errand");
            }
        }

        async function checkNotificationStatus() {
            const pushBtn = document.getElementById('btn-push');
            if (Notification.permission === 'granted') {
                pushBtn.classList.add('hidden');
            } else {
                if (selectedDriverId) {
                    pushBtn.classList.remove('hidden');
                }
            }
        }

        function showDriverSelection() {
            document.getElementById('screen-schedule').classList.add('hidden');
            document.getElementById('btn-switch-driver').classList.add('hidden');
            document.getElementById('btn-push').classList.add('hidden');
            document.getElementById('screen-select-driver').classList.remove('hidden');

            document.getElementById('driver-name').textContent = "Select Driver";
            document.getElementById('date-subtitle').textContent = "Chauffeur App";
            document.getElementById('driver-avatar').textContent = "?";
            document.getElementById('driver-avatar').style.borderColor = "#374151";
            document.getElementById('driver-avatar').style.color = "#6B7280";

            const list = document.getElementById('driver-list');
            if (driversData.length === 0) {
                list.innerHTML = "<p class='text-center text-gray-500'>No drivers configured.</p>";
                return;
            }

            list.innerHTML = driversData.map(d => `
                <button onclick="selectDriver('${d.id}')" class="flex items-center gap-4 p-4 rounded-2xl bg-gray-900 border border-gray-800 active:bg-gray-800 active:border-gray-700 transition-all shadow-lg text-left w-full">
                    <div class="w-14 h-14 rounded-full flex items-center justify-center font-black text-2xl border-4 shadow-inner bg-gray-800" style="border-color: ${d.color_code}; color: ${d.color_code}">
                        ${d.name.charAt(0).toUpperCase()}
                    </div>
                    <div>
                        <div class="text-xl font-bold text-white">${d.name}</div>
                        <div class="text-sm text-gray-400 font-medium">${d.group} driver</div>
                    </div>
                </button>
            `).join('');
        }


        let isNotifOpen = false;
        function toggleNotifications() {
            const modal = document.getElementById('notif-modal');
            const content = document.getElementById('notif-modal-content');
            isNotifOpen = !isNotifOpen;

            if (isNotifOpen) {
                modal.classList.remove('hidden');
                modal.style.display = 'flex';
                void modal.offsetWidth;
                modal.classList.remove('opacity-0');
                content.classList.remove('translate-y-full');
                fetchNotifications();
            } else {
                modal.classList.add('opacity-0');
                content.classList.add('translate-y-full');
                setTimeout(() => {
                    modal.classList.add('hidden');
                    modal.style.display = 'none';
                }, 300);
            }
        }

        async function clearNotifications() {
            try {
                await fetch(`${apiBase}api/telemetry/clear`, { method: 'POST' });
                fetchNotifications();
            } catch (err) {
                console.error(err);
            }
        }

        async function testPushNotification() {
            try {
                if (!currentDriverId) return alert("Select a driver first");
                const res = await fetch(`${apiBase}api/telemetry/test_push?driver_id=${currentDriverId}`, { method: 'POST' });
                if (res.ok) alert("Test push notification sent!");
            } catch (err) {
                console.error(err);
            }
        }

        async function fetchNotifications() {
            try {
                const res = await fetch(`${apiBase}api/telemetry`);
                const events = await res.json();
                const list = document.getElementById('notif-list');
                const badge = document.getElementById('notif-badge');

                if (events.length === 0) {
                    list.innerHTML = '<p class="text-gray-500 text-center py-4 italic">No recent notifications</p>';
                    badge.classList.add('hidden');
                } else {
                    badge.textContent = events.length;
                    badge.classList.remove('hidden');

                    list.innerHTML = events.map(ev => {
                        const dName = driversData.find(d => d.id === ev.driver_id)?.name || 'Unknown Driver';
                        const timeStr = new Date(ev.timestamp * 1000).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
                        const colorClass = ev.action === 'arrived' ? 'text-blue-400' : 'text-green-400';
                        return `
                            <div class="bg-gray-800 border border-gray-700 p-4 rounded-xl flex items-center justify-between shadow-sm">
                                <div>
                                    <span class="font-bold text-white">${dName}</span>
                                    <span class="ml-2 font-bold uppercase tracking-wider text-[10px] px-2 py-1 bg-gray-900 rounded ${colorClass}">${ev.action}</span>
                                    <p class="text-xs text-gray-400 mt-1">${ev.details || 'Event ID: ' + ev.event_id}</p>
                                </div>
                                <div class="text-[10px] font-bold text-gray-500">${timeStr}</div>
                            </div>
                        `;
                    }).join('');
                }
            } catch (e) {
                console.error("Failed to load notifications", e);
            }
        }

        async function selectDriver(id) {
            currentDriverId = id;
            selectedDriverId = id;
            localStorage.setItem('chauffeur_driver_id', id);

            const d = driversData.find(d => d.id === id);
            if (d) {
                document.getElementById('driver-name').textContent = d.name;
                document.getElementById('driver-avatar').textContent = d.name.charAt(0).toUpperCase();
                document.getElementById('driver-avatar').style.borderColor = d.color_code;
                document.getElementById('driver-avatar').style.color = d.color_code;
            }

            document.getElementById('screen-select-driver').classList.add('hidden');
            document.getElementById('screen-schedule').classList.remove('hidden');
            document.getElementById('btn-switch-driver').classList.remove('hidden');
            document.getElementById('btn-notif').classList.remove('hidden');
            await checkNotificationStatus();

            await fetchSchedule();
            fetchNotifications();
        }


        function urlB64ToUint8Array(base64String) {
            const padding = '='.repeat((4 - base64String.length % 4) % 4);
            const base64 = (base64String + padding).replace(/\-/g, '+').replace(/_/g, '/');
            const rawData = window.atob(base64);
            const outputArray = new Uint8Array(rawData.length);
            for (let i = 0; i < rawData.length; ++i) {
                outputArray[i] = rawData.charCodeAt(i);
            }
            return outputArray;
        }

        async function enableNotifications() {
            if (!('serviceWorker' in navigator) || !('PushManager' in window)) {
                alert("Push notifications are not supported by your browser.");
                return;
            }
            const permission = await Notification.requestPermission();
            if (permission !== 'granted') {
                alert("Permission not granted.");
                return;
            }

            try {
                const reg = await navigator.serviceWorker.register('/sw.js');
                const response = await fetch(`${apiBase}api/vapid_public_key`);
                const data = await response.json();

                const subscription = await reg.pushManager.subscribe({
                    userVisibleOnly: true,
                    applicationServerKey: urlB64ToUint8Array(data.public_key)
                });

                await fetch(`${apiBase}api/push_subscribe`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        driver_id: currentDriverId,
                        subscription: subscription
                    })
                });
                alert("Notifications enabled!");
            } catch (e) {
                console.error(e);
                alert("Failed to enable notifications: " + e.message);
            }
        }

        function clearDriver() {
            selectedDriverId = null;
            localStorage.removeItem('chauffeur_driver_id');
            showDriverSelection();
        }

        async function fetchSchedule(refresh = false, skipLocal = false) {
            const container = document.getElementById('days-container');
            const btnSync = document.getElementById('btn-sync');

            const cached = localStorage.getItem('chauffeur_schedule');
            let hasCachedData = false;
            if (cached && !refresh && !skipLocal) {
                try {
                    scheduleData = JSON.parse(cached);
                    buildTimeline();
                    hasCachedData = true;
                    // Do not return here, let it fetch fresh data in the background
                } catch (e) { }
            }

            if (refresh) {
                // If it's a manual refresh, clear the start date to reset the view
                window.globalStartDate = null;
            }

            if (!hasCachedData || refresh) {
                btnSync.classList.add('animate-spin');
            }

            try {
                let url = `${apiBase}api/schedule?_cb=` + new Date().getTime();
                if (refresh) url += '&force_refresh=true';

                const res = await fetch(url);
                scheduleData = await res.json();
                localStorage.setItem('chauffeur_schedule', JSON.stringify(scheduleData));
                buildTimeline();
            } catch (e) {
                console.error("Failed to fetch schedule", e);
                if (!hasCachedData) {
                    document.getElementById('days-container').innerHTML = `<div class="w-full flex items-center justify-center text-red-400">Failed to load data</div>`;
                }
            } finally {
                setTimeout(() => btnSync.classList.remove('animate-spin'), 500);
            }
        }

        function formatTime(isoStr) {
            return new Date(isoStr).toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
        }

        function formatDuration(mins) {
            if (mins < 60) return `${mins}m`;
            const h = Math.floor(mins / 60);
            const m = mins % 60;
            return m > 0 ? `${h}h ${m}m` : `${h}h`;
        }

        function openActionSheet(origin, destination, legTitle, eventId = null, legId = null) {
            routeContext = { origin, destination, legTitle, eventId, legId };
            document.getElementById('sheet-subtitle').textContent = legTitle;

            const sheet = document.getElementById('action-sheet');
            const content = document.getElementById('action-sheet-content');
            sheet.classList.remove('hidden');
            sheet.style.display = 'flex';

            // Trigger reflow
            void sheet.offsetWidth;

            sheet.classList.remove('opacity-0');
            content.classList.remove('translate-y-full');
        }

        function closeActionSheet() {
            const sheet = document.getElementById('action-sheet');
            const content = document.getElementById('action-sheet-content');

            sheet.classList.add('opacity-0');
            content.classList.add('translate-y-full');

            setTimeout(() => {
                sheet.classList.add('hidden');
                sheet.style.display = 'none';
                routeContext = null;
            }, 300);
        }

        function openMaps(provider) {
            if (!routeContext) return;

            let destStr = routeContext.destination;

            // Apple Maps fuzzy matches poorly on named places (like "Ancient Oaks pool, 8400...").
            // If the first part before a comma contains no numbers but the second part does,
            // we strip the name part so Apple Maps gets a clean street address.
            if (provider === 'apple') {
                const parts = destStr.split(',');
                if (parts.length > 1 && !/\d/.test(parts[0]) && /\d/.test(parts[1])) {
                    destStr = parts.slice(1).join(',').trim();
                }
            }

            const destEnc = encodeURIComponent(destStr);

            let url = '';
            if (provider === 'google') {
                url = `https://www.google.com/maps/dir/?api=1&destination=${destEnc}&dir_action=navigate`;
            } else if (provider === 'apple') {
                url = `maps://?daddr=${destEnc}&dirflg=d`;
            } else if (provider === 'waze') {
                url = `waze://?q=${destEnc}&navigate=yes`;
            }

            closeActionSheet();
            const a = document.createElement('a');
            a.href = url;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
        }

        async function markCompleted() {
            if (!routeContext || !routeContext.eventId || !currentDriverId) return;
            const btn = document.getElementById('btn-mark-completed');
            btn.disabled = true;
            btn.innerHTML = '<svg class="w-6 h-6 animate-spin" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10" stroke-dasharray="31.4 31.4" stroke-dashoffset="0"/></svg> Saving...';

            try {
                let actionStr = 'completed';
                if (routeContext.legTitle.includes('Pickup')) actionStr = 'picked up';
                if (routeContext.legTitle.includes('Dropoff')) actionStr = 'dropped off';
                if (routeContext.legTitle.includes('Home')) actionStr = 'arrived';

                await fetch(`${apiBase}api/telemetry`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        driver_id: currentDriverId,
                        event_id: routeContext.eventId,
                        action: actionStr,
                        details: routeContext.legTitle,
                        leg_id: routeContext.legId
                    })
                });

                // ALSO mark it in drive_status backend
                await fetch(`${apiBase}api/drive_status`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        leg_id: routeContext.legId,
                        status: 'completed'
                    })
                });
                await fetchSchedule();
                closeActionSheet();
            } catch (e) {
                console.error("Failed to mark completed", e);
                btn.textContent = 'Failed';
            } finally {
                btn.disabled = false;
            }
        }

        function openEventModal(titleStr) {
            const ev = JSON.parse(decodeURIComponent(titleStr));
            document.getElementById('em-title').textContent = ev.title;
            document.getElementById('em-time').textContent = ev.timeStr;
            document.getElementById('em-location').textContent = ev.location || 'No location provided';
            document.getElementById('em-passengers').innerHTML = ev.passengerHtml || '<span class="text-gray-500 italic">None</span>';

            const mapBtn = document.getElementById('em-map-btn');
            if (ev.location) {
                mapBtn.style.display = 'flex';
                mapBtn.onclick = () => {
                    closeEventModal();
                    setTimeout(() => openActionSheet('', ev.location, 'Map to Event'), 300);
                };
            } else {
                mapBtn.style.display = 'none';
            }

            const modal = document.getElementById('event-modal');
            const content = document.getElementById('event-modal-content');
            modal.classList.remove('hidden');
            modal.style.display = 'flex';
            void modal.offsetWidth; // trigger reflow
            modal.classList.remove('opacity-0');
            content.classList.remove('translate-y-full');
            content.classList.remove('sm:scale-95');
        }

        function closeEventModal() {
            const modal = document.getElementById('event-modal');
            const content = document.getElementById('event-modal-content');
            modal.classList.add('opacity-0');
            content.classList.add('translate-y-full');
            content.classList.add('sm:scale-95');
            setTimeout(() => {
                modal.classList.add('hidden');
                modal.style.display = 'none';
            }, 300);
        }

        function renderLegPill(timeStr, title, mins, delayMins, actionArgs, colorTheme = 'blue', subtitleHtml = '', legId = null, isPast = false, lateMins = 0) {
            const isCompleted = legId && scheduleData && scheduleData.completed_drives && scheduleData.completed_drives.includes(legId);
            if (isCompleted) {
                return `
                    <div class="flex items-start mb-2 relative z-10 opacity-60">
                        <div class="w-8 h-8 rounded-full bg-gray-800 border-2 border-gray-950 flex items-center justify-center shrink-0 shadow-sm text-green-400">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>
                        </div>
                        <div class="ml-4 flex-1 bg-gray-900 border border-gray-800 rounded-lg p-2 flex items-center justify-between">
                            <div class="text-gray-400 font-medium text-sm line-through">${title}</div>
                        </div>
                    </div>`;
            }

            const iconSvg = colorTheme === 'blue'
                ? `<svg class="w-4 h-4" fill="currentColor" viewBox="0 0 24 24"><path d="M18.92 6.01C18.72 5.42 18.16 5 17.5 5h-11c-.66 0-1.21.42-1.42 1.01L3 12v8c0 .55.45 1 1 1h1c.55 0 1-.45 1-1v-1h12v1c0 .55.45 1 1 1h1c.55 0 1-.45 1-1v-8l-2.08-5.99zM6.85 7h10.29l1.08 3.11H5.77L6.85 7zM19 17H5v-5h14v5zM7.5 16c.83 0 1.5-.67 1.5-1.5S8.33 13 7.5 13 6 13.67 6 14.5 6.67 16 7.5 16z"/></svg>`
                : `<svg class="w-4 h-4" fill="currentColor" viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>`;

            const colorClassBg = colorTheme === 'blue' ? 'bg-blue-900' : 'bg-green-900';
            const colorClassText = colorTheme === 'blue' ? 'text-blue-300' : 'text-green-300';
            const timeColorClassText = colorTheme === 'blue' ? 'text-blue-400' : 'text-green-400';
            const durationClassText = colorTheme === 'blue' ? 'text-blue-500' : 'text-green-500';

            const timeLabel = colorTheme === 'blue' ? 'Leave at' : 'Arrive by';

            return `
                <div class="flex items-start mb-6 relative z-10 group cursor-pointer ${isPast ? 'opacity-40' : ''}" onclick="openActionSheet(${actionArgs})">
                    <div class="w-10 h-10 rounded-full ${colorClassBg} border-4 border-gray-950 flex items-center justify-center shrink-0 shadow-md ${colorClassText}">
                        ${iconSvg}
                    </div>
                    <div class="ml-4 flex-1 bg-gray-900 border border-gray-800 rounded-xl p-4 shadow-sm active:bg-gray-800 transition-colors">
                        <div class="text-sm font-bold ${timeColorClassText} mb-1 uppercase tracking-wider">${timeLabel} ${timeStr}</div>
                        <div class="text-white font-medium text-lg leading-tight mb-2">${title}</div>
                        ${subtitleHtml ? `<div class="flex flex-wrap gap-1 mb-2">${subtitleHtml}</div>` : ''}
                        <div class="flex items-center text-xs font-mono text-gray-400 bg-gray-950 inline-flex px-2 py-1 rounded">
                            <span class="${durationClassText}">${formatDuration(mins)}</span>
                            ${delayMins > 3 ? `<span class="ml-2 text-yellow-500 font-bold">⚠ +${delayMins}m</span>` : ''}
                            ${lateMins > 0 ? `<span class="ml-2 text-red-500 font-bold" title="Arriving ${lateMins}m late">⚠ Late</span>` : ''}
                        </div>
                    </div>
                </div>
            `;
        }

        function buildTimeline() {
            const container = document.getElementById('days-container');
            const dId = selectedDriverId;
            if (!scheduleData || !dId) return;

            const { events, assignments, ghost_assignments, route_edges, initial_edges, final_edges } = scheduleData;

            let localRouteEdges = JSON.parse(JSON.stringify(route_edges || {}));
            let localInitialEdges = JSON.parse(JSON.stringify(initial_edges || {}));
            let localFinalEdges = JSON.parse(JSON.stringify(final_edges || {}));

            const myEvents = events.filter(ev => {
                const assigned = (assignments && assignments[ev.id]) || (ghost_assignments && ghost_assignments[ev.id]);
                if (assigned === dId) return true;
                if (scheduleData.driver_events && scheduleData.driver_events[dId] && scheduleData.driver_events[dId].includes(ev.id)) return true;
                return false;
            });

            const byDate = {};
            const myErrands = (scheduleData.scheduled_errands || []).filter(e => e.driver && e.driver.id === dId);
            myErrands.forEach(errand => {
                errand.start = errand.start_time;
                errand.end = errand.end_time;
                errand.event_type = 'errand';

                const e1_id = errand.inserted_after_event_id;
                const e2_id = errand.inserted_before_event_id;
                const e_id = errand.id;

                if (!localRouteEdges[dId]) localRouteEdges[dId] = {};
                if (!localInitialEdges[dId]) localInitialEdges[dId] = {};
                if (!localFinalEdges[dId]) localFinalEdges[dId] = {};

                if (e1_id === null && e2_id === null) {
                    localInitialEdges[dId][e_id] = { to_event: e_id, travel_mins: errand.travel_to_mins, delay_mins: 0, driver_home_location: "" };
                    localFinalEdges[dId][e_id] = { from_event: e_id, travel_mins: errand.travel_from_mins, delay_mins: 0, dropoff_waypoint: null };
                } else if (e1_id !== null && e2_id !== null) {
                    if (localRouteEdges[dId][e1_id]) delete localRouteEdges[dId][e1_id];
                    localRouteEdges[dId][e1_id] = { from_event: e1_id, to_event: e_id, travel_mins: errand.travel_to_mins, delay_mins: 0 };
                    localRouteEdges[dId][e_id] = { from_event: e_id, to_event: e2_id, travel_mins: errand.travel_from_mins, delay_mins: 0 };
                } else if (e1_id !== null) {
                    if (localFinalEdges[dId][e1_id]) delete localFinalEdges[dId][e1_id];
                    localRouteEdges[dId][e1_id] = { from_event: e1_id, to_event: e_id, travel_mins: errand.travel_to_mins, delay_mins: 0 };
                    localFinalEdges[dId][e_id] = { from_event: e_id, travel_mins: errand.travel_from_mins, delay_mins: 0, dropoff_waypoint: null };
                } else if (e2_id !== null) {
                    if (localInitialEdges[dId][e2_id]) delete localInitialEdges[dId][e2_id];
                    localInitialEdges[dId][e_id] = { to_event: e_id, travel_mins: errand.travel_to_mins, delay_mins: 0, driver_home_location: "" };
                    localRouteEdges[dId][e_id] = { from_event: e_id, to_event: e2_id, travel_mins: errand.travel_from_mins, delay_mins: 0 };
                }

                let currDate = new Date(errand.start);
                const year = currDate.getFullYear();
                const month = String(currDate.getMonth() + 1).padStart(2, '0');
                const day = String(currDate.getDate()).padStart(2, '0');
                const dStr = `${year}-${month}-${day}`;
                if (!byDate[dStr]) byDate[dStr] = [];
                byDate[dStr].push(errand);
            });

            myEvents.forEach(ev => {
                let currDate = new Date(ev.start);
                currDate.setHours(0, 0, 0, 0);
                let endDate = new Date(ev.end);
                endDate.setHours(0, 0, 0, 0);

                // If the event ends at midnight, don't include the end date unless it's the same as the start date
                if (new Date(ev.end).getHours() === 0 && new Date(ev.end).getMinutes() === 0 && currDate < endDate) {
                    endDate.setDate(endDate.getDate() - 1);
                }

                while (currDate <= endDate) {
                    // Manually construct YYYY-MM-DD in local time
                    const year = currDate.getFullYear();
                    const month = String(currDate.getMonth() + 1).padStart(2, '0');
                    const day = String(currDate.getDate()).padStart(2, '0');
                    const dStr = `${year}-${month}-${day}`;

                    if (!byDate[dStr]) byDate[dStr] = [];
                    byDate[dStr].push(ev);
                    currDate.setDate(currDate.getDate() + 1);
                }
            });

            currentDates = [];
            if (!window.globalStartDate) {
                window.globalStartDate = new Date();
                window.globalStartDate.setHours(0, 0, 0, 0);
                window.globalDaysToShow = 7;
            }

            for (let i = 0; i < window.globalDaysToShow; i++) {
                const d = new Date(window.globalStartDate);
                d.setDate(d.getDate() + i);
                currentDates.push(d.toLocaleDateString('en-CA'));
            }

            container.innerHTML = '';

            currentDates.forEach((dateStr, index) => {
                const evs = byDate[dateStr] || [];
                evs.sort((a, b) => new Date(a.start) - new Date(b.start));

                const pane = document.createElement('div');
                pane.className = "min-w-full w-full h-full snap-center overflow-y-auto px-4 py-6";
                pane.id = `pane-${index}`;

                if (evs.length === 0) {
                    pane.innerHTML = `
                        <div class="flex flex-col items-center justify-center h-full opacity-50 text-center">
                            <div class="text-6xl mb-4">☕</div>
                            <h3 class="text-xl font-bold mb-2">No Drives Scheduled</h3>
                            <p class="text-gray-400">Enjoy your free time!</p>
                        </div>
                    `;
                    container.appendChild(pane);
                    return;
                }

                let html = '<div class="flex flex-col relative before:absolute before:left-[19px] before:top-4 before:bottom-4 before:w-1 before:bg-gray-800 before:z-0">';

                const driverConfig = driversData.find(d => d.id === dId) || {};
                const globalHome = scheduleData.home_location || '';
                const calendar_metadata = scheduleData.calendar_metadata || {};

                function getPassengerBadges(eventObj) {
                    const calMetas = eventObj.calendar_ids.map(c => calendar_metadata[c] || { backgroundColor: '#3B82F6', summary: 'Passenger' });
                    return calMetas.map(meta => `<span class="px-2 py-0.5 text-[10px] font-bold rounded-full border border-gray-600 truncate max-w-[80px]" style="background-color: ${meta.backgroundColor}20; color: ${meta.backgroundColor}; border-color: ${meta.backgroundColor}50;" title="${meta.summary}">${meta.summary}</span>`).join('');
                }

                function getHomeLabel(loc) {
                    if (!loc) return "Drive home";
                    const l = loc.toLowerCase();
                    if (l.includes("hotel") || l.includes("resort") || l.includes("motel") || l.includes("suites") || l.includes("lodge") || l.includes(" inn") || l.startsWith("inn ") || l.includes("hyatt") || l.includes("hilton") || l.includes("ritz") || l.includes("marriott")) {
                        return "Drive to Hotel";
                    }
                    else if (l.includes("airbnb") || l.includes("vrbo")) {
                        return "Drive to Rental";
                    }
                    return "Drive home";
                }

                evs.forEach((ev, evIdx) => {
                    const isDriverOnly = !(assignments && assignments[ev.id]) && !(ghost_assignments && ghost_assignments[ev.id]);

                    if (ev.event_type === 'errand') {
                        const isPast = new Date(ev.end) < new Date();
                        html += `
                        <div class="flex items-start mb-6 relative z-10 group cursor-pointer ${isPast ? 'opacity-60' : ''}" onclick="markErrandCompleted('${ev.id}')">
                            <div class="w-10 h-10 rounded-full bg-gray-800 border-4 border-gray-950 flex items-center justify-center shrink-0 shadow-md text-gray-400">
                                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>
                            </div>
                            <div class="ml-4 flex-1 bg-gray-800 border border-gray-700 rounded-xl p-4 shadow-sm active:bg-gray-700 transition-colors">
                                <div class="text-sm font-bold text-yellow-500 mb-1 uppercase tracking-wider">Errand • ${formatTime(ev.start)}</div>
                                <div class="text-white font-bold text-lg leading-tight mb-2">${ev.title}</div>
                                <div class="text-sm text-gray-500 flex items-start gap-1"><svg class="w-4 h-4 shrink-0 mt-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"></path></svg><span class="break-words line-clamp-2">${ev.location}</span></div>
                            </div>
                        </div>`;
                        return;
                    }

                    // --- Initial Edge ---
                    if (initial_edges[dId] && initial_edges[dId][ev.id]) {
                        const edge = initial_edges[dId] ? initial_edges[dId][ev.id] : null;
                        if (edge && edge.travel_mins > 0) {
                            const originLocation = edge.driver_home_location || driverConfig.home_location || globalHome;
                            const destinationLocation = ev.location;
                            const depTime = new Date(new Date(ev.start).getTime() - (edge.travel_mins + 5 + (edge.buffer_before_mins || 0)) * 60000);
                            const badges = getPassengerBadges(ev);

                            if (edge.pickup_waypoint) {
                                const leg1Mins = edge.pickup_waypoint.from_driver_home_mins;
                                const leg2Mins = edge.pickup_waypoint.from_global_home_mins;
                                const leg2DepTime = new Date(depTime.getTime() + leg1Mins * 60000);
                                const paxPickupLoc = edge.pickup_waypoint.pickup_location || globalHome;

                                if (leg1Mins > 0) {
                                    let args1 = `'${originLocation.replace(/'/g, "\\'")}', '${paxPickupLoc.replace(/'/g, "\\'")}', 'Drive to Pickup', '${ev.id}'`;
                                    html += renderLegPill(formatTime(depTime.toISOString()), "Drive to Pickup", leg1Mins, 0, args1 + `, 'init_${ev.id}_1'`, 'blue', badges, `init_${ev.id}_1`, depTime < new Date());
                                }

                                let args2 = `'${paxPickupLoc.replace(/'/g, "\\'")}', '${destinationLocation.replace(/'/g, "\\'")}', 'Drive to ${destinationLocation.split(',')[0].replace(/'/g, "\\'")}', '${ev.id}'`;
                                html += renderLegPill(formatTime(leg2DepTime.toISOString()), `Drive to ${destinationLocation.split(',')[0]}`, leg2Mins, edge.delay_mins, args2 + `, 'init_${ev.id}_2'`, 'blue', leg1Mins > 0 ? '' : badges, `init_${ev.id}_2`, leg2DepTime < new Date());
                            } else {
                                let args = `'${originLocation.replace(/'/g, "\\'")}', '${destinationLocation.replace(/'/g, "\\'")}', 'Drive to ${destinationLocation.split(',')[0].replace(/'/g, "\\'")}', '${ev.id}'`;
                                html += renderLegPill(formatTime(depTime.toISOString()), `Drive to ${destinationLocation.split(',')[0]}`, edge.travel_mins, edge.delay_mins, args + `, 'init_${ev.id}'`, 'blue', badges, `init_${ev.id}`, depTime < new Date());
                            }
                        }
                    }

                    // --- Event ---
                    let bgColor = isDriverOnly ? 'bg-gray-800/50 border-gray-700 border-dashed border' : 'bg-gray-800 border-gray-700 border';
                    let titleClass = isDriverOnly ? 'text-gray-400' : 'text-white';
                    const badges = getPassengerBadges(ev);

                    let lateMins = 0;
                    if (localRouteEdges[dId]) {
                        const incomingEdge = Object.values(localRouteEdges[dId]).find(edge => edge.to_event === ev.id);
                        if (incomingEdge && incomingEdge.late_mins) {
                            lateMins = incomingEdge.late_mins;
                        }
                    }

                    const eventData = {
                        title: ev.event_type === 'dropoff' ? 'Dropoff: ' + ev.title : (ev.event_type === 'pickup' ? 'Pickup: ' + ev.title : ev.title),
                        timeStr: (ev.event_type === 'dropoff' || ev.event_type === 'pickup') ? formatTime(ev.start) : `${formatTime(ev.start)} - ${formatTime(ev.end)}`,
                        location: ev.location,
                        passengerHtml: badges
                    };
                    const evDataStr = encodeURIComponent(JSON.stringify(eventData));

                    const isEventPast = new Date(ev.end) < new Date();
                    html += `
                        <div class="flex items-start mb-6 relative z-10 group cursor-pointer ${isEventPast ? 'opacity-40' : ''}" onclick="openEventModal('${evDataStr.replace(/'/g, "\\'")}')">
                            <div class="w-10 h-10 rounded-full bg-gray-700 border-4 border-gray-950 flex items-center justify-center shrink-0 shadow-md text-white font-bold text-xs" style="background-color: ${driverConfig.color_code || '#4a5568'}">
                                ${formatTime(ev.start).split(':')[0]}
                            </div>
                            <div class="ml-4 flex-1 ${bgColor} rounded-xl p-4 shadow-sm active:bg-gray-800 transition-colors">
                                <div class="text-sm font-bold text-gray-400 mb-1">${(ev.event_type === 'dropoff' || ev.event_type === 'pickup') ? formatTime(ev.start) : formatTime(ev.start) + ' - ' + formatTime(ev.end)}</div>
                                <div class="${titleClass} font-bold text-xl leading-tight mb-2">
                                    ${ev.event_type === 'dropoff' ? '<span class="text-[10px] tracking-widest uppercase bg-orange-600/30 text-orange-300 px-2 py-1 rounded mr-2 align-middle border border-orange-500/50">Dropoff</span>' : ''}
                                    ${ev.event_type === 'pickup' ? '<span class="text-[10px] tracking-widest uppercase bg-green-600/30 text-green-300 px-2 py-1 rounded mr-2 align-middle border border-green-500/50">Pickup</span>' : ''}
                                    ${ev.title}
                                </div>
                                ${badges ? `<div class="flex flex-wrap gap-1 mb-2">${badges}</div>` : ''}
                                ${lateMins > 0 ? `<div class="text-red-400 font-bold text-sm mb-2 flex items-center"><svg class="w-4 h-4 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path></svg> Arriving ${lateMins}m Late</div>` : ''}
                                ${ev.location ? `<div class="text-sm text-gray-500 flex items-start gap-1"><svg class="w-4 h-4 shrink-0 mt-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"></path></svg><span class="break-words line-clamp-2">${ev.location}</span></div>` : ''}
                            </div>
                        </div>
                    `;

                    // --- Routing Edge ---
                    if (localRouteEdges[dId] && localRouteEdges[dId][ev.id]) {
                        const edge = localRouteEdges[dId] ? localRouteEdges[dId][ev.id] : null;
                        const nextEv = evs.find(e => e.id === edge.to_event);
                        if (nextEv) {

                            let computedOrigin = ev.location;
                            const destinationLocation = nextEv.location;
                            const nextBadges = getPassengerBadges(nextEv);

                            if (edge.home_waypoint && edge.pickup_waypoint) {
                                const leg1Mins = edge.home_waypoint.to_home_mins;
                                const leg2Mins = edge.home_waypoint.from_home_mins;
                                const leg3Mins = edge.pickup_waypoint.from_pickup_mins;
                                const pickupLocation = edge.pickup_waypoint.pickup_location || globalHome;
                                const driverHomeLoc = edge.home_waypoint.driver_home_location || globalHome;

                                const homeLabel = getHomeLabel(driverHomeLoc);
                                const pickupTitle = edge.pickup_waypoint.pickup_event_title ? `Pickup at ${edge.pickup_waypoint.pickup_event_title}` : 'Pickup';

                                const leg2DepTime = new Date(new Date(ev.end).getTime() + (leg1Mins + edge.home_waypoint.layover_mins) * 60000);

                                let args1 = `'${computedOrigin.replace(/'/g, "\\'")}', '${driverHomeLoc.replace(/'/g, "\\'")}', '${homeLabel.replace(/'/g, "\\'")}', '${ev.id}'`;
                                html += renderLegPill(formatTime(ev.end), homeLabel, leg1Mins, 0, args1 + `, 'route_${ev.id}_1'`, 'blue', '', `route_${ev.id}_1`, new Date(ev.end) < new Date());

                                if (leg2Mins === 0) { // Meaning pickupLocation == driverHomeLoc
                                    let args3 = `'${driverHomeLoc.replace(/'/g, "\\'")}', '${destinationLocation.replace(/'/g, "\\'")}', 'Drive to ${destinationLocation.split(',')[0].replace(/'/g, "\\'")}', '${ev.id}'`;
                                    html += renderLegPill(formatTime(leg2DepTime.toISOString()), `Drive to ${destinationLocation.split(',')[0]}`, leg3Mins, edge.delay_mins, args3 + `, 'route_${ev.id}_2'`, 'blue', nextBadges, `route_${ev.id}_2`, leg2DepTime < new Date(), edge.late_mins || 0);
                                } else {
                                    const leg3DepTime = new Date(leg2DepTime.getTime() + leg2Mins * 60000);
                                    let args2 = `'${driverHomeLoc.replace(/'/g, "\\'")}', '${pickupLocation.replace(/'/g, "\\'")}', '${pickupTitle.replace(/'/g, "\\'")}', '${ev.id}'`;
                                    html += renderLegPill(formatTime(leg2DepTime.toISOString()), pickupTitle, leg2Mins, 0, args2 + `, 'route_${ev.id}_2'`, 'blue', nextBadges, `route_${ev.id}_2`, leg2DepTime < new Date());

                                    let args3 = `'${pickupLocation.replace(/'/g, "\\'")}', '${destinationLocation.replace(/'/g, "\\'")}', 'Drive to ${destinationLocation.split(',')[0].replace(/'/g, "\\'")}', '${ev.id}'`;
                                    html += renderLegPill(formatTime(leg3DepTime.toISOString()), `Drive to ${destinationLocation.split(',')[0]}`, leg3Mins, edge.delay_mins, args3 + `, 'route_${ev.id}_3'`, 'blue', '', `route_${ev.id}_3`, leg3DepTime < new Date(), edge.late_mins || 0);
                                }
                            } else if (edge.home_waypoint) {
                                const leg1Mins = edge.home_waypoint.to_home_mins;
                                const leg2Mins = edge.home_waypoint.from_home_mins;
                                const leg2DepTime = new Date(new Date(ev.end).getTime() + (leg1Mins + edge.home_waypoint.layover_mins) * 60000);
                                const driverHomeLoc = edge.home_waypoint.driver_home_location || globalHome;

                                const homeLabel = getHomeLabel(driverHomeLoc);
                                let args1 = `'${computedOrigin.replace(/'/g, "\\'")}', '${driverHomeLoc.replace(/'/g, "\\'")}', '${homeLabel.replace(/'/g, "\\'")}', '${ev.id}'`;
                                html += renderLegPill(formatTime(ev.end), homeLabel, leg1Mins, 0, args1 + `, 'route_${ev.id}_1'`, 'blue', '', `route_${ev.id}_1`, new Date(ev.end) < new Date());

                                let args2 = `'${driverHomeLoc.replace(/'/g, "\\'")}', '${destinationLocation.replace(/'/g, "\\'")}', 'Drive to ${destinationLocation.split(',')[0].replace(/'/g, "\\'")}', '${ev.id}'`;
                                html += renderLegPill(formatTime(leg2DepTime.toISOString()), `Drive to ${destinationLocation.split(',')[0]}`, leg2Mins, edge.delay_mins, args2 + `, 'route_${ev.id}_2'`, 'blue', nextBadges, `route_${ev.id}_2`, leg2DepTime < new Date(), edge.late_mins || 0);
                            } else if (edge.pickup_waypoint) {
                                const leg1Mins = edge.pickup_waypoint.to_pickup_mins;
                                const leg2Mins = edge.pickup_waypoint.from_pickup_mins;
                                const pickupLocation = edge.pickup_waypoint.pickup_location || globalHome;
                                const pickupTitle = edge.pickup_waypoint.pickup_event_title ? `Pickup at ${edge.pickup_waypoint.pickup_event_title}` : 'Pickup';
                                const leg2DepTime = new Date(new Date(ev.end).getTime() + leg1Mins * 60000);

                                let args1 = `'${computedOrigin.replace(/'/g, "\\'")}', '${pickupLocation.replace(/'/g, "\\'")}', '${pickupTitle.replace(/'/g, "\\'")}', '${ev.id}'`;
                                html += renderLegPill(formatTime(ev.end), pickupTitle, leg1Mins, 0, args1 + `, 'route_${ev.id}_1'`, 'blue', nextBadges, `route_${ev.id}_1`, new Date(ev.end) < new Date());

                                let args2 = `'${pickupLocation.replace(/'/g, "\\'")}', '${destinationLocation.replace(/'/g, "\\'")}', 'Drive to ${destinationLocation.split(',')[0].replace(/'/g, "\\'")}', '${ev.id}'`;
                                html += renderLegPill(formatTime(leg2DepTime.toISOString()), `Drive to ${destinationLocation.split(',')[0]}`, leg2Mins, edge.delay_mins, args2 + `, 'route_${ev.id}_2'`, 'blue', '', `route_${ev.id}_2`, leg2DepTime < new Date(), edge.late_mins || 0);
                            } else {
                                let destStr = destinationLocation ? destinationLocation.split(',')[0] : 'Next Event';
                                let args = `'${(computedOrigin || '').replace(/'/g, "\\'")}', '${(destinationLocation || '').replace(/'/g, "\\'")}', 'Drive to ${destStr.replace(/'/g, "\\'")}', '${ev.id}'`;
                                html += renderLegPill(formatTime(ev.end), `Drive to ${destStr}`, edge.travel_mins, edge.delay_mins, args + `, 'route_${ev.id}_${nextEv.id}'`, 'blue', nextBadges, `route_${ev.id}_${nextEv.id}`, new Date(ev.end) < new Date(), edge.late_mins || 0);
                            }
                        }
                    }

                    // --- Final Edge ---
                    if (localFinalEdges[dId] && localFinalEdges[dId][ev.id]) {
                        const edge = localFinalEdges[dId] ? localFinalEdges[dId][ev.id] : null;
                        if (edge && edge.travel_mins > 0) {
                            const arriveDate = new Date(new Date(ev.end).getTime() + edge.travel_mins * 60000);
                            const originLocation = ev.location;
                            const destinationLocation = edge.driver_home_location || driverConfig.home_location || globalHome;
                            const badges = getPassengerBadges(ev);

                            if (edge.dropoff_waypoint) {
                                const leg1Mins = edge.dropoff_waypoint.to_global_home_mins;
                                const leg2Mins = edge.dropoff_waypoint.to_driver_home_mins;
                                const leg2DepTime = new Date(new Date(ev.end).getTime() + leg1Mins * 60000);
                                const leg2ArrTime = arriveDate;

                                const paxDropoffLoc = edge.dropoff_waypoint.dropoff_location || globalHome;
                                const driverHomeLoc = edge.dropoff_waypoint.driver_home_location || destinationLocation;

                                let args1 = `'${originLocation.replace(/'/g, "\\'")}', '${paxDropoffLoc.replace(/'/g, "\\'")}', 'Drive to Dropoff', '${ev.id}'`;
                                html += renderLegPill(formatTime(leg2DepTime.toISOString()), "Drive to Dropoff", leg1Mins, 0, args1 + `, 'final_${ev.id}_1'`, 'green', badges, `final_${ev.id}_1`, leg2DepTime < new Date());

                                const homeLabel = getHomeLabel(driverHomeLoc);
                                let args2 = `'${paxDropoffLoc.replace(/'/g, "\\'")}', '${driverHomeLoc.replace(/'/g, "\\'")}', '${homeLabel.replace(/'/g, "\\'")}', '${ev.id}'`;
                                html += renderLegPill(formatTime(leg2ArrTime.toISOString()), homeLabel, leg2Mins, edge.delay_mins, args2 + `, 'final_${ev.id}'`, 'green', '', `final_${ev.id}`, leg2ArrTime < new Date());
                            } else {
                                const homeLabel = getHomeLabel(destinationLocation);
                                let args = `'${(originLocation || '').replace(/'/g, "\\'")}', '${(destinationLocation || '').replace(/'/g, "\\'")}', '${homeLabel.replace(/'/g, "\\'")}', '${ev.id}'`;
                                html += renderLegPill(formatTime(arriveDate.toISOString()), homeLabel, edge.travel_mins, edge.delay_mins, args + `, 'final_${ev.id}'`, 'green', badges, `final_${ev.id}`, arriveDate < new Date());
                            }
                        }
                    }
                });

                html += '</div>';
                pane.innerHTML = html;
                container.appendChild(pane);
            });

            updateHeaderDate();

            // Set up scroll snapping logic
            container.addEventListener('scroll', () => {
                const scrollLeft = container.scrollLeft;
                const paneWidth = container.clientWidth;
                const idx = Math.round(scrollLeft / paneWidth);
                if (idx !== activeDateIndex) {
                    activeDateIndex = idx;
                    updateHeaderDate();
                }
            });
        }

        function updateHeaderDate() {
            if (currentDates.length === 0) return;
            const dStr = currentDates[activeDateIndex];

            const today = new Date();
            const tomorrow = new Date();
            tomorrow.setDate(today.getDate() + 1);

            const todayStr = today.toLocaleDateString('en-CA');
            const tomorrowStr = tomorrow.toLocaleDateString('en-CA');

            let label = "";
            let subLabel = "";
            const options = { weekday: 'long', month: 'short', day: 'numeric' };
            const dDate = new Date(dStr + 'T12:00:00');

            if (dStr === todayStr) {
                label = "Today";
            } else if (dStr === tomorrowStr) {
                label = "Tomorrow";
            } else {
                label = dDate.toLocaleDateString(undefined, options);
            }

            document.getElementById('current-day-label').textContent = label;
            document.getElementById('date-subtitle').textContent = dDate.toLocaleDateString(undefined, { month: 'short', day: 'numeric' });

            // document.getElementById('btn-prev-day').disabled = activeDateIndex === 0;
            // document.getElementById('btn-next-day').disabled = activeDateIndex === currentDates.length - 1;
        }

        async function fetchMoreDays(direction) {
            const btnPrev = document.getElementById('btn-prev-day');
            const btnNext = document.getElementById('btn-next-day');
            btnPrev.disabled = true;
            btnNext.disabled = true;
            document.getElementById('current-day-label').textContent = 'Loading...';

            let queryStart, queryEnd;
            if (direction === 'next') {
                queryStart = new Date(window.globalStartDate);
                queryStart.setDate(queryStart.getDate() + window.globalDaysToShow);
                queryEnd = new Date(queryStart);
                window.globalDaysToShow += 1;
            } else {
                queryEnd = new Date(window.globalStartDate);
                queryEnd.setDate(queryEnd.getDate() - 1);
                queryStart = new Date(queryEnd);
                window.globalStartDate = queryStart;
                window.globalDaysToShow += 1;
            }

            const startStr = queryStart.toISOString().split('T')[0];
            const endStr = queryEnd.toISOString().split('T')[0];

            try {
                const res = await fetch(`${apiBase}api/schedule?start_date=${startStr}&end_date=${endStr}`);
                if (res.ok) {
                    const data = await res.json();

                    // Merge events
                    const existingIds = new Set(scheduleData.events.map(e => e.id));
                    (data.events || []).forEach(e => {
                        if (!existingIds.has(e.id)) scheduleData.events.push(e);
                    });

                    // Merge assignments and edges
                    if (data.assignments) {
                        Object.assign(scheduleData.assignments, data.assignments);
                    }
                    if (data.ghost_assignments) {
                        Object.assign(scheduleData.ghost_assignments, data.ghost_assignments);
                    }
                    if (data.initial_edges) {
                        for (const dId in data.initial_edges) {
                            if (!scheduleData.initial_edges[dId]) scheduleData.initial_edges[dId] = {};
                            Object.assign(scheduleData.initial_edges[dId], data.initial_edges[dId]);
                        }
                    }
                    if (data.route_edges) {
                        for (const dId in data.route_edges) {
                            if (!scheduleData.route_edges[dId]) scheduleData.route_edges[dId] = {};
                            Object.assign(scheduleData.route_edges[dId], data.route_edges[dId]);
                        }
                    }
                    if (data.final_edges) {
                        for (const dId in data.final_edges) {
                            if (!scheduleData.final_edges[dId]) scheduleData.final_edges[dId] = {};
                            Object.assign(scheduleData.final_edges[dId], data.final_edges[dId]);
                        }
                    }
                    if (data.driver_events) {
                        for (const dId in data.driver_events) {
                            if (!scheduleData.driver_events[dId]) scheduleData.driver_events[dId] = [];
                            scheduleData.driver_events[dId] = [...new Set([...scheduleData.driver_events[dId], ...data.driver_events[dId]])];
                        }
                    }
                    if (data.scheduled_errands) {
                        const existingErrandIds = new Set((scheduleData.scheduled_errands || []).map(e => e.id));
                        if (!scheduleData.scheduled_errands) scheduleData.scheduled_errands = [];
                        data.scheduled_errands.forEach(e => {
                            if (!existingErrandIds.has(e.id)) scheduleData.scheduled_errands.push(e);
                        });
                    }

                    buildTimeline();

                    // Restore scroll position
                    const container = document.getElementById('days-container');
                    if (direction === 'next') {
                        activeDateIndex++;
                        const paneWidth = container.clientWidth;
                        container.scrollTo({ left: activeDateIndex * paneWidth, behavior: 'instant' });
                    } else {
                        // The entire timeline shifted right by 1, so our activeDateIndex is now +1
                        // We want to move to the newly inserted day at index 0, which means we do nothing to activeDateIndex but scroll left
                        // Wait, buildTimeline resets container scroll to 0?
                        // Let's just rely on prevDay scroll behavior.
                        // Actually, just let activeDateIndex be 0 (since we swiped left to the new day)
                        activeDateIndex = 0;
                        container.scrollTo({ left: 0, behavior: 'instant' });
                    }
                }
            } catch (err) {
                console.error(err);
            } finally {
                btnPrev.disabled = false;
                btnNext.disabled = false;
                updateHeaderDate();
            }
        }

        function prevDay() {
            if (activeDateIndex > 0) {
                const container = document.getElementById('days-container');
                const paneWidth = container.clientWidth;
                container.scrollBy({ left: -paneWidth, behavior: 'smooth' });
            } else {
                fetchMoreDays('prev');
            }
        }

        function nextDay() {
            if (activeDateIndex < currentDates.length - 1) {
                const container = document.getElementById('days-container');
                const paneWidth = container.clientWidth;
                container.scrollBy({ left: paneWidth, behavior: 'smooth' });
            } else {
                fetchMoreDays('next');
            }
        }

        window.onload = () => {
            init();

            // Check for navigation URL parameters
            const params = new URLSearchParams(window.location.search);
            const navDest = params.get('navigate_dest');
            if (navDest) {
                const navTitle = params.get('navigate_title') || 'Navigation';
                const navLeg = params.get('navigate_leg') || null;
                setTimeout(() => {
                    openActionSheet('', navDest, navTitle, null, navLeg);
                }, 500); // Give UI time to render

                // Clean up the URL so it doesn't pop up again on refresh
                window.history.replaceState({}, document.title, window.location.pathname);
            }
        };

        // Listen for real-time updates from the backend
        const evtSource = new EventSource("/api/stream");
        evtSource.onmessage = function (event) {
            if (event.data === "update") {
                if (selectedDriverId) {
                    fetchSchedule(false, true);
                }
            }
        };
    </script>
