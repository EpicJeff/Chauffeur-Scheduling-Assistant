<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Driver App</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        gray: {
                            950: '#0a0a0a',
                            900: '#171717',
                            800: '#262626',
                            700: '#404040',
                            600: '#525252',
                        }
                    }
                }
            }
        }
    </script>
    <style>
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        .snap-x-mandatory { scroll-snap-type: x mandatory; }
        .snap-center { scroll-snap-align: center; }
        body { -webkit-tap-highlight-color: transparent; }
    </style>
</head>
<body class="bg-gray-950 text-gray-100 font-sans h-screen flex flex-col overflow-hidden">

    <!-- Header -->
    <header class="bg-gray-900 border-b border-gray-800 p-4 flex items-center justify-between shrink-0 shadow-md relative z-20">
        <div class="flex items-center gap-3">
            <div id="driver-avatar" class="w-10 h-10 rounded-full flex items-center justify-center font-bold text-lg shadow-sm border-2 border-gray-700 bg-gray-800 text-gray-500">?</div>
            <div class="flex flex-col">
                <h1 id="driver-name" class="text-lg font-bold text-white leading-tight">Select Driver</h1>
                <span id="date-subtitle" class="text-xs text-blue-400 font-medium tracking-wide uppercase">Today</span>
            </div>
        </div>
        <div class="flex items-center gap-2">
            <button id="btn-sync" onclick="fetchData()" class="p-2 rounded-full bg-gray-800 text-gray-300 hover:text-white transition-colors">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
            </button>
            <button id="btn-switch-driver" onclick="clearDriver()" class="p-2 rounded-full bg-gray-800 text-gray-300 hover:text-white transition-colors hidden">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path></svg>
            </button>
        </div>
    </header>

    <!-- Driver Selection Screen -->
    <div id="screen-select-driver" class="flex-1 flex flex-col p-6 overflow-y-auto">
        <h2 class="text-2xl font-black mb-6 text-center text-white drop-shadow-sm">Who's Driving?</h2>
        <div id="driver-list" class="flex flex-col gap-4">
            <p class="text-center text-gray-500 animate-pulse">Loading drivers...</p>
        </div>
    </div>

    <!-- Main Schedule Screen -->
    <div id="screen-schedule" class="flex-1 flex flex-col hidden overflow-hidden relative">
        
        <!-- Day Navigation -->
        <div class="flex items-center justify-between px-4 py-3 bg-gray-900 border-b border-gray-800 shrink-0 z-10 shadow-sm">
            <button onclick="prevDay()" class="p-2 rounded-full bg-gray-800 text-gray-300 active:bg-gray-700 disabled:opacity-30 disabled:active:bg-gray-800 transition-colors" id="btn-prev-day">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M15 19l-7-7 7-7"></path></svg>
            </button>
            <div id="current-day-label" class="font-bold text-center text-white tracking-wide text-lg drop-shadow-md">Loading...</div>
            <button onclick="nextDay()" class="p-2 rounded-full bg-gray-800 text-gray-300 active:bg-gray-700 disabled:opacity-30 disabled:active:bg-gray-800 transition-colors" id="btn-next-day">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M9 5l7 7-7 7"></path></svg>
            </button>
        </div>

        <!-- Schedule Container (Swipeable) -->
        <div id="days-container" class="flex-1 flex overflow-x-auto snap-x-mandatory no-scrollbar scroll-smooth relative">
            <!-- Day panes injected here -->
        </div>
    </div>

    <!-- Action Sheet Modal -->
    <div id="action-sheet" class="fixed inset-0 z-50 hidden flex-col justify-end bg-black/60 backdrop-blur-sm transition-opacity opacity-0">
        <div id="action-sheet-content" class="bg-gray-900 rounded-t-2xl p-6 w-full transform translate-y-full transition-transform duration-300 shadow-[0_-10px_40px_rgba(0,0,0,0.5)]">
            <div class="w-12 h-1.5 bg-gray-700 rounded-full mx-auto mb-6"></div>
            <h3 class="text-xl font-bold mb-4 text-white" id="sheet-title">Open in Maps</h3>
            <p class="text-sm text-gray-400 mb-6 font-medium" id="sheet-subtitle"></p>
            <div class="flex flex-col gap-3">
                <button onclick="openMaps('google')" class="w-full flex items-center justify-center gap-3 py-4 rounded-xl bg-blue-600 active:bg-blue-700 text-white font-bold text-lg shadow-lg">
                    <svg class="w-6 h-6" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5a2.5 2.5 0 010-5 2.5 2.5 0 010 5z"/></svg>
                    Google Maps
                </button>
                <button onclick="openMaps('apple')" class="w-full flex items-center justify-center gap-3 py-4 rounded-xl bg-gray-800 border border-gray-700 active:bg-gray-700 text-white font-bold text-lg shadow-lg">
                    <svg class="w-6 h-6" viewBox="0 0 24 24" fill="currentColor"><path d="M17.05 20.28c-.98.95-2.05.8-3.08.35-1.09-.46-2.09-.48-3.24 0-1.44.62-2.2.44-3.06-.35C2.79 15.25 3.51 7.59 9.05 7.31c1.35.05 2.46.82 3.12.82.68 0 2.05-.92 3.57-.79 1.45.05 2.56.59 3.26 1.48-2.61 1.63-2.18 4.7.42 5.59-.62 1.77-1.48 3.32-2.37 4.22v1.65zM12.03 7.25c-.15-2.23 1.66-4.07 3.74-4.25.29 2.58-2.02 4.45-3.74 4.25z"/></svg>
                    Apple Maps
                </button>
                <button onclick="openMaps('waze')" class="w-full flex items-center justify-center gap-3 py-4 rounded-xl bg-cyan-600 active:bg-cyan-700 text-white font-bold text-lg shadow-lg">
                    <svg class="w-6 h-6" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1.5 13a1.5 1.5 0 110-3 1.5 1.5 0 010 3zm5 0a1.5 1.5 0 110-3 1.5 1.5 0 010 3zm-2.5-6.5a4 4 0 00-4 4h-2c0-3.31 2.69-6 6-6v2z"/></svg>
                    Waze
                </button>
                <button onclick="closeActionSheet()" class="w-full py-4 mt-2 rounded-xl bg-transparent text-gray-400 active:text-white font-bold text-lg">
                    Cancel
                </button>
            </div>
        </div>
    </div>

    <script>
        let driversData = [];
        let scheduleData = null;
        let selectedDriverId = localStorage.getItem('chauffeur_driver_id');
        let currentDates = [];
        let activeDateIndex = 0;
        let routeContext = null;

        async function init() {
            await fetchDrivers();
            if (selectedDriverId && driversData.find(d => d.id === selectedDriverId)) {
                selectDriver(selectedDriverId);
            } else {
                showDriverSelection();
            }
        }

        async function fetchDrivers() {
            try {
                const res = await fetch('api/drivers');
                const data = await res.json();
                driversData = data.filter(d => !d.is_disabled);
            } catch (e) {
                console.error("Failed to fetch drivers", e);
            }
        }

        function showDriverSelection() {
            document.getElementById('screen-schedule').classList.add('hidden');
            document.getElementById('btn-switch-driver').classList.add('hidden');
            document.getElementById('screen-select-driver').classList.remove('hidden');
            
            document.getElementById('driver-name').textContent = "Select Driver";
            document.getElementById('date-subtitle').textContent = "Chauffeur App";
            document.getElementById('driver-avatar').textContent = "?";
            document.getElementById('driver-avatar').style.borderColor = "#374151";
            document.getElementById('driver-avatar').style.color = "#6B7280";

            const list = document.getElementById('driver-list');
            if (driversData.length === 0) {
                list.innerHTML = "<p class='text-center text-gray-500'>No drivers configured.</p>";
                return;
            }

            list.innerHTML = driversData.map(d => `
                <button onclick="selectDriver('${d.id}')" class="flex items-center gap-4 p-4 rounded-2xl bg-gray-900 border border-gray-800 active:bg-gray-800 active:border-gray-700 transition-all shadow-lg text-left w-full">
                    <div class="w-14 h-14 rounded-full flex items-center justify-center font-black text-2xl border-4 shadow-inner bg-gray-800" style="border-color: ${d.color_code}; color: ${d.color_code}">
                        ${d.name.charAt(0).toUpperCase()}
                    </div>
                    <div>
                        <div class="text-xl font-bold text-white">${d.name}</div>
                        <div class="text-sm text-gray-400 font-medium">${d.group} driver</div>
                    </div>
                </button>
            `).join('');
        }

        async function selectDriver(driverId) {
            selectedDriverId = driverId;
            localStorage.setItem('chauffeur_driver_id', driverId);
            
            const d = driversData.find(d => d.id === driverId);
            if (d) {
                document.getElementById('driver-name').textContent = d.name;
                document.getElementById('driver-avatar').textContent = d.name.charAt(0).toUpperCase();
                document.getElementById('driver-avatar').style.borderColor = d.color_code;
                document.getElementById('driver-avatar').style.color = d.color_code;
            }

            document.getElementById('screen-select-driver').classList.add('hidden');
            document.getElementById('screen-schedule').classList.remove('hidden');
            document.getElementById('btn-switch-driver').classList.remove('hidden');
            
            await fetchData();
        }

        function clearDriver() {
            selectedDriverId = null;
            localStorage.removeItem('chauffeur_driver_id');
            showDriverSelection();
        }

        async function fetchData() {
            const btnSync = document.getElementById('btn-sync');
            btnSync.classList.add('animate-spin');
            
            try {
                const res = await fetch('api/schedule');
                scheduleData = await res.json();
                buildTimeline();
            } catch (e) {
                console.error("Failed to fetch schedule", e);
                document.getElementById('days-container').innerHTML = `<div class="w-full flex items-center justify-center text-red-400">Failed to load data</div>`;
            } finally {
                setTimeout(() => btnSync.classList.remove('animate-spin'), 500);
            }
        }

        function formatTime(isoStr) {
            return new Date(isoStr).toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
        }
        
        function formatDuration(mins) {
            if (mins < 60) return `${mins}m`;
            const h = Math.floor(mins/60);
            const m = mins % 60;
            return m > 0 ? `${h}h ${m}m` : `${h}h`;
        }

        function openActionSheet(origin, destination, legTitle, waypoint = null) {
            routeContext = { origin, destination, waypoint };
            document.getElementById('sheet-subtitle').textContent = legTitle;
            
            const sheet = document.getElementById('action-sheet');
            const content = document.getElementById('action-sheet-content');
            sheet.classList.remove('hidden');
            sheet.style.display = 'flex';
            
            // Trigger reflow
            void sheet.offsetWidth;
            
            sheet.classList.remove('opacity-0');
            content.classList.remove('translate-y-full');
        }

        function closeActionSheet() {
            const sheet = document.getElementById('action-sheet');
            const content = document.getElementById('action-sheet-content');
            
            sheet.classList.add('opacity-0');
            content.classList.add('translate-y-full');
            
            setTimeout(() => {
                sheet.classList.add('hidden');
                sheet.style.display = 'none';
                routeContext = null;
            }, 300);
        }

        function openMaps(provider) {
            if (!routeContext) return;
            const { origin, destination, waypoint } = routeContext;
            const originEnc = encodeURIComponent(origin);
            const destEnc = encodeURIComponent(destination);
            const waypointEnc = waypoint ? `&waypoints=${encodeURIComponent(waypoint)}` : '';
            let url = '';
            if (provider === 'google') {
                url = `https://www.google.com/maps/dir/?api=1&origin=${originEnc}&destination=${destEnc}${waypointEnc}`;
            } else if (provider === 'apple') {
                // Apple Maps officially supports multiple daddr in iOS 16+ for multi-stop
                const appleWaypoints = waypoint ? `&daddr=${encodeURIComponent(waypoint)}&daddr=${destEnc}` : `&daddr=${destEnc}`;
                url = `http://maps.apple.com/?saddr=${originEnc}${appleWaypoints}`;
            } else if (provider === 'waze') {
                // Waze does not support multi-stop routing via URL. 
                // Route to the waypoint (pickup) first if it exists, otherwise final destination.
                const wazeDest = waypoint ? encodeURIComponent(waypoint) : destEnc;
                url = `https://waze.com/ul?q=${wazeDest}&navigate=yes`;
                if (waypoint) {
                    alert("Waze does not support multi-stop routes. Routing to your first stop (the Pickup/Dropoff).");
                }
            }
            
            closeActionSheet();
            window.open(url, '_blank');
        }

        function buildTimeline() {
            const container = document.getElementById('days-container');
            const dId = selectedDriverId;
            if (!scheduleData || !dId) return;

            const { events, assignments, ghost_assignments, route_edges, initial_edges, final_edges } = scheduleData;
            
            const myEvents = events.filter(ev => {
                const assigned = (assignments && assignments[ev.id]) || (ghost_assignments && ghost_assignments[ev.id]);
                if (assigned === dId) return true;
                if (scheduleData.driver_events && scheduleData.driver_events[dId] && scheduleData.driver_events[dId].includes(ev.id)) return true;
                return false;
            });

            const byDate = {};
            myEvents.forEach(ev => {
                const dStr = new Date(ev.start).toLocaleDateString('en-CA');
                if (!byDate[dStr]) byDate[dStr] = [];
                byDate[dStr].push(ev);
            });

            currentDates = [];
            let startDate = new Date();
            startDate.setHours(0,0,0,0);
            
            const sortedAvailableDates = Object.keys(byDate).sort();
            if (sortedAvailableDates.length > 0) {
                const firstEvDate = new Date(sortedAvailableDates[0] + 'T00:00:00');
                if (firstEvDate > startDate) {
                    startDate = firstEvDate;
                }
            }

            const daysToShow = scheduleData.settings ? scheduleData.settings.days_to_show : 7;
            for (let i=0; i<daysToShow; i++) {
                const d = new Date(startDate);
                d.setDate(d.getDate() + i);
                currentDates.push(d.toLocaleDateString('en-CA'));
            }

            container.innerHTML = '';
            
            currentDates.forEach((dateStr, index) => {
                const evs = byDate[dateStr] || [];
                evs.sort((a, b) => new Date(a.start) - new Date(b.start));

                const pane = document.createElement('div');
                pane.className = "min-w-full w-full h-full snap-center overflow-y-auto px-4 py-6";
                pane.id = `pane-${index}`;

                if (evs.length === 0) {
                    pane.innerHTML = `
                        <div class="flex flex-col items-center justify-center h-full opacity-50 text-center">
                            <div class="text-6xl mb-4">☕</div>
                            <h3 class="text-xl font-bold mb-2">No Drives Scheduled</h3>
                            <p class="text-gray-400">Enjoy your free time!</p>
                        </div>
                    `;
                    container.appendChild(pane);
                    return;
                }

                let html = '<div class="flex flex-col relative before:absolute before:left-[19px] before:top-4 before:bottom-4 before:w-1 before:bg-gray-800 before:z-0">';
                
                const driverConfig = driversData.find(d => d.id === dId) || {};
                const globalHome = scheduleData.home_location || '';
                
                evs.forEach((ev, evIdx) => {
                    const isDriverOnly = !(assignments && assignments[ev.id]) && !(ghost_assignments && ghost_assignments[ev.id]);
                    
                    // --- Initial Edge ---
                    if (evIdx === 0 && !isDriverOnly) {
                        const edge = initial_edges[ev.id];
                        if (edge && edge.travel_mins > 0) {
                            const originLocation = driverConfig.home_location || globalHome;
                            const destinationLocation = ev.location;
                            const waypointLocation = edge.pickup_waypoint ? globalHome : null;
                            const depTime = new Date(new Date(ev.start).getTime() - (edge.travel_mins + 5) * 60000);
                            
                            let destStr = edge.pickup_waypoint ? "Pickup" : ev.location;
                            const titleStr = `${formatTime(depTime.toISOString())} - Drive to ${destStr}`;
                            
                            let openActionArgs = `'${originLocation.replace(/'/g, "\\'")}', '${destinationLocation.replace(/'/g, "\\'")}', '${titleStr.replace(/'/g, "\\'")}'`;
                            if (waypointLocation) openActionArgs += `, '${waypointLocation.replace(/'/g, "\\'")}'`;

                            html += `
                                <div class="flex items-start mb-6 relative z-10 group cursor-pointer" onclick="openActionSheet(${openActionArgs})">
                                    <div class="w-10 h-10 rounded-full bg-blue-900 border-4 border-gray-950 flex items-center justify-center shrink-0 shadow-md text-blue-300">
                                        <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 24 24"><path d="M18.92 6.01C18.72 5.42 18.16 5 17.5 5h-11c-.66 0-1.21.42-1.42 1.01L3 12v8c0 .55.45 1 1 1h1c.55 0 1-.45 1-1v-1h12v1c0 .55.45 1 1 1h1c.55 0 1-.45 1-1v-8l-2.08-5.99zM6.85 7h10.29l1.08 3.11H5.77L6.85 7zM19 17H5v-5h14v5zM7.5 16c.83 0 1.5-.67 1.5-1.5S8.33 13 7.5 13 6 13.67 6 14.5 6.67 16 7.5 16z"/></svg>
                                    </div>
                                    <div class="ml-4 flex-1 bg-gray-900 border border-gray-800 rounded-xl p-4 shadow-sm active:bg-gray-800 transition-colors">
                                        <div class="text-sm font-bold text-blue-400 mb-1 uppercase tracking-wider">Leave at ${formatTime(depTime.toISOString())}</div>
                                        <div class="text-white font-medium text-lg leading-tight mb-2">Drive to ${destStr}</div>
                                        <div class="flex items-center text-xs font-mono text-gray-400 bg-gray-950 inline-flex px-2 py-1 rounded">
                                            <span class="text-blue-500">${formatDuration(edge.travel_mins)}</span>
                                            ${edge.delay_mins > 3 ? `<span class="ml-2 text-yellow-500 font-bold">⚠ +${edge.delay_mins}m</span>` : ''}
                                        </div>
                                    </div>
                                </div>
                            `;
                        }
                    }

                    // --- Event ---
                    let bgColor = isDriverOnly ? 'bg-gray-800/50 border-gray-700 border-dashed border' : 'bg-gray-800 border-gray-700 border';
                    let titleClass = isDriverOnly ? 'text-gray-400' : 'text-white';
                    
                    html += `
                        <div class="flex items-start mb-6 relative z-10">
                            <div class="w-10 h-10 rounded-full bg-gray-700 border-4 border-gray-950 flex items-center justify-center shrink-0 shadow-md text-white font-bold text-xs" style="background-color: ${driverConfig.color_code || '#4a5568'}">
                                ${formatTime(ev.start).split(':')[0]}
                            </div>
                            <div class="ml-4 flex-1 ${bgColor} rounded-xl p-4 shadow-sm">
                                <div class="text-sm font-bold text-gray-400 mb-1">${formatTime(ev.start)} - ${formatTime(ev.end)}</div>
                                <div class="${titleClass} font-bold text-xl leading-tight mb-2">${ev.title}</div>
                                ${ev.location ? `<div class="text-sm text-gray-500 flex items-start gap-1"><svg class="w-4 h-4 shrink-0 mt-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"></path></svg><span class="break-words line-clamp-2">${ev.location}</span></div>` : ''}
                            </div>
                        </div>
                    `;

                    // --- Routing Edge ---
                    if (!isDriverOnly && evIdx < evs.length - 1 && route_edges[ev.id]) {
                        const edge = route_edges[ev.id];
                        const nextEv = evs[evIdx + 1];
                        
                        let computedOrigin = ev.location;
                        const destinationLocation = nextEv.location;
                        const waypointLocation = edge.home_waypoint ? globalHome : null;

                        let destStr = nextEv.location ? nextEv.location.split(',')[0] : 'Next Event';
                        const titleStr = `${formatTime(ev.end)} - Drive to ${destStr}`;
                        
                        let openActionArgs = `'${(computedOrigin || '').replace(/'/g, "\\'")}', '${(destinationLocation || '').replace(/'/g, "\\'")}', '${titleStr.replace(/'/g, "\\'")}'`;
                        if (waypointLocation) openActionArgs += `, '${waypointLocation.replace(/'/g, "\\'")}'`;

                        html += `
                            <div class="flex items-start mb-6 relative z-10 group cursor-pointer" onclick="openActionSheet(${openActionArgs})">
                                <div class="w-10 h-10 rounded-full bg-blue-900 border-4 border-gray-950 flex items-center justify-center shrink-0 shadow-md text-blue-300">
                                    <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 24 24"><path d="M18.92 6.01C18.72 5.42 18.16 5 17.5 5h-11c-.66 0-1.21.42-1.42 1.01L3 12v8c0 .55.45 1 1 1h1c.55 0 1-.45 1-1v-1h12v1c0 .55.45 1 1 1h1c.55 0 1-.45 1-1v-8l-2.08-5.99zM6.85 7h10.29l1.08 3.11H5.77L6.85 7zM19 17H5v-5h14v5zM7.5 16c.83 0 1.5-.67 1.5-1.5S8.33 13 7.5 13 6 13.67 6 14.5 6.67 16 7.5 16z"/></svg>
                                </div>
                                <div class="ml-4 flex-1 bg-gray-900 border border-gray-800 rounded-xl p-4 shadow-sm active:bg-gray-800 transition-colors">
                                    <div class="text-sm font-bold text-blue-400 mb-1 uppercase tracking-wider">Leave at ${formatTime(ev.end)}</div>
                                    <div class="text-white font-medium text-lg leading-tight mb-2">Drive to ${destStr}</div>
                                    <div class="flex items-center text-xs font-mono text-gray-400 bg-gray-950 inline-flex px-2 py-1 rounded">
                                        <span class="text-blue-500">${formatDuration(edge.travel_mins)}</span>
                                        ${edge.delay_mins > 3 ? `<span class="ml-2 text-yellow-500 font-bold">⚠ +${edge.delay_mins}m</span>` : ''}
                                    </div>
                                </div>
                            </div>
                        `;
                    }

                    // --- Final Edge ---
                    if (evIdx === evs.length - 1 && !isDriverOnly) {
                        const edge = final_edges[ev.id];
                        if (edge && edge.travel_mins > 0) {
                            const arriveDate = new Date(new Date(ev.end).getTime() + edge.travel_mins * 60000);
                            const originLocation = ev.location;
                            const destinationLocation = driverConfig.home_location || globalHome;
                            const waypointLocation = edge.dropoff_waypoint ? globalHome : null;
                            
                            let destStr = edge.dropoff_waypoint ? "Home via Dropoff" : "Home";
                            const titleStr = `${formatTime(ev.end)} - Drive to ${destStr}`;
                            
                            let openActionArgs = `'${(originLocation || '').replace(/'/g, "\\'")}', '${(destinationLocation || '').replace(/'/g, "\\'")}', '${titleStr.replace(/'/g, "\\'")}'`;
                            if (waypointLocation) openActionArgs += `, '${waypointLocation.replace(/'/g, "\\'")}'`;

                            html += `
                                <div class="flex items-start mb-6 relative z-10 group cursor-pointer" onclick="openActionSheet(${openActionArgs})">
                                    <div class="w-10 h-10 rounded-full bg-green-900 border-4 border-gray-950 flex items-center justify-center shrink-0 shadow-md text-green-300">
                                        <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
                                    </div>
                                    <div class="ml-4 flex-1 bg-gray-900 border border-gray-800 rounded-xl p-4 shadow-sm active:bg-gray-800 transition-colors">
                                        <div class="text-sm font-bold text-green-400 mb-1 uppercase tracking-wider">Arrive by ${formatTime(arriveDate.toISOString())}</div>
                                        <div class="text-white font-medium text-lg leading-tight mb-2">Drive ${destStr}</div>
                                        <div class="flex items-center text-xs font-mono text-gray-400 bg-gray-950 inline-flex px-2 py-1 rounded">
                                            <span class="text-green-500">${formatDuration(edge.travel_mins)}</span>
                                            ${edge.delay_mins > 3 ? `<span class="ml-2 text-yellow-500 font-bold">⚠ +${edge.delay_mins}m</span>` : ''}
                                        </div>
                                    </div>
                                </div>
                            `;
                        }
                    }
                });

                html += '</div>';
                pane.innerHTML = html;
                container.appendChild(pane);
            });

            updateHeaderDate();

            // Set up scroll snapping logic
            container.addEventListener('scroll', () => {
                const scrollLeft = container.scrollLeft;
                const paneWidth = container.clientWidth;
                const idx = Math.round(scrollLeft / paneWidth);
                if (idx !== activeDateIndex) {
                    activeDateIndex = idx;
                    updateHeaderDate();
                }
            });
        }

        function updateHeaderDate() {
            if (currentDates.length === 0) return;
            const dStr = currentDates[activeDateIndex];
            
            const today = new Date();
            const tomorrow = new Date();
            tomorrow.setDate(today.getDate() + 1);
            
            const todayStr = today.toLocaleDateString('en-CA');
            const tomorrowStr = tomorrow.toLocaleDateString('en-CA');
            
            let label = "";
            let subLabel = "";
            const options = { weekday: 'long', month: 'short', day: 'numeric' };
            const dDate = new Date(dStr + 'T12:00:00');
            
            if (dStr === todayStr) {
                label = "Today";
            } else if (dStr === tomorrowStr) {
                label = "Tomorrow";
            } else {
                label = dDate.toLocaleDateString(undefined, options);
            }
            
            document.getElementById('current-day-label').textContent = label;
            document.getElementById('date-subtitle').textContent = dDate.toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
            
            document.getElementById('btn-prev-day').disabled = activeDateIndex === 0;
            document.getElementById('btn-next-day').disabled = activeDateIndex === currentDates.length - 1;
        }

        function prevDay() {
            if (activeDateIndex > 0) {
                const container = document.getElementById('days-container');
                const paneWidth = container.clientWidth;
                container.scrollBy({ left: -paneWidth, behavior: 'smooth' });
            }
        }

        function nextDay() {
            if (activeDateIndex < currentDates.length - 1) {
                const container = document.getElementById('days-container');
                const paneWidth = container.clientWidth;
                container.scrollBy({ left: paneWidth, behavior: 'smooth' });
            }
        }

        window.onload = init;
    </script>
</body>
</html>
