<!DOCTYPE html>
<html lang="en" class="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Driver App</title>
    <link rel="manifest" href="static/manifest.json">
    <link rel="icon" type="image/png" href="static/icon-192.png">
    <link rel="apple-touch-icon" href="static/icon-192.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Chauffeur">
    <meta name="theme-color" content="#171717">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        gray: {
                            950: '#0a0a0a',
                            900: '#171717',
                            800: '#262626',
                            700: '#404040',
                            600: '#525252',
                        }
                    }
                }
            }
        }
    </script>
    <style>
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }

        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        .snap-x-mandatory {
            scroll-snap-type: x mandatory;
        }

        .snap-center {
            scroll-snap-align: center;
        }

        body {
            -webkit-tap-highlight-color: transparent;
        }
    </style>
</head>

<body class="bg-gray-950 text-gray-100 font-sans h-screen flex flex-col overflow-hidden">

    <!-- Header -->
    <header
        class="bg-gray-900 border-b border-gray-800 p-4 flex items-center justify-between shrink-0 shadow-md relative z-20">
        <div class="flex items-center gap-3">
            <div id="driver-avatar"
                class="w-10 h-10 rounded-full flex items-center justify-center font-bold text-lg shadow-sm border-2 border-gray-700 bg-gray-800 text-gray-500">
                ?</div>
            <div class="flex flex-col">
                <h1 id="driver-name" class="text-lg font-bold text-white leading-tight">Select Driver</h1>
                <span id="date-subtitle" class="text-xs text-blue-400 font-medium tracking-wide uppercase">Today</span>
            </div>
        </div>
        <div class="flex items-center gap-2">
            <button id="btn-push" onclick="enableNotifications()"
                class="p-2 rounded-full bg-blue-800 text-blue-200 hover:text-white transition-colors relative hidden"
                title="Enable Push Notifications">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9">
                    </path>
                </svg>
                <span
                    class="absolute top-0 right-0 transform translate-x-1/4 -translate-y-1/4 bg-blue-500 rounded-full w-2 h-2 animate-ping"></span>
                <span
                    class="absolute top-0 right-0 transform translate-x-1/4 -translate-y-1/4 bg-blue-500 rounded-full w-2 h-2"></span>
            </button>
            <button id="btn-notif" onclick="toggleNotifications()"
                class="p-2 rounded-full bg-gray-800 text-gray-300 hover:text-white transition-colors relative hidden">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9">
                    </path>
                </svg>
                <span id="notif-badge"
                    class="absolute top-0 right-0 transform translate-x-1/4 -translate-y-1/4 bg-red-500 text-white text-[10px] font-bold px-1.5 py-0.5 rounded-full hidden">0</span>
            </button>
            <button id="btn-sync" onclick="fetchSchedule(true)"
                class="p-2 rounded-full bg-gray-800 text-gray-300 hover:text-white transition-colors">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15">
                    </path>
                </svg>
            </button>
            <button id="btn-switch-driver" onclick="clearDriver()"
                class="p-2 rounded-full bg-gray-800 text-gray-300 hover:text-white transition-colors hidden">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1">
                    </path>
                </svg>
            </button>
        </div>
    </header>

    <!-- Driver Selection Screen -->
    <div id="screen-select-driver" class="flex-1 flex flex-col p-6 overflow-y-auto">
        <h2 class="text-2xl font-black mb-6 text-center text-white drop-shadow-sm">Who's Driving?</h2>
        <div id="driver-list" class="flex flex-col gap-4">
            <p class="text-center text-gray-500 animate-pulse">Loading drivers...</p>
        </div>
    </div>

    <!-- Main Schedule Screen -->
    <div id="screen-schedule" class="flex-1 flex flex-col hidden overflow-hidden relative">

        <!-- Day Navigation -->
        <div id="day-nav"
            class="flex items-center justify-between px-4 py-3 bg-gray-900 border-b border-gray-800 shrink-0 z-10 shadow-sm">
            <button onclick="prevDay()"
                class="p-2 rounded-full bg-gray-800 text-gray-300 active:bg-gray-700 disabled:opacity-30 disabled:active:bg-gray-800 transition-colors"
                id="btn-prev-day">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M15 19l-7-7 7-7"></path>
                </svg>
            </button>
            <div id="current-day-label" class="font-bold text-center text-white tracking-wide text-lg drop-shadow-md">
                Loading...</div>
            <button onclick="nextDay()"
                class="p-2 rounded-full bg-gray-800 text-gray-300 active:bg-gray-700 disabled:opacity-30 disabled:active:bg-gray-800 transition-colors"
                id="btn-next-day">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M9 5l7 7-7 7"></path>
                </svg>
            </button>
        </div>

        <!-- Schedule Container (Swipeable) -->
        <div id="days-container"
            class="flex-1 flex overflow-x-auto snap-x-mandatory no-scrollbar scroll-smooth relative">
            <!-- Day panes injected here -->
        </div>

        <!-- Messages (family chat) -->
        <div id="messages-container" class="flex-1 flex-col min-h-0 relative" style="display: none">
            <div id="channel-list" class="flex-1 overflow-y-auto p-4 space-y-2"></div>
            <div id="thread-view" class="absolute inset-0 bg-gray-950 flex-col z-20" style="display: none">
                <div class="flex items-center gap-3 p-3 border-b border-gray-800 bg-gray-900 shrink-0">
                    <button onclick="closeThread()"
                        class="p-2 rounded-full bg-gray-800 text-gray-300 active:bg-gray-700">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M15 19l-7-7 7-7">
                            </path>
                        </svg>
                    </button>
                    <div id="thread-title" class="font-bold text-white text-lg truncate">Chat</div>
                </div>
                <div id="thread-messages" class="flex-1 overflow-y-auto p-4 flex flex-col gap-2"></div>
                <form id="thread-form" onsubmit="submitThreadMessage(event)"
                    class="p-3 bg-gray-900 border-t border-gray-800 flex gap-2 shrink-0"
                    style="padding-bottom: max(0.75rem, env(safe-area-inset-bottom))">
                    <input id="thread-input" type="text" autocomplete="off" placeholder="Message..."
                        class="flex-1 bg-gray-800 border border-gray-600 rounded-full px-4 py-2.5 text-white placeholder-gray-500 focus:outline-none focus:border-blue-500">
                    <button type="submit"
                        class="bg-blue-600 active:bg-blue-700 text-white font-bold px-5 rounded-full shrink-0">Send</button>
                </form>
            </div>
        </div>

        <!-- Family Map -->
        <div id="map-container" class="flex-1 flex-col min-h-0 relative" style="display: none">
            {% include 'components/family_map.html' %}
        </div>

        <!-- Bottom Tab Bar -->
        <div class="flex bg-gray-900 border-t border-gray-800 shrink-0 z-10 shadow-[0_-4px_12px_rgba(0,0,0,0.4)]"
            style="padding-bottom: env(safe-area-inset-bottom)">
            <button id="tab-drives" onclick="setView('drives')"
                class="flex-1 flex flex-col items-center gap-0.5 pt-2.5 pb-2 text-blue-400 transition-colors">
                <svg class="w-6 h-6" fill="currentColor" viewBox="0 0 24 24">
                    <path d="M18.92 6.01C18.72 5.42 18.16 5 17.5 5h-11c-.66 0-1.21.42-1.42 1.01L3 12v8c0 .55.45 1 1 1h1c.55 0 1-.45 1-1v-1h12v1c0 .55.45 1 1 1h1c.55 0 1-.45 1-1v-8l-2.08-5.99zM6.85 7h10.29l1.08 3.11H5.77L6.85 7zM19 17H5v-5h14v5zM7.5 16c.83 0 1.5-.67 1.5-1.5S8.33 13 7.5 13 6 13.67 6 14.5 6.67 16 7.5 16zm9 0c.83 0 1.5-.67 1.5-1.5S17.33 13 16.5 13 15 13.67 15 14.5s.67 1.5 1.5 1.5z"/>
                </svg>
                <span class="text-[11px] font-bold tracking-wide">My Drives</span>
            </button>
            <button id="tab-family" onclick="setView('family')"
                class="flex-1 flex flex-col items-center gap-0.5 pt-2.5 pb-2 text-gray-500 transition-colors">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round"
                        d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path>
                </svg>
                <span class="text-[11px] font-bold tracking-wide">Family</span>
            </button>
            <button id="tab-messages" onclick="setView('messages')"
                class="flex-1 flex flex-col items-center gap-0.5 pt-2.5 pb-2 text-gray-500 transition-colors relative">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round"
                        d="M8 10h.01M12 10h.01M16 10h.01M9 16H5a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v8a2 2 0 01-2 2h-5l-5 5v-5z"></path>
                </svg>
                <span class="text-[11px] font-bold tracking-wide">Messages</span>
                <span id="tab-messages-badge"
                    class="absolute top-1 right-1/2 translate-x-5 min-w-[18px] h-[18px] px-1 rounded-full bg-red-500 text-white text-[10px] font-bold items-center justify-center"
                    style="display: none">0</span>
            </button>
            <button id="tab-map" onclick="setView('map')"
                class="flex-1 flex flex-col items-center gap-0.5 pt-2.5 pb-2 text-gray-500 transition-colors">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round"
                        d="M9 20l-5.447-2.724A1 1 0 013 16.382V5.618a1 1 0 011.447-.894L9 7m0 13l6-3m-6 3V7m6 10l4.553 2.276A1 1 0 0021 18.382V7.618a1 1 0 00-.553-.894L15 4m0 13V4m0 0L9 7"></path>
                </svg>
                <span class="text-[11px] font-bold tracking-wide">Map</span>
            </button>
        </div>
    </div>

    <!-- Notifications Modal -->
    <div id="notif-modal"
        class="fixed inset-0 bg-black/60 z-50 hidden opacity-0 transition-opacity duration-300 flex flex-col justify-end">
        <div id="notif-modal-content"
            class="bg-gray-900 border-t border-gray-700 w-full rounded-t-2xl shadow-[0_-10px_40px_rgba(0,0,0,0.5)] transform translate-y-full transition-transform duration-300 p-6 flex flex-col h-[70vh]">
            <div class="flex justify-between items-center mb-6 shrink-0">
                <div class="flex justify-between items-center w-full pb-2 border-b border-gray-800">
                    <h2 class="text-xl font-bold text-white">Notifications</h2>
                    <button onclick="clearNotifications()"
                        class="text-sm font-bold text-red-400 bg-red-400/10 px-3 py-1 rounded-lg active:bg-red-400/20 transition-colors">Clear
                        All</button>
                </div>

                <button onclick="toggleNotifications()"
                    class="text-gray-400 hover:text-white bg-gray-800 rounded-full p-1.5"><svg class="w-5 h-5"
                        fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12">
                        </path>
                    </svg></button>
            </div>
            <button onclick="testPushNotification()"
                class="mb-4 shrink-0 w-full border-2 border-indigo-500/50 text-indigo-300 hover:bg-indigo-900/20 active:bg-indigo-600 active:text-white font-bold py-2.5 px-4 rounded-xl transition-colors text-sm">
                Send Test Push Notification</button>
            <div id="notif-list" class="flex-1 overflow-y-auto space-y-3 no-scrollbar pb-6">
                <p class="text-center text-gray-500 italic py-4">No recent notifications</p>
            </div>
        </div>
    </div>

    <!-- Action Sheet Modal -->
    <div id="action-sheet"
        class="fixed inset-0 z-50 hidden flex-col justify-end bg-black/60 backdrop-blur-sm transition-opacity opacity-0">
        <div id="action-sheet-content"
            class="bg-gray-900 rounded-t-2xl p-6 w-full transform translate-y-full transition-transform duration-300 shadow-[0_-10px_40px_rgba(0,0,0,0.5)]">
            <div class="w-12 h-1.5 bg-gray-700 rounded-full mx-auto mb-6"></div>
            <h3 class="text-xl font-bold mb-4 text-white" id="sheet-title">Open in Maps</h3>
            <p class="text-sm text-gray-400 mb-6 font-medium" id="sheet-subtitle"></p>
            <div id="sheet-state-1" class="flex flex-col gap-3">
                <button onclick="startDrive()" id="btn-start-drive"
                    class="w-full flex items-center justify-center gap-3 py-4 rounded-xl bg-blue-600 hover:bg-blue-500 active:bg-blue-700 text-white font-bold text-lg shadow-lg transition-colors">
                    <svg class="w-6 h-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>
                    Start Drive
                </button>
                <div id="mark-completed-separator" class="w-full h-px bg-gray-800 my-1"></div>
                <button onclick="markCompleted()" id="btn-mark-completed"
                    class="w-full flex items-center justify-center gap-3 py-4 rounded-xl border-2 border-green-600/50 hover:bg-green-900/20 active:bg-green-600 text-green-500 font-bold text-lg shadow-lg transition-colors">
                    <svg class="w-6 h-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5" /></svg>
                    Mark as Completed
                </button>
                <button onclick="closeActionSheet()"
                    class="w-full py-4 mt-2 rounded-xl bg-transparent text-gray-400 active:text-white font-bold text-lg">
                    Cancel
                </button>
            </div>

            <div id="sheet-state-2" class="flex flex-col gap-3 hidden">
                <button onclick="openMaps('google')"
                    class="w-full flex items-center justify-center gap-3 py-4 rounded-xl bg-blue-600 active:bg-blue-700 text-white font-bold text-lg shadow-lg">
                    <svg class="w-6 h-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path><circle cx="12" cy="10" r="3"></circle></svg>
                    Google Maps
                </button>
                <button onclick="openMaps('apple')"
                    class="w-full flex items-center justify-center gap-3 py-4 rounded-xl bg-gray-700 active:bg-gray-600 text-white font-bold text-lg shadow-lg">
                    <svg class="w-6 h-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"></path></svg>
                    Apple Maps
                </button>
                <button onclick="openMaps('waze')"
                    class="w-full flex items-center justify-center gap-3 py-4 rounded-xl bg-cyan-600 active:bg-cyan-700 text-white font-bold text-lg shadow-lg">
                    <svg class="w-6 h-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><path d="M8 14s1.5 2 4 2 4-2 4-2"></path><line x1="9" y1="9" x2="9.01" y2="9"></line><line x1="15" y1="9" x2="15.01" y2="9"></line></svg>
                    Waze
                </button>
                <button onclick="closeActionSheet()"
                    class="w-full py-4 mt-2 rounded-xl bg-transparent text-gray-400 active:text-white font-bold text-lg">
                    Cancel
                </button>
            </div>
        </div>
    </div>

    <script>
        const apiBase = window.location.pathname.endsWith('/') ? '../' : '';
        let driversData = [];
        let membersData = [];
        let scheduleData = null;
        let selectedDriverId = localStorage.getItem('chauffeur_driver_id');
        let selectedMemberId = localStorage.getItem('chauffeur_member_id');
        let currentDates = [];
        let activeDateIndex = 0;
        let routeContext = null;
        let currentView = localStorage.getItem('chauffeur_view') || 'drives';

        function setView(view, focusMemberId = null) {
            if (view === currentView && !focusMemberId) return;
            currentView = view;
            localStorage.setItem('chauffeur_view', view);
            updateTabBar();
            applyViewVisibility();
            if (view === 'messages') {
                fetchChannels();
            } else if (view === 'map') {
                initFamilyMap(focusMemberId);
                startFamilyMapPolling();
            } else {
                buildTimeline();
            }
            if (view !== 'map' && typeof stopFamilyMapPolling === 'function') stopFamilyMapPolling();
        }

        function applyViewVisibility() {
            const isMessages = currentView === 'messages';
            const isMap = currentView === 'map';
            document.getElementById('days-container').style.display = (isMessages || isMap) ? 'none' : 'flex';
            const nav = document.getElementById('day-nav');
            if (nav) nav.style.display = (isMessages || isMap) ? 'none' : 'flex';
            document.getElementById('messages-container').style.display = isMessages ? 'flex' : 'none';
            document.getElementById('map-container').style.display = isMap ? 'flex' : 'none';
        }

        function updateTabBar() {
            ['drives', 'family', 'messages', 'map'].forEach(v => {
                const tab = document.getElementById(`tab-${v}`);
                if (!tab) return;
                tab.classList.toggle('text-blue-400', v === currentView);
                tab.classList.toggle('text-gray-500', v !== currentView);
            });
        }

        function showGlobalAlert(msg) {
            let el = document.getElementById('global-alert');
            if (!el) {
                el = document.createElement('div');
                el.id = 'global-alert';
                el.className = 'fixed top-4 left-1/2 -translate-x-1/2 z-[70] bg-gray-800 border border-gray-600 text-white text-sm font-bold px-4 py-3 rounded-xl shadow-2xl max-w-[90vw] text-center transition-opacity duration-300 opacity-0 pointer-events-none';
                document.body.appendChild(el);
            }
            el.textContent = msg;
            clearTimeout(el._hideTimer);
            void el.offsetWidth;
            el.classList.remove('opacity-0');
            el._hideTimer = setTimeout(() => el.classList.add('opacity-0'), 3500);
        }

        async function init() {
            updateTabBar();
            applyViewVisibility();
            await fetchDrivers();
            await fetchMembers();
            if (selectedDriverId && driversData.find(d => d.id === selectedDriverId)) {
                await selectDriver(selectedDriverId);
                const params = new URLSearchParams(window.location.search);
                const openChannelParam = params.get('open_channel');
                if (openChannelParam && selectedMemberId) {
                    setView('messages');
                    openChannel(openChannelParam);
                } else if (params.get('view') === 'messages' && selectedMemberId) {
                    setView('messages');
                } else if (currentView === 'map') {
                    // restored from localStorage: setView() would early-return
                    initFamilyMap();
                    startFamilyMapPolling();
                }
            } else {
                showDriverSelection();
            }
        }

        async function fetchDrivers() {
            try {
                const res = await fetch(`${apiBase}api/drivers`);
                const data = await res.json();
                driversData = data.filter(d => !d.is_disabled);
            } catch (e) {
                console.error("Failed to fetch drivers", e);
            }
        }

        async function fetchMembers() {
            try {
                const res = await fetch(`${apiBase}api/members`);
                membersData = await res.json();
            } catch (e) {
                console.error("Failed to fetch members", e);
            }
        }

        // Member identity rides alongside the legacy driver identity: existing
        // endpoints still key on driver_id; member_id is the hub-level identity
        // (messaging, passenger views) introduced with the family refactor.
        function syncMemberIdentity(driverId) {
            const m = membersData.find(m => m.driver_id === driverId);
            if (m) {
                selectedMemberId = m.id;
                localStorage.setItem('chauffeur_member_id', m.id);
            }
        }

        // --- Family messaging ---
        let channelsData = [];
        let activeChannelId = null;
        let messagesStream = null;

        function connectMessagesStream() {
            if (!selectedMemberId) return;
            if (messagesStream) { try { messagesStream.close(); } catch (e) { } }
            messagesStream = new EventSource(`${apiBase}api/messages/stream?member_id=${selectedMemberId}`);
            messagesStream.onmessage = (e) => {
                try {
                    const data = JSON.parse(e.data);
                    if (activeChannelId && data.channel_id === activeChannelId && currentView === 'messages') {
                        refreshThread();
                    } else {
                        fetchChannels();
                    }
                } catch (err) { }
            };
            messagesStream.onerror = () => {
                if (messagesStream.readyState === EventSource.CLOSED) {
                    setTimeout(connectMessagesStream, 5000);
                }
            };
        }

        function mfEscape(s) {
            return String(s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;')
                .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
        }

        function channelDisplay(c) {
            if (c.kind === 'family') return { name: 'Family', color: '#3b82f6', avatar: '👨‍👩‍👧‍👦' };
            if (c.kind === 'event') return { name: c.title || 'Event chat', color: '#8b5cf6', avatar: '📅' };

        function urlB64ToUint8Array(base64String) {
            const padding = '='.repeat((4 - base64String.length % 4) % 4);
            const base64 = (base64String + padding).replace(/\-/g, '+').replace(/_/g, '/');
            const rawData = window.atob(base64);
            const outputArray = new Uint8Array(rawData.length);
            for (let i = 0; i < rawData.length; ++i) {
                outputArray[i] = rawData.charCodeAt(i);
            }
            return outputArray;
        }

        async function enableNotifications() {
            if (!('serviceWorker' in navigator) || !('PushManager' in window)) {
                showGlobalAlert("Push notifications are not supported by your browser.");
                return;
            }
            const permission = await Notification.requestPermission();
            if (permission !== 'granted') {
                showGlobalAlert("Permission not granted.");
                return;
            }

            try {
                const reg = await navigator.serviceWorker.register('/sw.js');
                const response = await fetch(`${apiBase}api/vapid_public_key`);
                const data = await response.json();

                const subscription = await reg.pushManager.subscribe({
                    userVisibleOnly: true,
                    applicationServerKey: urlB64ToUint8Array(data.public_key)
                });

                await fetch(`${apiBase}api/push_subscribe`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        driver_id: currentDriverId,
                        member_id: selectedMemberId,
                        subscription: subscription
                    })
                });
                showGlobalAlert("Notifications enabled!");
            } catch (e) {
                console.error(e);
                showGlobalAlert("Failed to enable notifications: " + e.message);
            }
        }

        // If permission is already granted, quietly refresh the server-side
        // subscription for this device+driver on every app load. Heals stale
        // registrations (e.g. after a VAPID key change or a pruned endpoint)
        // and keeps multiple devices per driver registered.
        async function syncPushSubscription() {
            try {
                if (!('serviceWorker' in navigator) || !('PushManager' in window)) return;
                if (Notification.permission !== 'granted' || !selectedDriverId) return;
                const reg = await navigator.serviceWorker.register('/sw.js');
                const response = await fetch(`${apiBase}api/vapid_public_key`);
                const data = await response.json();
                const subscription = await reg.pushManager.subscribe({
                    userVisibleOnly: true,
                    applicationServerKey: urlB64ToUint8Array(data.public_key)
                });
                await fetch(`${apiBase}api/push_subscribe`, {  // silent re-sync
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ driver_id: selectedDriverId, member_id: selectedMemberId, subscription: subscription })
                });
            } catch (e) {
                console.warn('Push subscription re-sync failed', e);
            }
        }

        async function fetchSchedule(refresh = false, skipLocal = false) {
            const container = document.getElementById('days-container');
            const btnSync = document.getElementById('btn-sync');

            const cached = localStorage.getItem('chauffeur_schedule');
            let hasCachedData = false;
            if (cached && !refresh && !skipLocal) {
                try {
                    scheduleData = JSON.parse(cached);
                    buildTimeline();
                    hasCachedData = true;
                    // Do not return here, let it fetch fresh data in the background
                } catch (e) { }
            }

            if (refresh) {
                // If it's a manual refresh, clear the start date to reset the view
                window.globalStartDate = null;
            }

            if (!hasCachedData || refresh) {
                btnSync.classList.add('animate-spin');
            }

            try {
                let url = `${apiBase}api/schedule?_cb=` + new Date().getTime();
                if (refresh) url += '&force_refresh=true';

                const res = await fetch(url);
                scheduleData = await res.json();
                localStorage.setItem('chauffeur_schedule', JSON.stringify(scheduleData));
                buildTimeline();
            } catch (e) {
                console.error("Failed to fetch schedule", e);
                if (!hasCachedData) {
                    document.getElementById('days-container').innerHTML = `<div class="w-full flex items-center justify-center text-red-400">Failed to load data</div>`;
                }
            } finally {
                setTimeout(() => btnSync.classList.remove('animate-spin'), 500);
            }
        }

        function openMaps(provider) {
            if (!routeContext) return;

            let destStr = routeContext.destination;

            // Apple Maps fuzzy matches poorly on named places (like "Ancient Oaks pool, 8400...").
            // If the first part before a comma contains no numbers but the second part does,
            // we strip the name part so Apple Maps gets a clean street address.
            if (provider === 'apple') {
                const parts = destStr.split(',');
                if (parts.length > 1 && !/\d/.test(parts[0]) && /\d/.test(parts[1])) {
                    destStr = parts.slice(1).join(',').trim();
                }
            }

            const destEnc = encodeURIComponent(destStr);

            let url = '';
            if (provider === 'google') {
                url = `https://www.google.com/maps/dir/?api=1&destination=${destEnc}&dir_action=navigate`;
            } else if (provider === 'apple') {
                url = `maps://?daddr=${destEnc}&dirflg=d`;
            } else if (provider === 'waze') {
                url = `waze://?q=${destEnc}&navigate=yes`;
            }

            closeActionSheet();
            const a = document.createElement('a');
            a.href = url;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
        }

                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        driver_id: currentDriverId,
                        event_id: routeContext.eventId,
                        action: actionStr,
                        details: routeContext.legTitle,
                        leg_id: routeContext.legId
                    })
                });

                // ALSO mark it in drive_status backend
                await fetch(`${apiBase}api/drive_status`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        leg_id: routeContext.legId,
                        status: 'completed'
                    })
                });
                await fetchSchedule();

            } catch (e) {

        const CLAIM_ICON = `<svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M18 9v3m0 0v3m0-3h3m-3 0h-3m-2-5a4 4 0 11-8 0 4 4 0 018 0zM3 20a6 6 0 0112 0v1H3v-1z"></path></svg>`;
        const CLAIM_SPINNER = '<svg class="w-5 h-5 animate-spin" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10" stroke-dasharray="31.4 31.4" stroke-dashoffset="0"/></svg>';

        // Creates ManualOverride(s) pinning the given event/leg ids to the
        // logged-in driver (same api/overrides contract as the dashboard's
        // driver dropdown). Split dropoff/pickup halves are claimed by their
        // exact variant id so the other leg stays solver-controlled. The
        // backend re-solves in the background and the SSE stream refreshes the UI.
        async function claimEvent(ev, ids, btn) {
            if (!selectedDriverId || !ids || ids.length === 0) return;
            const wrap = document.getElementById('em-claim-container');
            const allBtns = wrap ? Array.from(wrap.querySelectorAll('button')) : [btn];
            allBtns.forEach(b => b.disabled = true);
            const origHtml = btn.innerHTML;
            const reset = () => {
                allBtns.forEach(b => b.disabled = false);
                btn.innerHTML = origHtml;
            };
            btn.innerHTML = `${CLAIM_SPINNER} Checking...`;

            try {
                // Dry-run per leg: warn if the solver would normally refuse this
                // pairing. The override still wins if the driver confirms.
                let conflicts = [];
                for (const id of ids) {
                    try {
                        const chkRes = await fetch(`${apiBase}api/overrides/check`, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ event_id: id, driver_id: selectedDriverId })
                        });
                        const chk = await chkRes.json();
                        if (chk.conflicts) conflicts.push(...chk.conflicts);
                    } catch (e) {
                        console.warn('Override conflict check failed, proceeding without it', e);
                    }
                }
                conflicts = [...new Set(conflicts)];
                if (conflicts.length > 0) {
                    const proceed = confirm("The solver would normally not assign you this:\n\n• " + conflicts.join("\n• ") + "\n\nOverride anyway?");
                    if (!proceed) {
                        reset();
                        return;
                    }
                }

                btn.innerHTML = `${CLAIM_SPINNER} Assigning...`;
                for (const id of ids) {
                    const res = await fetch(`${apiBase}api/overrides`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            event_id: id,
                            driver_id: selectedDriverId,
                            event_title: ev.title,
                            date_str: ev.dateStr || null,
                            source: 'pwa'
                        })
                    });
                    if (!res.ok) throw new Error('Override request failed');
                }

                closeEventModal();
                showGlobalAlert("Assigned to you — rebuilding the schedule…");
            } catch (e) {
                console.error('Failed to claim event', e);
                showGlobalAlert('Failed to assign. Check your connection.');
                reset();
            }
        }

        function openEventModal(titleStr) {

                            });

                        completeBtn.innerHTML = '<svg class="w-5 h-5 animate-spin" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10" stroke-dasharray="31.4 31.4" stroke-dashoffset="0"/></svg> Completing...';
                        markErrandCompleted(ev.id, completeBtn).then(() => {

            const modal = document.getElementById('event-modal');

        function renderLegPill(timeStr, title, mins, delayMins, actionArgs, colorTheme = 'blue', subtitleHtml = '', legId = null, isPast = false, lateMins = 0) {
