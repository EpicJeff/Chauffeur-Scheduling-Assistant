<!-- Shared kiosk Moments pop (Presence slice, docs/presence_status_design.md):
     the wall panel lights up, unbidden, with a fresh photo/clip from an
     activity — the family hearth showing you the moment you couldn't be at.
     Plain JS, no Alpine dependency (status_celebration precedent). Active only
     with ?kiosk=true.

     THE POP IS ALL THAT LIVES HERE. There used to be a floating 📸 FAB and a
     rail of recent moments down the right edge of every kiosk page; it earned
     nothing, sat over whatever tab you were actually looking at, and was cut.
     Looking BACK is /moments (or a Moments board), and what tells the family
     something landed while nobody was in the room is the shelf badge this
     component feeds — chrome the panel already has, rather than chrome
     floating on top of it.

     Two windows, deliberately different:
       - the POP is fresh-only (12 h), so a panel powered on after a weekend
         never ambushes the room with Tuesday's game;
       - the BADGE counts everything since this panel last opened the gallery,
         because that is the whole question it answers.
     Their storage keys are separate for the same reason: the pop's seeds to
     the newest moment on first sight (never replay), the badge's seeds to
     24 h ago (a fresh panel badges today, not the week). -->
<script>
    (function () {
        if (new URLSearchParams(window.location.search).get('kiosk') !== 'true') return;
        // ha_theme.html works the path climb out once, board level included.
        const apiBase = (typeof window !== 'undefined' && window.chfBase !== undefined ? window.chfBase : '');
        const SEEN_KEY = 'chauffeur_moments_seen_ts';

        function esc(s) {
            const d = document.createElement('div');
            d.textContent = s == null ? '' : String(s);
            return d.innerHTML;
        }

        // The kind lives at the top level on the feed payload and inside the
        // attachment on a raw message (the home board tile hands us one of
        // those). Reading only one of them is how the overlay's clip timeout
        // ended up applying to nothing.
        function isClip(m) {
            return (m.kind || (m.attachment || {}).kind) === 'video';
        }

        // A CLIP PLAYING ON A RASPBERRY PI is the hardest thing this app asks
        // of a wall panel, and the page it plays on makes it harder. Every
        // `backdrop-filter` on screen — the shelf's fade strip, the mapped
        // panel surfaces, the FAB — has to re-blur what is behind it on every
        // frame the video paints, and the Pi is already decoding in software.
        // None of that blur is visible under a full-screen overlay anyway, so
        // it stands down for the twenty seconds the clip is up. The style
        // element lives inside the overlay: it exists exactly as long as the
        // clip does, and there is nothing to clean up.
        const CLIP_COMPOSITING_CSS = `
            <style>
                html.clip-playing *,
                html.clip-playing *::before,
                html.clip-playing *::after {
                    -webkit-backdrop-filter: none !important;
                    backdrop-filter: none !important;
                }
            </style>`;

        function mediaUrl(m, which) {
            const att = m.attachment || {};
            const u = (which === 'poster' ? m.poster_url : m.media_url)
                || m.media_url || att.url || '';
            return u ? `${apiBase}${String(u).replace(/^\//, '')}` : (att.data_url || '');
        }

        // The pop always shows the media itself. Poster frames are for GRIDS
        // (the gallery draws those) — nothing here is a thumbnail.
        // Relative like the api fetches, so HA ingress paths work.
        function mediaHtml(m, cls) {
            const kind = m.kind || (m.attachment || {}).kind;
            // preload=auto: buffer ahead rather than decode against the
            // network. The clip is already on the family's own box and the
            // panel has nothing else to do while it is on screen.
            return kind === 'video'
                ? `<video src="${mediaUrl(m)}" poster="${mediaUrl(m, 'poster')}" autoplay muted loop playsinline preload="auto" class="${cls}"></video>`
                : `<img src="${mediaUrl(m)}" class="${cls}">`;
        }

        window.showMomentOverlayKiosk = function (m) {
            const clip = isClip(m);
            const overlay = document.createElement('div');
            overlay.className = 'fixed inset-0 z-[200] flex items-center justify-center p-8';
            overlay.dataset.momentOverlay = '1';
            overlay.style.background = 'rgba(0,0,0,0.82)';
            overlay.innerHTML = `
                <style>@keyframes kioskMomentPop { 0% { transform: scale(.5); opacity: 0; } 60% { transform: scale(1.06); } 100% { transform: scale(1); opacity: 1; } }</style>
                ${clip ? CLIP_COMPOSITING_CSS : ''}
                <div style="animation:kioskMomentPop .5s ease-out forwards"
                    class="relative text-center bg-gray-900 border border-pink-500/40 rounded-3xl shadow-2xl p-6 max-w-3xl">
                    <div class="text-[12px] font-black uppercase tracking-widest text-pink-300 mb-2">📸 ${esc(m.event_title)}</div>
                    ${mediaHtml(m, 'max-h-[62vh] rounded-2xl mx-auto object-contain')}
                    ${m.body ? `<div class="text-xl text-white font-bold mt-3">${esc(m.body)}</div>` : ''}
                    <div class="text-sm text-gray-400 mt-2">from ${esc(m.sender_name)}</div>
                </div>`;
            function close() {
                overlay.remove();
                // A poll can pop a second moment over the first, so the flag
                // comes off only when the last overlay has gone.
                if (!document.querySelector('[data-moment-overlay]')) {
                    document.documentElement.classList.remove('clip-playing');
                }
            }
            overlay.addEventListener('click', close);
            document.body.appendChild(overlay);
            if (clip) document.documentElement.classList.add('clip-playing');
            // Clips get a little longer on the wall than stills.
            setTimeout(close, clip ? 30000 : 20000);
        };

        // The catch-up badge. Its key is NOT the pop's: SEEN_KEY seeds to the
        // newest moment on first sight so a rebooted panel never replays old
        // moments as full-screen pops, and reusing it would mean a panel that
        // polled at 3am shows a zero badge over breakfast for moments nobody
        // saw. This seeds to 24h ago instead.
        const VIEWED_KEY = 'chauffeur_moments_viewed_ts';

        function viewedTs() {
            const v = parseFloat(localStorage.getItem(VIEWED_KEY) || '');
            if (!isNaN(v) && v > 0) return v;
            const seed = (Date.now() / 1000) - 24 * 3600;
            localStorage.setItem(VIEWED_KEY, String(seed));
            return seed;
        }

        // Counted server-side rather than derived from the feed above: the
        // feed is windowed and capped for the POP, and widening it to make a
        // number would drag media across the wire from every panel page once
        // a minute. The route answers with a bare count.
        async function refreshBadge() {
            if (typeof window.chfSetMomentsBadge !== 'function') return;
            try {
                const res = await fetch(`${apiBase}api/presence/moments/count?since=${viewedTs()}`);
                if (!res.ok) return;
                window.chfSetMomentsBadge((await res.json()).count || 0);
            } catch (e) { }
        }

        async function poll() {
            refreshBadge();
            try {
                // Fresh-only, and small: the pop shows ONE moment and the rail
                // that used to browse a week of them is gone.
                const POP_HOURS = 12;
                const res = await fetch(`${apiBase}api/presence/moments?hours=${POP_HOURS}&limit=6`);
                if (!res.ok) return;
                const moments = (await res.json()).filter(m => m.attachment
                    && (m.attachment.data_url || m.attachment.url));
                const prev = localStorage.getItem(SEEN_KEY);
                const newest = moments.length ? (moments[0].ts || 0) : 0;
                localStorage.setItem(SEEN_KEY, String(Math.max(newest, parseFloat(prev || '0') || 0)));
                if (prev === null) return;   // first sighting: seed silently
                const seen = parseFloat(prev) || 0;
                const fresh = moments.filter(m => (m.ts || 0) > seen);
                if (fresh.length) window.showMomentOverlayKiosk(fresh[0]);
            } catch (e) { }
        }

        document.addEventListener('DOMContentLoaded', () => {
            poll();
            setInterval(poll, 60000);
        });
    })();
</script>
