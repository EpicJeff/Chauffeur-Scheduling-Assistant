<!-- Shared kiosk Moments hearth (Presence slice, docs/presence_status_design.md):
     the wall panel lights up, unbidden, with a fresh photo/clip from an
     activity — the family hearth showing you the moment you couldn't be at.
     Plain JS, no Alpine dependency (status_celebration precedent). Active only
     with ?kiosk=true. Polls /api/presence/moments every 60s; dedupe is the
     celebration convention — localStorage seeded silently on first sight so a
     freshly mounted panel never replays old moments. If the page provides a
     <div id="moments-hearth-card"></div> mount, the newest moment also stays
     browsable as a card there; without a mount the overlay still works. -->
<script>
    (function () {
        if (new URLSearchParams(window.location.search).get('kiosk') !== 'true') return;
        const apiBase = window.location.pathname.endsWith('/') ? '../' : '';
        const SEEN_KEY = 'chauffeur_moments_seen_ts';

        function esc(s) {
            const d = document.createElement('div');
            d.textContent = s == null ? '' : String(s);
            return d.innerHTML;
        }

        function mediaHtml(m, cls) {
            const att = m.attachment || {};
            if (att.kind === 'video' && att.url) {
                // Relative (like the api fetches) so HA ingress paths work.
                return `<video src="${apiBase}${att.url.replace(/^\//, '')}" autoplay muted loop playsinline class="${cls}"></video>`;
            }
            return `<img src="${att.data_url || ''}" class="${cls}">`;
        }

        function momentAgo(ts) {
            const mins = Math.max(0, Math.round((Date.now() / 1000 - ts) / 60));
            if (mins < 1) return 'just now';
            if (mins < 60) return `${mins} min ago`;
            const h = Math.round(mins / 60);
            return `${h} hour${h !== 1 ? 's' : ''} ago`;
        }

        window.showMomentOverlayKiosk = function (m) {
            const overlay = document.createElement('div');
            overlay.className = 'fixed inset-0 z-[200] flex items-center justify-center p-8';
            overlay.style.background = 'rgba(0,0,0,0.82)';
            overlay.innerHTML = `
                <style>@keyframes kioskMomentPop { 0% { transform: scale(.5); opacity: 0; } 60% { transform: scale(1.06); } 100% { transform: scale(1); opacity: 1; } }</style>
                <div style="animation:kioskMomentPop .5s ease-out forwards"
                    class="relative text-center bg-gray-900 border border-pink-500/40 rounded-3xl shadow-2xl p-6 max-w-3xl">
                    <div class="text-[12px] font-black uppercase tracking-widest text-pink-300 mb-2">📸 ${esc(m.event_title)}</div>
                    ${mediaHtml(m, 'max-h-[62vh] rounded-2xl mx-auto object-contain')}
                    ${m.body ? `<div class="text-xl text-white font-bold mt-3">${esc(m.body)}</div>` : ''}
                    <div class="text-sm text-gray-400 mt-2">from ${esc(m.sender_name)}</div>
                </div>`;
            overlay.addEventListener('click', () => overlay.remove());
            document.body.appendChild(overlay);
            // Clips get a little longer on the wall than stills.
            setTimeout(() => overlay.remove(), (m.attachment || {}).kind === 'video' ? 30000 : 20000);
        };

        function renderCard(m) {
            const mount = document.getElementById('moments-hearth-card');
            if (!mount) return;
            if (!m) { mount.innerHTML = ''; return; }
            mount.innerHTML = `
                <div class="mb-8">
                    <div class="bg-gray-800/60 rounded-2xl border border-pink-900/60 p-4 flex items-center gap-4 max-w-2xl cursor-pointer"
                        onclick='showMomentOverlayKiosk(${JSON.stringify(m).replace(/[<'&]/g, c => ({"<": "\\u003c", "'": "\\u0027", "&": "\\u0026"}[c]))})'>
                        <div class="w-28 h-28 rounded-xl overflow-hidden shrink-0">${mediaHtml(m, 'w-full h-full object-cover')}</div>
                        <div class="min-w-0">
                            <div class="text-[11px] font-black uppercase tracking-widest text-pink-300 mb-1">📸 Latest moment</div>
                            <div class="font-bold text-white truncate">${esc(m.event_title)}</div>
                            ${m.body ? `<div class="text-sm text-gray-300 mt-1">${esc(m.body)}</div>` : ''}
                            <div class="text-xs text-gray-500 mt-2">from ${esc(m.sender_name)} · ${momentAgo(m.ts)}</div>
                        </div>
                    </div>
                </div>`;
        }

        async function poll() {
            try {
                const res = await fetch(`${apiBase}api/presence/moments?hours=12`);
                if (!res.ok) return;
                const moments = (await res.json()).filter(m => m.attachment
                    && (m.attachment.data_url || m.attachment.url));
                renderCard(moments[0] || null);
                const prev = localStorage.getItem(SEEN_KEY);
                const newest = moments.length ? (moments[0].ts || 0) : 0;
                localStorage.setItem(SEEN_KEY, String(Math.max(newest, parseFloat(prev || '0') || 0)));
                if (prev === null) return;   // first sighting: seed silently
                const fresh = moments.filter(m => (m.ts || 0) > (parseFloat(prev) || 0));
                if (fresh.length) window.showMomentOverlayKiosk(fresh[0]);
            } catch (e) { }
        }

        document.addEventListener('DOMContentLoaded', () => {
            poll();
            setInterval(poll, 60000);
        });
    })();
</script>
