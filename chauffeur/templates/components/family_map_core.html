<!-- The family map, as a FACTORY rather than a page.

     `components/family_map.html` was one map bolted to one pair of element ids
     (`#family-map`, `#family-map-chips`) held in file-level globals, which is
     exactly right for a page that shows a map and no use at all to the wall
     board, where the map is a tile among tiles and its data arrives inside the
     board payload rather than from a fetch of its own.

     So the drawing lives here — `FamilyMap.create(el, opts)` returns an
     instance bound to whatever element it is given — and the page-level
     wrapper keeps the old global functions on top of it. Two callers, one
     renderer: the marker a member gets on the board tile is the same marker,
     from the same code, as the one on /map.

     Two things the tile needs that a page does not:

     1. **Injected locations.** `refresh()` takes an array, and only fetches
        `/api/family/locations` when handed nothing. The board already reads
        every member's HA state to build its map tile; making the tile fetch
        the same states again would double the panel's cost to Home Assistant
        to draw one picture.
     2. **A map that may or may not be a control.** Every board map card has
        its own `interactive` setting. Off, the card is a door — the whole
        card is an <a> to /map, so `interactive: false` turns Leaflet's
        handlers off and the tile puts `pointer-events: none` over the top.
        On, it is a full map with popups. home.html rebuilds the instance
        when the setting flips, because Leaflet bakes its handlers in at
        construction.

     The base map is vector when the browser can draw it (MapLibre GL inside
     Leaflet via maplibre-gl-leaflet, OSMF Shortbread tiles, a light or dark
     VersaTiles style that follows the page) and today's raster OSM tiles
     when it cannot. Spec: docs/superpowers/specs/2026-10-08-vector-family-map-design.md.
-->
<style>
    /* Leaflet popups default to white chrome; follow the HA theme when active. */
    .ha-theme .leaflet-popup-content-wrapper,
    .ha-theme .leaflet-popup-tip {
        background: var(--ha-card-bg, #ffffff);
        color: var(--ha-primary-text, #333333);
    }

    /* OpenStreetMap's terms want the credit visible, so it is never removed —
       but on a 240px board tile the default chip is a third of the width, so
       there it shrinks to a mark rather than a sentence. */
    .fm-quiet .leaflet-control-attribution {
        font-size: 8px;
        padding: 0 3px;
        background: rgb(255 255 255 / 0.6);
    }

    /* A dark vector map would otherwise carry Leaflet's white credit chip. */
    .fm-dark .leaflet-control-attribution {
        background: rgb(0 0 0 / 0.55);
        color: #d4d4d4;
    }
    .fm-dark .leaflet-control-attribution a { color: #93c5fd; }
</style>
<script>
    window.FamilyMap = window.FamilyMap || (function () {
        // Computed independently of the including page's script order — and
        // it has to count the BOARD's extra segment, which is what this
        // missed. `/board/{slug}` is two deep, so a bare `static/...` asked
        // for `/board/static/vendor/leaflet/leaflet.js`, got a 404, and
        // Leaflet never loaded: a map card worked on /home and drew nothing
        // on any custom board. Same climb home.html does for its own head
        // (v2.207.0's rule, which this component predated) — ONE extra level
        // counted against the route rather than real path segments, because
        // ingress puts /api/hassio_ingress/<token>/ in front of everything
        // and must never be climbed out of.
        // That same climb is ha_theme.html's window.chfBase now, worked once.
        const apiBase = (typeof window !== 'undefined' && window.chfBase !== undefined ? window.chfBase : '');

        function esc(s) {
            return String(s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;')
                .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
        }

        function ensureLeaflet() {
            if (window.L) return Promise.resolve();
            if (window._fmLeafletLoading) return window._fmLeafletLoading;
            window._fmLeafletLoading = new Promise((resolve, reject) => {
                // Vendored (tools/vendor_assets.py), and `apiBase` rather than
                // a bare relative path because this component is included by
                // pages at several depths. Leaflet's stylesheet reaches for
                // `images/` beside itself, which is why the vendored copy keeps
                // its own directory.
                const css = document.createElement('link');
                css.rel = 'stylesheet';
                css.href = apiBase + 'static/vendor/leaflet/leaflet.css';
                document.head.appendChild(css);
                const js = document.createElement('script');
                js.src = apiBase + 'static/vendor/leaflet/leaflet.js';
                js.onload = resolve;
                js.onerror = reject;
                document.head.appendChild(js);
            });
            return window._fmLeafletLoading;
        }

        // ---- The vector base map ------------------------------------------
        const OSMF_TILEJSON = 'https://vector.openstreetmap.org/shortbread_v1/tilejson.json';
        const OSM_TILES = 'https://tile.openstreetmap.org/{z}/{x}/{y}.png';
        const OSM_ATTRIBUTION = '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>';
        const STYLE_FOR = { light: 'colorful', dark: 'eclipse' };
        // How long a lost WebGL context gets to come back before this map
        // gives up on vectors. Browsers cap live contexts per page and take
        // the oldest; HA saw those never return.
        const CONTEXT_GRACE_MS = 3000;

        // Absolute, because MapLibre resolves glyph and sprite URLs inside its
        // worker, where a relative path has no page to be relative to. Built
        // from the page's own location plus the climb (`apiBase`), so ingress
        // and the board's extra segment resolve the same way the scripts do.
        // `href` exists for the test; callers leave it out.
        function assetBase(prefix, href) {
            return new URL((prefix === undefined ? apiBase : prefix)
                           + 'static/vendor/map-style/', href || location.href).href;
        }

        let _canVector = null;
        // Asked only when a map is first built — never at include time, so a
        // page that never opens a map makes no WebGL attempt at all.
        function canVector() {
            if (_canVector !== null) return _canVector;
            try {
                const gl = document.createElement('canvas').getContext('webgl2');
                _canVector = !!gl;
                const lose = gl && gl.getExtension('WEBGL_lose_context');
                if (lose) lose.loseContext();   // the probe holds no context
            } catch (e) { _canVector = false; }
            return _canVector;
        }

        // MapLibre v6 is ESM only, the Leaflet bridge is its UMD build (its
        // ESM build imports `leaflet` by bare name, and our Leaflet is a
        // global script), so: import the module, publish it as the global
        // the bridge reads, then load the bridge. Once per page.
        function ensureVector() {
            if (window._fmVectorLoading) return window._fmVectorLoading;
            window._fmVectorLoading = (async () => {
                const css = document.createElement('link');
                css.rel = 'stylesheet';
                css.href = apiBase + 'static/vendor/maplibre/maplibre-gl.css';
                document.head.appendChild(css);
                const mod = await import(new URL(apiBase + 'static/vendor/maplibre/maplibre-gl.mjs',
                                                 location.href).href);
                window.maplibregl = mod;
                await new Promise((resolve, reject) => {
                    const js = document.createElement('script');
                    js.src = apiBase + 'static/vendor/maplibre/leaflet-maplibre-gl.js';
                    js.onload = resolve;
                    js.onerror = reject;
                    document.head.appendChild(js);
                });
                if (!L.maplibreGL) throw new Error('maplibre-gl-leaflet did not register');
            })();
            // A failed load stays failed for this page: every map goes raster.
            window._fmVectorLoading.catch(() => {});
            return window._fmVectorLoading;
        }

        function luminance(css) {
            const s = String(css || '').trim();
            let r, g, b, m;
            if ((m = s.match(/^#([0-9a-f]{3})$/i))) {
                [r, g, b] = m[1].split('').map(c => parseInt(c + c, 16));
            } else if ((m = s.match(/^#([0-9a-f]{6})$/i))) {
                [r, g, b] = [0, 2, 4].map(i => parseInt(m[1].substr(i, 2), 16));
            } else if ((m = s.match(/^rgba?\(\s*(\d+)[\s,]+(\d+)[\s,]+(\d+)/i))) {
                [r, g, b] = [m[1], m[2], m[3]].map(Number);
            } else {
                return null;
            }
            return (0.2126 * r + 0.7152 * g + 0.0722 * b) / 255;
        }

        function prefersLight() {
            try { return window.matchMedia('(prefers-color-scheme: light)').matches; }
            catch (e) { return false; }
        }

        // Which style the page wants. Order matters: the wall's own setting,
        // then the PWA's, then an HA theme's background, then the admin
        // pages' permanent `dark` class, then the device.
        function mapTheme() {
            const root = document.documentElement;
            const panel = root.getAttribute('data-panel-theme');
            if (panel === 'light' || panel === 'dark') return panel;
            if (panel === 'auto') return prefersLight() ? 'light' : 'dark';
            const pwa = root.getAttribute('data-theme');
            if (pwa === 'light' || pwa === 'dark') return pwa;
            if (root.classList.contains('ha-theme')) {
                const lum = luminance(getComputedStyle(root).getPropertyValue('--ha-bg'));
                if (lum !== null) return lum > 0.5 ? 'light' : 'dark';
            }
            if (root.classList.contains('dark')) return 'dark';
            return prefersLight() ? 'light' : 'dark';
        }

        // The vendored VersaTiles style is stored as published. Here it is
        // pointed at OSMF's tiles (through TileJSON, as OSMF asks, never a
        // hard-coded tile URL) and at our own copies of its fonts and icons.
        function rewriteStyle(style, base) {
            const s = JSON.parse(JSON.stringify(style));
            Object.keys(s.sources || {}).forEach(k => {
                if (s.sources[k].type === 'vector') {
                    s.sources[k] = { type: 'vector', url: OSMF_TILEJSON };
                }
            });
            s.glyphs = base + 'glyphs/{fontstack}/{range}.pbf';
            const sprites = Array.isArray(s.sprite) ? s.sprite
                : (s.sprite ? [{ id: 'default', url: s.sprite }] : []);
            s.sprite = sprites.map(sp => ({ id: sp.id, url: base + 'sprites/' + sp.url.split('/').pop() }));
            return s;
        }

        const _styles = {};
        function styleFor(theme) {
            const name = STYLE_FOR[theme];
            if (!_styles[name]) {
                _styles[name] = fetch(apiBase + `static/vendor/map-style/${name}.json`)
                    .then(r => { if (!r.ok) throw new Error(`style ${name}: ${r.status}`); return r.json(); })
                    .then(s => rewriteStyle(s, assetBase()));
                // A failed fetch is not remembered; the next map may retry.
                _styles[name].catch(() => { delete _styles[name]; });
            }
            return _styles[name];
        }

        // Every live vector map, so one observer can restyle them all.
        const _vectorMaps = new Set();
        let _watching = false;
        function watchTheme() {
            if (_watching) return;
            _watching = true;
            const onChange = () => _vectorMaps.forEach(i => i.applyTheme());
            new MutationObserver(onChange).observe(document.documentElement, {
                attributes: true,
                attributeFilter: ['data-panel-theme', 'data-theme', 'class', 'style']
            });
            try {
                window.matchMedia('(prefers-color-scheme: light)').addEventListener('change', onChange);
            } catch (e) { /* old browser: theme follows on the next map build */ }
        }

        function iconFor(loc, size) {
            const label = loc.avatar || (loc.name || '?').charAt(0).toUpperCase();
            // Cars get a rounded-square marker so a glance separates the
            // fleet from the family.
            const radius = loc.is_car ? '30%' : '50%';
            const inner = loc.image
                ? `<img src="${esc(loc.image)}" style="width:100%;height:100%;object-fit:cover;border-radius:${radius}">`
                : esc(label);
            return L.divIcon({
                className: '',
                html: `<div style="width:${size}px;height:${size}px;border-radius:${radius};background:#171717;border:3px solid ${loc.color_code || '#3b82f6'};display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:${Math.round(size * 0.42)}px;box-shadow:0 2px 8px rgba(0,0,0,.5);overflow:hidden">${inner}</div>`,
                iconSize: [size, size],
                iconAnchor: [size / 2, size / 2],
                popupAnchor: [0, -(size / 2 + 1)]
            });
        }

        function popupFor(loc) {
            const drivingLine = loc.driving ? `🚗 Driving: ${esc(loc.driving.leg_title)}` : '';
            const canMessage = typeof messageMember === 'function'
                && typeof selectedMemberId !== 'undefined' && selectedMemberId
                && selectedMemberId !== loc.member_id
                && !loc.is_car;
            let carStats = '';
            if (loc.is_car) {
                const bits = [];
                if (loc.battery_pct != null) bits.push(`🔌 ${Math.round(loc.battery_pct)}%`);
                if (loc.fuel_pct != null) bits.push(`⛽ ${Math.round(loc.fuel_pct)}%`);
                if (loc.range != null) bits.push(`${Math.round(loc.range)} mi range`);
                if (bits.length) carStats = `<div style="margin-top:4px;font-weight:700">${bits.join(' · ')}</div>`;
            }
            return `<div style="min-width:140px">
                <div style="font-weight:800">${esc(loc.name)}</div>
                <div style="color:var(--ha-secondary-text, #666);text-transform:capitalize">${esc((loc.state || '').replace(/_/g, ' '))}</div>
                ${carStats}
                ${drivingLine ? `<div style="margin-top:4px">${drivingLine}</div>` : ''}
                ${canMessage ? `<button onclick="messageMember('${loc.member_id}')" style="margin-top:6px;background:var(--ha-primary-color, #2563eb);color:#fff;font-weight:700;border:none;border-radius:8px;padding:6px 10px;width:100%;cursor:pointer">Message</button>` : ''}
            </div>`;
        }

        function chipFor(loc) {
            const driving = loc.driving ? ' · 🚗' : '';
            // A private-stage kid on a kiosk: the chip says the location is
            // kept, rather than pretending the phone is untracked.
            const where = loc.private ? '🔒' : esc(loc.state);
            return `<span class="flex items-center gap-1.5 px-2.5 py-1 rounded-full bg-gray-800 border border-gray-700 text-xs font-bold text-gray-300">
                <span class="w-2.5 h-2.5 rounded-full" style="background-color:${loc.color_code || '#6b7280'}"></span>
                ${esc(loc.name)}: ${where}${driving}</span>`;
        }

        async function fetchLocations() {
            // Who is looking travels with the request (stage arc A4): the PWA
            // defines selectedMemberId, kiosk pages don't — and the server
            // withholds a private-stage kid's whereabouts from viewerless
            // (kiosk) requests.
            let q = '';
            try {
                if (typeof selectedMemberId !== 'undefined' && selectedMemberId)
                    q = `?viewer=${encodeURIComponent(selectedMemberId)}`;
            } catch (e) { /* not a PWA page */ }
            const res = await fetch(`${apiBase}api/family/locations${q}`);
            return await res.json();
        }

        function create(el, opts) {
            opts = Object.assign({
                interactive: true,   // false = a picture of the map, not a control
                chipsEl: null,       // where "tracked by zone only" chips go, if anywhere
                popups: true,
                fit: true,           // frame everyone once, then leave the view alone
                markerSize: 38,
                maxZoom: 15,
                // Where to look when there is nothing to look AT: [lat, lon]
                // (home, in practice) and the zoom to sit at. Without one the
                // map stays on the whole-continent default, which is a picture
                // of nowhere — so a caller that has no such place is better
                // off saying so in words than drawing this.
                fallbackCenter: null,
                fallbackZoom: 14
            }, opts || {});

            const inst = {
                el: el, opts: opts, map: null, markers: {}, didFit: false, timer: null,
                base: null, theme: null, baseLayer: null, lostTimer: null, gen: 0,

                async ensure() {
                    // A destroy() that lands while Leaflet is still loading
                    // (Alpine replacing the tile) must not be undone by this
                    // call resuming and building a map anyway.
                    const gen = inst.gen;
                    await ensureLeaflet();
                    if (gen !== inst.gen) return null;
                    // A map whose container was thrown away (Alpine re-rendering
                    // a tile, a PWA tab rebuilt) is dead weight holding a
                    // detached node — rebuild rather than draw into nothing.
                    if (inst.map && !inst.map.getContainer().isConnected) inst.destroy();
                    if (!inst.map) {
                        if (!opts.interactive) el.classList.add('fm-quiet');
                        // Leaflet's panes and controls carry z-index 400–1000
                        // and escape into the PAGE's stacking order whenever
                        // no ancestor forms a stacking context — which is
                        // exactly what happened during a clip: the hearth
                        // overlay's clip-playing mode strips every
                        // backdrop-filter (a Pi decoding video cannot also
                        // re-blur every frame), and a backdrop-filter was the
                        // stacking context that had been keeping the map
                        // under overlays. Photos left the blur on, so only
                        // videos slid behind the map. Isolating the map's own
                        // container pins its z-indexes inside it, whatever
                        // the page around it is doing.
                        el.style.isolation = 'isolate';
                        inst.map = L.map(el, {
                            // The raster layer used to set this; a vector
                            // layer sets no bound and would zoom into a blur.
                            maxZoom: 19,
                            zoomControl: opts.interactive,
                            dragging: opts.interactive,
                            scrollWheelZoom: opts.interactive,
                            doubleClickZoom: opts.interactive,
                            boxZoom: opts.interactive,
                            keyboard: opts.interactive,
                            touchZoom: opts.interactive,
                            tap: opts.interactive
                        }).setView([39.5, -98.35], 4);
                        await inst.addBase();
                    }
                    // The container may have just become visible (a PWA tab
                    // switch, a tile that was off screen).
                    setTimeout(() => { if (inst.map) inst.map.invalidateSize(); }, 50);
                    return inst.map;
                },

                setBaseClass() {
                    el.classList.toggle('fm-vector', inst.base === 'vector');
                    el.classList.toggle('fm-raster', inst.base === 'raster');
                    el.classList.toggle('fm-dark', inst.base === 'vector' && inst.theme === 'dark');
                },

                async addBase() {
                    const map = inst.map;
                    if (canVector()) {
                        try {
                            await ensureVector();
                            const theme = mapTheme();
                            const style = await styleFor(theme);
                            // Torn down (or rebuilt) while we waited: draw nothing.
                            if (inst.map !== map) return;
                            inst.theme = theme;
                            // The bridge always turns MapLibre's own credit
                            // off and hands Leaflet's control whatever
                            // `customAttribution` says, so the OSM credit
                            // shows once, where it always has.
                            inst.baseLayer = L.maplibreGL({
                                style: style,
                                attributionControl: { customAttribution: OSM_ATTRIBUTION }
                            }).addTo(map);
                            inst.base = 'vector';
                            inst.watchContext();
                            _vectorMaps.add(inst);
                            watchTheme();
                            inst.setBaseClass();
                            // The page may have changed theme while the style
                            // was loading (the wall corrects a cached theme
                            // when the profile lands) — the observer could
                            // not restyle a map that did not exist yet.
                            inst.applyTheme();
                            return;
                        } catch (e) { /* fall through to the raster map */ }
                    }
                    if (inst.map === map) inst.toRaster();
                },

                // Once raster, raster for this instance's life: no flapping.
                toRaster() {
                    if (!inst.map || inst.base === 'raster') return;
                    clearTimeout(inst.lostTimer);
                    _vectorMaps.delete(inst);
                    if (inst.baseLayer) {
                        try { inst.map.removeLayer(inst.baseLayer); } catch (e) { }
                    }
                    inst.baseLayer = L.tileLayer(OSM_TILES, {
                        maxZoom: 19, attribution: OSM_ATTRIBUTION
                    }).addTo(inst.map);
                    inst.base = 'raster';
                    inst.setBaseClass();
                },

                watchContext() {
                    const gl = inst.baseLayer.getMaplibreMap();
                    // OSMF's vector host unreachable (a blocker, an outage)
                    // while the raster host may still answer: a source error
                    // before any tile has arrived means this map would only
                    // ever be pins on a flat colour, so it goes raster. Once
                    // tiles have drawn, a stray tile error is just a gap.
                    let tilesArrived = false;
                    gl.on('sourcedata', e => { if (e.tile) tilesArrived = true; });
                    gl.on('error', e => {
                        if (!tilesArrived && e && e.sourceId) inst.toRaster();
                    });
                    gl.on('webglcontextlost', () => {
                        clearTimeout(inst.lostTimer);
                        inst.lostTimer = setTimeout(() => inst.toRaster(), CONTEXT_GRACE_MS);
                    });
                    gl.on('webglcontextrestored', () => clearTimeout(inst.lostTimer));
                },

                async applyTheme() {
                    if (inst.base !== 'vector') return;
                    const theme = mapTheme();
                    if (theme === inst.theme) return;
                    inst.theme = theme;
                    inst.setBaseClass();
                    try {
                        const style = await styleFor(theme);
                        // Only the LAST flip gets to draw: a slower earlier
                        // fetch landing second must not win.
                        if (inst.base === 'vector' && inst.theme === theme) {
                            inst.baseLayer.getMaplibreMap().setStyle(style);
                        }
                    } catch (e) { /* keep the style it has */ }
                },

                // `locations` is optional: hand it an array (the board already
                // has one) or let it go and fetch the family's own.
                async refresh(locations, focusMemberId) {
                    if (!inst.map) return;
                    if (!locations) {
                        try { locations = await fetchLocations(); }
                        catch (e) { return; }
                    }
                    const chipHtml = [];
                    const seen = new Set();

                    (locations || []).forEach(loc => {
                        const hasCoords = typeof loc.latitude === 'number'
                            && typeof loc.longitude === 'number';
                        if (!hasCoords) {
                            if (loc.state || loc.private) chipHtml.push(chipFor(loc));
                            return;
                        }
                        seen.add(loc.member_id);
                        const icon = iconFor(loc, opts.markerSize);
                        const popup = popupFor(loc);
                        if (inst.markers[loc.member_id]) {
                            inst.markers[loc.member_id].setLatLng([loc.latitude, loc.longitude]);
                            inst.markers[loc.member_id].setIcon(icon);
                            if (opts.popups) inst.markers[loc.member_id].setPopupContent(popup);
                        } else {
                            const m = L.marker([loc.latitude, loc.longitude], { icon: icon })
                                .addTo(inst.map);
                            if (opts.popups) m.bindPopup(popup);
                            inst.markers[loc.member_id] = m;
                        }
                    });

                    // Drop markers for members that lost coords
                    Object.keys(inst.markers).forEach(id => {
                        if (!seen.has(id)) {
                            inst.map.removeLayer(inst.markers[id]);
                            delete inst.markers[id];
                        }
                    });

                    if (opts.chipsEl) opts.chipsEl.innerHTML = chipHtml.join('');

                    if (focusMemberId && inst.markers[focusMemberId]) {
                        inst.map.setView(inst.markers[focusMemberId].getLatLng(), 15);
                        if (opts.popups) inst.markers[focusMemberId].openPopup();
                    } else if (opts.fit && !inst.didFit && seen.size > 0) {
                        inst.didFit = true;
                        const group = L.featureGroup(Object.values(inst.markers));
                        inst.map.fitBounds(group.getBounds().pad(0.3), { maxZoom: opts.maxZoom });
                    } else if (opts.fit && !inst.didFit && opts.fallbackCenter) {
                        // NOT `didFit`. This is a placeholder view, and the
                        // moment a real pin arrives the map should frame it —
                        // marking the fit as done here would leave a family
                        // spread across the county parked over their own roof.
                        inst.map.setView(opts.fallbackCenter, opts.fallbackZoom);
                    }
                },

                // Frame everyone again, on demand.
                //
                // `fit` is deliberately a once-per-instance thing — a map that
                // re-framed itself every poll would yank the view out from
                // under anybody reading it. The cost of that is that a pan
                // PERSISTS, and on a wall panel nobody owns the pan: a map
                // dragged sideways by somebody squeezing past stays dragged
                // for days. This is the way back, and it is why the board's
                // map card can be interactive at all.
                recenter() {
                    const marks = Object.values(inst.markers);
                    if (!inst.map) return;
                    // Nothing to frame, but there is still somewhere to BE:
                    // the ⌖ on a map showing only home has to put a pan back
                    // where it started, or the one map that cannot be
                    // re-framed is the one nobody can read their way out of.
                    if (!marks.length) {
                        if (opts.fallbackCenter) {
                            inst.map.setView(opts.fallbackCenter, opts.fallbackZoom);
                        }
                        return;
                    }
                    inst.didFit = true;
                    inst.map.fitBounds(L.featureGroup(marks).getBounds().pad(0.3),
                                       { maxZoom: opts.maxZoom });
                },

                startPolling(ms) {
                    inst.stopPolling();
                    inst.timer = setInterval(() => {
                        if (document.visibilityState === 'visible') inst.refresh();
                    }, ms || 20000);
                },

                stopPolling() {
                    if (inst.timer) { clearInterval(inst.timer); inst.timer = null; }
                },

                destroy() {
                    inst.stopPolling();
                    inst.gen++;
                    clearTimeout(inst.lostTimer);
                    _vectorMaps.delete(inst);
                    if (inst.map) { inst.map.remove(); inst.map = null; }
                    inst.base = null;
                    inst.baseLayer = null;
                    inst.theme = null;
                    el.classList.remove('fm-vector', 'fm-raster', 'fm-dark');
                    inst.markers = {};
                    inst.didFit = false;
                }
            };
            return inst;
        }

        return { create: create, fetchLocations: fetchLocations, ensureLeaflet: ensureLeaflet,
                 mapTheme: mapTheme, rewriteStyle: rewriteStyle, assetBase: assetBase,
                 canVector: canVector };
