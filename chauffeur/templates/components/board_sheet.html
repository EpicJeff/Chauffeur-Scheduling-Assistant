{# Shared presentation-board sheet (spec 2026-11-27-presentation-boards-design §5, §7.5).
   One overlay for phone (full-screen) and admin (large centred panel), driven by
   static/board_sheet.js on the `chf-board-open` window event. #}
<style>
  .chf-board-overlay {
    --bs-backdrop: rgba(3, 7, 18, 0.72);
    --bs-bg: #111827;
    --bs-card: #1f2937;
    --bs-card-soft: rgba(3, 7, 18, 0.55);
    --bs-sticky-bg: #161e2e;
    --bs-border: rgba(255, 255, 255, 0.09);
    --bs-ink: #f3f4f6;
    --bs-muted: #9ca3af;
    --bs-accent: #5eead4;
    --bs-accent-soft: rgba(45, 212, 191, 0.16);
    --bs-card-shadow: none;
    --bs-radius: 16px;
    --bs-radius-lg: 20px;
    position: fixed;
    inset: 0;
    z-index: 350;
    overscroll-behavior: contain;
    background: var(--bs-backdrop);
    display: flex;
    align-items: stretch;
    justify-content: center;
    padding: 0;
  }
  .chf-board-overlay[hidden] { display: none !important; }

  /* PWA token themes (light & dark via theme.css, for non-adult / kid stages) */
  html[data-theme="light"] .chf-board-overlay {
    --bs-backdrop: rgba(31, 29, 43, 0.45);
    --bs-bg: rgb(var(--c-gray-950, 250 247 242));
    --bs-card: rgb(var(--c-gray-900, 243 238 230));
    --bs-card-soft: rgb(var(--c-gray-800, 234 227 216));
    --bs-sticky-bg: rgb(var(--c-gray-800, 234 227 216));
    --bs-border: rgb(var(--c-gray-700, 220 211 197));
    --bs-ink: rgb(var(--c-gray-100, 36 31 28));
    --bs-muted: rgb(var(--c-gray-400, 92 81 69));
    --bs-accent: rgb(var(--c-teal-700, 15 118 110));
    --bs-accent-soft: rgb(var(--c-teal-900, 204 251 241));
  }

  /* Adult PWA reimagined vocabulary (static/pwa_shell.css tokens; higher specificity than data-theme alone) */
  html[data-audience="adult"] .chf-board-overlay,
  html[data-audience="adult"][data-theme="light"] .chf-board-overlay {
    --bs-backdrop: rgba(31, 29, 43, 0.36);
    --bs-bg: linear-gradient(180deg, var(--pwa-sky-top, #fff4e8) 0%, var(--pwa-sky-mid, #f1f2fa) 42%, var(--pwa-sky-bottom, #e6effb) 100%);
    --bs-card: var(--pwa-card-raised, #ffffff);
    --bs-card-soft: var(--pwa-card, rgba(255, 255, 255, 0.62));
    --bs-sticky-bg: #f5f5fa;
    --bs-border: var(--pwa-msg-line, rgba(31, 29, 43, 0.08));
    --bs-ink: var(--pwa-ink, #1f1d2b);
    --bs-muted: var(--pwa-msg-muted, #5f5c73);
    --bs-accent: var(--pwa-accent, #1d4ed8);
    --bs-accent-soft: color-mix(in srgb, var(--pwa-accent, #1d4ed8) 12%, transparent);
    --bs-card-shadow: 0 2px 10px rgba(31, 29, 43, 0.05);
    --bs-radius: 18px;
    --bs-radius-lg: 22px;
  }
  html[data-audience="adult"][data-theme="dark"] .chf-board-overlay {
    --bs-backdrop: rgba(3, 7, 18, 0.62);
    --bs-bg: linear-gradient(180deg, var(--pwa-sky-top, #1b1d28) 0%, var(--pwa-sky-mid, #171923) 42%, var(--pwa-sky-bottom, #12141c) 100%);
    --bs-card: var(--pwa-card-raised, #262a36);
    --bs-card-soft: var(--pwa-card, rgba(255, 255, 255, 0.06));
    --bs-sticky-bg: #1e212c;
    --bs-border: var(--pwa-msg-line, rgba(243, 242, 247, 0.08));
    --bs-ink: var(--pwa-ink, #f3f2f7);
    --bs-muted: var(--pwa-msg-muted, #b7b4c9);
    --bs-accent: var(--pwa-accent, #60a5fa);
    --bs-accent-soft: color-mix(in srgb, var(--pwa-accent, #60a5fa) 16%, transparent);
    --bs-card-shadow: none;
  }

  /* HA-themed admin pages */
  body.ha-theme .chf-board-overlay {
    --bs-bg: var(--ha-bg, #111111);
    --bs-card: var(--ha-card-bg, #1c1c1c);
    --bs-card-soft: var(--ha-header-bg, #262626);
    --bs-sticky-bg: var(--ha-header-bg, #262626);
    --bs-border: var(--ha-divider, #333333);
    --bs-ink: var(--ha-primary-text, #e1e1e1);
    --bs-muted: var(--ha-secondary-text, #9b9b9b);
  }

  .chf-board-panel {
    width: 100%;
    height: 100dvh;
    background: var(--bs-bg);
    color: var(--bs-ink);
    display: flex;
    flex-direction: column;
    overflow: hidden;
    outline: none;
    font-family: inherit;
  }
  @media (min-width: 768px) {
    .chf-board-overlay {
      align-items: center;
      padding: 20px;
    }
    .chf-board-panel {
      max-width: 820px;
      height: auto;
      max-height: 92vh;
      min-height: 500px;
      border-radius: var(--bs-radius-lg);
      border: 1px solid var(--bs-border);
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.45);
    }
  }

  .chf-board-chrome {
    display: flex;
    flex-direction: column;
    flex: 1;
    min-height: 0;
  }
  .chf-board-header {
    flex-shrink: 0;
    display: flex;
    align-items: center;
    gap: 12px;
    padding: calc(14px + env(safe-area-inset-top, 0px)) 16px 12px;
    border-bottom: 1px solid var(--bs-border);
  }
  @media (min-width: 768px) {
    .chf-board-header { padding: 16px 22px 14px; }
  }
  .chf-board-header-copy { min-width: 0; flex: 1; }
  .chf-board-title {
    margin: 0;
    font-size: 20px;
    font-weight: 700;
    line-height: 1.25;
    letter-spacing: -0.02em;
    color: var(--bs-ink);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .chf-board-summary {
    margin-top: 2px;
    font-size: 13px;
    font-weight: 500;
    color: var(--bs-muted);
  }
  .chf-board-close {
    flex-shrink: 0;
    width: 44px;
    height: 44px;
    border-radius: 999px;
    border: 1px solid var(--bs-border);
    background: var(--bs-card);
    color: var(--bs-ink);
    font-size: 16px;
    font-weight: 700;
    display: grid;
    place-items: center;
    cursor: pointer;
  }
  .chf-board-close:hover { filter: brightness(1.08); }
  .chf-board-close:focus-visible { outline: 3px solid var(--bs-accent); outline-offset: 2px; }

  .chf-board-body {
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    overscroll-behavior: contain;
    padding: 14px 16px 20px;
    scrollbar-width: thin;
    scrollbar-color: var(--bs-border) transparent;
  }
  @media (min-width: 768px) {
    .chf-board-body { padding: 18px 24px 24px; }
  }

  /* Pager */
  .chf-board-pager {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    margin-bottom: 14px;
  }
  .chf-board-nav-btn {
    width: 40px;
    height: 40px;
    min-width: 40px;
    border-radius: 999px;
    border: 1px solid var(--bs-border);
    background: var(--bs-card);
    color: var(--bs-ink);
    font-size: 22px;
    line-height: 1;
    display: grid;
    place-items: center;
    cursor: pointer;
  }
  .chf-board-nav-btn:disabled { opacity: 0.35; cursor: default; }
  .chf-board-dots {
    display: flex;
    align-items: center;
    gap: 6px;
    margin-left: auto;
  }
  .chf-board-dot {
    width: 8px;
    height: 8px;
    padding: 0;
    border: 0;
    border-radius: 999px;
    background: var(--bs-muted);
    opacity: 0.4;
    cursor: pointer;
    transition: width 0.18s ease, opacity 0.18s ease;
  }
  .chf-board-dot.is-active {
    width: 24px;
    background: var(--bs-accent);
    opacity: 1;
  }
  .chf-board-counter {
    font-size: 12px;
    font-weight: 600;
    color: var(--bs-muted);
    font-variant-numeric: tabular-nums;
    margin-right: auto;
    padding-left: 4px;
  }

  /* Hero collage (1-4 tiles, Layout B) */
  .chf-board-screen[hidden] { display: none; }
  @media (min-width: 768px) {
    .chf-board-screen {
      display: grid;
      grid-template-columns: 310px minmax(0, 1fr);
      grid-template-rows: auto 1fr;
      column-gap: 22px;
      align-items: start;
    }
    .chf-board-screen > .chf-board-hero {
      grid-column: 1;
      grid-row: 1 / span 2;
      margin-bottom: 0;
    }
    .chf-board-screen > .chf-board-option-head {
      grid-column: 2;
      grid-row: 1;
    }
    .chf-board-screen > .chf-board-items {
      grid-column: 2;
      grid-row: 2;
    }
  }
  .chf-board-hero {
    display: grid;
    gap: 6px;
    border-radius: var(--bs-radius-lg);
    overflow: hidden;
    background: var(--bs-card-soft);
    border: 1px solid var(--bs-border);
    margin-bottom: 16px;
  }
  .chf-board-hero-1 {
    grid-template-columns: 1fr;
    aspect-ratio: 16 / 10;
    max-height: 300px;
  }
  .chf-board-hero-2 {
    grid-template-columns: 1fr 1fr;
    aspect-ratio: 16 / 10;
    max-height: 280px;
  }
  .chf-board-hero-3 {
    grid-template-columns: 1.25fr 1fr;
    grid-template-rows: 1fr 1fr;
    height: 230px;
  }
  @media (min-width: 768px) {
    .chf-board-hero-3 { height: 290px; grid-template-columns: 1.15fr 1fr; }
  }
  .chf-board-hero-3 > .chf-board-hero-tile:first-child {
    grid-row: 1 / span 2;
  }
  .chf-board-hero-4 {
    grid-template-columns: 1fr 1fr;
    grid-template-rows: 1fr 1fr;
    height: 250px;
  }
  @media (min-width: 768px) {
    .chf-board-hero-4 { height: 300px; }
  }
  .chf-board-hero-tile {
    position: relative;
    min-width: 0;
    min-height: 0;
    overflow: hidden;
    background: var(--bs-card);
  }
  .chf-board-hero-img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  /* Neutral placeholder tile for null or 404 images */
  .chf-board-placeholder {
    width: 100%;
    height: 100%;
    min-height: 48px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 6px;
    padding: 10px;
    text-align: center;
    background: color-mix(in srgb, var(--bs-ink) 6%, transparent);
    color: var(--bs-muted);
  }
  .chf-board-placeholder-icon {
    width: 26px;
    height: 26px;
    opacity: 0.6;
    flex-shrink: 0;
  }
  .chf-board-placeholder-sm .chf-board-placeholder-icon {
    width: 20px;
    height: 20px;
  }
  .chf-board-placeholder-label {
    font-size: 11px;
    font-weight: 600;
    line-height: 1.25;
    max-width: 100%;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }

  /* Option header (title, note, total) */
  .chf-board-option-head {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 14px;
  }
  .chf-board-option-copy { min-width: 0; flex: 1; }
  .chf-board-option-title {
    margin: 0;
    font-size: 20px;
    font-weight: 700;
    line-height: 1.25;
    color: var(--bs-ink);
    overflow-wrap: anywhere;
  }
  .chf-board-option-note {
    margin: 4px 0 0;
    font-size: 14px;
    line-height: 1.4;
    color: var(--bs-muted);
    overflow-wrap: anywhere;
  }
  .chf-board-option-total {
    flex-shrink: 0;
    padding: 6px 12px;
    border-radius: 999px;
    background: var(--bs-accent-soft);
    color: var(--bs-accent);
    font-size: 16px;
    font-weight: 800;
    font-variant-numeric: tabular-nums;
    line-height: 1.2;
  }

  /* Item rows */
  .chf-board-items,
  .chf-board-list-rows {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .chf-board-item,
  .chf-board-list-item {
    display: flex;
    align-items: flex-start;
    gap: 12px;
    padding: 11px 12px;
    border-radius: var(--bs-radius);
    background: var(--bs-card);
    border: 1px solid var(--bs-border);
    box-shadow: var(--bs-card-shadow);
  }
  .chf-board-thumb {
    width: 56px;
    height: 56px;
    flex-shrink: 0;
    border-radius: 12px;
    overflow: hidden;
    background: var(--bs-card-soft);
    border: 1px solid var(--bs-border);
  }
  .chf-board-list-thumb {
    width: 48px;
    height: 48px;
    flex-shrink: 0;
    border-radius: 10px;
    overflow: hidden;
    background: var(--bs-card-soft);
    border: 1px solid var(--bs-border);
  }
  .chf-board-thumb-img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }
  .chf-board-item-body {
    flex: 1;
    min-width: 0;
    overflow-wrap: anywhere;
  }
  .chf-board-slot-role {
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--bs-muted);
    margin-bottom: 2px;
  }
  .chf-board-item-title {
    font-size: 15px;
    font-weight: 600;
    line-height: 1.35;
    color: var(--bs-ink);
  }
  .chf-board-item-meta {
    margin-top: 3px;
    font-size: 13px;
  }
  .chf-board-store-link,
  .chf-board-cmp-link {
    display: inline;
    color: var(--bs-accent);
    font-weight: 600;
    text-decoration: none;
  }
  .chf-board-store-link:hover,
  .chf-board-cmp-link:hover { text-decoration: underline; }
  .chf-board-store-text { color: var(--bs-muted); font-weight: 500; }
  .chf-board-ext { font-size: 12px; line-height: 1; margin-left: 3px; white-space: nowrap; }
  .chf-board-item-price {
    flex-shrink: 0;
    font-size: 15px;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    color: var(--bs-ink);
    padding-top: 2px;
  }
  .chf-board-facts {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-top: 8px;
  }
  .chf-board-fact {
    font-size: 12px;
    padding: 3px 8px;
    border-radius: 999px;
    background: var(--bs-card-soft);
    border: 1px solid var(--bs-border);
    color: var(--bs-ink);
  }
  .chf-board-fact-k {
    color: var(--bs-muted);
    font-weight: 600;
  }
  .chf-board-fact-v { font-weight: 600; }

  /* Compare layout */
  .chf-board-scroll-hint {
    display: flex;
    align-items: center;
    justify-content: flex-end;
    gap: 4px;
    margin: 0 0 8px;
    font-size: 12px;
    font-weight: 600;
    color: var(--bs-muted);
  }
  .chf-board-scroll-hint::after {
    content: '\2192';
    font-size: 13px;
  }
  .chf-board-scroll-hint[hidden] { display: none; }
  .chf-board-compare-stage {
    position: relative;
    border-radius: var(--bs-radius);
    overflow: hidden;
  }
  .chf-board-compare-stage::after {
    content: '';
    position: absolute;
    top: 1px;
    right: 1px;
    bottom: 1px;
    width: 44px;
    border-radius: 0 calc(var(--bs-radius) - 1px) calc(var(--bs-radius) - 1px) 0;
    background: linear-gradient(to right, transparent, var(--bs-card));
    pointer-events: none;
    z-index: 2;
    opacity: 0;
    transition: opacity 0.18s ease;
  }
  .chf-board-compare-stage.has-more-right::after {
    opacity: 1;
  }
  .chf-board-table-wrap {
    overflow-x: auto;
    border-radius: var(--bs-radius);
    border: 1px solid var(--bs-border);
    background: var(--bs-card);
  }
  .chf-board-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 14px;
    text-align: left;
  }
  .chf-board-table th,
  .chf-board-table td {
    padding: 12px 14px;
    border-bottom: 1px solid var(--bs-border);
    vertical-align: top;
  }
  .chf-board-table tbody tr:last-child th,
  .chf-board-table tbody tr:last-child td {
    border-bottom: 0;
  }
  .chf-board-cmp-corner,
  .chf-board-cmp-rowlbl {
    width: 78px;
    min-width: 74px;
    padding: 10px;
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--bs-muted);
    background: var(--bs-sticky-bg);
    border-right: 1px solid var(--bs-border);
    position: sticky;
    left: 0;
    z-index: 3;
  }
  .chf-board-cmp-col {
    min-width: 132px;
    font-weight: 700;
    color: var(--bs-ink);
  }
  .chf-board-cmp-cell {
    color: var(--bs-ink);
    min-width: 132px;
  }
  @media (min-width: 768px) {
    .chf-board-cmp-corner,
    .chf-board-cmp-rowlbl { width: 96px; min-width: 92px; padding: 12px 14px; font-size: 12px; }
    .chf-board-cmp-col,
    .chf-board-cmp-cell { min-width: 156px; }
  }
  .chf-board-cmp-thumb {
    width: 100%;
    aspect-ratio: 16 / 10;
    border-radius: 10px;
    overflow: hidden;
    background: var(--bs-card-soft);
    border: 1px solid var(--bs-border);
    margin-bottom: 8px;
  }
  .chf-board-cmp-img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }
  .chf-board-cmp-price {
    font-weight: 700;
    font-variant-numeric: tabular-nums;
  }

  /* List layout (read-only checklist in slice 1) */
  .chf-board-list-group + .chf-board-list-group { margin-top: 18px; }
  .chf-board-list-heading {
    margin: 0 0 8px;
    font-size: 13px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--bs-muted);
  }
  .chf-board-check {
    width: 18px;
    height: 18px;
    flex-shrink: 0;
    margin-top: 3px;
    border-radius: 5px;
    border: 1.5px solid var(--bs-muted);
    opacity: 0.7;
  }

  /* Loading & 404 states */
  .chf-board-state,
  .chf-board-empty {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    min-height: 220px;
    gap: 12px;
    color: var(--bs-muted);
    font-size: 15px;
  }
  .chf-board-state-text { margin: 0; max-width: 320px; line-height: 1.5; }
  .chf-board-spinner {
    width: 28px;
    height: 28px;
    border-radius: 50%;
    border: 3px solid var(--bs-border);
    border-top-color: var(--bs-accent);
    animation: chfBoardSpin 0.9s linear infinite;
  }
  @keyframes chfBoardSpin { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) {
    .chf-board-spinner { animation: none; }
    .chf-board-dot { transition: none; }
  }

  /* Reserved room for slice 2's Kept tray (empty in slice 1) */
  .chf-board-tray-slot {
    flex-shrink: 0;
    min-height: calc(16px + env(safe-area-inset-bottom, 0px));
  }
</style>

<div class="chf-board-overlay" data-board-sheet hidden>
  <div class="chf-board-panel" data-board-panel tabindex="-1" role="dialog" aria-modal="true" aria-label="Presentation board"></div>
</div>
<script defer src="{{ 'static/board_sheet.js'|ver }}"></script>
