{# One builder for /work, /projects and the phone app. Hosts own chrome.
   Programs supplies the disclosure, card, checklist, form and chip vocabulary. #}
<section x-data='projectsPage({{ (projects_host|default("admin"))|tojson }})' x-init="rootEl = $el; load()" @chf-projects-open.window="load()"
         @chf-projects-context.window="sproutSection = $event.detail" x-show="!sproutSection || shownProjects.length > 0"
         @chf-admin-ready.window="load()" class="panel-page w-full max-w-2xl mx-auto px-4 py-6" x-cloak>
    <h2 class="panel-page-title">Projects</h2>
    <p class="text-xs text-gray-500 italic px-1" x-show="loading">Loading projects…</p>
    <p class="text-xs text-gray-500 italic px-1" x-show="error" x-text="error" role="status"></p>
    <div class="bg-gray-800 rounded-2xl border border-gray-700 p-4 mb-6">
        <button type="button" data-new-project @click="creating = !creating" :aria-expanded="creating"
                class="w-full flex items-center justify-between text-sm font-bold text-gray-200">
            <span>+ New project</span><span class="text-gray-500 text-xs" x-text="creating ? 'Hide' : 'Show'"></span>
        </button>
        <template x-if="creating">
            <form class="mt-3 space-y-2.5" @submit.prevent="create()">
                <label class="block text-xs text-gray-400">Title
                    <input name="title" required x-model="draft.title" class="w-full bg-gray-900 border border-gray-700 rounded-lg px-3 py-2 text-gray-100 text-sm">
                </label>
                <label class="block text-xs text-gray-400">Goal
                    <textarea name="goal" x-model="draft.goal" class="w-full bg-gray-900 border border-gray-700 rounded-lg px-3 py-2 text-gray-100 text-sm"></textarea>
                </label>
                <label class="block text-xs text-gray-400">Done when
                    <textarea name="done_when" x-model="draft.done_when" class="w-full bg-gray-900 border border-gray-700 rounded-lg px-3 py-2 text-gray-100 text-sm"></textarea>
                </label>
                <template x-if="isParent()">
                    <label class="block text-xs text-gray-400">Owner
                        <select name="owner_member_id" x-model="draft.owner_member_id" @change="defaultAudience()" class="w-full bg-gray-900 border border-gray-700 rounded-lg px-3 py-2 text-gray-100 text-sm">
                            <template x-for="m in owners()" :key="m.id"><option :value="m.id" x-text="m.name"></option></template>
                        </select>
                    </label>
                </template>
                <label class="block text-xs text-gray-400">Who can see it
                    <select name="audience" x-model="draft.audience" class="w-full bg-gray-900 border border-gray-700 rounded-lg px-3 py-2 text-gray-100 text-sm">
                        <option value="private">Private</option><option value="parents">Parents</option><option value="household">Household</option>
                    </select>
                </label>
                <label class="block text-xs text-gray-400">Target date (optional)
                    <input name="target_date" type="date" x-model="draft.target_date" class="w-full bg-gray-900 border border-gray-700 rounded-lg px-3 py-2 text-gray-100 text-sm">
                </label>
                <button data-create-project :disabled="!!busy" class="w-full text-sm font-bold px-3 py-2 rounded-lg bg-teal-700 text-white active:bg-teal-800 disabled:opacity-50">Create project</button>
            </form>
        </template>
    </div>
    <template x-if="!opened">
        <div>
            <div class="flex flex-wrap items-center gap-2 mb-3">
                <button type="button" data-lane-filter="programs" @click="programsOnly = !programsOnly; bindCards()" :aria-pressed="programsOnly ? 'true' : 'false'"
                        :class="programsOnly ? 'bg-teal-700 text-white border-teal-600' : 'bg-gray-800 text-gray-300 border-gray-700'"
                        class="text-xs font-bold px-2.5 py-1.5 rounded-lg border">Programs</button>
                <label class="ml-auto flex items-center gap-2 text-[11px] text-gray-500 cursor-pointer select-none">
                    <input type="checkbox" x-model="showClosed" @change="rememberClosed()" class="h-3.5 w-3.5 accent-teal-400"><span>Show closed</span>
                </label>
            </div>
            <p class="text-xs text-gray-500 italic px-1" x-show="!loading && !error && !shownProjects.length">No projects yet.</p>
            <template x-for="ln in lanes" :key="ln.key">
                <div class="mb-5" :data-lane="ln.key">
                    <button type="button" x-show="ln.key === 'closed'" @click="closedOpen = !closedOpen"
                            class="w-full flex items-center justify-between text-xs font-black uppercase tracking-widest px-1 mb-2 text-gray-600">
                        <span x-text="ln.label + ' (' + ln.items.length + ')'"></span>
                        <span class="normal-case font-semibold" x-text="closedOpen ? 'Hide' : 'Show'"></span>
                    </button>
                    <div x-show="ln.key !== 'closed'" class="text-xs font-black uppercase tracking-widest px-1 mb-2" :class="ln.titleClass" x-text="ln.label"></div>
                    <div class="space-y-2" x-show="ln.key !== 'closed' || closedOpen">
                        <template x-for="project in ln.items" :key="project.id">
                            <article data-project-card class="bg-gray-900 border border-gray-800 rounded-2xl p-3">
                                <button type="button" :data-project-id="project.id" @click="open(project)" class="w-full text-left">
                                    <span class="flex items-start justify-between gap-2">
                                        <span class="text-sm font-bold text-gray-100" x-text="project.title"></span>
                                        <span class="text-xs font-bold px-1.5 py-0.5 rounded shrink-0" :class="chip(project.state)" x-text="project.state"></span>
                                    </span>
                                    <span class="block text-[11px] text-gray-500 mt-0.5" x-text="memberName(project.owner_member_id)"></span>
                                    <span class="block text-xs text-gray-400 mt-1" x-text="project.card_next || ''"></span>
                                    <span class="block text-xs text-gray-500 mt-1" x-show="project.steps_total > 0" x-text="project.steps_done + ' of ' + project.steps_total + ' done'"></span>
                                </button>
                            </article>
                        </template>
                    </div>
                </div>
            </template>
            <template x-if="elsewhere.length && !programsOnly">
                <div class="mb-5" data-lane="elsewhere">
                    <div class="text-xs font-black uppercase tracking-widest px-1 mb-2 text-gray-500">Your work elsewhere</div>
                    <div class="space-y-2" data-pieces>
                        <template x-for="s in elsewhere" :key="s.id">
                            <div :data-piece="'mission:' + s.id">
                                <div x-html="window.Situations.cardHtml(s, sitCtx())"></div>
                                <div class="flex justify-end px-3 mt-1">
                                    <button type="button" :data-piece-open="'mission:' + s.id" @click="openSheet('mission', s.id, s.title, null)"
                                            class="text-xs font-bold text-teal-300 underline underline-offset-2">Open</button>
                                </div>
                            </div>
                        </template>
                    </div>
                </div>
            </template>
        </div>
    </template>
    <template x-if="opened && detail">
        <div data-project-detail class="space-y-3">
            <button type="button" data-project-back @click="back()" class="text-xs font-semibold text-gray-400 underline underline-offset-2">← All projects</button>
            <template x-for="project in [detail]" :key="project.id">
                <article data-project-card class="bg-gray-900 border border-gray-800 rounded-2xl p-3 space-y-2.5">
                    <div class="flex items-start justify-between gap-2">
                        <h3 class="text-base font-bold text-gray-100" x-text="project.title"></h3>
                        <span class="text-xs font-bold px-1.5 py-0.5 rounded shrink-0" :class="chip(project.state)" x-text="project.state"></span>
                    </div>
                        <p class="text-sm text-gray-300"><span class="text-gray-500">Goal: </span><span x-text="project.goal"></span></p>
                        <p class="text-sm text-gray-300"><span class="text-gray-500">Done when: </span><span x-text="project.done_when"></span></p>
                        <p class="text-xs text-gray-500" x-show="project.target_date" x-text="project.target_date ? 'Target: ' + project.target_date : ''"></p>
                        <ol class="space-y-1">
                            <template x-for="step in ordered(project)" :key="step.id">
                                <li :data-step-id="step.id" class="text-xs bg-gray-950/60 border border-gray-800 rounded-lg px-2.5 py-1.5 space-y-1">
                                    <div class="flex items-start justify-between gap-2">
                                        <div class="min-w-0">
                                            <div class="font-semibold text-gray-300" x-text="step.title"></div>
                                            <div class="text-gray-500"><span x-text="step.owner_label"></span><span x-text="step.due_date ? ' · Due ' + step.due_date : ''"></span></div>
                                        </div>
                                        <template x-if="step.owner !== 'argyle' && step.can_edit">
                                            <button type="button" :data-step-tick="step.id" @click="tick(project, step)" :disabled="!!busy"
                                                    :aria-pressed="step.state === 'done'" :aria-label="(step.state === 'done' ? 'Reopen ' : 'Complete ') + step.title"
                                                    class="text-xs font-bold px-2.5 py-1 rounded-lg bg-gray-800 text-gray-300 border border-gray-700 active:bg-gray-700 disabled:opacity-50"
                                                    x-text="step.state === 'done' ? '✓ Done' : 'Tick'"></button>
                                        </template>
                                    </div>
                                    <div class="text-gray-400" x-text="stepState(step.state)"></div>
                                    <template x-if="step.owner === 'argyle'">
                                        <div class="space-y-1">
                                            <template x-for="(line, i) in foundLines(step.found)" :key="i"><p class="text-gray-300" x-text="line"></p></template>
                                            <p class="text-gray-300" x-show="step.question" x-text="step.question ? 'Argyle needs you: ' + step.question : ''"></p>
                                            <template x-if="step.mission_id && !isChild()"><button type="button" :data-piece-open="'mission:' + step.mission_id" @click="openSheet('mission', step.mission_id, step.title, project.id)" class="text-blue-400 underline underline-offset-2">Open Argyle’s work and answer</button></template>
                                            <template x-if="step.state === 'doing' && step.can_cancel">
                                                <div class="flex flex-wrap gap-2">
                                                    <button type="button" :data-step-skip="step.id" @click="cancel(project, step, 'skip')" :disabled="!!busy" class="text-xs font-bold px-3 py-1.5 rounded-lg bg-gray-800 text-gray-300 border border-gray-700 active:bg-gray-700">Skip</button>
                                                    <button type="button" :data-step-stop="step.id" @click="cancel(project, step, 'stop')" :disabled="!!busy" class="text-xs font-bold px-3 py-1.5 rounded-lg bg-gray-800 text-gray-400 border border-gray-700 active:bg-gray-700">Stop</button>
                                                </div>
                                            </template>
                                        </div>
                                    </template>
                                    <template x-if="step.owner !== 'argyle'">
                                        <div class="space-y-1">
                                            <p class="text-gray-400" x-show="step.hold" x-text="step.hold ? 'On the calendar: ' + windowLabel(step.hold) : ''"></p>
                                            <template x-if="step.can_edit">
                                                <div class="flex flex-wrap gap-2">
                                                    <button type="button" :data-step-hold="step.id" @click="suggest(project, step)" :disabled="!!busy" class="text-xs font-semibold text-gray-500 underline underline-offset-2">Put it on the calendar</button>
                                                    <template x-if="step.hold"><button type="button" @click="writeStep(project, step, 'hold/clear', {})" :disabled="!!busy" class="text-xs font-semibold text-gray-500 underline underline-offset-2">Clear time</button></template>
                                                </div>
                                            </template>
                                            <template x-if="hold && hold.projectId === project.id && hold.stepId === step.id">
                                                <div class="mt-2 space-y-2">
                                                    <p class="text-gray-300" x-text="hold ? (hold.window ? windowLabel(hold.window) : hold.message) : ''"></p>
                                                    <div class="flex flex-wrap gap-2">
                                                        <template x-if="hold && hold.window"><button type="button" data-hold-confirm @click="keepHold(project, step)" :disabled="!!busy" class="text-xs font-bold px-3 py-1.5 rounded-lg bg-teal-700 text-white active:bg-teal-800">Keep this time</button></template>
                                                        <button type="button" @click="pickTime()" class="text-xs font-bold px-3 py-1.5 rounded-lg bg-gray-800 text-gray-300 border border-gray-700 active:bg-gray-700">Pick another time</button>
                                                        <button type="button" @click="hold = null" class="text-xs font-bold px-3 py-1.5 rounded-lg bg-gray-800 text-gray-300 border border-gray-700 active:bg-gray-700">Cancel</button>
                                                    </div>
                                                </div>
                                            </template>
                                        </div>
                                    </template>
                                </li>
                            </template>
                        </ol>
                        <template x-if="project.can_act"><button type="button" @click="addStep(project)" :disabled="!!busy" class="text-xs font-bold px-3 py-1.5 rounded-lg bg-gray-800 text-gray-300 border border-gray-700 active:bg-gray-700">Add a step</button></template>
                    <div class="space-y-2" data-pieces>
                        <div class="text-sm font-bold text-gray-300">Pieces</div>
                        <p class="text-xs text-gray-500 italic" x-show="!(pieces[project.id] || []).length">No pieces attached yet.</p>
                        <template x-for="card in (pieces[project.id] || [])" :key="card.kind + ':' + card.id">
                            <div :data-piece="card.kind + ':' + card.id">
                                <template x-if="card.situation">
                                    <div>
                                        <div x-html="window.Situations.cardHtml(card.situation, sitCtx())"></div>
                                        <template x-if="card.sheet">
                                            <div class="flex justify-end px-3 mt-1">
                                                <button type="button" :data-piece-open="card.kind + ':' + card.id" @click="openSheet(card.kind, card.id, card.title, project.id)"
                                                        class="text-xs font-bold text-teal-300 underline underline-offset-2">Open</button>
                                            </div>
                                        </template>
                                    </div>
                                </template>
                                <template x-if="card.kind === 'program'">
                                    <div class="bg-gray-900 border border-gray-800 rounded-2xl p-3">
                                        <div class="flex items-start justify-between gap-2">
                                            <span class="text-sm font-bold text-gray-100" x-text="card.title"></span>
                                            <span class="text-xs font-bold px-1.5 py-0.5 rounded shrink-0" :class="chip(card.program.state)" x-text="card.program.state"></span>
                                        </div>
                                        <p class="text-xs text-gray-400 mt-1" x-show="card.program.phase" x-text="card.program.phase"></p>
                                        <p class="text-xs text-blue-300 mt-1" x-show="card.program.state === 'proposed'">Proposed: see its week and approve it here.</p>
                                        <template x-if="card.sheet">
                                            <div class="flex justify-end mt-1">
                                                <button type="button" :data-piece-open="card.kind + ':' + card.id" @click="openSheet(card.kind, card.id, card.title, project.id)"
                                                        class="text-xs font-bold text-teal-300 underline underline-offset-2">Open</button>
                                            </div>
                                        </template>
                                    </div>
                                </template>
                                <template x-if="!card.sheet"><a :href="apiBase + card.link" class="text-xs text-blue-400 underline underline-offset-2" x-text="card.title"></a></template>
                            </div>
                        </template>
                    </div>
                    <template x-if="project.can_act && project.state === 'active'">
                        <div class="space-y-2">
                            <button type="button" data-add-piece @click="addPiece(project)" :disabled="!!busy"
                                    class="text-xs font-bold px-3 py-1.5 rounded-lg bg-gray-800 text-gray-300 border border-gray-700 active:bg-gray-700 disabled:opacity-50">Add a piece</button>
                            {% include 'components/project_piece_forms.html' %}
                        </div>
                    </template>
                        <template x-if="project.can_act">
                            <div class="flex flex-wrap gap-2 mt-2.5">
                                <template x-if="!isChild() && project.state === 'active'"><button type="button" @click="plan(project)" :disabled="!!busy" class="text-xs font-bold px-3 py-1.5 rounded-lg bg-gray-800 text-gray-300 border border-gray-700 active:bg-gray-700">Plan it with Argyle</button></template>
                                <template x-if="project.state === 'active'"><button type="button" @click="state(project, 'paused', 'Pause')" :disabled="!!busy" class="text-xs font-bold px-3 py-1.5 rounded-lg bg-gray-800 text-gray-300 border border-gray-700 active:bg-gray-700">Pause</button></template>
                                <template x-if="project.state === 'paused'"><button type="button" @click="state(project, 'active', 'Resume')" :disabled="!!busy" class="text-xs font-bold px-3 py-1.5 rounded-lg bg-teal-700 text-white active:bg-teal-800">Resume</button></template>
                                <template x-if="['active', 'paused'].includes(project.state)"><button type="button" @click="state(project, 'done', 'Mark done')" :disabled="!!busy" class="text-xs font-bold px-3 py-1.5 rounded-lg bg-emerald-700 text-white active:bg-emerald-800">Done</button></template>
                                <template x-if="['active', 'paused'].includes(project.state)"><button type="button" @click="state(project, 'dropped', 'Drop')" :disabled="!!busy" class="text-xs font-bold px-3 py-1.5 rounded-lg bg-gray-800 text-gray-400 border border-gray-700 active:bg-gray-700">Drop</button></template>
                            </div>
                        </template>
                </article>
            </template>
        </div>
    </template>
</section>
<script>
function projectsPage(host = 'admin') {
    return {
        host, rootEl: null, apiBase: window.chfBase !== undefined ? window.chfBase : '',
        projects: [], members: [], myId: '', loading: false, busy: false, error: '',
        creating: false, opened: null, hold: null, pieces: {}, elsewhere: [], contacts: [], pieceForm: null,
        emptyPieceForm: {title: '', goal: '', thread_kind: 'vendor', owner_member_id: '', contact_id: '',
                         counterparty_name: '', counterparty_email: '', next_action: '', next_action_at: '',
                         tier: 'mission', for_member_id: '', starting_point: '', sessions_per_week: 3, minutes: 25,
                         preferred_days: [], target_date: ''},
        // Alpine can evaluate form bindings once more while their x-if tears down.
        get pieceDraft() { return this.pieceForm || this.emptyPieceForm; },
        programsOnly: new URLSearchParams(location.search).get('lane') === 'programs',
        closedOpen: false,
        showClosed: (() => { try { return localStorage.getItem('chf_projects_show_closed') === '1'; } catch (e) { return false; } })(),
        sproutSection: document.documentElement.dataset.childStage === 'sprout',
        get shownProjects() { return this.sproutSection ? this.projects.filter(p => p.owner_member_id === this.myId) : this.projects; },
        draft: {title: '', goal: '', done_when: '', audience: 'private', owner_member_id: '', target_date: ''},
        headers() {
            const token = window.chfPersonToken ? window.chfPersonToken() : localStorage.getItem('chauffeur_member_token');
            return {'Content-Type': 'application/json', ...(token ? {'X-Member-Token': token} : {})};
        },
        async request(path, body, method = 'POST') {
            const r = await fetch(this.apiBase + path, {method: body === undefined ? 'GET' : method,
                headers: this.headers(), ...(body === undefined ? {} : {body: JSON.stringify(body)})});
            const data = await r.json();
            if (!r.ok || ['error','refused'].includes(data.status)) throw new Error(data.detail || data.message || 'Could not complete that request.');
            return data;
        },
        isChild() { const m = this.members.find(m => m.id === this.myId); return !!m && (m.role === 'child' || !!m.is_child); },
        isParent() { return !this.isChild() && this.members.some(m => m.id === this.myId && m.role === 'parent'); },
        owners() { return this.members.filter(m => ['parent','adult','child'].includes(m.role) && (m.status || 'active') === 'active' && !m.system); },
        defaultAudience() { const m = this.members.find(m => m.id === this.draft.owner_member_id); this.draft.audience = m && (m.role === 'child' || m.is_child) ? 'parents' : 'private'; },
        async load() {
            this.loading = true; this.error = '';
            const who = window.chfPersonId ? window.chfPersonId() : localStorage.getItem('chauffeur_member_id') || '';
            if (this.myId !== who) {
                this.projects = []; this.members = []; this.opened = null; this.hold = null; this.pieces = {}; this.elsewhere = []; this.contacts = []; this.pieceForm = null; this._addressed = false;
                this.creating = false;
                this.draft = {title:'', goal:'', done_when:'', audience:'private', owner_member_id:who, target_date:''};
            }
            this.myId = who;
            try {
                const [data, members] = await Promise.all([this.request('api/projects'), this.request('api/members')]);
                if (this.myId !== who) return;
                this.projects = data.projects || []; this.members = members;
                this.elsewhere = this.isChild() ? [] : ((await this.request('api/projects/elsewhere').catch(() => ({situations: []}))).situations || []);
                this.bindCards();
                if (!this.draft.owner_member_id || !this.creating) { this.draft.owner_member_id = who; this.defaultAudience(); }
                if (this.opened && this.detail) await this.loadPieces(this.detail);
                if (!this._addressed) { this._addressed = true; await this.fromAddress(); }
            } catch (e) { this.projects = []; this.error = e.message; }
            finally { this.loading = false; }
        },
        rememberClosed() { try { localStorage.setItem('chf_projects_show_closed', this.showClosed ? '1' : '0'); } catch (e) { /* private window */ } },
        get detail() { return this.projects.find(p => p.id === this.opened) || null; },
        get lanes() {
            const rows = this.shownProjects.filter(p => !this.programsOnly || p.has_program);
            const by = key => rows.filter(p => (p.lane || 'waiting') === key);
            const all = [
                {key: 'needs_you', label: 'Needs you', titleClass: 'text-amber-400', items: by('needs_you')},
                {key: 'moving', label: 'Moving', titleClass: 'text-teal-300', items: by('moving')},
                {key: 'waiting', label: 'Waiting', titleClass: 'text-gray-500', items: by('waiting')},
                {key: 'paused', label: 'Paused', titleClass: 'text-gray-500', items: by('paused')},
                {key: 'closed', label: 'Done & dropped', titleClass: 'text-gray-600', items: by('closed')},
            ];
            return all.filter(l => l.items.length && (l.key !== 'closed' || this.showClosed));
        },
        memberName(id) { const m = this.members.find(m => m.id === id); return m ? m.name : ''; },
        setAddress(params) {
            if (this.host !== 'admin') return;
            const q = new URLSearchParams(location.search);
            for (const [k, v] of Object.entries(params)) { if (v === null || v === undefined) q.delete(k); else q.set(k, v); }
            const s = q.toString();
            history.replaceState(history.state, '', location.pathname + (s ? '?' + s : '') + location.hash);
        },
        sitCtx() {
            return {apiBase: this.apiBase, canWrite: !this.isChild(), readOnly: false,
                    memberId: this.host === 'phone' ? this.myId : undefined,
                    lookup: (kind, id) => this.situationById(id), onChange: () => this.load()};
        },
        situationById(id) {
            for (const cards of Object.values(this.pieces)) { const c = cards.find(c => c.id === id && c.situation); if (c) return c.situation; }
            return this.elsewhere.find(s => s.id === id) || null;
        },
        bindCards() {
            const root = this.rootEl;
            if (!root) return;
            this.$nextTick(() => {
                if (!root.isConnected || !window.Situations) return;
                root.querySelectorAll('[data-pieces]').forEach(el => window.Situations.bind(el, this.sitCtx()));
            });
        },
        openSheet(kind, id, title, projectId) {
            window.dispatchEvent(new CustomEvent('chf-record-sheet-open', {detail: {kind, id, title: title || '', projectId: projectId || null}}));
        },
        async loadPieces(p) {
            try { this.pieces[p.id] = (await this.request('api/projects/' + encodeURIComponent(p.id) + '/pieces')).pieces || []; }
            catch (e) { this.error = e.message; }
            this.bindCards();
        },
        async open(p) {
            try {
                const data = await this.request('api/projects/' + encodeURIComponent(p.id));
                this.projects = this.projects.map(row => row.id === p.id ? {...row, ...data.project} : row);
                this.opened = p.id; this.hold = null; this.pieceForm = null;
                this.setAddress({id: p.id});
                await this.loadPieces(p);
            } catch (e) { this.error = e.message; }
        },
        back() { this.opened = null; this.hold = null; this.pieceForm = null; this.setAddress({id: null, piece: null}); this.bindCards(); },
        async fromAddress() {
            if (this.host !== 'admin') return;
            const q = new URLSearchParams(location.search);
            const id = q.get('id'), piece = q.get('piece') || '';
            const [kind, rid] = piece.includes(':') ? piece.split(':', 2) : [null, null];
            if (id && !this.opened) { const p = this.projects.find(p => p.id === id); if (p) await this.open(p); }
            if (!kind || !rid) return;
            if (!id) {
                const where = await this.request('api/projects/for/' + encodeURIComponent(kind) + '/' + encodeURIComponent(rid)).catch(() => null);
                if (where && where.project_id) { const p = this.projects.find(p => p.id === where.project_id); if (p) await this.open(p); }
                else if (!(where && where.record_visible)) { this.error = 'That isn’t here, or isn’t yours to see.'; return; }
            }
            this.openSheet(kind, rid, '', this.opened);
        },
        async addPiece(p) {
            const options = [{value: 'existing', label: 'Something already in Chauffeur'}];
            if (!this.isChild()) options.push({value: 'thread', label: 'A conversation with someone outside'}, {value: 'mission', label: 'Work for Argyle'});
            options.push({value: 'program', label: 'A practice program'});
            const pick = await promptChoice('Add a piece', '', options);
            if (!pick) return;
            if (pick === 'existing') return this.pickExisting(p);
            if (pick === 'thread' && !this.contacts.length) this.contacts = await this.request('api/assist-contacts').catch(() => []) || [];
            this.pieceForm = {projectId: p.id, kind: pick, title: '', goal: '', thread_kind: 'vendor', owner_member_id: this.myId,
                              contact_id: '', counterparty_name: '', counterparty_email: '', next_action: '', next_action_at: '',
                              tier: 'mission', for_member_id: this.myId, starting_point: '', sessions_per_week: 3, minutes: 25,
                              preferred_days: [], target_date: ''};
        },
        togglePieceDay(d) { if (!this.pieceForm) return; const days = this.pieceForm.preferred_days; const i = days.indexOf(d); if (i === -1) days.push(d); else days.splice(i, 1); },
        async pickExisting(p) {
            const q = await promptInput('Add something already in Chauffeur', 'A trip, an occasion, a list, a program…', {okText: 'Find it'});
            if (!q || !q.trim()) return;
            try {
                const found = (await this.request('api/subjects/search?q=' + encodeURIComponent(q.trim()))).candidates || [];
                if (!found.length) { showGlobalAlert('Nothing by that name.'); return; }
                const pick = await promptChoice('Which one?', '', found.map(c => ({value: c.kind + ':' + c.id, label: c.title + ' (' + c.kind + ')'})));
                if (!pick) return;
                const [kind, id] = pick.split(':', 2);
                if (await this.mutate('api/projects/' + encodeURIComponent(p.id) + '/pieces', {kind, id})) await this.loadPieces(p);
            } catch (e) { this.error = e.message; }
        },
        async createPiece() {
            const f = this.pieceForm;
            if (!f || this.busy) return;
            const project = this.detail;
            const body = f.kind === 'thread'
                ? {title: f.title.trim(), goal: f.goal, kind: f.thread_kind, owner_member_id: f.owner_member_id, contact_id: f.contact_id || null,
                   counterparty_name: f.counterparty_name, counterparty_email: f.counterparty_email, next_action: f.next_action,
                   next_action_at: f.next_action_at || null, project_id: f.projectId}
                : f.kind === 'mission'
                ? {goal: f.goal.trim(), tier: f.tier, project_id: f.projectId}
                : {title: f.title.trim(), for_member_id: f.for_member_id || this.myId, member_id: this.myId || null,
                   starting_point: f.starting_point.trim(), sessions_per_week: f.sessions_per_week || 3, minutes: f.minutes || 25,
                   preferred_days: f.preferred_days, target_date: f.target_date || null, project_id: f.projectId};
            const path = {thread: 'api/threads', mission: 'api/missions/launch', program: 'api/programs'}[f.kind];
            if (await this.mutate(path, body)) { this.pieceForm = null; if (project) await this.loadPieces(project); }
        },
        ordered(p) { return [...p.steps].sort((a,b) => a.order - b.order); },
        chip(state) { return {active:'bg-teal-500/20 text-teal-300', paused:'bg-amber-500/20 text-amber-300'}[state] || 'bg-gray-700 text-gray-300'; },
        foundLines(value, label = '') {
            if (value === null || value === undefined || value === '') return [];
            if (Array.isArray(value)) return value.flatMap(v => this.foundLines(v, label));
            if (typeof value === 'object') return Object.entries(value).flatMap(([k,v]) => this.foundLines(v, k.replace(/_/g, ' ')));
            return [(label ? label + ': ' : '') + String(value)];
        },
        stepState(state) { return {todo:'To do', doing:'In progress', done:'Done', skipped:'Skipped', blocked:'Needs you'}[state] || state; },
        windowLabel(w) {
            const date = new Date(w.date + 'T12:00:00').toLocaleDateString(undefined,
                {weekday:'short', month:'short', day:'numeric'});
            const time = value => window.formatClock ? window.formatClock(value)
                : new Date(w.date + 'T' + value).toLocaleTimeString('en-US', {hour:'numeric', minute:'2-digit'});
            return date + ', ' + time(w.start) + '–' + time(w.end);
        },
        async mutate(path, body) {
            if (this.busy) return false;
            this.busy = true; this.error = '';
            try { await this.request(path, body); await this.load(); return true; }
            catch (e) { this.error = e.message; return false; }
            finally { this.busy = false; }
        },
        async create() {
            if (this.busy) return;
            this.busy = true; this.error = '';
            try {
                const d = await this.request('api/projects', {...this.draft, target_date: this.draft.target_date || null});
                this.creating = false; this.opened = d.project.id;
                this.draft = {title:'', goal:'', done_when:'', audience:'private', owner_member_id:this.myId, target_date:''};
                await this.load();
            } catch (e) { this.error = e.message; }
            finally { this.busy = false; }
        },
        stepPath(p,s) { return 'api/projects/' + encodeURIComponent(p.id) + '/steps/' + encodeURIComponent(s.id) + '/'; },
        writeStep(p,s,path,body) { return this.mutate(this.stepPath(p,s) + path, body); },
        tick(p,s) { return this.writeStep(p,s,'state',{state: s.state === 'done' ? 'todo' : 'done'}); },
        async cancel(p,s,outcome) {
            if (await promptConfirm(outcome === 'skip' ? 'Skip this step?' : 'Stop this work?', outcome === 'skip' ? 'This ends this step and lets its dependent steps go on.' : 'This stops the work and leaves this step blocked.', outcome === 'skip' ? 'Skip' : 'Stop', 'Cancel'))
                await this.writeStep(p,s,'cancel',{outcome});
        },
        async suggest(p,s) {
            this.error = '';
            try { const d = await this.request(this.stepPath(p,s) + 'hold', {}); this.hold = {projectId:p.id, stepId:s.id, window:d.window, message:d.message || ''}; }
            catch (e) { this.error = e.message; }
        },
        async pickTime() {
            const hold = this.hold;
            const text = await promptInput('Pick another time', 'Enter a date and start and end times: YYYY-MM-DD HH:MM HH:MM.', {value:hold.window ? hold.window.date + ' ' + hold.window.start + ' ' + hold.window.end : '', placeholder:'YYYY-MM-DD HH:MM HH:MM', okText:'Use this time'});
            if (text === null || this.hold !== hold) return;
            const parts = text.trim().split(/\s+/);
            if (parts.length !== 3 || !/^\d{4}-\d{2}-\d{2}$/.test(parts[0]) || !parts.slice(1).every(t => /^\d{2}:\d{2}$/.test(t))) { this.error = 'Use YYYY-MM-DD HH:MM HH:MM.'; return; }
            this.hold.window = {date:parts[0], start:parts[1], end:parts[2]};
        },
        async keepHold(p,s) { if (await this.writeStep(p,s,'hold',this.hold.window)) this.hold = null; },
        async state(p,state,label) {
            if (await promptConfirm(label + ' this project?', ['done','dropped'].includes(state) ? 'Argyle’s running work ends. Pieces and records stay.' : state === 'paused' ? 'Argyle’s work pauses until you resume.' : 'Argyle’s ready work can continue.', label, 'Cancel'))
                await this.mutate('api/projects/' + encodeURIComponent(p.id) + '/state', {state});
        },
        async addStep(p) {
            const title = await promptInput('Add a step', 'What needs doing?');
            if (!title || !title.trim()) return;
            const options = this.isChild() ? [{value:this.myId,label:'Me'}] : [...this.owners().map(m => ({value:m.id,label:m.name})), {value:'argyle',label:'Argyle'}];
            const owner = await promptChoice('Who will do it?', '', options);
            if (!owner) return;
            let goal = '';
            if (owner === 'argyle') { goal = await promptInput('Argyle’s goal', 'What should Argyle find or do?'); if (!goal) return; }
            await this.mutate('api/projects/' + encodeURIComponent(p.id) + '/steps', {title:title.trim(), owner, goal});
        },
        async plan(p) {
            if (await promptConfirm('Plan it with Argyle?', 'Argyle will help plan the next part. You approve the plan before its steps are added.', 'Plan it', 'Cancel')) {
                if (await this.mutate('api/projects/' + encodeURIComponent(p.id) + '/plan', {})) await this.loadPieces(p);
            }
        },
    };
}
</script>
