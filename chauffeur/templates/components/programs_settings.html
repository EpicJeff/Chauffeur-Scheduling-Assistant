{% from 'components/settings_drawer.html' import settings_section with context %}
{% call settings_section('programs-settings', 'Programs') %}
            <div class="bg-gray-900 rounded-xl p-4 space-y-3">
                <label class="flex items-center justify-between gap-3">
                    <span class="text-xs text-gray-300">
                        Programs
                        <span class="block text-[11px] text-gray-500 mt-0.5">
                            Off means no asks, no re-baselining and no findings.
                        </span>
                    </span>
                    <input type="checkbox" x-model="s.programs_enabled" @change="saveProgramSettings()"
                        class="shrink-0">
                </label>
                <label class="flex items-center justify-between gap-3">
                    <span class="text-xs text-gray-300">
                        Make a plan when none is found
                        <span class="block text-[11px] text-gray-500 mt-0.5">
                            When research turns up no published program for an aim, the app
                            writes one and labels it as its own. Off means those programs
                            claim practice time and carry no plan at all.
                        </span>
                    </span>
                    <input type="checkbox" x-model="s.programs_generate_enabled"
                        @change="saveProgramSettings()" class="shrink-0">
                </label>
            </div>
            {% endcall %}
            <section id="lessons" data-settings-section class="scroll-mt-28">
                <div class="text-xs font-semibold text-gray-500 uppercase tracking-widest mb-2">Lessons</div>
                <div class="bg-gray-900 rounded-xl p-4 space-y-3">
                    <label class="flex items-center justify-between gap-3">
                        <span class="text-xs text-gray-300">
                            Lesson scripts
                            <span class="block text-[11px] text-gray-500 mt-0.5">
                                Write a short scripted lesson for each practice session the
                                night before. Off still shows the plain steps — only the
                                depth is lost.
                            </span>
                        </span>
                        <input type="checkbox" x-model="s.program_lessons_enabled"
                            @change="saveProgramSettings()" class="shrink-0">
                    </label>
                    <label class="flex items-center justify-between gap-3">
                        <span class="text-xs text-gray-300">
                            Questions a day during a session
                            <span class="block text-[11px] text-gray-500 mt-0.5">
                                How many times anybody in the house may tap
                                &ldquo;Explain this&rdquo; inside a lesson before the app
                                stops answering for the day. Zero switches it off.
                                Nothing asked or answered is ever recorded.
                            </span>
                        </span>
                        <input type="number" min="0" max="200" step="1"
                            x-model.number="s.lesson_help_daily_cap"
                            @change="saveProgramSettings()"
                            class="w-20 bg-gray-900 border border-gray-700 rounded-lg px-2 py-1.5 text-white text-center shrink-0">
                    </label>
                    <label class="flex items-center justify-between gap-3">
                        <span class="text-xs text-gray-300">
                            Tries per lesson
                            <span class="block text-[11px] text-gray-500 mt-0.5">
                                How many times the lesson writer (Write lessons on the
                                library page, or the nightly retry) may spend a model call
                                on one lesson that keeps failing before it stops and leaves
                                the plain steps. Outages, quota and paused models never count;
                                Regenerate on a lesson starts the count over.
                            </span>
                        </span>
                        <input type="number" min="1" max="20" step="1"
                            x-model.number="s.lesson_max_attempts"
                            @change="saveProgramSettings()"
                            class="w-20 bg-gray-900 border border-gray-700 rounded-lg px-2 py-1.5 text-white text-center shrink-0">
                    </label>
                    <label class="flex items-center justify-between gap-3">
                        <span class="text-xs text-gray-300">
                            Lesson writing model
                            <span class="block text-[11px] text-gray-500 mt-0.5">
                                Best available uses Flash first and spends the daily Flash
                                quota; low cost starts on Gemma.
                            </span>
                        </span>
                        <select x-model="s.lesson_pool" @change="saveProgramSettings()"
                            class="bg-gray-900 border border-gray-700 rounded-lg px-2 py-1.5 text-white text-xs shrink-0">
                            <option value="heavy">Best available</option>
                            <option value="background">Low cost</option>
                        </select>
                    </label>
                </div>
            </section>
            {% call settings_section('programs-pacing', 'Pacing') %}
            <div class="bg-gray-900 rounded-xl p-4 space-y-3">
                <label class="flex items-center justify-between gap-3">
                    <span class="text-xs text-gray-300">
                        Ask after (hours)
                        <span class="block text-[11px] text-gray-500 mt-0.5">
                            How long after a practice window ends before asking whether it happened.
                        </span>
                    </span>
                    <input type="number" min="0" step="0.5" x-model.number="s.programs_ask_grace_hours"
                        @change="saveProgramSettings()"
                        class="w-20 bg-gray-900 border border-gray-700 rounded-lg px-2 py-1.5 text-white text-center shrink-0">
                </label>
                <label class="flex items-center justify-between gap-3">
                    <span class="text-xs text-gray-300">
                        Look back (days)
                        <span class="block text-[11px] text-gray-500 mt-0.5">
                            How far back the check for a struggling program looks.
                        </span>
                    </span>
                    <input type="number" min="1" step="1" x-model.number="s.programs_rebaseline_days"
                        @change="saveProgramSettings()"
                        class="w-20 bg-gray-900 border border-gray-700 rounded-lg px-2 py-1.5 text-white text-center shrink-0">
                </label>
                <label class="flex items-center justify-between gap-3">
                    <span class="text-xs text-gray-300">
                        Re-baseline at most every (days)
                        <span class="block text-[11px] text-gray-500 mt-0.5">
                            The minimum gap between two timeline stretches, so a plan cannot chatter about bending.
                        </span>
                    </span>
                    <input type="number" min="1" step="1" x-model.number="s.programs_rebaseline_cooldown_days"
                        @change="saveProgramSettings()"
                        class="w-20 bg-gray-900 border border-gray-700 rounded-lg px-2 py-1.5 text-white text-center shrink-0">
                </label>
                <label class="flex items-center justify-between gap-3">
                    <span class="text-xs text-gray-300">
                        Pages to read
                        <span class="block text-[11px] text-gray-500 mt-0.5">
                            How many real pages a curation run reads before proposing a plan. One run per program, cached for its life.
                        </span>
                    </span>
                    <input type="number" min="1" step="1" x-model.number="s.programs_research_pages"
                        @change="saveProgramSettings()"
                        class="w-20 bg-gray-900 border border-gray-700 rounded-lg px-2 py-1.5 text-white text-center shrink-0">
                </label>
            </div>
            {% endcall %}
