<!-- The lesson player. One scene at a time, tap to advance. The renderer
     owns every pixel; a script only parameterizes it. Nothing in here
     records how a lesson went: a check tap advances the scene, full stop.
     The only persisted outcome of practice anywhere is the session log,
     and the final screen merely offers that existing tap -- the player
     itself never posts. It dispatches `lesson-player:done` and the page
     that opened it calls its own existing log action.

     Preview mode: `lesson-player:open`'s detail may carry `preview: true`
     (the lesson editor's own "Play this" tap, and the forced-sweep
     report's "Play" tap -- both in programs.html -- open onto scenes
     nobody has actually reached tonight yet). A preview plays exactly
     like a real session -- same scenes, same primitives, same fallback
     ladder -- except that it can never end in a write: the footer's
     final-scene button closes instead of asking to log, and finish()
     returns before either the ask or the `lesson-player:done` dispatch,
     so neither this page's own listener nor app.html's can ever turn a
     preview into a session. The header carries a small marker the whole
     time so nobody watching mistakes it for the real thing.

     Fallback ladder, always: a window with no stored lesson plays its own
     plain steps as beats (`stepsToScenes`). The player must never block
     practice, which is what makes this shippable before any generation
     exists (program_lessons.py, Task 4) -- `open()` is only ever called
     with `lesson: null` until a later task starts writing scripts.

     Scene shapes come from services/program_lessons.py's `sanitize_script`:
     say / do / check / show. Every `show` primitive that module's
     PRIMITIVES dict validates now draws a real picture: `timer` /
     `metronome` (the countdown ring and the beat pulse), `keyboard` /
     `fretboard` (SVG built from the note/dot params -- the fretboard
     drawn the way a book draws one: vertical strings, low E left, frets
     running downward), `cards` (tap-driven, scene-local) and `counter`
     (a paced, tap-STARTED count, scene-local -- a tap begins it, then it
     advances itself on `seconds_per_rep`, with a tick and, where a voice
     exists, a spoken number; see startCounterPace() below). isRenderableShow()
     stays an explicit allow-list rather than "any primitive with a kind" --
     a future 7th primitive shipped without a renderer still falls through
     to its caption as a say beat, mirroring the sanitizer's own degrade
     rule for a primitive this file has never heard of.

     One presentation, two sizes: `?panel=true` is read directly (the
     kiosk-shares-logic / TripLogic pattern -- see docs/ui_design_guide.md)
     rather than this becoming a second component, and `panel-modal` is the
     class components/avatar_editor.html and the pet_* overlays already use
     so a full-screen modal reads as opaque on a wall board instead of the
     board's own see-through glass (panel_skin.html's `.panel-modal` rule). -->
<style>
    [x-cloak] { display: none !important; }

    /* A beat fading up, replayed on every scene change -- including two
       back-to-back scenes of the SAME type (several `do` steps, one after
       another), where Alpine never removes/re-adds the element so the
       animation would otherwise only ever play once. `replayBeat()` below
       forces it by toggling this class across a reflow. */
    @keyframes lpBeatIn {
        from { opacity: 0; transform: translateY(14px); }
        to   { opacity: 1; transform: translateY(0); }
    }
    .lp-beat-in { animation: lpBeatIn .45s ease-out; }

    /* The metronome's visible pulse. The real beat is the Web Audio click
       in startMetronome(); this is only ever a picture of it. */
    @keyframes lpMetroPulse {
        0%, 100% { transform: scale(1); opacity: .5; }
        50%      { transform: scale(1.4); opacity: 1; }
    }
    .lp-metro-dot { animation: lpMetroPulse 1s ease-in-out infinite; }
</style>

<div x-data="lessonPlayer()" x-show="openFlag" x-cloak
     @lesson-player:open.window="open($event.detail.window, $event.detail.lesson, $event.detail.preview)"
     class="panel-modal fixed inset-0 z-[90] bg-gray-950/95 flex flex-col select-none"
     :class="panel ? 'text-2xl' : 'text-base'">

    <!-- header: program title, session label, close -->
    <div class="shrink-0 flex items-center gap-3 px-4 py-3 border-b border-gray-800">
        <span class="shrink-0" :class="panel ? 'text-3xl' : 'text-xl'">&#9654;&#65039;</span>
        <div class="min-w-0 flex-1">
            <div class="font-black text-gray-100 truncate" :class="panel ? 'text-2xl' : 'text-base'"
                 x-text="(w || {}).title || 'Practice'"></div>
            <div class="text-gray-400 truncate" :class="panel ? 'text-base' : 'text-[11px]'"
                 x-show="(w || {}).session_label" x-text="(w || {}).session_label"></div>
            <!-- The preview marker: the only visible difference while a
                 preview plays out, so nobody watching mistakes a slot
                 nobody has reached tonight for a real session. Same
                 semantic-tint chip vocabulary docs/ui_design_guide.md
                 names (`bg-teal-500/20 text-teal-300`), in the player's
                 own voice rather than a technical "PREVIEW MODE" label. -->
            <span x-show="preview" class="inline-block font-bold rounded bg-teal-500/20 text-teal-300 mt-0.5"
                 :class="panel ? 'text-xs px-2 py-0.5' : 'text-[10px] px-1.5 py-0.5'">Just a look — nothing gets saved</span>
        </div>
        <!-- Which room this board speaks into. Panel only: a phone in a
             pocket has its own speaker and a teenager's lesson does not
             play to the kitchen. Shows the room when there is one and
             offers to set one when there is not, so the once-per-device
             ask is never the only way in and a wrong answer is one tap
             from being right. -->
        <button type="button" x-show="panel" @click="askRoom()"
                class="shrink-0 rounded-full border font-bold px-4 h-14 text-base"
                :class="room ? 'bg-teal-500/20 border-teal-500/40 text-teal-300'
                             : 'bg-gray-800 border-gray-700 text-gray-400'"
                x-text="room ? ('🔈 ' + room) : 'Set room'"></button>
        <!-- Argyle's voice, off for this session. Always visible, never a
             setting: a lesson in a quiet house is the same lesson, and a
             person who wants the voice back gets it by tapping again or
             by opening the player tomorrow. Sits beside Close because
             those are the two things a person reaches for without
             looking. -->
        <button type="button" @click="toggleMute()"
                :aria-label="muted ? 'Turn the voice on' : 'Turn the voice off'"
                :title="muted ? 'Voice off — tap for sound' : 'Voice on — tap for quiet'"
                class="shrink-0 rounded-full border leading-none grid place-items-center"
                :class="(muted ? 'bg-gray-800 border-gray-700 text-gray-400 ' : 'bg-teal-500/20 border-teal-500/40 text-teal-300 ')
                        + (panel ? 'w-14 h-14 text-2xl' : 'w-10 h-10 text-base')"
                x-text="muted ? '🔇' : '🔊'"></button>
        <button type="button" @click="close()"
                class="shrink-0 rounded-full bg-gray-800 border border-gray-700 text-gray-300 leading-none grid place-items-center"
                :class="panel ? 'w-14 h-14 text-3xl' : 'w-10 h-10 text-xl'">&times;</button>
    </div>

    <!-- scene area: one scene, keyed by idx, tap (almost) anywhere to advance
         -- except on the LAST scene, where this ambient handler is inert.
         Advancing off the last scene is finish(), and finishing offers an
         irreversible write (services/programs.py's `sessions` is append-only,
         there is no unlog, and a logged session moves the child's rung on
         via `programs.unit_for`). A whole-screen tap target is the right
         shape for "next beat" and completely the wrong one for that, so the
         last step out is the footer button alone, and that button asks
         first. Safe today only by luck: `stepsToScenes` always ends on a
         `check`, whose own three buttons carry .stop, but _SYSTEM asks the
         model for a check "near the end" and a generated script routinely
         ends on say/do/show. -->
    <div class="flex-1 min-h-0 overflow-y-auto flex flex-col items-center justify-center gap-5 p-6 text-center lp-beat-in"
         x-effect="idx, $nextTick(() => replayBeat($el))"
         @click="scene().type !== 'check' && !isLast() && advance()">

        <div class="uppercase tracking-widest text-teal-400 font-black"
             :class="panel ? 'text-sm' : 'text-[11px]'" x-show="kicker()" x-text="kicker()"></div>

        <!-- say: an animated text beat. Also where a `show` this player has
             no primitive for lands -- its caption reads exactly like a say,
             which is the sanitizer's own degrade rule mirrored client-side. -->
        <template x-if="scene().type === 'say' || (scene().type === 'show' && !isRenderableShow(scene()))">
            <div class="w-full max-w-sm font-bold text-gray-100" :class="panel ? 'text-3xl' : 'text-xl'"
                 x-text="sayText()"></div>
        </template>

        <!-- do: the drill itself, live -->
        <template x-if="scene().type === 'do'">
            <div class="w-full max-w-sm font-bold text-gray-100" :class="panel ? 'text-3xl' : 'text-xl'"
                 x-text="scene().text"></div>
        </template>

        <!-- check: fixed taps, never stored -- answerCheck() only advances.
             .stop on every tap is load-bearing, not decoration: this block
             sits inside the scene-area div, whose own handler is
             `scene().type !== 'check' && advance()`. Without .stop, a tap
             here runs answerCheck() -> advance() (idx already moved), THEN
             bubbles to that ancestor, which re-reads scene() against the
             now-NEXT scene -- and if that scene is not itself a check, the
             bubbled click double-advances, skipping a scene (and killing
             whatever enterScene() just started for it) or finishing a
             scene early. Invisible today only because stepsToScenes always
             puts the check last, where the second read still sees 'check'
             and the `&&` short-circuits; a generated script's MID-lesson
             check would not be so lucky. -->
        <template x-if="scene().type === 'check'">
            <div class="w-full max-w-sm space-y-5">
                <div class="font-bold text-gray-100" :class="panel ? 'text-3xl' : 'text-xl'" x-text="scene().ask"></div>
                <div class="flex flex-col gap-2.5">
                    <button type="button" @click.stop="answerCheck()"
                            class="w-full rounded-xl bg-teal-700 text-white font-bold active:brightness-90"
                            :class="panel ? 'py-4 text-2xl' : 'py-2.5 text-sm'">Got it</button>
                    <button type="button" @click.stop="answerCheck()"
                            class="w-full rounded-xl bg-gray-800 border border-gray-700 text-gray-200 font-bold active:bg-gray-700"
                            :class="panel ? 'py-4 text-2xl' : 'py-2.5 text-sm'">Almost</button>
                    <button type="button" @click.stop="answerCheck()"
                            class="w-full rounded-xl bg-gray-800 border border-gray-700 text-gray-400 font-bold active:bg-gray-700"
                            :class="panel ? 'py-4 text-2xl' : 'py-2.5 text-sm'">Not yet</button>
                </div>
            </div>
        </template>

        <!-- wait: a beat whose content is that nothing happens. The
             countdown is here so a person CAN watch it, and the line
             underneath says they do not have to -- the call into the room
             is armed on the server the moment this scene opens and
             survives the player being closed, the tablet sleeping and the
             app restarting. Honest about the other half of that bargain
             too: a lesson keeps no place, so coming back means starting
             from the top. Said on the surface rather than discovered. -->
        <template x-if="scene().type === 'wait'">
            <div class="w-full max-w-sm flex flex-col items-center gap-4">
                <div class="font-bold text-gray-100" :class="panel ? 'text-3xl' : 'text-xl'"
                     x-text="scene().text"></div>
                <div class="font-black tabular-nums text-teal-300"
                     :class="panel ? 'text-7xl' : 'text-5xl'"
                     x-text="fmtClock(waitLeft)"></div>
                <div class="text-gray-400" :class="panel ? 'text-lg' : 'text-xs'"
                     x-show="scene().announce">
                    <span x-show="room">You can close this — Argyle will call the
                        <span x-text="room"></span> when it is up. Coming back
                        starts the lesson again from the top.</span>
                    <span x-show="!room">This screen will tell you when it is up.</span>
                </div>
            </div>
        </template>

        <!-- show: primitive dispatch. Every kind
             services/program_lessons.py's PRIMITIVES dict validates now
             draws a real picture: timer/metronome (the ring and pulse
             below), keyboard/fretboard (SVG from note/dot arithmetic),
             cards (tap-driven, scene-local) and counter (a paced,
             tap-started count, scene-local). The caption renders
             first, the same top-to-bottom order the ring and pulse below
             already use. isRenderableShow stays an explicit allow-list
             rather than "any primitive" so a future 7th kind shipped
             without a renderer still falls through to its caption, the
             same call sanitize_script already makes server-side for a
             broken primitive. -->
        <template x-if="scene().type === 'show' && isRenderableShow(scene())">
            <div class="w-full flex flex-col items-center gap-4">
                <div class="text-gray-400" :class="panel ? 'text-xl' : 'text-sm'"
                     x-show="scene().caption" x-text="scene().caption"></div>

                <!-- keyboard: SVG built purely from note-name arithmetic,
                     see keyboardSvg() below -- highlighted keys only, no
                     per-key hand-drawn rect. -->
                <template x-if="scene().primitive.kind === 'keyboard'">
                    <div class="w-full mx-auto" :class="panel ? 'max-w-2xl' : 'max-w-xs'"
                         x-html="keyboardSvg(scene().primitive.keys)"></div>
                </template>

                <!-- fretboard: SVG built purely from dot-grid arithmetic,
                     see fretboardSvg() below. Vertical (book-convention)
                     diagrams are narrower than they are tall, the opposite
                     aspect ratio of keyboard/cards above -- reusing THEIR
                     wide containers (max-w-2xl on panel) would stretch a
                     ~240-viewBox-unit-wide diagram to 672px and its height
                     along with it, well past a full screen. A narrower cap
                     here is a direct consequence of the orientation fix,
                     not a stray style choice. -->
                <template x-if="scene().primitive.kind === 'fretboard'">
                    <div class="w-full mx-auto" :class="panel ? 'max-w-sm' : 'max-w-xs'"
                         x-html="fretboardSvg(scene().primitive.dots, scene().primitive.muted)"></div>
                </template>

                <!-- cards: one pair at a time, tap the card to flip. .stop
                     on every tap here is the same load-bearing guard the
                     check buttons use above -- this scene area's own
                     handler is `scene().type !== 'check' && advance()`,
                     which a bare `show` scene does NOT skip, so an
                     unguarded flip/prev/next tap would both do its own
                     thing AND advance past the scene in the same motion.
                     Position and flip state live only in cardIdx/
                     cardFlipped, reset unconditionally at the top of
                     enterScene() -- never fetched, never stored. -->
                <template x-if="scene().primitive.kind === 'cards'">
                    <div class="w-full flex flex-col items-center gap-4"
                         :class="panel ? 'max-w-2xl' : 'max-w-sm'">
                        <div @click.stop="toggleCardFlip()"
                             class="w-full aspect-[3/2] rounded-2xl bg-gray-800 border border-gray-700 flex items-center justify-center p-6 cursor-pointer active:bg-gray-700"
                             :class="panel ? 'text-3xl' : 'text-xl'">
                            <div class="font-bold text-gray-100 text-center" x-text="cardFace()"></div>
                        </div>
                        <div class="flex items-center gap-1.5">
                            <template x-for="(p, i) in (scene().primitive.pairs || [])" :key="i">
                                <span class="rounded-full"
                                      :class="i === cardIdx ? 'bg-teal-400 w-5 h-1.5' : 'bg-gray-700 w-1.5 h-1.5'"></span>
                            </template>
                        </div>
                        <div class="flex items-center gap-4">
                            <button type="button" @click.stop="cardPrev()"
                                    class="rounded-lg bg-gray-800 border border-gray-700 text-gray-300 font-bold active:bg-gray-700"
                                    :class="panel ? 'px-6 py-3 text-xl' : 'px-4 py-2 text-sm'">Prev</button>
                            <span class="text-gray-400" :class="panel ? 'text-lg' : 'text-xs'"
                                  x-text="(cardIdx + 1) + ' / ' + (scene().primitive.pairs || []).length"></span>
                            <button type="button" @click.stop="cardNext()"
                                    class="rounded-lg bg-gray-800 border border-gray-700 text-gray-300 font-bold active:bg-gray-700"
                                    :class="panel ? 'px-6 py-3 text-xl' : 'px-4 py-2 text-sm'">Next</button>
                        </div>
                    </div>
                </template>

                <!-- counter: a PACED count, not a tap-per-rep -- nobody
                     can stop mid-exercise to tap a phone. One tap on the
                     dial starts it; it then advances itself on the
                     primitive's own seconds_per_rep, with a tick and (where
                     a voice exists) a spoken number, same .stop guard as
                     cards and the same reason. A tap while it is running
                     pauses it; a tap while paused (and not yet at target)
                     resumes it; counterTap() is the one handler for all
                     three, and it never touches anything but its own
                     in-memory counterVal/counterRunning. Reaching target
                     stops itself -- see tickCounter() -- so finishing never
                     needs a tap either. -->
                <template x-if="scene().primitive.kind === 'counter'">
                    <div class="w-full flex flex-col items-center gap-3">
                        <div @click.stop="counterTap()"
                             class="rounded-full border-2 flex items-center justify-center cursor-pointer active:bg-gray-700"
                             :class="[panel ? 'w-48 h-48' : 'w-32 h-32',
                                      counterDone() ? 'bg-teal-900/40 border-teal-400' : 'bg-gray-800 border-teal-700']">
                            <div class="font-black text-gray-100" :class="panel ? 'text-6xl' : 'text-5xl'" x-text="counterVal"></div>
                        </div>
                        <div class="text-gray-400" :class="panel ? 'text-lg' : 'text-xs'"
                             x-text="'of ' + (scene().primitive.target || 0)"></div>
                        <div class="font-bold" :class="[panel ? 'text-base' : 'text-xs',
                                                         counterDone() ? 'text-teal-400' : 'text-gray-400']"
                             x-text="counterStatusText()"></div>
                    </div>
                </template>
            </div>
        </template>

        <!-- the countdown ring: a `do` with seconds, or a `show timer` -->
        <div class="relative w-36 h-36 mx-auto" x-show="timerSeconds() > 0">
            <svg class="absolute inset-0 w-full h-full -rotate-90" viewBox="0 0 100 100">
                <circle cx="50" cy="50" r="44" fill="none" stroke="currentColor" class="text-gray-400/70" stroke-width="8"></circle>
                <circle cx="50" cy="50" r="44" fill="none" stroke="currentColor" class="text-teal-400" stroke-width="8" stroke-linecap="round"
                        :stroke-dasharray="ringC" :stroke-dashoffset="ringOffset()"></circle>
            </svg>
            <div class="absolute inset-0 flex items-center justify-center font-black text-gray-100"
                 :class="panel ? 'text-3xl' : 'text-2xl'" x-text="fmtClock(timeLeft)"></div>
        </div>

        <!-- the metronome: a `do` with metronome_bpm, or a `show metronome` -->
        <div class="flex items-center justify-center gap-2.5" x-show="metroBpm() > 0">
            <span class="rounded-full bg-teal-400 lp-metro-dot" :class="panel ? 'w-5 h-5' : 'w-3.5 h-3.5'"
                  :style="'animation-duration:' + (60 / (metroBpm() || 100)) + 's'"></span>
            <span class="text-gray-400" :class="panel ? 'text-lg' : 'text-xs'" x-text="metroBpm() + ' bpm'"></span>
        </div>
    </div>

    <!-- footer: where this came from, progress dots (position only, never
         results), advance tap -->
    <div class="shrink-0 px-4 py-4 border-t border-gray-800 space-y-3">
        <!-- Where the lesson came from, which is the whole point of the
             cited/generated split and was visible nowhere: a cited script
             names the page it was written from and links it, a generated one
             says the app wrote it, and a window with no script at all says
             it is playing the plan's own steps. Metadata styling per
             docs/ui_design_guide.md ("metadata text-[11px] ... text-gray-400").
             In the FOOTER rather than over the scene, so the link is not
             inside the tap-to-advance area at all. On a wall board the host
             is plain text: a panel has one window and no way back from a
             page it navigates to. -->
        <div class="flex items-center justify-center gap-1.5 flex-wrap" x-show="originLabel()">
            <span class="font-semibold text-gray-400" :class="panel ? 'text-base' : 'text-[11px]'"
                  x-text="originLabel()"></span>
            <template x-if="sourceHost() && !panel">
                <a :href="(lesson || {}).source_url" target="_blank" rel="noopener"
                   class="text-[11px] font-bold text-blue-400 underline underline-offset-2"
                   x-text="sourceHost()"></a>
            </template>
            <template x-if="sourceHost() && panel">
                <span class="text-base font-semibold text-gray-400" x-text="sourceHost()"></span>
            </template>
        </div>
        <div class="flex items-center justify-center gap-1.5">
            <template x-for="(sc, i) in scenes" :key="i">
                <span class="rounded-full" :class="i === idx ? 'bg-teal-400 w-5 h-1.5' : 'bg-gray-700 w-1.5 h-1.5'"></span>
            </template>
        </div>
        <!-- the final screen: on the last scene this same tap is the "log
             it?" ask -- tapping it calls advance(), which (already on the
             last index) calls finish(), which ASKS and then only ever
             DISPATCHES; the page that opened the player owns the actual log
             write. A check scene skips this row entirely -- its own three
             taps already advance, last scene or not, and land on the same
             finish() and the same ask.
             This button says "Finish", not "Log it?", wherever the HOST
             never turns a finished session into a write -- read off
             `hostListens` (window.chfHasLessonDoneListener), not `panel`:
             a wall board (home.html) and the calendar page (calendar.html)
             both register no `lesson-player:done` listener at all, by
             design (a panel authenticates as a place, not a person; the
             calendar page has no session log to write to at all), so
             gating this on panel alone used to leave a non-panel host with
             no listener asking the identical dishonest question and
             recording nothing either way. See `hostListens`'s own comment
             above for the announcement this reads. -->
        <button type="button" @click="advance()" x-show="scene().type !== 'check'"
                class="w-full rounded-xl bg-blue-600 text-white font-bold active:bg-blue-700"
                :class="panel ? 'py-4 text-2xl' : 'py-3 text-sm'"
                x-text="isLast() ? (preview ? 'Close' : (hostListens ? 'Log it?' : 'Finish')) : 'Continue'"></button>
    </div>
</div>

<script>
function lessonPlayer() {
    // Shared by keyboardSvg()/fretboardSvg()'s SVG <text> -- pinned
    // explicitly rather than left to inherit, see fretboardSvg's own
    // comment for why: a glyph an SVG's own font-matching substitutes
    // unpredictably is the wrong place to save a few characters.
    const FONT_ATTR = 'font-family="Inter,ui-sans-serif,system-ui,-apple-system,'
        + '&quot;Segoe UI&quot;,Roboto,Arial,sans-serif"';
    // Mirrors program_lessons.COUNTER_DEFAULT_SPR -- applied here only as a
    // last-resort fallback for a counter primitive stored before
    // seconds_per_rep existed (sanitize_script now fills the field in on
    // every scene it builds, but an old row in program_lessons was never
    // re-sanitized, so the client still needs its own default).
    const COUNTER_DEFAULT_SPR = 3;

    return {
        openFlag: false, w: null, scenes: [], idx: 0,
        // The lesson ROW behind the scenes (origin, source_url), kept so the
        // footer can say where this came from. `usingLesson` is false when
        // the fallback ladder built the scenes from the window's own steps,
        // which is a different, equally honest thing to say.
        lesson: null, usingLesson: false,
        // True only when opened via `lesson-player:open`'s `preview: true`
        // (the editor's "Play this", the sweep report's "Play"). Read by
        // the footer's label and by finish() -- see both below -- and by
        // nothing else: every other behaviour (scene rendering, primitives,
        // checks, the fallback ladder, stopSound on close) is identical in
        // a preview and a real session.
        preview: false,
        panel: new URLSearchParams(location.search).get('panel') === 'true',
        // Whether THIS PAGE ever turns a finished session into a write --
        // a different question than `panel` answers, and the one finish()
        // below actually needs. programs.html and app.html both react to
        // `lesson-player:done` (onLessonDone, askProgramSession) and each
        // sets this flag right next to its own listener, so the
        // announcement cannot drift from the thing it announces. home.html
        // and calendar.html never set it: a panel authenticates as a
        // place, not a person, and the calendar page owns no log-a-session
        // action to call at all. There is no reliable way to sniff
        // `window` for a registered listener instead -- no such
        // introspection exists for a custom event, and programs.html's own
        // listener is an Alpine directive (`@lesson-player:done.window`),
        // not even a bare addEventListener a script could find -- so the
        // host has to say so itself, the same way window.chfBase and the
        // other chf-prefixed globals already announce a capability of the
        // page to whatever shared component reads it.
        hostListens: !!window.chfHasLessonDoneListener,
        timer: null, timeLeft: 0, timerTotal: 0, audio: null, metroTimer: null,
        ringC: 2 * Math.PI * 44,
        // cards/counter: scene-local only, reset every enterScene() --
        // never persisted, see counterTap()/toggleCardFlip() below.
        // counterTimer drives the counter's own paced advance, same
        // never-survives-the-scene rule as `timer`/`metroTimer` above --
        // stopSound() clears it too (a rep count is not a metronome or a
        // countdown, but it is exactly as scene-local as either one).
        cardIdx: 0, cardFlipped: false, counterVal: 0, counterRunning: false,
        counterTimer: null,
        // Which room this SCREEN is in, on a wall panel. Empty everywhere
        // else and empty until somebody says -- see loadRoom()/askRoom().
        room: '',
        // A wait beat's on-screen countdown. Cosmetic only -- the call
        // into the room is armed on the server and outlives this.
        waitLeft: 0, waitTimer: null,
        // The current beat's cues and how many of them have already been
        // said. A cursor rather than a set, which is safe because the
        // sanitizer stores them sorted by `at`. Both reset on every scene
        // entry and cleared in stopSound().
        cues: [], cuesFired: 0,
        // Argyle's voice, silenced for THIS session only. Session-local
        // like every other flag here, and deliberately not a setting: a
        // quiet house tonight is not a household that never wants a voice,
        // and the tap is one press away every time the player opens.
        muted: false,

        open(w, lesson, preview) {
            this.w = w || {};
            this.lesson = lesson || null;
            this.preview = !!preview;
            this.muted = false;
            this.usingLesson = !!(lesson && (lesson.scenes || []).length);
            this.scenes = this.usingLesson
                ? lesson.scenes : this.stepsToScenes(this.w);
            this.idx = 0; this.openFlag = true;
            this.room = this.loadRoom();
            // Asked ONCE per device, and never again whatever the answer
            // was -- a household that wants the panel to stay quiet says
            // so by cancelling, and the header chip is how they change
            // their mind later. Not awaited: the session starts on time
            // and this first one's session-level lines come out of the
            // panel itself, which is what would have happened anyway.
            if (this.panel && !this.preview && !this.room) this.maybeAskRoom();
            // A preview is never greeted. Everything else about it plays
            // identically -- same scenes, same voice on each of them --
            // but being welcomed by name to a session nobody is actually
            // having is the one place the header's marker chip is not
            // enough, and it is the same call finish() already makes at
            // the other end.
            if (!this.preview) this.say(this.greetingLine());
            this.enterScene();
        },

        // The two lines Argyle says that no model ever writes: how it
        // opens and how it closes. Template strings off the window's own
        // fields, so there is no call to fail, nothing to screen, and no
        // way for a lesson script to put words in the house voice's mouth
        // at the two moments a person is most likely to be listening.
        greetingLine() {
            const who = (this.w || {}).member_name || '';
            const what = (this.w || {}).title || 'practice';
            return who ? `Ready, ${who}? ${what}.` : `Ready? ${what}.`;
        },
        sendOffLine() { return "That's the session. Nice work."; },

        // Where this lesson came from, in the family's own terms. A cited
        // script names the host it was written from (linked, off-panel);
        // a generated one says so outright, which is the honest label an
        // uncited unit is supposed to carry and which nothing on any screen
        // was actually showing; and a window playing the fallback ladder
        // says that too, rather than passing plain steps off as a lesson.
        originLabel() {
            if (!this.usingLesson) return "The plan's own steps";
            return this.sourceHost() ? 'From' : 'Written by the app';
        },
        sourceHost() {
            const u = (this.lesson && this.lesson.source_url) || '';
            if (!u) return '';
            try { return new URL(u).hostname.replace(/^www\./, ''); }
            catch (e) { return u.slice(0, 40); }
        },

        // The fallback ladder: a window with no lesson plays its own steps.
        // The player never blocks practice.
        stepsToScenes(w) {
            const scenes = [];
            if (w.unit_title) scenes.push({type: 'say', text: w.unit_title});
            (w.steps || []).forEach(s => scenes.push({type: 'do', text: s}));
            if (!scenes.length && w.milestone)
                scenes.push({type: 'say', text: w.milestone});
            scenes.push({type: 'check', ask: 'Good session?'});
            return scenes;
        },

        scene() { return this.scenes[this.idx] || {type: 'say', text: ''}; },
        isLast() { return this.idx >= this.scenes.length - 1; },

        // A `show` whose kind this renderer draws -- every kind
        // services/program_lessons.py's PRIMITIVES dict validates, now
        // that keyboard/fretboard/cards/counter join timer/metronome.
        // Kept as an explicit allow-list rather than "any primitive with
        // a kind" so a future 7th primitive shipped without a renderer
        // still falls through to the say-shaped caption below, the same
        // call sanitize_script already makes server-side for a broken
        // primitive.
        isRenderableShow(s) {
            return !!(s && s.primitive && ['timer', 'metronome', 'keyboard',
                'fretboard', 'cards', 'counter'].includes(s.primitive.kind));
        },

        // `say` always has non-empty text (sanitize_script drops an empty
        // or screened say beat outright), but a `show` scene is explicitly
        // allowed an empty caption even when its primitive is valid -- and
        // an unrenderable kind (every kind PRIMITIVES validates draws a
        // picture as of Task 12, so this is only ever a future 7th
        // primitive shipped ahead of its renderer) lands here on that
        // caption alone. A bare '' as the last resort used to mean a
        // literally blank content area: no kicker, no ring, no metronome,
        // no text. The third term is a real sentence so that shape can
        // never happen.
        sayText() {
            const s = this.scene();
            return s.text || s.caption || (s.type === 'show' ? 'New material.' : '');
        },

        kicker() {
            const t = this.scene().type;
            if (t === 'do') return 'Practice';
            if (t === 'check') return 'Quick check';
            return '';
        },

        // Seconds/bpm for whichever scene is showing, whether it arrived as
        // a `do`'s own fields or as a `show timer` / `show metronome`
        // primitive -- one place the ring and the pulse both read from.
        timerSeconds() {
            const s = this.scene();
            if (s.type === 'do' && s.seconds) return s.seconds;
            if (s.type === 'show' && s.primitive && s.primitive.kind === 'timer') return s.primitive.seconds;
            return 0;
        },
        metroBpm() {
            const s = this.scene();
            if (s.type === 'do' && s.metronome_bpm) return s.metronome_bpm;
            if (s.type === 'show' && s.primitive && s.primitive.kind === 'metronome') return s.primitive.bpm;
            return 0;
        },

        // keyboard / fretboard: pure functions from a validated primitive's
        // own params to an SVG string, bound via x-html (the same pattern
        // components/pet_battle.html already uses for a pet's `.svg`
        // field). Both use one small, fixed geometry table applied by a
        // loop -- never a per-key or per-fret hand-written rect.

        // 12 chromatic slots -> geometry, C..B. `w`: white-key index
        // within the octave. `b`: the boundary (right edge of white key N)
        // a black key sits on. Same table for every note; the note name
        // only ever selects an index into it.
        keyboardSvg(keys) {
            const NAT = {C: 0, D: 2, E: 4, F: 5, G: 7, A: 9, B: 11};
            const GEOM = [{w: 0}, {b: 0}, {w: 1}, {b: 1}, {w: 2}, {w: 3},
                          {b: 3}, {w: 4}, {b: 4}, {w: 5}, {b: 5}, {w: 6}];
            const notes = (Array.isArray(keys) ? keys : []).map(k => {
                const m = /^([A-G])([#b]?)(\d)$/.exec(k || '');
                if (!m) return null;
                const semi = ((NAT[m[1]] + (m[2] === '#' ? 1 : m[2] === 'b' ? -1 : 0)) + 12) % 12;
                return {octave: parseInt(m[3], 10), semi};
            }).filter(Boolean);
            if (!notes.length) return '';
            // The octave window CONTAINING the highlighted keys, capped at
            // two -- a wider span clamps to the first two rather than
            // stretching the keybed to fit every requested key. Capping is
            // allowed to be silent about WHICH two octaves it kept; it is
            // never allowed to be silent about a highlighted key it then
            // drew nothing for -- see `dropped` below, the same honesty
            // fretboardSvg's own window enforces for dots.
            const minO = Math.min(...notes.map(n => n.octave));
            const maxO = Math.min(Math.max(...notes.map(n => n.octave)), minO + 1);
            const dropped = notes.filter(n => n.octave > maxO).length;
            const on = new Set(notes.filter(n => n.octave <= maxO)
                                     .map(n => n.octave + ':' + n.semi));
            const W = 32, H = 120, BW = 20, BH = 74, accent = '#2dd4bf';
            const HEAD = dropped ? 22 : 0;
            let whites = '', blacks = '';
            for (let o = minO; o <= maxO; o++) {
                const baseX = (o - minO) * 7 * W;
                GEOM.forEach((g, p) => {
                    const hi = on.has(o + ':' + p);
                    if (g.w !== undefined) {
                        whites += `<rect x="${baseX + g.w * W}" y="${HEAD}" width="${W - 2}" height="${H}" rx="4" `
                            + `fill="${hi ? accent : '#f1f5f9'}" stroke="#475569" stroke-width="1.5"></rect>`;
                    } else {
                        const x = baseX + (g.b + 1) * W - BW / 2;
                        blacks += `<rect x="${x}" y="${HEAD}" width="${BW}" height="${BH}" rx="3" `
                            + `fill="${hi ? accent : '#1e293b'}" stroke="rgba(255,255,255,0.35)" stroke-width="1"></rect>`;
                    }
                });
            }
            const totalW = (maxO - minO + 1) * 7 * W;
            // Whenever `dropped` is nonzero the window is necessarily the
            // full two octaves (a single-octave window can only happen
            // when nothing exceeded it), so there is always room for this
            // line -- see the Node-verified geometry notes in the fix
            // report for the proof.
            const head = dropped
                ? `<text x="${totalW}" y="${HEAD - 7}" text-anchor="end" ${FONT_ATTR} class="text-amber-400" `
                    + `font-size="12" font-weight="800" fill="currentColor">+${dropped} more `
                    + `key${dropped > 1 ? 's' : ''} beyond this window &#8594;</text>`
                : '';
            return `<svg viewBox="0 0 ${totalW} ${H + HEAD}" class="w-full h-auto" preserveAspectRatio="xMidYMid meet">`
                + head + whites + blacks + `</svg>`;
        },

        // Vertical, book-convention diagram: strings are vertical lines,
        // LOW E (string 6) leftmost, HIGH E (string 1) rightmost -- the way
        // a method book prints a chord, never a mirror-image or a
        // face-each-other view (see the fix report for the ambiguity that
        // forced this call explicitly). Frets are horizontal lines running
        // DOWNWARD from the nut. The window still widens to the dots' own
        // fret span (a chord shape almost always fits) up to a sane cap;
        // only a span past that cap falls back to compression, and even
        // then a compressed dot is marked unmistakably as approximate
        // rather than drawn as if it were exact -- the renderer owning
        // drawing is what makes a wrong spec VISIBLE, and a
        // confidently-wrong chord diagram in a teaching tool is worse than
        // none. An open string (fret 0) draws as an O above the nut, and a
        // muted string (see `muted` -- an optional per-string list,
        // program_lessons._valid_fretboard) as an X beside it; neither is
        // a dot and neither is ever squeezed into the fret-1 row, where an
        // O would be indistinguishable from an actually-fretted note. A
        // string carrying a real dot never also gets a mute mark -- the
        // dot already says more than an X could, so it wins. Either mark
        // lives ABOVE the nut and means nothing without it, so having
        // either one forces the window to start at fret 1 even when every
        // fretted dot sits higher up the neck -- never a diagram that
        // shows an open string with no nut in view.
        fretboardSvg(dots, muted) {
            const clean = (Array.isArray(dots) ? dots : []).map(d => ({
                string: parseInt(d && d.string, 10),
                fret: parseInt(d && d.fret, 10),
                finger: parseInt(d && d.finger, 10),
            })).filter(d => d.string >= 1 && d.string <= 6 && d.fret >= 0 && d.fret <= 24
                          && d.finger >= 1 && d.finger <= 4);
            const dotStrings = new Set(clean.map(d => d.string));
            const mutedStrings = (Array.isArray(muted) ? muted : [])
                .map(m => parseInt(m, 10))
                .filter(s => s >= 1 && s <= 6 && !dotStrings.has(s));
            if (!clean.length && !mutedStrings.length) return '';
            const openDots = clean.filter(d => d.fret === 0);
            const frettedDots = clean.filter(d => d.fret > 0);

            const STR_GAP = 34, FRET_H = 46, BASE_WIN = 5, MAX_WIN = 12;
            const TOP = 56, LEFT = 22, RIGHT = 48, BOTTOM = 30;
            // An open or muted mark lives above the nut and means nothing
            // unless the nut is actually in view, so either one pins
            // `start` to fret 1 regardless of where the fretted dots sit.
            // Otherwise frettedDots is never empty AND anchored below fret
            // 1 at once (fret > 0 by definition), so `start` always lands
            // exactly on the lowest fretted dot -- clamping below the
            // window can never happen in that branch either; only ABOVE
            // it can, once the true span outgrows MAX_WIN.
            const hasHeadMarks = openDots.length > 0 || mutedStrings.length > 0;
            const minFret = frettedDots.length ? Math.min(...frettedDots.map(d => d.fret)) : 1;
            const maxFret = frettedDots.length ? Math.max(...frettedDots.map(d => d.fret)) : minFret;
            const start = hasHeadMarks ? 1 : Math.max(1, minFret);
            const span = Math.min(Math.max(maxFret - start + 1, 1), MAX_WIN);
            const WIN = Math.max(BASE_WIN, span);
            const gx = LEFT, gy = TOP;
            const w = gx + 5 * STR_GAP + RIGHT, h = gy + WIN * FRET_H + BOTTOM;
            const solid = '#0f766e';
            let body = '';

            // Strings: 6 vertical lines. colOf() below is the one place
            // the low-E-left/high-E-right mapping lives.
            for (let col = 0; col < 6; col++) {
                const x = gx + col * STR_GAP;
                body += `<line x1="${x}" y1="${gy}" x2="${x}" y2="${gy + WIN * FRET_H}" class="text-gray-400/70" `
                    + `stroke="currentColor" stroke-width="1.5"></line>`;
            }
            // Frets: horizontal lines running down the neck. The topmost
            // one is the NUT (thick) only when the window starts at fret
            // 1; a window that starts higher draws an ordinary fret line
            // there instead, and the `${start}fr` marker below names which
            // fret it actually is -- exactly how a book prints a diagram
            // that does not start at the nut.
            for (let f = 0; f <= WIN; f++) {
                const y = gy + f * FRET_H;
                const isNut = start === 1 && f === 0;
                body += `<line x1="${gx}" y1="${y}" x2="${gx + 5 * STR_GAP}" y2="${y}" class="text-gray-400/70" `
                    + `stroke="currentColor" stroke-width="${isNut ? 5 : 1.5}"></line>`;
            }
            if (start > 1) {
                body += `<text x="${gx}" y="${gy - 12}" text-anchor="start" ${FONT_ATTR} class="text-slate-400" `
                    + `font-size="14" font-weight="800" fill="currentColor">${start}fr</text>`;
            }

            const colOf = string => gx + (6 - string) * STR_GAP;

            // Open strings: an O above the nut, on the string's own line --
            // no finger number inside it (there is no finger on an open
            // string), and structurally above the grid so it can never
            // land in the same row as a real fret-1 dot.
            openDots.forEach(d => {
                const x = colOf(d.string), y = gy - 24;
                body += `<circle cx="${x}" cy="${y}" r="9" fill="none" class="text-teal-400" `
                    + `stroke="currentColor" stroke-width="2.5"></circle>`;
            });
            // Muted strings: an X in that same row -- a string is never
            // both (mutedStrings above already excludes any string that
            // carries a real dot, open or fretted).
            mutedStrings.forEach(s => {
                const x = colOf(s), y = gy - 24, r = 7;
                body += `<line x1="${x - r}" y1="${y - r}" x2="${x + r}" y2="${y + r}" `
                    + `stroke="#64748b" stroke-width="2.5" stroke-linecap="round"></line>`
                    + `<line x1="${x - r}" y1="${y + r}" x2="${x + r}" y2="${y - r}" `
                    + `stroke="#64748b" stroke-width="2.5" stroke-linecap="round"></line>`;
            });

            // Fretted: true position whenever it fits the window (which
            // widened to the real span, up to MAX_WIN -- a realistic
            // one-finger-per-fret run across six frets gets six distinct
            // ROWS, not five). Finger numbers stay inside the dot. Only a
            // dot further out than MAX_WIN frets from `start` falls back
            // to the bottom row, and there it is drawn as a dashed,
            // unfilled, amber ring with its REAL fret number written
            // BELOW it -- approximate and visibly so, never mistaken for
            // an exact position. The label sits below rather than beside
            // the dot on purpose: an out-of-window dot always lands in the
            // bottom row (see the row clamp) but can be in ANY of the 6
            // string columns, including the rightmost, where a label
            // drawn to the side could run past the viewBox.
            frettedDots.forEach(d => {
                const inWindow = d.fret <= start + WIN - 1;
                const row = Math.max(0, Math.min(WIN - 1, d.fret - start));
                const x = colOf(d.string), y = gy + (row + 0.5) * FRET_H;
                if (inWindow) {
                    body += `<circle cx="${x}" cy="${y}" r="12" fill="${solid}"></circle>`
                        + `<text x="${x}" y="${y}" text-anchor="middle" dominant-baseline="central" ${FONT_ATTR} `
                        + `font-size="13" font-weight="800" fill="#fff">${d.finger}</text>`;
                } else {
                    body += `<circle cx="${x}" cy="${y}" r="12" fill="none" stroke="currentColor" class="text-amber-400" `
                        + `stroke-width="2.5" stroke-dasharray="4,3"></circle>`
                        + `<text x="${x}" y="${y}" text-anchor="middle" dominant-baseline="central" ${FONT_ATTR} class="text-amber-400" `
                        + `font-size="13" font-weight="800" fill="currentColor">${d.finger}</text>`
                        + `<text x="${x}" y="${y + 24}" text-anchor="middle" ${FONT_ATTR} class="text-amber-400" `
                        + `font-size="10" font-weight="700" fill="currentColor">${d.fret}fr</text>`;
                }
            });
            return `<svg viewBox="0 0 ${w} ${h}" class="w-full h-auto" preserveAspectRatio="xMidYMid meet">${body}</svg>`;
        },

        // cards / counter: within-scene state only, reset unconditionally
        // at the top of enterScene() below -- never fetched, never stored.
        // Every tap that touches them carries .stop in the markup above so
        // it can never bubble into the scene area's own tap-to-advance
        // handler, the same guard the check buttons need and explain in
        // full further up this file.
        cardFace() {
            const s = this.scene();
            const pairs = (s.primitive && s.primitive.pairs) || [];
            const pair = pairs[this.cardIdx];
            return this.cardFlipped ? ((pair && pair.back) || '') : ((pair && pair.front) || '');
        },
        toggleCardFlip() { this.cardFlipped = !this.cardFlipped; },
        cardPrev() {
            if (this.cardIdx > 0) { this.cardIdx--; this.cardFlipped = false; }
        },
        cardNext() {
            const s = this.scene();
            const pairs = (s.primitive && s.primitive.pairs) || [];
            if (this.cardIdx < pairs.length - 1) { this.cardIdx++; this.cardFlipped = false; }
        },
        // A rep count is a within-scene convenience, not a record: no
        // fetch, no storage, just counterVal ticking toward the
        // primitive's own target. It used to be tap-PER-rep, which nobody
        // can actually do mid-exercise -- you cannot stop after each
        // push-up to tap a phone. One tap now starts a PACED count instead:
        // it advances itself on the primitive's own seconds_per_rep, same
        // idea as an instructor counting reps out loud with even space
        // between numbers. counterTap() is the single handler the dial's
        // own @click.stop calls; it only ever decides start-vs-pause and
        // never touches counterVal directly itself.
        counterTap() {
            const s = this.scene();
            const target = (s.primitive && s.primitive.target) || 0;
            if (target <= 0 || this.counterVal >= target) return;
            if (this.counterRunning) { this.pauseCounter(); return; }
            this.startCounterPace();
        },
        startCounterPace() {
            const s = this.scene();
            const raw = (s.primitive && s.primitive.seconds_per_rep) || COUNTER_DEFAULT_SPR;
            // Independently bounded client-side, same discipline
            // fretboardSvg's own `clean` filter uses -- the server already
            // clamps seconds_per_rep to 1-10 (program_lessons._valid_counter),
            // but a primitive stored before that existed has no field to
            // clamp, so this is a wide defensive floor/ceiling, not the
            // real UX range.
            const spr = Math.max(1, Math.min(30, raw));
            this.counterRunning = true;
            // Announce the first rep right away, same pattern
            // startMetronome() already uses for its own first click --
            // only on a true fresh start, never on a resume (counterVal
            // already > 0), or resuming mid-count would fire an extra,
            // early tick on top of whatever cadence was already running.
            if (this.counterVal === 0) this.tickCounter();
            if (this.counterTimer) clearInterval(this.counterTimer);
            this.counterTimer = setInterval(() => this.tickCounter(), spr * 1000);
        },
        // The one place that stops the pace, called both when a person
        // taps to pause AND when tickCounter() reaches target on its own --
        // finishing the count is visible (the dial's own done styling,
        // counterStatusText()) and never needs a tap.
        pauseCounter() {
            this.counterRunning = false;
            if (this.counterTimer) { clearInterval(this.counterTimer); this.counterTimer = null; }
        },
        tickCounter() {
            const s = this.scene();
            const target = (s.primitive && s.primitive.target) || 0;
            if (this.counterVal >= target) { this.pauseCounter(); return; }
            this.counterVal++;
            this.playClick();
            this.speakCount(this.counterVal);
            if (this.counterVal >= target) this.pauseCounter();
        },
        counterDone() {
            const s = this.scene();
            const target = (s.primitive && s.primitive.target) || 0;
            return target > 0 && this.counterVal >= target;
        },
        counterStatusText() {
            if (this.counterDone()) return 'All done';
            if (this.counterRunning) return 'Counting — tap to pause';
            if (this.counterVal > 0) return 'Paused — tap to resume';
            return 'Tap to start';
        },
        // Speech is a pure enhancement, never a dependency -- every call is
        // wrapped, and a missing speechSynthesis or an empty voice list
        // (the HA wall panel plausibly has neither) just leaves the tick as
        // the only signal. cancel() first means a cadence the browser
        // cannot keep up with never queues a backlog of stale numbers: the
        // newest count is always the one that gets said, in step with the
        // tick and the dial rather than trailing behind them.
        speakCount(n) {
            try {
                if (this.muted) return;
                const synth = window.speechSynthesis;
                if (!synth || !(synth.getVoices() || []).length) return;
                synth.cancel();
                synth.speak(new SpeechSynthesisUtterance(String(n)));
            } catch (e) { /* the tick alone is never blocked by a speech failure */ }
        },

        // --- Argyle's voice ------------------------------------------
        // One door for everything spoken inside a session. A voiceless
        // device -- a wall panel with no engine installed, a browser that
        // throws on getVoices() -- still plays the whole lesson: speech
        // is an enhancement here and never a dependency, the same bargain
        // speakCount() above already makes for a rep count, which is why
        // every line of this is inside the try.
        //
        // cancel() before every line for the same reason it fires per
        // tick up there: the newest thing Argyle has to say is always the
        // one worth hearing, and a backlog of stale sentences read over a
        // scene that has already moved on is worse than silence.
        //
        // Voice is picked by LANGUAGE PREFIX rather than an exact match,
        // because a script asking for `pt-BR` on a machine that only ships
        // `pt-PT` is far better served by a Portuguese voice than by the
        // English default reading Portuguese words aloud.
        // WHERE a session-level line goes. Two channels, split by latency
        // and nothing else: a greeting, a scene's own line and the
        // send-off sit BETWEEN beats and can afford a round trip through
        // Home Assistant, so on a wall panel standing in a named room
        // they come out of that room's own speaker in the house voice.
        // Everything in-beat -- a cue at 0:30, a rep count -- calls
        // sayLocal() directly instead, because a line that arrives after
        // the moment it was about is worse than one nobody heard.
        say(text, lang, tone) {
            if (this.muted || !text) return;
            if (this.roomSay(text)) return;
            this.sayLocal(text, lang, tone);
        },

        // The room channel. Fire-and-forget on purpose: a session must
        // never wait on Home Assistant, and a room that will not take the
        // line is a room that stays quiet, not a lesson that stalls.
        // Returns whether the line was HANDED OFF, so say() knows not to
        // also read it out of the panel's own tinny speaker.
        //
        // Never in a preview: a look at a lesson nobody is having is not
        // a reason to talk to the house.
        roomSay(text) {
            if (!this.panel || !this.room || this.preview) return false;
            try {
                fetch((window.chfBase || '') + 'api/lessons/speak', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({room: this.room, text: String(text)}),
                }).catch(() => {});
            } catch (e) { return false; }
            return true;
        },

        // Which room this SCREEN is in. Deliberately not a per-card
        // setting: the music card has one because a music card is often
        // pointed at another room on purpose, but a screen is in exactly
        // one place and two cards on one panel cannot be in two of them.
        // No board-level or device-level room binding exists in this app
        // today, so the panel asks whoever is standing at it, once, and
        // keeps the answer on the device -- a per-viewer convenience,
        // which is exactly what localStorage is for, and a wrong answer
        // costs one re-ask.
        //
        // A host-set `window.chfLessonRoom` wins outright, the same
        // chf-prefixed pattern window.chfBase and chfHasLessonDoneListener
        // already use, so a board that ever does learn its own room has a
        // door to land in without this component changing.
        loadRoom() {
            if (window.chfLessonRoom) return String(window.chfLessonRoom);
            try { return localStorage.getItem('chf-lesson-room') || ''; }
            catch (e) { return ''; }
        },
        async askRoom() {
            const answer = await promptInput(
                'Which room is this screen in?',
                'Argyle will speak this session through that room’s '
                + 'speaker. The name Home Assistant knows it by.',
                {placeholder: 'Kitchen', value: this.room || '',
                 okText: 'Use this room'});
            // null is a CANCEL and means leave it alone; '' typed on
            // purpose means stop speaking into a room. Only the second
            // one clears what is stored.
            if (answer === null) return this.room;
            const room = (answer || '').trim();
            this.room = room;
            try {
                if (room) localStorage.setItem('chf-lesson-room', room);
                else localStorage.removeItem('chf-lesson-room');
            } catch (e) { /* a private window still gets a voice tonight */ }
            return room;
        },
        // The once-per-device version. A cancel is an ANSWER -- this
        // panel stays local -- so the marker is written either way and
        // nothing asks again unprompted; the header chip is the hand path
        // back for a household that changes its mind.
        async maybeAskRoom() {
            try {
                if (localStorage.getItem('chf-lesson-room-asked')) return '';
                localStorage.setItem('chf-lesson-room-asked', '1');
            } catch (e) { return ''; }
            return await this.askRoom();
        },

        sayLocal(text, lang, tone) {
            if (this.muted || !text) return;
            try {
                const synth = window.speechSynthesis;
                if (!synth) return;
                synth.cancel();
                const u = new SpeechSynthesisUtterance(String(text));
                if (lang) {
                    const v = (synth.getVoices() || []).find(
                        v => v.lang && v.lang.toLowerCase().startsWith(
                            String(lang).slice(0, 2).toLowerCase()));
                    if (v) u.voice = v;
                    u.lang = lang;
                }
                // One persona, two paces. `calm` is a wind-down voice --
                // slower and a shade lower; `coach` is the ordinary one.
                u.rate = tone === 'calm' ? 0.85 : 1.0;
                u.pitch = tone === 'calm' ? 0.9 : 1.0;
                synth.speak(u);
            } catch (e) { /* a voiceless device still runs the scene */ }
        },

        // --- cues: what Argyle says while the drill runs ---------------
        // A cue is owed by ELAPSED TIME, never delivered by a chain of
        // setTimeouts. The difference matters on exactly the devices this
        // runs on: a backgrounded tab, a locked phone, a wall board under
        // load. A timeout chain in a throttled tab fires late and, worse,
        // drifts away from the countdown ring beside it -- two clocks
        // disagreeing about how far into a beat we are. This asks one
        // question of the beat's own clock instead: what is owed by now?
        //
        // cuesDueAt is deliberately PURE -- no `this`, no clock of its
        // own -- so it can be lifted out of this file and driven by a
        // fake one under Node, which is how its firing order is actually
        // verified (tests/test_lesson_player_runtime.py) rather than
        // merely read. `fired` is a cursor, not a set, and that is safe
        // because the sanitizer sorts cues by `at` before storing them.
        cuesDueAt(cues, elapsed, fired) {
            const list = Array.isArray(cues) ? cues : [];
            const due = [];
            let n = Math.max(0, fired | 0);
            while (n < list.length && ((list[n] || {}).at || 0) <= elapsed) {
                due.push(list[n]);
                n++;
            }
            return due;
        },
        startCues(cues) {
            this.cues = Array.isArray(cues) ? cues : [];
            this.cuesFired = 0;
            // A cue written for second 0 belongs to the moment the beat
            // opens, not to its first tick a whole second later.
            this.fireCuesTo(0);
        },
        fireCuesTo(elapsed) {
            const due = this.cuesDueAt(this.cues, elapsed, this.cuesFired);
            if (!due.length) return;
            this.cuesFired += due.length;
            due.forEach(c => this.runCue(c, elapsed));
        },
        // Said and forgotten. A cue leaves no trace of having fired
        // anywhere outside this scene -- the same rule the checks and the
        // rep counter already keep.
        runCue(c, elapsed) {
            if (!c) return;
            // sayLocal, never say: a cue is IN the beat, and a line that
            // has to reach a speaker through Home Assistant first arrives
            // after the moment it was about.
            if (c.say) this.sayLocal(c.say,
                                     c.speak_lang || this.scene().speak_lang,
                                     this.scene().tone);
            if (c.count) this.sayLocal(String(Math.max(0, Math.round(elapsed))));
            if (c.chime) this.playClick();
        },

        // A tap, not a setting. A quiet house tonight is not a household
        // that never wants a voice, so this lives for the length of one
        // session and records nothing about the preference -- open the
        // player again tomorrow and Argyle speaks again.
        toggleMute() {
            this.muted = !this.muted;
            if (this.muted) {
                try { window.speechSynthesis && window.speechSynthesis.cancel(); }
                catch (e) {}
            }
        },

        // A chime is the same short Web Audio figure playClick() already
        // owns, at a different pitch -- `success` one note, `fanfare` two.
        // Reusing the player's own AudioContext rather than growing a
        // third audio implementation is the lesson the counter and the
        // metronome already taught this file once.
        playChime(kind) {
            if (this.muted) return;
            try {
                if (!this.audio) this.audio = new (window.AudioContext || window.webkitAudioContext)();
                if (this.audio.state === 'suspended') this.audio.resume().catch(() => {});
            } catch (e) { return; }
            if (!this.audio) return;
            const notes = kind === 'fanfare' ? [660, 880] : [880];
            notes.forEach((hz, i) => {
                const osc = this.audio.createOscillator();
                const gain = this.audio.createGain();
                osc.frequency.value = hz;
                osc.connect(gain).connect(this.audio.destination);
                const at = this.audio.currentTime + i * 0.14;
                gain.gain.setValueAtTime(0.2, at);
                gain.gain.exponentialRampToValueAtTime(0.0001, at + 0.16);
                osc.start(at);
                osc.stop(at + 0.16);
            });
        },

        advance() {
            this.stopSound();
            if (this.idx < this.scenes.length - 1) { this.idx++; this.enterScene(); }
            else this.finish();
        },
        // A check tap advances. It is not stored, not sent, not remembered.
        answerCheck() { this.advance(); },

        enterScene() {
            // Cards/counter state is scene-local by design -- reset on
            // EVERY entry, not only when the new scene happens to be
            // cards/counter, so nothing stale can ever be visible even for
            // a frame when hopping between two different scene types. The
            // counter's own pace never survives a scene change either:
            // advance() already calls stopSound() (which clears
            // counterTimer) before this runs, and this clears it again on
            // the way IN, so a fresh open() -- which never calls
            // stopSound() first -- cannot inherit a running interval from
            // nowhere.
            this.cardIdx = 0; this.cardFlipped = false; this.counterVal = 0;
            this.counterRunning = false;
            this.cues = []; this.cuesFired = 0;
            this.waitLeft = 0;
            if (this.waitTimer) { clearInterval(this.waitTimer); this.waitTimer = null; }
            if (this.counterTimer) { clearInterval(this.counterTimer); this.counterTimer = null; }
            const s = this.scene();
            // The voice goes first, before any timer starts under it: a
            // cue that explains the drill is worth nothing said over the
            // drill's own countdown. The chime comes after the words for
            // the same reason -- it punctuates them.
            if (s.speak) this.say(s.speak, s.speak_lang, s.tone);
            if (s.chime) this.playChime(s.chime);
            // Armed BEFORE the timer starts, so a cue written for second
            // 0 lands with the beat rather than a tick behind it.
            if (s.type === 'do' && s.cues) this.startCues(s.cues);
            if (s.type === 'wait') this.startWait(s);
            if (s.type === 'do' && s.seconds) this.startTimer(s.seconds);
            if (s.type === 'do' && s.metronome_bpm) this.startMetronome(s.metronome_bpm);
            if (s.type === 'show' && s.primitive) {
                if (s.primitive.kind === 'timer' && s.primitive.seconds) this.startTimer(s.primitive.seconds);
                if (s.primitive.kind === 'metronome' && s.primitive.bpm) this.startMetronome(s.primitive.bpm);
            }
        },

        // A wait beat: arm the call, then count down on screen for
        // whoever wants to watch. The arming happens FIRST and on the
        // server, so the promise this scene makes survives everything
        // this screen can do next -- closing, sleeping, reloading. The
        // on-screen countdown is the cosmetic half and dies with the
        // scene, which is why stopSound() clears it and nothing cancels
        // the armed call.
        //
        // A room is required to arm one: with no room there is nothing to
        // call, and the scene says so rather than promising a voice that
        // is not coming. The panel-only rule does not apply here the way
        // it does to roomSay -- a phone standing in a kitchen while dough
        // proofs is exactly as valid a caller -- but a room is still how
        // the announce path finds a speaker, and only a panel has one
        // bound today.
        startWait(s) {
            const mins = Math.max(1, s.minutes || 1);
            this.waitLeft = mins * 60;
            this.say(s.announce
                ? `Timer set. I'll say when it's up.`
                : `${mins} minutes.`, s.speak_lang, s.tone);
            if (this.room && s.announce) {
                try {
                    fetch((window.chfBase || '') + 'api/lessons/wait', {
                        method: 'POST',
                        headers: {'Content-Type': 'application/json'},
                        body: JSON.stringify({room: this.room, minutes: mins,
                                              text: s.announce}),
                    }).catch(() => {});
                } catch (e) { /* the on-screen countdown still runs */ }
            }
            if (this.waitTimer) clearInterval(this.waitTimer);
            this.waitTimer = setInterval(() => {
                this.waitLeft = Math.max(0, this.waitLeft - 1);
                if (this.waitLeft <= 0) {
                    clearInterval(this.waitTimer); this.waitTimer = null;
                    // Whoever DID stay and watch gets told here, locally,
                    // rather than waiting on the room's own call.
                    this.sayLocal(s.announce || 'Time.');
                    this.playChime('success');
                }
            }, 1000);
        },

        startTimer(secs) {
            if (this.timer) clearInterval(this.timer);
            this.timerTotal = secs;
            this.timeLeft = secs;
            this.timer = setInterval(() => {
                this.timeLeft = Math.max(0, this.timeLeft - 1);
                // The countdown IS the beat's clock, so it is also the
                // one that owes the cues -- one number, so the ring, the
                // click and the voice can never disagree about how far in
                // we are.
                this.fireCuesTo(this.timerTotal - this.timeLeft);
                if (this.timeLeft <= 0) { clearInterval(this.timer); this.timer = null; }
            }, 1000);
        },

        // The one Web Audio click, shared by the metronome's own pulse AND
        // the counter's rep tick (startCounterPace()/tickCounter() above)
        // -- a lesson never gets a second audio implementation for what is,
        // underneath, the identical short click at a different cadence.
        // Lazily opens/resumes its AudioContext on first use either way.
        playClick() {
            try {
                if (!this.audio) this.audio = new (window.AudioContext || window.webkitAudioContext)();
                if (this.audio.state === 'suspended') this.audio.resume().catch(() => {});
            } catch (e) { return; }
            if (!this.audio) return;
            const osc = this.audio.createOscillator();
            const gain = this.audio.createGain();
            osc.frequency.value = 880;
            osc.connect(gain).connect(this.audio.destination);
            const now = this.audio.currentTime;
            gain.gain.setValueAtTime(0.25, now);
            gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.04);
            osc.start(now);
            osc.stop(now + 0.04);
        },

        startMetronome(bpm) {
            if (this.metroTimer) clearInterval(this.metroTimer);
            this.playClick();
            this.metroTimer = setInterval(() => this.playClick(), Math.max(60000 / bpm, 100));
        },

        // Cleared on every scene change (advance() calls this before it
        // moves idx), on close, and on finish -- so nothing here can ever
        // keep ticking or clicking past the player being on screen. The
        // counter's own paced interval is exactly as scene-local as the
        // countdown timer and the metronome, so it is cleared right beside
        // them, not left to enterScene()'s reset alone (enterScene() clears
        // it too, defensively, on the way back IN -- see its own comment).
        stopSound() {
            if (this.timer) { clearInterval(this.timer); this.timer = null; }
            if (this.metroTimer) { clearInterval(this.metroTimer); this.metroTimer = null; }
            if (this.counterTimer) { clearInterval(this.counterTimer); this.counterTimer = null; }
            this.counterRunning = false;
            // A cue belongs to one beat. Leaving the list armed would let
            // the next scene's own timer fire the last one's lines.
            this.cues = []; this.cuesFired = 0;
            // The countdown on screen stops with the scene. The armed
            // call does NOT -- it lives on the server precisely so that
            // closing this player cannot take it back, which is the whole
            // promise a wait beat makes.
            if (this.waitTimer) { clearInterval(this.waitTimer); this.waitTimer = null; }
            // Speech is exactly as scene-local as the countdown and the
            // click beside it. Without this, advancing, closing or
            // finishing leaves a sentence still being read aloud into a
            // room whose lesson has already moved on or ended -- the one
            // failure mode a voice has that a timer does not.
            try { window.speechSynthesis && window.speechSynthesis.cancel(); }
            catch (e) {}
            if (this.audio) { try { this.audio.close(); } catch (e) {} this.audio = null; }
        },

        ringOffset() {
            const total = this.timerTotal || 1;
            const frac = Math.max(0, Math.min(1, this.timeLeft / total));
            return (this.ringC * (1 - frac)).toFixed(1);
        },

        fmtClock(secs) {
            secs = Math.max(0, Math.floor(secs || 0));
            const m = Math.floor(secs / 60), s = secs % 60;
            return m + ':' + String(s).padStart(2, '0');
        },

        // Retriggers the fade-up across a reflow, so it plays again even
        // between two back-to-back scenes of the SAME type (several `do`
        // steps, one after another), where Alpine's x-if never removes the
        // element and a plain CSS `animation` would otherwise only ever
        // fire once.
        replayBeat(el) {
            if (!el) return;
            el.classList.remove('lp-beat-in');
            void el.offsetWidth;
            el.classList.add('lp-beat-in');
        },

        // The only place this component ever talks to the outside world.
        // No fetch, no POST -- the page that opened the player owns the
        // actual session log and reuses its own existing action for it.
        //
        // It ASKS first, because what it sets off is irreversible:
        // `storage.append_program_session` is append-only, there is no
        // unlog anywhere in this app, and a logged session moves the
        // child's rung on (`programs.unit_for`). The design has always said
        // the final check merely PREFILLS the log ask; before this it WAS
        // the log, fired by whichever tap happened to land last.
        // promptConfirm, never a browser dialog (house rule).
        //
        // No ask when nothing listens: gated on `hostListens`
        // (window.chfHasLessonDoneListener), never on `panel` -- a wall
        // board and the calendar page both genuinely have nobody listening
        // for this event, but `panel` alone used to say so only for the
        // FIRST of those, and only while the URL still carried the flag. A
        // non-panel host with no listener (home.html opened as an ordinary
        // page, or the calendar page, which owns no log-a-session action at
        // all) asked the exact same dishonest question and recorded
        // nothing either way -- the confirmed write it promised was never
        // coming on either host.
        async finish() {
            this.stopSound();
            // A preview never reaches the log ask or the done dispatch --
            // it closes, full stop, before either one runs. Checked first,
            // ahead of the listener check below, so a preview still just
            // closes rather than asking a question nothing would ever
            // answer, even on a host that genuinely listens. Nothing
            // downstream -- programs.html's onLessonDone, app.html's own
            // listener -- can ever mistake a preview for a finished
            // session, because the event that tells them one happened is
            // never fired.
            if (this.preview) { this.openFlag = false; return; }
            // Said AFTER stopSound() above, which cancels whatever the
            // last scene was still reading -- a send-off talked over by
            // the beat it is sending off is worse than none. Spoken
            // before the log ask so the sentence lands while the session
            // is still the thing on screen, and never in a preview, which
            // returned one line up.
            this.say(this.sendOffLine());
            if (this.hostListens) {
                const ok = await promptConfirm('Log this session?',
                    'It records the practice and cannot be undone.',
                    'Log it', 'Not now');
                if (!ok) { this.openFlag = false; return; }
            }
            window.dispatchEvent(new CustomEvent('lesson-player:done', {detail: {window: this.w}}));
            this.openFlag = false;
        },
        close() { this.stopSound(); this.openFlag = false; },
    };
}
</script>
