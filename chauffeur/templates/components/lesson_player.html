            } catch (e) { return ''; }
            return await this.askRoom();
        },

        sayLocal(text, lang, tone) {
            if (this.muted || !text) return;
            try {
                const synth = window.speechSynthesis;
                if (!synth) return;
                synth.cancel();
                const u = new SpeechSynthesisUtterance(String(text));
                if (lang) {
                    const v = (synth.getVoices() || []).find(
                        v => v.lang && v.lang.toLowerCase().startsWith(
                            String(lang).slice(0, 2).toLowerCase()));
                    if (v) u.voice = v;
                    u.lang = lang;
                }
                // One persona, two paces. `calm` is a wind-down voice --
                // slower and a shade lower; `coach` is the ordinary one.
                u.rate = tone === 'calm' ? 0.85 : 1.0;
                u.pitch = tone === 'calm' ? 0.9 : 1.0;
                synth.speak(u);
            } catch (e) { /* a voiceless device still runs the scene */ }
        },

        // --- cues: what Argyle says while the drill runs ---------------
        // A cue is owed by ELAPSED TIME, never delivered by a chain of
        // setTimeouts. The difference matters on exactly the devices this
        // runs on: a backgrounded tab, a locked phone, a wall board under
        // load. A timeout chain in a throttled tab fires late and, worse,
        // drifts away from the countdown ring beside it -- two clocks
        // disagreeing about how far into a beat we are. This asks one
        // question of the beat's own clock instead: what is owed by now?
        //
        // cuesDueAt is deliberately PURE -- no `this`, no clock of its
        // own -- so it can be lifted out of this file and driven by a
        // fake one under Node, which is how its firing order is actually
        // verified (tests/test_lesson_player_runtime.py) rather than
        // merely read. `fired` is a cursor, not a set, and that is safe
        // because the sanitizer sorts cues by `at` before storing them.
        cuesDueAt(cues, elapsed, fired) {
            const list = Array.isArray(cues) ? cues : [];
            const due = [];
            let n = Math.max(0, fired | 0);
            while (n < list.length && ((list[n] || {}).at || 0) <= elapsed) {
                due.push(list[n]);
                n++;
            }
            return due;
        },
        startCues(cues) {
            this.cues = Array.isArray(cues) ? cues : [];
            this.cuesFired = 0;
            // A cue written for second 0 belongs to the moment the beat
            // opens, not to its first tick a whole second later.
            this.fireCuesTo(0);
        },
        fireCuesTo(elapsed) {
            const due = this.cuesDueAt(this.cues, elapsed, this.cuesFired);
            if (!due.length) return;
            this.cuesFired += due.length;
            due.forEach(c => this.runCue(c, elapsed));
        },
        // Said and forgotten. A cue leaves no trace of having fired
        // anywhere outside this scene -- the same rule the checks and the
        // rep counter already keep.
        runCue(c, elapsed) {
            if (!c) return;
            // sayLocal, never say: a cue is IN the beat, and a line that
            // has to reach a speaker through Home Assistant first arrives
            // after the moment it was about.
            if (c.say) this.sayLocal(c.say,
                                     c.speak_lang || this.scene().speak_lang,
                                     this.scene().tone);
            if (c.count) this.sayLocal(String(Math.max(0, Math.round(elapsed))));
            if (c.chime) this.playClick();
        },

        // A tap, not a setting. A quiet house tonight is not a household
        // that never wants a voice, so this lives for the length of one
        // session and records nothing about the preference -- open the
        // player again tomorrow and Argyle speaks again.
        toggleMute() {
            this.muted = !this.muted;
            if (this.muted) {
                try { window.speechSynthesis && window.speechSynthesis.cancel(); }
                catch (e) {}
            }
        },

        // A chime is the same short Web Audio figure playClick() already
        // owns, at a different pitch -- `success` one note, `fanfare` two.
        // Reusing the player's own AudioContext rather than growing a
        // third audio implementation is the lesson the counter and the
        // metronome already taught this file once.
        playChime(kind) {
            if (this.muted) return;
            try {
                if (!this.audio) this.audio = new (window.AudioContext || window.webkitAudioContext)();
                if (this.audio.state === 'suspended') this.audio.resume().catch(() => {});
            } catch (e) { return; }
            if (!this.audio) return;
            const notes = kind === 'fanfare' ? [660, 880] : [880];
            notes.forEach((hz, i) => {
                const osc = this.audio.createOscillator();
                const gain = this.audio.createGain();
                osc.frequency.value = hz;
                osc.connect(gain).connect(this.audio.destination);
                const at = this.audio.currentTime + i * 0.14;
                gain.gain.setValueAtTime(0.2, at);
                gain.gain.exponentialRampToValueAtTime(0.0001, at + 0.16);
                osc.start(at);
                osc.stop(at + 0.16);
            });
        },

        advance() {
            this.stopSound();
            if (this.idx < this.scenes.length - 1) { this.idx++; this.enterScene(); }
            else this.finish();
        },
        // A check tap advances. It is not stored, not sent, not remembered
        // -- and that is still true of the offer below, which changes what
        // happens NEXT in this session and nothing else anywhere.
        //
        // `kind` exists only to tell the one tap that may open an offer
        // from the two that never can. Nothing reads it afterwards; it is
        // not a grade, and there is nowhere for it to be one.
        answerCheck(kind) {
            const offer = this.scene().not_yet_offer;
            if (kind === 'not_yet' && offer && (offer.scenes || []).length) {
                this.offerOpen = true;
                this.say(offer.label, this.scene().speak_lang, this.scene().tone);
                return;
            }
            this.advance();
        },
        // Taken. The detour goes in immediately after this check, in the
        // live scene list and nowhere else: no fetch, no storage, no
        // record that it was ever offered or ever accepted. Any offer
        // riding a spliced scene is stripped on the way in -- the
        // sanitizer already refuses nested offers, and a spliced scene is
        // the one path into this list that never came through open(), so
        // the client keeps its own copy of that rule rather than trusting
        // the shape it was handed.
        acceptOffer() {
            const offer = this.scene().not_yet_offer || {};
            const detour = (offer.scenes || []).map(s => {
                const copy = Object.assign({}, s);
                delete copy.not_yet_offer;
                return copy;
            });
            this.offerOpen = false;
            if (!detour.length) { this.advance(); return; }
            this.scenes.splice(this.idx + 1, 0, ...detour);
            this.advance();
        },
        // Declined. Exactly what a not-yet did before offers existed.
        declineOffer() { this.offerOpen = false; this.advance(); },

        // The same drill, slower. No model, no offer, no round trip --
        // one factor applied to the beat's own numbers, and the cues
        // scaled with them so a line written for the halfway point is
        // still at the halfway point. Runs once, on the scene as it
        // stands; the stored script is never touched, so leaving and
        // coming back to this beat gets it at its written speed again.
        againSlower() {
            const s = this.scene();
            if (s.type !== 'do') return;
            const SLOWER = 0.75;
            this.stopSound();
            // Cues before the clock, the same order enterScene() uses, so
            // a line written for second 0 lands with the replay rather
            // than a tick behind it.
            if (s.cues) {
                this.startCues((s.cues || []).map(
                    c => Object.assign({}, c, {at: Math.round((c.at || 0) / SLOWER)})));
            }
            if (s.seconds) this.startTimer(Math.max(5, Math.round(s.seconds / SLOWER)));
            if (s.metronome_bpm) {
                this.startMetronome(Math.max(30, Math.round(s.metronome_bpm * SLOWER)));
            }
        },

        enterScene() {
            // Cards/counter state is scene-local by design -- reset on
            // EVERY entry, not only when the new scene happens to be
            // cards/counter, so nothing stale can ever be visible even for
            // a frame when hopping between two different scene types. The
            // counter's own pace never survives a scene change either:
            // advance() already calls stopSound() (which clears
            // counterTimer) before this runs, and this clears it again on
            // the way IN, so a fresh open() -- which never calls
            // stopSound() first -- cannot inherit a running interval from
            // nowhere.
            this.hintIdx = 0;
            this.cardIdx = 0; this.cardFlipped = false; this.counterVal = 0;
            this.counterRunning = false;
            this.cues = []; this.cuesFired = 0;
            this.waitLeft = 0; this.offerOpen = false;
            this.helpText = ''; this.helpBusy = false;
            this.listenHeard = ''; this.listenDone = false; this.listenLeft = 0;
            this.tunerNote = ''; this.tunerCents = 0; this.pitchHeldSince = 0;
            this.peaks = []; this.lastPeakAt = 0;
            this.fadePass = 0; this.lineIdx = 0; this.lineRevealed = false;
            if (this.waitTimer) { clearInterval(this.waitTimer); this.waitTimer = null; }
            if (this.counterTimer) { clearInterval(this.counterTimer); this.counterTimer = null; }
            const s = this.scene();
            // The voice goes first, before any timer starts under it: a
            // cue that explains the drill is worth nothing said over the
            // drill's own countdown. The chime comes after the words for
            // the same reason -- it punctuates them.
            if (s.speak) this.say(s.speak, s.speak_lang, s.tone);
            if (s.chime) this.playChime(s.chime);
            // Armed BEFORE the timer starts, so a cue written for second
            // 0 lands with the beat rather than a tick behind it.
            if (s.type === 'do' && s.cues) this.startCues(s.cues);
            if (s.type === 'wait') this.startWait(s);
            if (s.type === 'show' && s.primitive
                && ['listen', 'tuner'].includes(s.primitive.kind)) {
                this.startListening(s.primitive);
            }
            // A rehearsal opens with the first cue, spoken -- there is
            // nothing to answer until somebody says the other part.
            if (s.type === 'show' && s.primitive
                && s.primitive.kind === 'lines') {
                const first = (s.primitive.pairs || [])[0] || {};
                this.say(first.cue, s.primitive.lang, s.tone);
            }
            if (s.type === 'do' && s.seconds) this.startTimer(s.seconds);
            if (s.type === 'do' && s.metronome_bpm) this.startMetronome(s.metronome_bpm);
            if (s.type === 'show' && s.primitive) {
                if (s.primitive.kind === 'timer' && s.primitive.seconds) this.startTimer(s.primitive.seconds);
                if (s.primitive.kind === 'metronome' && s.primitive.bpm) this.startMetronome(s.primitive.bpm);
            }
        },

        // --- fade: reading becomes reciting ----------------------------
        // Which words are blanked on a given pass. Two properties are the
        // whole feature and neither is visible by reading the code, which
        // is why this is pure and driven under Node against both of them:
        //
        //   * the same pass always blanks the SAME words -- a fade nobody
        //     can repeat is a new puzzle every time instead of the same
        //     one getting harder, and Math.random() would guarantee that;
        //   * a word blanked at pass k stays blanked at pass k+1, so the
        //     passage tightens rather than shuffling under you.
        //
        // Both fall straight out of the construction: a fixed permutation
        // of the word indices, and a count that only grows.
        fadeMask(count, pass_, passes) {
            const n = Math.max(0, count | 0);
            const total = Math.max(1, passes | 0);
            const p = Math.max(0, Math.min(total, pass_ | 0));
            // A deterministic shuffle of 0..n-1: order by a fixed
            // multiplicative hash of the index, so it is stable across
            // machines and reloads and is never in reading order (which
            // would blank the passage front to back, the one order that
            // teaches nothing).
            const order = [];
            for (let i = 0; i < n; i++) order.push(i);
            order.sort((a, b) => ((a * 2654435761) % 100000) - ((b * 2654435761) % 100000));
            const hide = Math.round(n * p / total);
            const mask = new Array(n).fill(false);
            for (let k = 0; k < hide; k++) mask[order[k]] = true;
            return mask;
        },
        fadeWords() {
            const s = this.scene();
            const words = String(s.text || '').split(/\s+/).filter(Boolean);
            const mask = this.fadeMask(words.length, this.fadePass, s.passes || 2);
            return words.map((w, i) => ({w, hidden: mask[i]}));
        },
        // One tap, one pass tighter. Nothing counts how many passes
        // somebody needed: that is the record this app refuses to keep,
        // and there is nowhere for it to be kept.
        nextFadePass() {
            const s = this.scene();
            if (this.fadePass < (s.passes || 2)) this.fadePass++;
        },

        // --- run-lines -------------------------------------------------
        // Argyle delivers the other character's cue out loud; the line
        // stays hidden until it is asked for, because a rehearsal where
        // the answer is already on screen is a reading.
        nextLine() {
            const pairs = ((this.scene().primitive) || {}).pairs || [];
            const lang = ((this.scene().primitive) || {}).lang;
            if (!this.lineRevealed) { this.lineRevealed = true; return; }
            if (this.lineIdx < pairs.length - 1) {
                this.lineIdx++;
                this.lineRevealed = false;
                this.say((pairs[this.lineIdx] || {}).cue, lang, this.scene().tone);
            }
        },

        // --- what a microphone can honestly answer ---------------------
        // Three pure functions, deliberately free of `this` and of any
        // clock, so they can be lifted out of this file and driven under
        // Node by synthesized sound with a known answer -- which is the
        // only way to know a pitch detector works at all. A detector that
        // merely LOOKS plausible is worthless; see
        // tests/test_lesson_player_runtime.py.

        // Normalized autocorrelation, the standard approach: slide the
        // buffer against itself and find the lag whose overlap is
        // strongest, then read the frequency off that lag. Robust to
        // harmonics -- a guitar string's second and third partials are
        // often LOUDER than its fundamental, which is exactly why an
        // FFT-peak reading is the wrong tool here.
        //
        // Returns null rather than a number when there is nothing to hear.
        // A tuner needle jumping around an empty room is worse than a
        // tuner that says nothing, and "answer anyway" is the failure
        // mode this kind of code falls into by default.
        autoCorrelate(buf, sampleRate) {
            const SIZE = buf.length;
            let sum = 0;
            for (let i = 0; i < SIZE; i++) sum += buf[i] * buf[i];
            const rms = Math.sqrt(sum / SIZE);
            if (rms < 0.01) return null;          // silence, honestly
            // Trim the quiet head and tail so a note's attack and decay
            // do not drag the correlation.
            let start = 0, end = SIZE - 1;
            const THRESH = 0.2;
            while (start < SIZE / 2 && Math.abs(buf[start]) < THRESH) start++;
            while (end > SIZE / 2 && Math.abs(buf[end]) < THRESH) end--;
            const trimmed = buf.slice(start, end);
            const n = trimmed.length;
            if (n < 128) return null;
            const c = new Array(n).fill(0);
            for (let lag = 0; lag < n; lag++) {
                for (let i = 0; i < n - lag; i++) c[lag] += trimmed[i] * trimmed[i + lag];
            }
            // Past the first trough, or the answer is always lag 0.
            let d = 0;
            while (d < n - 1 && c[d] > c[d + 1]) d++;
            let best = -1, bestVal = -1;
            for (let lag = d; lag < n; lag++) {
                if (c[lag] > bestVal) { bestVal = c[lag]; best = lag; }
            }
            if (best <= 0) return null;
            // Parabolic interpolation around the peak: a lag is an
            // integer number of samples, and a note is not.
            const x1 = c[best - 1] || 0, x2 = c[best], x3 = c[best + 1] || 0;
            const a = (x1 + x3 - 2 * x2) / 2, b = (x3 - x1) / 2;
            const shift = a ? -b / (2 * a) : 0;
            const hz = sampleRate / (best + shift);
            return (hz > 30 && hz < 5000) ? hz : null;
        },

        // A frequency as a note name, in the SAME grammar
        // program_lessons._NOTE_RE validates -- so a heard note and a
        // written target are directly comparable strings rather than two
        // spellings of one idea. `cents` is how far off it is, signed,
        // which is what a needle draws.
        hzToNote(hz) {
            const NAMES = ['C', 'C#', 'D', 'D#', 'E', 'F', 'F#', 'G', 'G#', 'A', 'A#', 'B'];
            const semis = 12 * Math.log2(hz / 440) + 69;      // MIDI number
            const nearest = Math.round(semis);
            const exact = 440 * Math.pow(2, (nearest - 69) / 12);
            return {
                name: NAMES[((nearest % 12) + 12) % 12] + (Math.floor(nearest / 12) - 1),
                cents: Math.round(1200 * Math.log2(hz / exact)),
            };
        },

        // A tempo is a GAP, never a count of peaks: five claps say
        // nothing until you know how far apart they were, and one clap
        // says nothing at all. Median rather than mean, so one
        // dropped or doubled peak moves the answer by nothing.
        peaksToBpm(times) {
            const t = (times || []).slice().sort((a, b) => a - b);
            if (t.length < 2) return null;
            const gaps = [];
            for (let i = 1; i < t.length; i++) gaps.push(t[i] - t[i - 1]);
            gaps.sort((a, b) => a - b);
            const mid = gaps[Math.floor(gaps.length / 2)];
            return mid > 0 ? 60 / mid : null;
        },

        // --- listening -------------------------------------------------
        // The microphone is asked for HERE, at the first scene that
        // actually listens, and nowhere else. A lesson that opens by
        // demanding a microphone is a lesson a household refuses once and
        // never trusts again -- and most lessons never listen at all.
        //
        // Nothing heard is recorded or sent. Nothing in this file can
        // record audio at all, and there is no request anywhere near the
        // audio path: the
        // analyser reads a float array in memory, a number comes out, the
        // array is overwritten on the next tick. That is the whole
        // pipeline, and it is the reason this can be offered at all.
        //
        // A refusal or a missing microphone is not an error. `micDenied`
        // becomes true, the scene renders its tap variant with an honest
        // note, and the lesson carries on -- a wall panel plausibly has
        // no microphone, and saying no has to cost nothing.
        async startListening(s) {
            // A tuner is not a timed challenge -- it is an instrument you
            // stand in front of until the string is right -- so it takes
            // the ceiling rather than a listen scene's own window.
            this.listenLeft = s.seconds
                || (s.kind === 'tuner' ? 120 : 20);
            this.listenTimer = setInterval(() => {
                this.listenLeft = Math.max(0, this.listenLeft - 1);
                if (this.listenLeft <= 0) {
                    clearInterval(this.listenTimer); this.listenTimer = null;
                    this.releaseMic();
                }
            }, 1000);
            try {
                const md = navigator.mediaDevices;
                if (!md || !md.getUserMedia) { this.micDenied = true; return; }
                this.micStream = await md.getUserMedia({audio: true});
                this.micCtx = new (window.AudioContext || window.webkitAudioContext)();
                const src = this.micCtx.createMediaStreamSource(this.micStream);
                this.micAnalyser = this.micCtx.createAnalyser();
                this.micAnalyser.fftSize = 2048;
                src.connect(this.micAnalyser);
                this.micBuf = new Float32Array(this.micAnalyser.fftSize);
                this.micDenied = false;
                this.micOn = true;
                this.micTick = setInterval(() => this.listenTick(), 120);
            } catch (e) {
                this.micDenied = true;
                this.releaseMic();
            }
        },
        // One read of the live buffer, 8 times a second. `presence` is
        // the only mode this answers today -- loud enough for long enough
        // means somebody did the thing -- and pitch and tempo fall
        // through to the same tap variant a missing microphone gets,
        // rather than pretending to hear something they cannot yet.
        listenTick() {
            if (!this.micAnalyser || this.listenDone) return;
            const p = (this.scene().primitive) || {};
            this.micAnalyser.getFloatTimeDomainData(this.micBuf);
            let sum = 0;
            for (let i = 0; i < this.micBuf.length; i++) sum += this.micBuf[i] * this.micBuf[i];
            const rms = Math.sqrt(sum / this.micBuf.length);
            const now = (this.micCtx && this.micCtx.currentTime) || 0;

            if (p.kind === 'tuner' || p.mode === 'pitch') {
                const hz = this.autoCorrelate(this.micBuf,
                                              (this.micCtx || {}).sampleRate || 44100);
                const note = hz ? this.hzToNote(hz) : null;
                this.tunerNote = note ? note.name : '';
                this.tunerCents = note ? note.cents : 0;
                // A note has to HOLD. Advancing on one lucky frame would
                // let a passing overtone off the wrong string finish the
                // scene for you, which is the opposite of listening.
                if (p.mode === 'pitch' && note && p.target && note.name === p.target) {
                    if (!this.pitchHeldSince) this.pitchHeldSince = now;
                    if (now - this.pitchHeldSince >= 0.5) {
                        this.listenHeard = 'That is ' + note.name + '.';
                        this.markHeard();
                    }
                } else {
                    this.pitchHeldSince = 0;
                }
                return;
            }

            if (p.mode === 'tempo') {
                // A peak is a rise above the floor after a quiet frame,
                // with a refractory gap so one loud strike is not counted
                // three times as it decays.
                if (rms > 0.05 && now - (this.lastPeakAt || 0) > 0.15) {
                    this.lastPeakAt = now;
                    this.peaks.push(now);
                    if (this.peaks.length > 12) this.peaks.shift();
                }
                const bpm = this.peaksToBpm(this.peaks);
                if (bpm) {
                    this.listenHeard = Math.round(bpm) + ' bpm';
                    // Within a tenth of the asked-for tempo is keeping
                    // up. It is a MATCH, not a mark: the scene says the
                    // number it heard and never whether it was good.
                    const want = p.bpm || this.metroBpm();
                    if (want && Math.abs(bpm - want) / want < 0.1
                        && this.peaks.length >= 4) {
                        this.markHeard();
                    }
                }
                return;
            }

            if (p.mode === 'presence' && rms > 0.02) {
                this.listenHeard = 'Heard you.';
                this.markHeard();
            }
        },
        // What a listening scene is FOR: it heard the thing, so the scene
        // is done. It is not a grade and it is not kept -- `listenDone`
        // dies with the scene like every other flag here.
        markHeard() {
            if (this.listenDone) return;
            this.listenDone = true;
            this.playChime('success');
            this.releaseMic();
        },
        // Stops the TRACK, not merely the graph node: a stream left live
        // keeps the browser's own recording indicator lit, which is both
        // the wrong signal and the right complaint.
        releaseMic() {
            if (this.micTick) { clearInterval(this.micTick); this.micTick = null; }
            if (this.listenTimer) { clearInterval(this.listenTimer); this.listenTimer = null; }
            try {
                if (this.micStream) {
                    (this.micStream.getTracks() || []).forEach(t => t.stop());
                }
            } catch (e) {}
            this.micStream = null;
            this.micAnalyser = null;
            this.micBuf = null;
            try { if (this.micCtx) this.micCtx.close(); } catch (e) {}
            this.micCtx = null;
            this.micOn = false;
        },

        // A wait beat: arm the call, then count down on screen for
        // whoever wants to watch. The arming happens FIRST and on the
        // server, so the promise this scene makes survives everything
        // this screen can do next -- closing, sleeping, reloading. The
        // on-screen countdown is the cosmetic half and dies with the
        // scene, which is why stopSound() clears it and nothing cancels
        // the armed call.
        //
        // A room is required to arm one: with no room there is nothing to
        // call, and the scene says so rather than promising a voice that
        // is not coming. The panel-only rule does not apply here the way
        // it does to roomSay -- a phone standing in a kitchen while dough
        // proofs is exactly as valid a caller -- but a room is still how
        // the announce path finds a speaker, and only a panel has one
        // bound today.
        startWait(s) {
            const mins = Math.max(1, s.minutes || 1);
            this.waitLeft = mins * 60;
            this.say(s.announce
                ? `Timer set. I'll say when it's up.`
                : `${mins} minutes.`, s.speak_lang, s.tone);
            if (this.room && s.announce) {
                try {
                    fetch((window.chfBase || '') + 'api/lessons/wait', {
                        method: 'POST',
                        headers: {'Content-Type': 'application/json'},
                        body: JSON.stringify({room: this.room, minutes: mins,
                                              text: s.announce}),
                    }).catch(() => {});
                } catch (e) { /* the on-screen countdown still runs */ }
            }
            if (this.waitTimer) clearInterval(this.waitTimer);
            this.waitTimer = setInterval(() => {
                this.waitLeft = Math.max(0, this.waitLeft - 1);
                if (this.waitLeft <= 0) {
                    clearInterval(this.waitTimer); this.waitTimer = null;
                    // Whoever DID stay and watch gets told here, locally,
                    // rather than waiting on the room's own call.
                    this.sayLocal(s.announce || 'Time.');
                    this.playChime('success');
                }
            }, 1000);
        },

        startTimer(secs) {
            if (this.timer) clearInterval(this.timer);
            this.timerTotal = secs;
            this.timeLeft = secs;
            this.timer = setInterval(() => {
                this.timeLeft = Math.max(0, this.timeLeft - 1);
                // The countdown IS the beat's clock, so it is also the
                // one that owes the cues -- one number, so the ring, the
                // click and the voice can never disagree about how far in
                // we are.
                this.fireCuesTo(this.timerTotal - this.timeLeft);
                if (this.timeLeft <= 0) { clearInterval(this.timer); this.timer = null; }
            }, 1000);
        },

        // The one Web Audio click, shared by the metronome's own pulse AND
        // the counter's rep tick (startCounterPace()/tickCounter() above)
        // -- a lesson never gets a second audio implementation for what is,
        // underneath, the identical short click at a different cadence.
        // Lazily opens/resumes its AudioContext on first use either way.
        playClick() {
            try {
                if (!this.audio) this.audio = new (window.AudioContext || window.webkitAudioContext)();
                if (this.audio.state === 'suspended') this.audio.resume().catch(() => {});
            } catch (e) { return; }
            if (!this.audio) return;
            const osc = this.audio.createOscillator();
            const gain = this.audio.createGain();
            osc.frequency.value = 880;
            osc.connect(gain).connect(this.audio.destination);
            const now = this.audio.currentTime;
            gain.gain.setValueAtTime(0.25, now);
            gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.04);
            osc.start(now);
            osc.stop(now + 0.04);
        },

        startMetronome(bpm) {
            if (this.metroTimer) clearInterval(this.metroTimer);
            this.playClick();
            this.metroTimer = setInterval(() => this.playClick(), Math.max(60000 / bpm, 100));
        },

        // Cleared on every scene change (advance() calls this before it
        // moves idx), on close, and on finish -- so nothing here can ever
        // keep ticking or clicking past the player being on screen. The
        // counter's own paced interval is exactly as scene-local as the
        // countdown timer and the metronome, so it is cleared right beside
        // them, not left to enterScene()'s reset alone (enterScene() clears
        // it too, defensively, on the way back IN -- see its own comment).
        stopSound() {
            if (this.timer) { clearInterval(this.timer); this.timer = null; }
            if (this.metroTimer) { clearInterval(this.metroTimer); this.metroTimer = null; }
            if (this.counterTimer) { clearInterval(this.counterTimer); this.counterTimer = null; }
            this.counterRunning = false;
            // A cue belongs to one beat. Leaving the list armed would let
            // the next scene's own timer fire the last one's lines.
            this.cues = []; this.cuesFired = 0;
            // The countdown on screen stops with the scene. The armed
            // call does NOT -- it lives on the server precisely so that
            // closing this player cannot take it back, which is the whole
            // promise a wait beat makes.
            if (this.waitTimer) { clearInterval(this.waitTimer); this.waitTimer = null; }
            // The microphone is the most scene-local thing in this file
            // and the one with real consequences for being left open, so
            // it is released here -- the single path every exit takes
            // (advance, close, finish) -- rather than trusted to a
            // per-scene teardown somebody has to remember to write.
            this.releaseMic();
            // Speech is exactly as scene-local as the countdown and the
            // click beside it. Without this, advancing, closing or
            // finishing leaves a sentence still being read aloud into a
            // room whose lesson has already moved on or ended -- the one
            // failure mode a voice has that a timer does not.
            try { window.speechSynthesis && window.speechSynthesis.cancel(); }
            catch (e) {}
            if (this.audio) { try { this.audio.close(); } catch (e) {} this.audio = null; }
        },

        ringOffset() {
            const total = this.timerTotal || 1;
            const frac = Math.max(0, Math.min(1, this.timeLeft / total));
            return (this.ringC * (1 - frac)).toFixed(1);
        },

        fmtClock(secs) {
            secs = Math.max(0, Math.floor(secs || 0));
            const m = Math.floor(secs / 60), s = secs % 60;
            return m + ':' + String(s).padStart(2, '0');
        },

        // Whether there is anything here worth asking about. Never in a
        // preview -- the daily cap is a household's one free-tier quota
        // and a look at a lesson nobody is having is the last thing that
        // should spend it -- and never on the fallback ladder, where the
        // beats are the plan's own steps and there is no stored scene on
        // the server to explain.
        explainable() {
            return !!(this.usingLesson && !this.preview && this.w
                      && this.w.program_id);
        },
        // One live question, about the beat already on screen. It can add
        // nothing, reorder nothing and replace nothing -- the scripted
        // lesson stays the design and this answers beside it. Records
        // nothing anywhere; the answer is cleared by the next scene.
        async explainThis() {
            if (this.helpBusy || !this.explainable()) return;
            this.helpBusy = true;
            this.helpText = '';
            try {
                const w = this.w || {};
                // Same header shape every other lesson fetch in this app
                // uses (family_calendar.html's _startPracticeSession, the
                // programs card): whatever member token this browser
                // holds, or none at all on a panel, which has none to
                // hold and reaches this route at WALL tier anyway.
                const headers = {'Content-Type': 'application/json'};
                try {
                    const token = localStorage.getItem('chauffeur_member_token') || '';
                    if (token) headers['X-Member-Token'] = token;
                } catch (e) { /* a panel has no token and needs none */ }
                const res = await fetch(
                    (window.chfBase || '') + 'api/programs/'
                    + encodeURIComponent(w.program_id) + '/lesson-help',
                    {method: 'POST', headers,
                     body: JSON.stringify({
                         phase_name: w.phase_name || '',
                         unit_n: w.unit_n || 0,
                         session_label: w.session_label || '',
                         scene_idx: this.idx,
                     })});
                const data = res.ok ? await res.json() : {};
                const answer = (data && data.answer) || '';
                // An empty answer is a real outcome -- a screened reply, a
                // pool with nothing left, a cap reached -- and saying so
                // is honest and costs one tap to try again.
                this.helpText = answer || "I couldn't help with that one.";
                if (answer) this.say(answer, this.scene().speak_lang, this.scene().tone);
            } catch (e) {
                this.helpText = "I couldn't help with that one.";
            }
            this.helpBusy = false;
        },

        // Retriggers the fade-up across a reflow, so it plays again even
        // between two back-to-back scenes of the SAME type (several `do`
        // steps, one after another), where Alpine's x-if never removes the
        // element and a plain CSS `animation` would otherwise only ever
        // fire once.
        replayBeat(el) {
            if (!el) return;
            el.classList.remove('lp-beat-in');
            void el.offsetWidth;
            el.classList.add('lp-beat-in');
        },

        // The only place this component ever talks to the outside world.
        // No fetch, no POST -- the page that opened the player owns the
        // actual session log and reuses its own existing action for it.
        //
        // It ASKS first, because what it sets off is irreversible:
        // `storage.append_program_session` is append-only, there is no
        // unlog anywhere in this app, and a logged session moves the
        // child's rung on (`programs.unit_for`). The design has always said
        // the final check merely PREFILLS the log ask; before this it WAS
        // the log, fired by whichever tap happened to land last.
        // promptConfirm, never a browser dialog (house rule).
        //
        // No ask when nothing listens: gated on `hostListens`
        // (window.chfHasLessonDoneListener), never on `panel` -- a wall
        // board and the calendar page both genuinely have nobody listening
        // for this event, but `panel` alone used to say so only for the
        // FIRST of those, and only while the URL still carried the flag. A
        // non-panel host with no listener (home.html opened as an ordinary
        // page, or the calendar page, which owns no log-a-session action at
        // all) asked the exact same dishonest question and recorded
        // nothing either way -- the confirmed write it promised was never
        // coming on either host.
        async finish() {
            this.stopSound();
            // A preview never reaches the log ask or the done dispatch --
            // it closes, full stop, before either one runs. Checked first,
            // ahead of the listener check below, so a preview still just
            // closes rather than asking a question nothing would ever
            // answer, even on a host that genuinely listens. Nothing
            // downstream -- programs.html's onLessonDone, app.html's own
            // listener -- can ever mistake a preview for a finished
            // session, because the event that tells them one happened is
            // never fired.
            if (this.preview) { this.openFlag = false; return; }
            // Said AFTER stopSound() above, which cancels whatever the
            // last scene was still reading -- a send-off talked over by
            // the beat it is sending off is worse than none. Spoken
            // before the log ask so the sentence lands while the session
            // is still the thing on screen, and never in a preview, which
            // returned one line up.
            this.say(this.sendOffLine());
            if (this.hostListens) {
                const ok = await promptConfirm('Log this session?',
                    'It records the practice and cannot be undone.',
                    'Log it', 'Not now');
                if (!ok) { this.openFlag = false; return; }
            }
            window.dispatchEvent(new CustomEvent('lesson-player:done', {detail: {window: this.w}}));
            this.openFlag = false;
        },
        close() { this.stopSound(); this.openFlag = false; },
    };
}
</script>
