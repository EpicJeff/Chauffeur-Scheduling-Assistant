<!-- ── The kid digest strip: a lane per child. One shared drawing.

     The routines page's kiosk mode renders this macro and the board's `kids`
     tile renders the same one, so the wall can never drift from the page. It
     had already drifted once, which is why this file exists: the `kids` tile
     predates the digest strip and drew a flat name-and-lines list, and the
     first board to actually SHOW the tile (Routines — every other board folds
     the kids into its hero band) shipped that stale drawing to a wall.

     The macro is markup only — pure Alpine, no element ids — and binds to a
     scope CONTRACT: `digestCards()` (sorted [{id, name, color_code, avatar,
     image?, lines, tasks, routine_count, streak}]), `digestColumns()` and
     `digestLabel()` ("☀️ Today" / "🌙 Tomorrow"). The routines page answers
     from its self-fetched `kidDigests`; the board's card wrapper
     (`kidDigestCard` below) answers from the tile payload it rides — this is
     a DISPLAY, so riding the payload is the rule (board rule 2), unlike the
     interactive lanes beside it.

     NO WEATHER, as of one release after it briefly grew some: there is a
     weather card, and a drawing that quietly includes another card's content
     is how a board ends up saying the same thing twice with no way to turn
     one of them off. A wall that wants weather beside the digest composes
     the two cards.

     The hero band's kid columns (board_tile_body's hero branch) are NOT this
     drawing and stay separate on purpose: inside the hero the kids are a
     compact strip under the next drive — no avatars, no streaks, panel-card
     cells — sized for a band rather than for a board.

     Jinja `import` renders none of this file, so the script at the bottom is
     emitted by `include` exactly once per page. -->

{% macro digest_grid() %}
                    <div>
                        <!-- Which DAY this is, and it is a caption rather than
                             a heading: a card's heading belongs to its TILE
                             (blank means blank, v2.204.1/v2.210), and an <h3>
                             in here was a second label in a box that already
                             had one — reported from a wall as text nobody
                             could find a setting for. It stays because the
                             strip flips between today and tomorrow at a
                             server-decided cutover, and a digest of tomorrow's
                             rides read as today's is worse than a caption. Off
                             is one toggle away. -->
                        <div x-show="digestShow('day')"
                            class="text-[10px] font-black uppercase tracking-widest text-gray-400 mb-2"
                            x-text="digestLabel()"></div>
                        <div class="grid gap-5" :style="'grid-template-columns: repeat(' + digestColumns() + ', minmax(0, 1fr))'">
                            <template x-for="k in digestCards()" :key="'kd-' + k.id">
                                <div class="bg-gray-800/60 rounded-2xl border border-indigo-900/60 p-4 relative"
                                    :class="digestFigureFull(k) ? 'pl-24' : ''">
                                    <!-- The standing character in their own block (avatar arc):
                                         on the LEFT, like every other surface the figure
                                         appears on. Tappable door to the dressing-up box. -->
                                    <template x-if="digestFigureFull(k)">
                                        <button type="button"
                                            class="absolute top-2 left-2"
                                            :disabled="typeof openAvatarEditor === 'undefined'"
                                            @click="typeof openAvatarEditor !== 'undefined'
                                                    && openAvatarEditor({ id: k.id, name: k.name })">
                                            <img :src="k.figure" class="h-28 drop-shadow-lg" :alt="k.name">
                                        </button>
                                    </template>
                                    <div x-show="digestShow('header')"
                                        class="flex items-center gap-3 pb-2 border-b border-gray-700 mb-3">
                                        <!-- chip only when the figure is off: both at once said
                                             the same thing twice (lane-header precedent) -->
                                        <div x-show="!digestFigureFull(k)"
                                            class="w-8 h-8 rounded-full flex items-center justify-center font-bold text-white text-sm shrink-0 overflow-hidden"
                                            :style="'background-color:' + (k.color_code || '#3b82f6')">
                                            <template x-if="k.image"><img :src="k.image" class="w-full h-full object-cover"></template>
                                            <template x-if="!k.image"><span x-text="k.avatar || (k.name || '?').charAt(0)"></span></template>
                                        </div>
                                        <div class="font-bold text-white flex-1 truncate" x-text="k.name"></div>
                                        <div x-show="digestShow('streak') && k.streak"
                                            class="text-orange-400 font-black text-sm shrink-0">
                                            <span x-text="k.streak"></span>🔥
                                        </div>
                                    </div>
                                    <template x-for="(line, i) in k.lines" :key="'kdl-' + k.id + '-' + i">
                                        <div class="text-sm text-gray-200 mb-1.5" x-text="line"></div>
                                    </template>
                                    <div x-show="!k.lines.length" class="text-sm text-gray-400">No rides — free day! 🎉</div>
                                    <template x-if="digestShow('tasks')">
                                        <div>
                                            <template x-for="(tline, ti) in (k.tasks || [])" :key="'kdt-' + k.id + '-' + ti">
                                                <div class="text-sm text-indigo-200 mb-1.5" x-text="tline"></div>
                                            </template>
                                        </div>
                                    </template>
                                    <div x-show="digestShow('routines') && k.routine_count"
                                        class="text-xs text-gray-500 mt-2"
                                        x-text="'📋 ' + k.routine_count + ' routine thing' + (k.routine_count !== 1 ? 's' : '')"></div>
                                </div>
                            </template>
                        </div>
                    </div>
{% endmacro %}

<script>
    // The board's mount: the same contract the routines page answers from its
    // own state, answered from the tile payload. Display only, so it rides
    // the payload rather than fetching — and the sixty-second board poll is
    // exactly the cadence this content moves at.
    function kidDigestCard(t) {
        const data = (t && t.data) || {};
        const parts = data.parts || {};
        return {
            // The conversion paradigm, which this card predates: every
            // visually distinct part is a toggle, absent means shown.
            digestShow(part) { return parts[part] !== false; },
            // full figure vs the small face: compact is for pages that draw
            // the figure somewhere nearby (the routines kiosk's lanes)
            digestFigureFull(k) {
                return this.digestShow('figure') && parts.figure_compact !== true && !!k.figure;
            },
            digestCards() { return data.kids || []; },
            digestColumns() {
                // A card knows its tile, not the window. Lanes wrap at four,
                // the same cap every lane card on the board uses.
                return Math.max(1, Math.min((data.kids || []).length || 1, 4));
            },
            digestLabel() {
                return (data.label === 'Today' ? '☀️ ' : '🌙 ')
                    + (data.label || 'Tomorrow');
            },
        };
    }
</script>
