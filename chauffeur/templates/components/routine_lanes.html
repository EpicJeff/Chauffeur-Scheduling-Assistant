<!-- ── Today's routine, a lane per child. One shared drawing.

     The routines PAGE renders this macro in kiosk mode and the `routines_lanes`
     board card renders the same one, so a wall can never drift from the page.
     What stays on the page is the whole admin half — a routine editor per
     member, the copy-from-somebody-else control, the prep kits — none of which
     belongs on a screen with no keyboard that every child in the house can
     reach.

     The macro is markup only — pure Alpine, no element ids — and binds to a
     scope CONTRACT, everything `routineLanesLogic()` below returns: `streaks`,
     `dayItemsFor(memberId)`, `toggleRoutineCheck(id, memberId, checked)`,
     `formatClock`, `kidGlyph`, `laneColumns()` and `routineShow(part)`.
     `interactive` is an Alpine expression: false and the row is a div rather
     than a button, because a hidden control still answers querySelector and a
     wall board is a display.

     IDENTITY IS PER LANE. Every check takes the tapped child's member_id from
     its own lane's `s.member_id`, passed per call and never stored — the same
     rule the chores lanes follow, and for the same reason: two children at one
     kiosk would otherwise stomp each other's taps. The server re-validates
     that the routine belongs to them.

     Parts (all default on): 'header' (avatar and name), 'status' (the earned
     tier), 'streak' (the 🔥 count), 'progress' (today's bar), 'items' (the
     checklist itself).

     Jinja `import` renders none of this file, so the logic script at the
     bottom is emitted by `include` exactly once per page. -->

{# The inside of one checklist row: a tick, the time, the glyph, the title.
   Its own macro because the row is a <button> when the lane can be tapped and
   a <div> when it cannot, and two hand-copied insides is how a glyph ends up
   in one of them and not the other. #}
{% macro routine_row() %}
                                            <div class="rounded-full border-2 flex items-center justify-center shrink-0 font-bold"
                                                :class="[it.checked ? 'bg-green-500 border-green-500 text-white' : 'border-gray-600 text-transparent',
                                                         shellOf(s).glyph_scale === 'xl' ? 'w-9 h-9 text-lg' : 'w-6 h-6 text-sm']">✓</div>
                                            <span class="text-blue-400 font-bold text-xs w-14 shrink-0" x-text="formatClock(it.time_of_day)"></span>
                                            <!-- Stage shell (R1): a Sprout row is photo- or
                                                 glyph-LED at hero size; a Navigator's glyph
                                                 shrinks; a Copilot's disappears — the same
                                                 A4 scale the PWA has always drawn. -->
                                            <template x-if="it.image_id && shellBig(s)">
                                                <img :src="rlApiBase + 'api/media/' + it.image_id" alt=""
                                                    class="rounded-lg object-cover shrink-0"
                                                    :class="shellOf(s).glyph_scale === 'xl' ? 'w-12 h-12' : 'w-8 h-8'">
                                            </template>
                                            <template x-if="!(it.image_id && shellBig(s)) && shellOf(s).glyph_scale !== 'none'">
                                                <span class="shrink-0" :class="shellGlyphClass(s)" x-text="kidGlyph(it)"></span>
                                            </template>
                                            <span :class="[it.checked ? 'text-gray-400 line-through' : 'text-white',
                                                           shellOf(s).glyph_scale === 'xl' ? 'font-black text-lg' : 'font-semibold']"
                                                x-text="it.title"></span>
{% endmacro %}

{% macro lane_grid(interactive='true') %}
                    <div class="grid gap-5" :style="'grid-template-columns: repeat(' + laneColumns() + ', minmax(0, 1fr))'">
                        <template x-for="s in streaks" :key="'rlane-' + s.member_id">
                            <div class="bg-gray-800/60 rounded-2xl border border-gray-700 p-4 flex flex-col gap-3">
                                <!-- Lane header: one horizontal row. The standing character
                                     (avatar arc A5) is its LEFT element and replaces the head
                                     chip -- both at once said the same thing twice. Figure part
                                     off (or no art) falls back to the chip. Either one is the
                                     door to the dressing-up box (A3), wordless on purpose. -->
                                <template x-if="routineShow('header')">
                                <div class="flex items-center gap-3 pb-2 border-b border-gray-700">
                                    <template x-if="routineShow('figure') && s.figure">
                                        <button type="button" class="relative shrink-0"
                                            :disabled="typeof openAvatarEditor === 'undefined'"
                                            @click="typeof openAvatarEditor !== 'undefined'
                                                    && openAvatarEditor({ id: s.member_id, name: s.name })">
                                            <img :src="s.figure" class="h-28 drop-shadow-lg" :alt="s.name">
                                            <span x-show="typeof openAvatarEditor !== 'undefined'"
                                                class="absolute top-0 -right-1 w-4 h-4 rounded-full bg-gray-900 border border-gray-600 grid place-items-center text-[9px]">✏️</span>
                                        </button>
                                    </template>
                                    <template x-if="!(routineShow('figure') && s.figure)">
                                        <button type="button" class="relative shrink-0"
                                            :disabled="typeof openAvatarEditor === 'undefined'"
                                            @click="typeof openAvatarEditor !== 'undefined'
                                                    && openAvatarEditor({ id: s.member_id, name: s.name })">
                                            <div class="w-10 h-10 rounded-full flex items-center justify-center font-bold text-white overflow-hidden"
                                                :style="'background-color:' + (s.color_code || '#3b82f6')">
                                                <template x-if="s.image"><img :src="s.image" class="w-full h-full object-cover"></template>
                                                <template x-if="!s.image"><span x-text="s.avatar || (s.name || '?').charAt(0)"></span></template>
                                            </div>
                                            <span x-show="typeof openAvatarEditor !== 'undefined'"
                                                class="absolute -bottom-0.5 -right-0.5 w-4 h-4 rounded-full bg-gray-900 border border-gray-600 grid place-items-center text-[9px]">✏️</span>
                                        </button>
                                    </template>
                                    <div class="min-w-0 flex-1">
                                        <div class="font-bold text-white text-lg truncate" x-text="s.name"></div>
                                        <template x-if="routineShow('status') && s.status">
                                            <span class="inline-block text-[11px] font-bold text-amber-200"
                                                x-text="s.status.emoji + ' ' + s.status.name"></span>
                                        </template>
                                    </div>
                                    <!-- The A4 rule reaches the wall: a Sprout's lane
                                         hides streaks (they don't land yet), a
                                         Navigator's hides them too (babyish now).
                                         An adult lane (no shell) keeps them. -->
                                    <div class="font-black text-orange-400 text-lg shrink-0"
                                        x-show="routineShow('streak') && (s.shell ? s.shell.show_streaks : true)">
                                        <span x-text="s.streak.current"></span>🔥
                                    </div>
                                </div>
                                </template>

                                <!-- Today progress -->
                                <template x-if="routineShow('progress')">
                                <div class="flex items-center gap-2">
                                    <div class="flex-1 bg-gray-900 rounded-full h-2 overflow-hidden">
                                        <div class="bg-green-500 h-full rounded-full transition-all"
                                            :style="'width:' + (s.streak.today_total ? Math.round(100 * s.streak.today_done / s.streak.today_total) : 0) + '%'"></div>
                                    </div>
                                    <div class="text-xs font-bold shrink-0"
                                        :class="s.streak.today_complete ? 'text-green-400' : 'text-gray-400'"
                                        x-text="s.streak.today_total ? (s.streak.today_done + '/' + s.streak.today_total) : 'rest day'"></div>
                                </div>
                                </template>

                                <!-- The runway (R2): while a flagged window is
                                     live, the lane leads with the vehicle — a
                                     rocket on a track for a Sprout/Explorer, a
                                     slim honest bar for everyone older. Fill =
                                     flagged items and their steps; the end is
                                     the items' own times, tightened by a real
                                     departure when the solver has one. Behind
                                     tints amber, calmly — never a siren. -->
                                <template x-if="activeRunways(s.member_id).length">
                                <div class="space-y-2">
                                    <template x-for="rw in activeRunways(s.member_id)" :key="'rwy-' + s.member_id + '-' + rw.kind">
                                        <div class="rounded-xl border p-3"
                                            :class="rw.behind ? 'border-amber-500/60 bg-amber-900/10' : 'border-gray-700 bg-gray-900'">
                                            <div class="flex items-center justify-between gap-2 mb-1.5">
                                                <span class="font-black"
                                                    :class="shellBig(s) ? 'text-base text-white' : 'text-[10px] uppercase tracking-widest text-gray-400'"
                                                    x-text="(rw.kind === 'morning' ? '🌅 Morning' : '🌙 Bedtime') + ' runway'"></span>
                                                <span class="text-xs font-bold shrink-0"
                                                    :class="rw.behind ? 'text-amber-300' : 'text-gray-400'"
                                                    x-text="rw.units_done + '/' + rw.units_total
                                                        + (rw.end_label ? ' · done by ' + rw.end_label : '')"></span>
                                            </div>
                                            <div class="relative bg-gray-950 rounded-full overflow-hidden"
                                                :class="shellBig(s) ? 'h-5' : 'h-2'">
                                                <div class="h-full rounded-full transition-all duration-700"
                                                    :class="rw.behind ? 'bg-amber-500' : 'bg-emerald-500'"
                                                    :style="'width:' + runwayPct(rw) + '%'"></div>
                                                <span x-show="shellBig(s)"
                                                    class="absolute top-1/2 -translate-y-1/2 text-lg transition-all duration-700"
                                                    :style="'left: max(0%, calc(' + runwayPct(rw) + '% - 24px))'">🚀</span>
                                            </div>
                                            <div x-show="shellBig(s) && rw.next_up"
                                                class="mt-1.5 font-bold text-gray-300"
                                                :class="shellOf(s).glyph_scale === 'xl' ? 'text-base' : 'text-sm'"
                                                x-text="rw.next_up ? ('Next: '
                                                    + (rw.next_up.emoji ? rw.next_up.emoji + ' ' : '')
                                                    + rw.next_up.title
                                                    + (rw.next_up.time_of_day ? ' · ' + formatClock(rw.next_up.time_of_day) : '')) : ''"></div>
                                        </div>
                                    </template>
                                </div>
                                </template>

                                <!-- Today's checklist. A row is a BUTTON only
                                     where it can be tapped: an inert card
                                     drawing disabled buttons reads as broken
                                     rather than as a display. -->
                                <template x-if="routineShow('items')">
                                <div class="space-y-2">
                                    <template x-for="it in dayItemsFor(s.member_id)" :key="'rit-' + s.member_id + '-' + it.id">
                                        <div>
                                            <!-- A row is a BUTTON where it can be
                                                 tapped and a DIV where it cannot.
                                                 Alpine has no dynamic tag, so the
                                                 two are separate branches over one
                                                 shared inside (`routine_row`) —
                                                 an inert card drawing dead buttons
                                                 reads as broken rather than as a
                                                 display. -->
                                            <template x-if="{{ interactive }}">
                                                <button type="button"
                                                    @click="toggleRoutineCheck(it.id, s.member_id, !it.checked)"
                                                    class="w-full text-left border rounded-xl flex items-center gap-3 transition-colors"
                                                    :class="[it.checked ? 'border-green-600/60 bg-green-900/20' : 'border-gray-800 bg-gray-900',
                                                             shellOf(s).glyph_scale === 'xl' ? 'p-4' : 'p-3']">
                                                    {{ routine_row() }}
                                                </button>
                                            </template>
                                            <template x-if="!({{ interactive }})">
                                                <div class="w-full text-left border rounded-xl flex items-center gap-3"
                                                    :class="[it.checked ? 'border-green-600/60 bg-green-900/20' : 'border-gray-800 bg-gray-900',
                                                             shellOf(s).glyph_scale === 'xl' ? 'p-4' : 'p-3']">
                                                    {{ routine_row() }}
                                                </div>
                                            </template>
                                            <!-- The item's steps, while it is still open. Each
                                                 is its own tap on an interactive lane; the item
                                                 completes itself when the last one ticks (the
                                                 server owns that — steps mint nothing). -->
                                            <!-- Steps wear the SAME stage shell as their item
                                                 (the R1 rule, reaching one level down): a
                                                 Sprout's packing list is big taps and big
                                                 glyphs, not fine print under a giant row. -->
                                            <template x-if="(it.steps || []).length && !it.checked">
                                                <div class="pr-2 pt-1"
                                                    :class="shellOf(s).glyph_scale === 'xl' ? 'pl-12 space-y-1.5' : 'pl-9 space-y-1'">
                                                    <template x-for="st in it.steps" :key="'rst-' + it.id + '-' + st.id">
                                                        <template x-if="{{ interactive }}">
                                                            <button type="button"
                                                                @click="toggleRoutineStepCheck(it.id, s.member_id, st.id,
                                                                        !(it.steps_checked || []).includes(st.id))"
                                                                class="w-full text-left flex items-center gap-2"
                                                                :class="shellOf(s).glyph_scale === 'xl' ? 'py-1.5' : 'py-0.5'">
                                                                <span class="rounded-full border-2 flex items-center justify-center shrink-0 font-bold"
                                                                    :class="[(it.steps_checked || []).includes(st.id) ? 'bg-green-500 border-green-500 text-white' : 'border-gray-600 text-transparent',
                                                                             shellOf(s).glyph_scale === 'xl' ? 'w-7 h-7 text-sm'
                                                                                 : (shellBig(s) ? 'w-5 h-5 text-[11px]' : 'w-4 h-4 text-[10px]')]">✓</span>
                                                                <span x-show="st.emoji" class="shrink-0"
                                                                    :class="shellOf(s).glyph_scale === 'xl' ? 'text-2xl' : (shellBig(s) ? 'text-base' : 'text-sm')"
                                                                    x-text="st.emoji"></span>
                                                                <span :class="[(it.steps_checked || []).includes(st.id) ? 'text-gray-500 line-through' : 'text-gray-300',
                                                                               shellOf(s).glyph_scale === 'xl' ? 'text-base font-bold'
                                                                                   : (shellBig(s) ? 'text-sm font-semibold' : 'text-xs font-semibold')]"
                                                                    x-text="st.title"></span>
                                                            </button>
                                                        </template>
                                                    </template>
                                                </div>
                                            </template>
                                        </div>
                                    </template>
                                    <div x-show="dayItemsFor(s.member_id).length === 0"
                                        class="text-gray-600 text-xs bg-gray-900 border border-gray-800 rounded-xl p-3">Nothing today — rest day 🎉</div>
                                </div>
                                </template>
                            </div>
                        </template>
                    </div>
                    <div x-show="!streaks.length" class="text-gray-500 bg-gray-800 rounded-xl p-6">
                        No routines set up yet.
                    </div>
{% endmacro %}

<script>
    // The lane logic: the streaks, today's checklist per child, and the one
    // tap that changes anything — ONE copy, spread into whichever Alpine
    // component mounts the macro. The routines page spreads it into
    // routinesPage(); a board card wraps it in routineLanesCard().
    function routineLanesLogic(apiBase) {
        return {
            streaks: [],
            dayItems: {},          // memberId -> today's checklist
            dayRunways: {},        // memberId -> {morning?, bedtime?} (R2)
            use24h: false,
            // Markup bindings (item photos) need the base the fetches close over.
            rlApiBase: apiBase,

            routineShow(part) { return true; },

            // --- Stage shell (R1): per-LANE presentation from the server's
            // resolved capabilities. An adult lane has no shell and draws
            // exactly as before; absent data (a stale payload mid-upgrade)
            // reads as Explorer-ish defaults, never as broken.
            shellOf(s) { return (s && s.shell) || { glyph_scale: 'lg' }; },
            shellBig(s) {
                const g = this.shellOf(s).glyph_scale;
                return g === 'xl' || g === 'lg';
            },
            shellGlyphClass(s) {
                const g = this.shellOf(s).glyph_scale;
                return g === 'xl' ? 'text-4xl' : (g === 'sm' ? 'text-base' : 'text-xl');
            },
            // Hooks a mount overrides. The page fires the status celebration
            // from both of these; a card does not, because the celebration is
            // a full-screen overlay and a wall showing one per tile is not a
            // celebration, it is a fault.
            lanesOnStreaks(data) { },
            lanesOnChecked(memberId, name, tierStatus) { },

            // The household's clock. A routine's `time_of_day` is stored as
            // "HH:MM" and was printed raw, so every routine time read as
            // 24-hour whatever the setting said. Kept a pure string transform:
            // the value is a wall-clock time with no date, and routing it
            // through a Date would invent one.
            formatClock(hhmm) {
                const m = /^(\d{1,2}):(\d{2})$/.exec(String(hhmm || '').trim());
                if (!m) return hhmm || '';
                let h = parseInt(m[1], 10);
                if (isNaN(h) || h > 23) return hhmm;
                if (this.use24h) return `${String(h).padStart(2, '0')}:${m[2]}`;
                const suffix = h < 12 ? 'AM' : 'PM';
                h = h % 12 || 12;
                return `${h}:${m[2]} ${suffix}`;
            },
            async loadClockFormat() {
                try {
                    const res = await fetch(`${apiBase}api/settings`);
                    if (res.ok) this.use24h = !!(await res.json()).time_format_24h;
                } catch (e) { /* 12-hour is the default either way */ }
            },

            async loadStreaks() {
                try {
                    const res = await fetch(`${apiBase}api/routines/streaks`);
                    const data = await res.json();
                    this.streaks = Array.isArray(data) ? data : [];
                    this.lanesOnStreaks(this.streaks);
                } catch (e) { this.streaks = []; }
            },
            // One request per lane, in parallel. Per member because the day
            // endpoint answers for one child — which is also what keeps the
            // check that follows honest about whose routine it is.
            async loadAllDayItems() {
                const entries = await Promise.all(this.streaks.map(async s => {
                    try {
                        const res = await fetch(`${apiBase}api/routines/day?member_id=`
                            + encodeURIComponent(s.member_id));
                        const data = await res.json();
                        return [s.member_id, data.items || [], data.runways || {}];
                    } catch (e) { return [s.member_id, [], {}]; }
                }));
                const map = {}, runways = {};
                for (const [id, items, rw] of entries) { map[id] = items; runways[id] = rw; }
                this.dayItems = map;
                this.dayRunways = runways;
            },
            async reloadLanes() {
                await this.loadStreaks();
                await this.loadAllDayItems();
            },
            dayItemsFor(memberId) { return this.dayItems[memberId] || []; },
            // R2: the live runway windows for a lane (usually zero or one).
            activeRunways(memberId) {
                return Object.values(this.dayRunways[memberId] || {})
                    .filter(r => r.window_active);
            },
            runwayPct(rw) {
                return Math.round(100 * (rw.units_done || 0)
                    / Math.max(1, rw.units_total || 1));
            },

            async toggleRoutineStepCheck(routineId, memberId, stepId, checked) {
                const res = await fetch(`${apiBase}api/routines/${routineId}/steps/check`, {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ member_id: memberId, step_id: stepId,
                                           checked: checked })
                });
                if (!res.ok) {
                    const e = await res.json().catch(() => ({}));
                    showGlobalAlert(e.detail || 'Could not update');
                } else {
                    const data = await res.json().catch(() => ({}));
                    if (data.item_checked) {
                        // The last step finished the ITEM — the same moment a
                        // direct tap makes, so the same hooks fire.
                        const s = this.streaks.find(x => x.member_id === memberId);
                        this.lanesOnChecked(memberId, s ? s.name : '', data.tier_status);
                        if (typeof celebrateAvatarUnlocks !== 'undefined') {
                            celebrateAvatarUnlocks(s ? s.name : '', data.avatar_unlocked);
                        }
                    }
                }
                await this.reloadLanes();
            },

            async toggleRoutineCheck(routineId, memberId, checked) {
                const res = await fetch(`${apiBase}api/routines/${routineId}/check`, {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ member_id: memberId, checked: checked })
                });
                if (!res.ok) {
                    const e = await res.json().catch(() => ({}));
                    showGlobalAlert(e.detail || 'Could not update');
                } else {
                    const data = await res.json().catch(() => ({}));
                    const s = this.streaks.find(x => x.member_id === memberId);
                    this.lanesOnChecked(memberId, s ? s.name : '', data.tier_status);
                    // New wardrobe earned by THIS tap (avatar arc A6).
                    if (typeof celebrateAvatarUnlocks !== 'undefined') {
                        celebrateAvatarUnlocks(s ? s.name : '', data.avatar_unlocked);
                    }
                }
                await this.reloadLanes();
            },
        };
    }

    // The same 30 seconds the routines kiosk already polled on: a phone
    // ticking something off and the wall agreeing before anybody notices.
    const ROUTINE_LANES_POLL_MS = 30000;

    function routineLanesCard(t, apiBase) {
        const cfg = (t && t.data) || {};
        const wanted = new Set(cfg.members || []);
        const parts = cfg.parts || {};
        return {
            ...routineLanesLogic(apiBase),
            lanesInteractive: cfg.interactive !== false,
            routineShow(part) { return parts[part] !== false; },
            lanesOnStreaks(data) {
                // The card's member filter — "build your own views, filter by
                // person" is half the reason boards exist. Applied in place so
                // the day-items fetch below only asks for the lanes drawn.
                if (wanted.size) {
                    const keep = data.filter(s => wanted.has(s.member_id));
                    data.length = 0;
                    data.push(...keep);
                }
            },
            laneColumns() {
                // A card does not know the window the way the page does; it
                // knows its tile. Lanes wrap at four — a tile wider than four
                // children is a tile that wanted to be the kiosk.
                return Math.max(1, Math.min(this.streaks.length || 1, 4));
            },
            startRoutineLanes() {
                this.loadClockFormat();
                this.reloadLanes();
                setInterval(() => this.reloadLanes(), ROUTINE_LANES_POLL_MS);
            },
        };
    }
</script>
