    </div><script>
        var isReadOnly = window.isReadOnly || false;
        var isKiosk = window.isKiosk || false;
        var chatMessages = document.getElementById('chat-messages');
        var chatInput = document.getElementById('chat-input');
        var chatSubmitBtn = document.getElementById('chat-submit-btn');
        var mapsStatsInterval = null;
        
        function formatControlCenterTime(dateStr) {
            if (typeof window.formatTime === 'function') {
                return window.formatTime(dateStr);
            }
            const is24h = (window.currentData && window.currentData.settings && window.currentData.settings.time_format_24h) || false;
            return new Date(dateStr).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', hour12: !is24h });
        }
        
        if (typeof window.toggleAccordion !== 'function') {
            window.toggleAccordion = function(contentId, chevronId) {
                const content = document.getElementById(contentId);
                const chevron = document.getElementById(chevronId);
                if (content && chevron) {
                    const isHidden = content.classList.contains('hidden');
                    if (isHidden) {
                        content.classList.remove('hidden');
                        chevron.classList.add('rotate-180');
                        
                        // Trigger fetching if expanding specific ones
                        if (contentId === 'notif-content') {
                            if (typeof fetchNotifications === 'function') fetchNotifications();
                        } else if (contentId === 'stats-accordion-content') {
                            if (typeof fetchMapsStatsDashboard === 'function') {
                                fetchMapsStatsDashboard();
                                if (typeof mapsStatsInterval !== 'undefined' && !mapsStatsInterval) {
                                    mapsStatsInterval = setInterval(fetchMapsStatsDashboard, 5000);
                                }
                            }
                        }
                    } else {
                        content.classList.add('hidden');
                        chevron.classList.remove('rotate-180');
                        
                        if (contentId === 'stats-accordion-content') {
                            if (typeof mapsStatsInterval !== 'undefined' && mapsStatsInterval) {
                                clearInterval(mapsStatsInterval);
                                mapsStatsInterval = null;
                            }
                        }
                    }
                }
            };
        }
        
        async function fetchNotifications() {
            try {
                const res = await fetch('api/telemetry');
                const events = await res.json();
                const list = document.getElementById('notif-list');
                const badge = document.getElementById('notif-badge');

                if (events.length === 0) {
                    list.innerHTML = '<p class="text-gray-500 text-center py-4 italic">No recent notifications</p>';
                    badge.classList.add('hidden');
                } else {
                    badge.textContent = events.length;
                    badge.classList.remove('hidden');

                    list.innerHTML = events.map(ev => {
                        const dName = (typeof window.driversMap !== 'undefined' && window.driversMap[ev.driver_id]) ? window.driversMap[ev.driver_id].name : (ev.driver_id || 'Unknown Driver');
                        const timeStr = formatControlCenterTime(new Date(ev.timestamp * 1000).toISOString());
                        const colorClass = ev.action === 'arrived' ? 'text-blue-400' : 'text-green-400';
                        return `
                            <div class="bg-gray-900 border border-gray-700 p-4 rounded-xl flex items-center justify-between shadow-sm">
                                <div>
                                    <span class="font-bold text-white">${dName}</span>
                                    <span class="ml-2 font-bold uppercase tracking-wider text-xs px-2 py-1 bg-gray-800 rounded ${colorClass}">${ev.action}</span>
                                    <p class="text-sm text-gray-400 mt-1">${ev.details || 'Event ID: ' + ev.event_id}</p>
                                </div>
                                <div class="text-xs font-bold text-gray-500">${timeStr}</div>
                            </div>
                        `;
                    }).join('');
                }
            } catch (e) {
                console.error("Failed to load notifications", e);
            }
        }

async function fetchMapsStatsDashboard() {
            try {
                const apiBase = window.location.pathname.endsWith('/') ? '../' : '';
                const res = await fetch(`${apiBase}api/maps/stats`);
                if (!res.ok) return;
                let resData = await res.json();
                let stats = resData.stats || {};
                if (typeof stats !== 'object' || stats === null) stats = {};
                
                stats.matrix = stats.matrix || { monthly: 0, limit: 1, rolling_24h: 0, rpm: 0, disabled: false };
                stats.directions = stats.directions || { monthly: 0, limit: 1, rolling_24h: 0, rpm: 0, disabled: false };
                stats.geocode = stats.geocode || { monthly: 0, limit: 1, rolling_24h: 0, rpm: 0, disabled: false };
                stats.searchbox = stats.searchbox || { monthly: 0, limit: 1, rolling_24h: 0, rpm: 0, disabled: false };

                document.getElementById('stats-loader').classList.add('hidden');
                document.getElementById('stats-content').classList.remove('hidden');

                // Update warnings
                const warningsEl = document.getElementById('stats-warnings');
                let warningsHtml = '';

                if (stats.has_key === false) {
                    warningsHtml += `
                        <div class="p-3 bg-red-950/40 border border-red-900/60 text-red-300 rounded-lg text-xs flex flex-col gap-1">
                            <div class="flex items-center gap-2 font-bold">
                                <svg class="w-4 h-4 text-red-400 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path></svg>
                                <span>Mapbox API Key Missing</span>
                            </div>
                            <span class="text-gray-400">No Mapbox API Key is set in your addon configuration. Mapbox routing is bypassed.</span>
                            <span class="px-2 py-0.5 bg-red-900/60 text-red-200 rounded font-bold uppercase tracking-wider text-[10px] border border-red-800 w-max mt-1">Fallback: Using free OSRM</span>
                        </div>
                    `;
                }

                const matrixOffline = stats?.matrix?.disabled || ((stats?.matrix?.monthly || 0) >= (stats?.matrix?.limit || 1)) || (stats.has_key === false);
                const directionsOffline = stats?.directions?.disabled || ((stats?.directions?.monthly || 0) >= (stats?.directions?.limit || 1)) || (stats.has_key === false);

                if (matrixOffline && stats.has_key !== false) {
                    const reason = stats?.matrix?.disabled ? 'Disabled by user option.' : `Monthly limit reached (${stats?.matrix?.monthly || 0} / ${stats?.matrix?.limit || 1}).`;
                    warningsHtml += `
                        <div class="p-3 bg-amber-950/40 border border-amber-900/60 text-amber-300 rounded-lg text-xs flex flex-col gap-1">
                            <div class="flex items-center gap-2 font-bold">
                                <svg class="w-4 h-4 text-amber-400 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path></svg>
                                <span>Matrix API Offline</span>
                            </div>
                            <span class="text-gray-400">${reason}</span>
                            <span class="px-2 py-0.5 bg-amber-900/60 text-amber-200 rounded font-bold uppercase tracking-wider text-[10px] border border-amber-800 w-max mt-1">Fallback: Using Directions</span>
                        </div>
                    `;
                }

                if (matrixOffline && directionsOffline && stats.has_key !== false) {
                    const reason = stats?.directions?.disabled ? 'Disabled by user option.' : `Monthly limit reached (${stats?.directions?.monthly || 0} / ${stats?.directions?.limit || 1}).`;
                    warningsHtml += `
                        <div class="p-3 bg-red-950/40 border border-red-900/60 text-red-300 rounded-lg text-xs flex flex-col gap-1">
                            <div class="flex items-center gap-2 font-bold">
                                <svg class="w-4 h-4 text-red-400 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path></svg>
                                <span>Directions API Offline</span>
                            </div>
                            <span class="text-gray-400">${reason}</span>
                            <span class="px-2 py-0.5 bg-red-900/60 text-red-200 rounded font-bold uppercase tracking-wider text-[10px] border border-red-800 w-max mt-1">Fallback: Using free OSRM</span>
                        </div>
                    `;
                }

                warningsEl.innerHTML = warningsHtml;

                // Matrix updates
                const matPct = Math.min(100, (stats.matrix.monthly / stats.matrix.limit) * 100);
                document.getElementById('matrix-monthly-text').textContent = `${stats.matrix.monthly} / ${stats.matrix.limit}`;
                const matProgress = document.getElementById('matrix-progress');
                matProgress.style.width = `${matPct}%`;
                matProgress.className = `h-2.5 rounded-full transition-all duration-500 ${stats.matrix.monthly >= stats.matrix.limit ? 'bg-red-500' : (stats.matrix.monthly >= stats.matrix.limit * 0.8 ? 'bg-amber-500' : 'bg-blue-500')}`;
                document.getElementById('matrix-24h-text').textContent = stats.matrix.rolling_24h;

                const matRpm = document.getElementById('matrix-rpm-text');
                if (stats.matrix.rpm > 0) {
                    matRpm.textContent = stats.matrix.rpm;
                    matRpm.className = "px-1.5 py-0.5 bg-gray-900 text-blue-400 rounded font-bold border border-blue-900/30 animate-pulse";
                } else {
                    matRpm.textContent = "0";
                    matRpm.className = "px-1.5 py-0.5 bg-gray-900 text-gray-500 rounded font-bold border border-gray-800";
                }

                // Directions updates
                const dirPct = Math.min(100, (stats.directions.monthly / stats.directions.limit) * 100);
                document.getElementById('directions-monthly-text').textContent = `${stats.directions.monthly} / ${stats.directions.limit}`;
                const dirProgress = document.getElementById('directions-progress');
                dirProgress.style.width = `${dirPct}%`;
                dirProgress.className = `h-2.5 rounded-full transition-all duration-500 ${stats.directions.monthly >= stats.directions.limit ? 'bg-red-500' : (stats.directions.monthly >= stats.directions.limit * 0.8 ? 'bg-amber-500' : 'bg-purple-500')}`;
                document.getElementById('directions-24h-text').textContent = stats.directions.rolling_24h;

                const dirRpm = document.getElementById('directions-rpm-text');
                if (stats.directions.rpm > 0) {
                    dirRpm.textContent = stats.directions.rpm;
                    dirRpm.className = "px-1.5 py-0.5 bg-gray-900 text-purple-400 rounded font-bold border border-purple-900/30 animate-pulse";
                } else {
                    dirRpm.textContent = "0";
                    dirRpm.className = "px-1.5 py-0.5 bg-gray-900 text-gray-500 rounded font-bold border border-gray-800";
                }

                // Geocode updates
                const geoPct = Math.min(100, (stats.geocode.monthly / stats.geocode.limit) * 100);
                document.getElementById('geocode-monthly-text').textContent = `${stats.geocode.monthly} / ${stats.geocode.limit}`;
                const geoProgress = document.getElementById('geocode-progress');
                geoProgress.style.width = `${geoPct}%`;
                geoProgress.className = `h-2.5 rounded-full transition-all duration-500 ${stats.geocode.monthly >= stats.geocode.limit ? 'bg-red-500' : (stats.geocode.monthly >= stats.geocode.limit * 0.8 ? 'bg-amber-500' : 'bg-green-500')}`;
                document.getElementById('geocode-24h-text').textContent = stats.geocode.rolling_24h;

                const geoRpm = document.getElementById('geocode-rpm-text');
                if (stats.geocode.rpm > 0) {
                    geoRpm.textContent = stats.geocode.rpm;
                    geoRpm.className = "px-1.5 py-0.5 bg-gray-900 text-green-400 rounded font-bold border border-green-900/30 animate-pulse";
                } else {
                    geoRpm.textContent = "0";
                    geoRpm.className = "px-1.5 py-0.5 bg-gray-900 text-gray-500 rounded font-bold border border-gray-800";
                }

                // Search Box updates
                const sbPct = Math.min(100, (stats.searchbox.monthly / stats.searchbox.limit) * 100);
                document.getElementById('searchbox-monthly-text').textContent = `${stats.searchbox.monthly} / ${stats.searchbox.limit}`;
                const sbProgress = document.getElementById('searchbox-progress');
                sbProgress.style.width = `${sbPct}%`;
                sbProgress.className = `h-2.5 rounded-full transition-all duration-500 ${stats.searchbox.monthly >= stats.searchbox.limit ? 'bg-red-500' : (stats.searchbox.monthly >= stats.searchbox.limit * 0.8 ? 'bg-amber-500' : 'bg-yellow-500')}`;
                document.getElementById('searchbox-24h-text').textContent = stats.searchbox.rolling_24h;

                const sbRpm = document.getElementById('searchbox-rpm-text');
                if (stats.searchbox.rpm > 0) {
                    sbRpm.textContent = stats.searchbox.rpm;
                    sbRpm.className = "px-1.5 py-0.5 bg-gray-900 text-yellow-400 rounded font-bold border border-yellow-900/30 animate-pulse";
                } else {
                    sbRpm.textContent = "0";
                    sbRpm.className = "px-1.5 py-0.5 bg-gray-900 text-gray-500 rounded font-bold border border-gray-800";
                }

                // Category updates
                stats.category = stats.category || { monthly: 0, limit: 1, rolling_24h: 0, rpm: 0, disabled: false };
                const catPct = Math.min(100, (stats.category.monthly / stats.category.limit) * 100);
                document.getElementById('category-monthly-text').textContent = `${stats.category.monthly} / ${stats.category.limit}`;
                const catProgress = document.getElementById('category-progress');
                catProgress.style.width = `${catPct}%`;
                catProgress.className = `h-2.5 rounded-full transition-all duration-500 ${stats.category.monthly >= stats.category.limit ? 'bg-red-500' : (stats.category.monthly >= stats.category.limit * 0.8 ? 'bg-amber-500' : 'bg-orange-500')}`;
                document.getElementById('category-24h-text').textContent = stats.category.rolling_24h;

                const catRpm = document.getElementById('category-rpm-text');
                if (stats.category.rpm > 0) {
                    catRpm.textContent = stats.category.rpm;
                    catRpm.className = "px-1.5 py-0.5 bg-gray-900 text-orange-400 rounded font-bold border border-orange-900/30 animate-pulse";
                } else {
                    catRpm.textContent = "0";
                    catRpm.className = "px-1.5 py-0.5 bg-gray-900 text-gray-500 rounded font-bold border border-gray-800";
                }

                // Update warning dot on API Stats button in header
                const hasWarning = matrixOffline || directionsOffline;
                const dot = document.getElementById('maps-stats-warning-dot');
                if (dot) {
                    if (hasWarning) {
                        dot.classList.remove('hidden');
                    } else {
                        dot.classList.add('hidden');
                    }
                }
            } catch (e) {
                console.error("Failed to fetch map stats dashboard", e);
            }
        }

async function loadChatHistory() {
            try {
                const apiBase = window.location.pathname.endsWith('/') ? '../' : '';
                const res = await fetch(`${apiBase}api/chat/history`);
                const data = await res.json();
                chatMessages.innerHTML = '';
                if (data.history && data.history.length > 0) {
                    data.history.forEach(msg => appendMessage(msg.role, msg.content));
                } else {
                    appendMessage('assistant', 'Hello! I am your scheduling assistant. Tell me what routing rules you want to add or change, and I will handle it.');
                }
                scrollToBottom();
            } catch (err) {
                console.error('Failed to load chat history', err);
            }
        }

function appendMessage(role, content) {
            const div = document.createElement('div');
            div.className = `max-w-[85%] rounded-lg p-3 text-sm ${role === 'user' ? 'bg-blue-600 text-white self-end rounded-tr-none' : 'bg-gray-700 text-gray-100 self-start rounded-tl-none border border-gray-600'}`;
            // Simple markdown rendering for boldness and line breaks
            let formatted = content.replace(/\n/g, '<br/>').replace(/\*\*(.*?)\*\*/g, '<b>$1</b>');
            div.innerHTML = formatted;
            chatMessages.appendChild(div);
            scrollToBottom();
        }

function scrollToBottom() {
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

async function submitChat(e) {
            e.preventDefault();
            const text = chatInput.value.trim();
            if (!text) return;

            // UI Optimistic Update
            appendMessage('user', text);
            chatInput.value = '';
            chatInput.disabled = true;
            chatSubmitBtn.disabled = true;

            const typingDiv = document.createElement('div');
            typingDiv.className = 'text-gray-400 text-xs italic self-start mt-1 mb-2 animate-pulse';
            typingDiv.innerText = 'Assistant is thinking...';
            chatMessages.appendChild(typingDiv);
            scrollToBottom();

            try {
                const apiBase = window.location.pathname.endsWith('/') ? '../' : '';
                const pageContext = {
                    pathname: window.location.pathname,
                    search: window.location.search
                };
                const res = await fetch(`${apiBase}api/chat`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: text, context: pageContext })
                });

                if (!res.ok) {
                    throw new Error(`Server returned status ${res.status}`);
                }

                const data = await res.json();

                typingDiv.remove();

                if (data.error) {
                    appendMessage('assistant', `⚠️ Error: ${data.error}`);
                } else {
                    appendMessage('assistant', data.reply);
                    if (typeof window.forceSync === 'function') {
                        window.forceSync();
                    } else if (typeof window.fetchTripData === 'function') {
                        window.fetchTripData();
                    } else if (typeof window.renderConfig === 'function') {
                        window.location.reload();
                    } else {
                        window.location.reload();
                    }
                }
            } catch (err) {
                typingDiv.remove();
                appendMessage('assistant', `⚠️ Connection error: ${err.message}`);
            } finally {
                chatInput.disabled = false;
                chatSubmitBtn.disabled = false;
                chatInput.focus();
            }
        }

let isOperationsSidebarOpen = false;

        function toggleOperationsSidebar() {
            const sidebar = document.getElementById('operations-sidebar');
            isOperationsSidebarOpen = !isOperationsSidebarOpen;

            if (isOperationsSidebarOpen) {
                sidebar.classList.remove('translate-x-full');
                sidebar.classList.add('translate-x-0');

                if (window.innerWidth >= 768) {
                    document.body.style.paddingRight = '466px'; // 450px sidebar + 16px default padding
                }

                // Fetch content for expanded accordions
                if (!document.getElementById('notif-content').classList.contains('hidden')) {
                    fetchNotifications();
                }
                if (!document.getElementById('stats-accordion-content').classList.contains('hidden')) {
                    fetchMapsStatsDashboard();
                }
            } else {
                sidebar.classList.remove('translate-x-0');
                sidebar.classList.add('translate-x-full');
                document.body.style.paddingRight = '';
                if (mapsStatsInterval) {
                    clearInterval(mapsStatsInterval);
                    mapsStatsInterval = null;
                }
            }
        }

// Initialize chat
        document.addEventListener('DOMContentLoaded', () => {
            if (!isReadOnly || isKiosk) loadChatHistory();
        });
</script>
