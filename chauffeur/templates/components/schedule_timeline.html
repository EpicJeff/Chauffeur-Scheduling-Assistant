<!-- THE Drives timeline. One renderer, three surfaces.

     `renderSchedule(data, options)` draws the whole thing: a column per
     driver, time running down at a fixed pixels-per-minute, dead hours
     condensed to a "…" band, drive-time pills between events, the lateness and
     conflict marks, the unassigned and no-location columns. It has always
     taken a `targetContainerId` because the page and the AI-options modal both
     call it — this file is what makes the wall board a third caller instead of
     a second, differently-drawn timeline.

     It lived in dashboard.html. The board's own tile drew its own smaller
     timeline for one version (v2.125.0) and the family's report was the
     obvious one: *"does not look quite the same as the actual page — timeline
     is different, event chips are different."* Two drawings of the same thing
     is exactly what the shelf is not allowed to look like, and the fix is not
     to copy the chips more carefully. It is to draw them once.

     Moved VERBATIM apart from one correction, marked below: `isReadOnly` and
     `isKiosk` are now options with the page's globals as their default. The
     modal has passed `isReadOnly: true` since it was written and the option
     was never read.

     The state below is the timeline's, and lives here now rather than in
     dashboard.html — classic scripts share one global scope, so the page's
     code goes on using these names unchanged. Anything that DRAWS from them
     belongs here; anything that fetches or mutates them stays on the page.
-->
<script>
    // The timeline's own state. Declared here, set by whoever is driving:
    // dashboard.html fills these from /api/schedule as it always has, and the
    // home board fills them from the board payload's own cached slice.
    const _tlParams = new URLSearchParams(window.location.search);
    const isKiosk = _tlParams.get('kiosk') === 'true';
    const isReadOnly = _tlParams.get('readonly') === 'true' || isKiosk;

    const localSolvingDates = new Set();
    let initialEdges = {};
    let finalEdges = {};
    let currentStartDate = null;
    let currentEndDate = null;
    let currentData = null;
    let currentEventsMap = {};
    // Assigned without a declaration on the dashboard, so it was already a
    // window property. Named explicitly now that two pages depend on it.
    var driversMap = driversMap || {};

    function formatTime(dateStr) {
        const is24h = (window.currentData && window.currentData.settings && window.currentData.settings.time_format_24h) || false;
        return new Date(dateStr).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', hour12: !is24h });
    }

    function formatDateStr(dateStr) {
        if (dateStr.length === 10) dateStr += 'T00:00:00';
        return new Date(dateStr).toLocaleDateString([], { weekday: 'long', month: 'short', day: 'numeric' });
    }

    // The timeline's markup carries inline handlers for opening an event,
    // dragging it to another driver, and acting on an AI suggestion. Those
    // belong to the DRIVES PAGE, which defines them further down its own
    // script and overwrites these. A surface that only displays the timeline
    // (the board tile) gets no-ops rather than a ReferenceError from a chip
    // somebody tapped — and passes `isReadOnly: true`, which is what stops the
    // drag attributes being written at all.
    window.openEventModal = window.openEventModal || function () {};
    window.openAIOptionsModal = window.openAIOptionsModal || function () {};
    window.createRule = window.createRule || function () {};
    window.drag = window.drag || function () {};
    window.drop = window.drop || function () {};
    window.allowDrop = window.allowDrop || function () {};

        // Captured so a chip-tap mutation can redraw exactly what the page
        // drew (the board and the dashboard call with different options).
        let lastScheduleRenderOptions = {};

        // --- Optional-event decision popover (phase 2 hand path) ---
        // Works on EVERY surface that renders this timeline — the dashboard
        // (parents deciding for small children) and the /home wall board
        // (no PWA needed). Two deliberate taps; readOnly only disables drag.
        let _optDecisionPop = null;
        function closeOptionalDecision() {
            if (_optDecisionPop) { _optDecisionPop.remove(); _optDecisionPop = null; }
        }
        function openOptionalDecision(e, evId, current) {
            e.stopPropagation();
            e.preventDefault();
            closeOptionalDecision();
            const rect = e.currentTarget.getBoundingClientRect();
            const pop = document.createElement('div');
            pop.className = 'fixed z-[300] bg-gray-900 border border-purple-500/50 rounded-xl shadow-2xl p-2 flex gap-2';
            pop.style.left = Math.max(8, Math.min(rect.left, window.innerWidth - 280)) + 'px';
            pop.style.top = Math.min(rect.bottom + 6, window.innerHeight - 60) + 'px';
            const btn = (label, decision, cls, active) =>
                `<button onclick="setOptionalDecisionFromChip('${evId}', '${decision}')"
                    class="text-xs font-bold px-3 py-2 rounded-lg ${cls} ${active ? 'ring-2 ring-white/70' : ''}">${label}</button>`;
            pop.innerHTML =
                btn('Going ✓', 'attend', 'bg-green-600 text-white', current === 'attend') +
                btn('Skip today', 'skip', 'bg-purple-700 text-purple-100', current === 'skip') +
                btn('Leave open', 'clear', 'bg-gray-700 text-gray-200', !current);
            pop.addEventListener('click', ev2 => ev2.stopPropagation());
            document.body.appendChild(pop);
            _optDecisionPop = pop;
            setTimeout(() => document.addEventListener('click', closeOptionalDecision, { once: true }), 0);
        }
        async function setOptionalDecisionFromChip(evId, decision) {
            closeOptionalDecision();
            // ha_theme.html works the path climb out once, board level included.
            const apiBase = (typeof window !== 'undefined' && window.chfBase !== undefined ? window.chfBase : '');
            try {
                const res = await fetch(`${apiBase}api/events/${encodeURIComponent(evId)}/optional_decision`, {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ decision }) });
                if (!res.ok) {
                    const err = await res.json().catch(() => ({}));
                    if (window.showGlobalAlert) showGlobalAlert(err.detail || "Couldn't save that.");
                    return;
                }
                const out = await res.json();
                if (window.showGlobalAlert && out.message) showGlobalAlert(out.message);
                // Reflect the choice immediately; the background re-solve
                // catches the driver consequences on the next data poll.
                const ev = ((currentData && currentData.events) || [])
                    .find(x => String(x.id) === String(evId));
                if (ev) ev.optional_decision = out.decision || null;
                if (currentData) renderSchedule(currentData, lastScheduleRenderOptions || {});
            } catch (e2) {
                if (window.showGlobalAlert) showGlobalAlert("Couldn't save that.");
            }
        }

        function renderSchedule(data, options = {}) {
            lastScheduleRenderOptions = options;
            if (!data) data = {};
            const {
                targetContainerId = 'schedule-container',
                isModal = false,
                dateFilter = null,
                isPagination = false
            } = options;

            // A caller can declare itself read-only. It always could — the AI
            // options modal has passed `isReadOnly: true` since it was written
            // — but the option was never destructured, so the flag was
            // silently the PAGE's, and the modal was read-only only because
            // the page it lives on usually is. The home board's tile is the
            // first caller for which that is not true.
            const readOnly = options.isReadOnly !== undefined
                ? options.isReadOnly : isReadOnly;
            const kiosk = options.isKiosk !== undefined ? options.isKiosk : isKiosk;

            const {
                events = [],
                assignments = {},
                ghost_assignments = {},
                unassigned = [],
                no_location = [],
                calendar_metadata = {},
                overridden_events = [],
                lateness_warnings = [],
                scheduled_errands = []
            } = data;

            let localEvents = [...events];
            let localAssignments = { ...assignments };
            let localRouteEdges = JSON.parse(JSON.stringify(data.route_edges || {}));
            let localInitialEdges = JSON.parse(JSON.stringify(initialEdges || {}));
            let localFinalEdges = JSON.parse(JSON.stringify(finalEdges || {}));

            // Outside hands (load arc A1): somebody outside this household is
            // covering the drive. They get a COLUMN, exactly as a ghost driver
            // does, so the entire existing column machinery — sorting, blocks,
            // empty-column hiding — works on them unchanged.
            //
            // Injected HERE, in the shared renderer, rather than on the
            // dashboard: the board tile draws with this same function, and the
            // v2.126.0 lesson was that two drawings of one thing drift apart
            // the day they ship.
            const assistAssignments = data.assist_assignments || {};
            const assistContacts = {};
            (data.assist_contacts || []).forEach(c => { assistContacts[c.id] = c; });
            Object.entries(assistAssignments).forEach(([evId, cId]) => {
                const c = assistContacts[cId];
                if (!c) return;   // contact deleted mid-flight: leave it unassigned
                const colId = 'assist_' + cId;
                if (!driversMap[colId]) {
                    driversMap[colId] = {
                        id: colId,
                        // The label the family says out loud beats the legal
                        // name on a kitchen wall: "Emma's mom".
                        name: c.relation_label || c.name,
                        color_code: c.color_code || '#64748b',
                        // Not 'primary'/'secondary', so colSortKey lands them
                        // after the household and before the ghosts: real
                        // coverage outranks a hypothetical extra person.
                        group: 'assist',
                        priority_index: 999,
                        is_assist: true,
                        assist_contact: c
                    };
                }
                localAssignments[evId] = colId;
            });

            if (window.showErrands && scheduled_errands && scheduled_errands.length > 0) {
                scheduled_errands.forEach(errand => {
                    errand.start = errand.start_time;
                    errand.end = errand.end_time;
                    errand.event_type = 'errand';
                    localEvents.push(errand);
                    localAssignments[errand.id] = errand.driver.id;

                    // Patch route edges for drive time pills
                    const d_id = errand.driver.id;
                    if (!localRouteEdges[d_id]) localRouteEdges[d_id] = {};
                    if (!localInitialEdges[d_id]) localInitialEdges[d_id] = {};
                    if (!localFinalEdges[d_id]) localFinalEdges[d_id] = {};

                    const e1_id = errand.inserted_after_event_id;
                    const e2_id = errand.inserted_before_event_id;

                    if (e1_id === null && e2_id === null) {
                        // Only event of the day
                        localInitialEdges[d_id][errand.id] = {
                            to_event: errand.id,
                            travel_mins: errand.travel_to_mins,
                            delay_mins: 0
                        };
                        localFinalEdges[d_id][errand.id] = {
                            from_event: errand.id,
                            travel_mins: errand.travel_from_mins,
                            delay_mins: 0
                        };
                    } else if (e1_id === null) {
                        // Before first event
                        localInitialEdges[d_id][errand.id] = {
                            to_event: errand.id,
                            travel_mins: errand.travel_to_mins,
                            delay_mins: 0
                        };
                        delete localInitialEdges[d_id][e2_id];

                        localRouteEdges[d_id][errand.id] = {
                            from_event: errand.id,
                            to_event: e2_id,
                            travel_mins: errand.travel_from_mins,
                            delay_mins: 0
                        };
                    } else if (e2_id === null) {
                        // After last event
                        localFinalEdges[d_id][errand.id] = {
                            from_event: errand.id,
                            travel_mins: errand.travel_from_mins,
                            delay_mins: 0
                        };
                        delete localFinalEdges[d_id][e1_id];

                        localRouteEdges[d_id][e1_id] = {
                            from_event: e1_id,
                            to_event: errand.id,
                            travel_mins: errand.travel_to_mins,
                            delay_mins: 0
                        };
                    } else {
                        // Between events
                        if (localRouteEdges[d_id][e1_id]) {
                            localRouteEdges[d_id][e1_id] = {
                                from_event: e1_id,
                                to_event: errand.id,
                                travel_mins: errand.travel_to_mins,
                                delay_mins: 0
                            };
                        }

                        localRouteEdges[d_id][errand.id] = {
                            from_event: errand.id,
                            to_event: e2_id,
                            travel_mins: errand.travel_from_mins,
                            delay_mins: 0
                        };
                    }
                });
            }

            if (!isModal) {
                // --- Inbox Logic ---
                let triageEvents = events.filter(e => e.needs_triage);

                // Group recurring events
                const seriesGrouped = {};
                const deduplicatedTriageEvents = [];
                for (const ev of triageEvents) {
                    if (ev.recurring_event_id) {
                        if (!seriesGrouped[ev.recurring_event_id]) {
                            seriesGrouped[ev.recurring_event_id] = {
                                ...ev,
                                is_series_grouped: true,
                                series_count: 1
                            };
                            deduplicatedTriageEvents.push(seriesGrouped[ev.recurring_event_id]);
                        } else {
                            seriesGrouped[ev.recurring_event_id].series_count++;
                        }
                    } else {
                        deduplicatedTriageEvents.push(ev);
                    }
                }

                triageEvents = deduplicatedTriageEvents;

                // PAGE CHROME, not timeline. The inbox of events needing setup
                // and the AI banner below it belong to the Drives page and are
                // simply absent on any other host — the board's tile is a
                // timeline, not the page around it. Unguarded, the `else`
                // branch here threw on `null.classList` and took the whole
                // render down, which is how the tile came up empty the first
                // time it was pointed at this renderer.
                const inboxContainer = document.getElementById('inbox-container');
                const inboxList = document.getElementById('inbox-list');
                const inboxCount = document.getElementById('inbox-count');

                if (!inboxContainer || !inboxList || !inboxCount) {
                    /* no inbox on this surface */
                } else if (triageEvents.length > 0 && !kiosk) {
                    inboxCount.textContent = triageEvents.length;
                    inboxContainer.classList.remove('hidden');
                    inboxList.innerHTML = triageEvents.map(ev => {
                        const calMetas = (ev.calendar_ids || []).map(c => calendar_metadata && calendar_metadata[c] ? calendar_metadata[c] : { backgroundColor: '#3B82F6', summary: 'Calendar' });
                        const evColor = calMetas.length > 0 ? calMetas[0].backgroundColor : '#3B82F6';

                        const seriesBadge = ev.is_series_grouped && ev.series_count > 1 ? `<span class="bg-indigo-900/50 text-indigo-300 text-[10px] font-bold uppercase px-2 py-0.5 rounded ml-2 border border-indigo-700/50 shrink-0">Series (${ev.series_count})</span>` : '';

                        return `
                        <div id="event-${ev.id}" onclick="openEventModal('${ev.id}')" class="bg-gray-800 border border-red-500/50 rounded-xl p-4 cursor-pointer hover:bg-gray-700 transition shadow-lg relative overflow-hidden group">
                            <div class="absolute left-0 top-0 bottom-0 w-1.5" style="background-color: ${evColor}"></div>
                            <div class="pl-2">
                                <h3 class="font-bold text-white text-lg truncate group-hover:text-blue-300 transition flex items-center">
                                    <span>${ev.title || '(No Title)'}</span>
                                    ${seriesBadge}
                                </h3>
                                <p class="text-sm text-gray-400 mt-1">${formatDateStr(ev.start)} • ${formatTime(ev.start)}</p>
                                <div class="mt-3 flex items-center justify-between">
                                    <span class="text-xs font-bold uppercase tracking-wider text-red-400 bg-red-900/30 px-2 py-1 rounded-md">Needs Setup</span>
                                    <svg class="w-4 h-4 text-gray-500 group-hover:text-white transition" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg>
                                </div>
                            </div>
                        </div>
                    `;
                    }).join('');
                } else {
                    inboxContainer.classList.add('hidden');
                }
                // --- End Inbox Logic ---

                // --- AI Suggestion Logic ---
                // Same: absent off the Drives page, and it is a BUTTON — a
                // wall board displays the schedule, it does not approve a new
                // one. A detached node absorbs the two class changes rather
                // than sprinkling null checks through the branch below.
                const aiBanner = document.getElementById('ai-suggestion-banner')
                    || document.createElement('div');
                let hasAiSuggestion = false;
                let firstSuggestionDate = null;
                let allSuggestionDates = [];
                if (data.ai_metadata) {
                    // Ensure dates are sorted chronologically
                    const sortedDates = Object.keys(data.ai_metadata).sort((a, b) => new Date(a) - new Date(b));
                    for (const dateStr of sortedDates) {
                        const meta = data.ai_metadata[dateStr];
                        if (meta.ai_status === 'suggests_alternative' && meta.options && meta.options.length > 0) {
                            hasAiSuggestion = true;
                            allSuggestionDates.push(dateStr);
                            if (!firstSuggestionDate) firstSuggestionDate = dateStr;
                        }
                    }
                }
                if (hasAiSuggestion && !readOnly) {
                    aiBanner.classList.remove('hidden');
                    window.currentAiMetadata = data.ai_metadata;
                    window.firstSuggestionDate = firstSuggestionDate;
                    window.allSuggestionDates = allSuggestionDates;
                } else {
                    aiBanner.classList.add('hidden');
                    window.currentAiMetadata = data.ai_metadata || null;
                    window.allSuggestionDates = [];
                }

                // Clear local solving dates if they are no longer in data.solving_dates
                if (data.solving_dates) {
                    for (const date of localSolvingDates) {
                        if (!data.solving_dates.includes(date)) {
                            localSolvingDates.delete(date);
                        }
                    }
                } else {
                    localSolvingDates.clear();
                }
            } // Close if (!isModal)

            const scheduleByDate = {};
            if (currentStartDate && currentEndDate) {
                let currDate = new Date(currentStartDate);
                currDate.setHours(0, 0, 0, 0);
                const endD = new Date(currentEndDate);
                endD.setHours(23, 59, 59, 999);
                while (currDate <= endD) {
                    const year = currDate.getFullYear();
                    const month = String(currDate.getMonth() + 1).padStart(2, '0');
                    const day = String(currDate.getDate()).padStart(2, '0');
                    const dateKey = `${year}-${month}-${day}`;
                    scheduleByDate[dateKey] = {};
                    currDate.setDate(currDate.getDate() + 1);
                }
            } else if (data.solving_dates) {
                data.solving_dates.forEach(d_str => {
                    if (!scheduleByDate[d_str]) {
                        scheduleByDate[d_str] = {};
                    }
                });
            }
            localSolvingDates.forEach(d_str => {
                if (!scheduleByDate[d_str]) {
                    scheduleByDate[d_str] = {};
                }
            });



            const overriddenEventsList = overridden_events || [];
            const latenessWarningsMap = lateness_warnings || {};

            currentEventsMap = {};
            localEvents.forEach(ev => {
                currentEventsMap[ev.id] = ev;

                // An event can belong to multiple columns now.
                // It belongs to its assigned column, ghost_assigned column, unassigned/no_location, AND any driver_events column.
                let targetCols = [];
                if (no_location && no_location.includes(ev.id)) {
                    targetCols.push('no_location');
                } else {
                    if (localAssignments && localAssignments[ev.id]) targetCols.push(localAssignments[ev.id]);
                    if (ghost_assignments && ghost_assignments[ev.id]) targetCols.push(ghost_assignments[ev.id]);
                    if (unassigned && unassigned.includes(ev.id)) targetCols.push('unassigned');

                    // Add columns where the driver is attending the event
                    if (data.driver_events) {
                        for (const dId of Object.keys(data.driver_events)) {
                            if (data.driver_events[dId].includes(ev.id) && !targetCols.includes(dId)) {
                                targetCols.push(dId);
                            }
                        }
                    }
                }
                
                if (ev.event_type === 'background_trip') {
                    (data.drivers || []).forEach(d => {
                        if (!targetCols.includes(d.id)) targetCols.push(d.id);
                    });
                    if (!targetCols.includes('unassigned')) targetCols.push('unassigned');
                }

                if (targetCols.length === 0) return;

                let currDate = new Date(ev.start);
                if (currentStartDate && currDate < currentStartDate) {
                    currDate = new Date(currentStartDate);
                }
                currDate.setHours(0, 0, 0, 0);

                let endDate = new Date(ev.end);
                if (currentEndDate && endDate > currentEndDate) {
                    endDate = new Date(currentEndDate);
                }
                endDate.setHours(0, 0, 0, 0);

                // If the event ends at midnight, don't include the end date unless it's the same as the start date
                if (new Date(ev.end).getHours() === 0 && new Date(ev.end).getMinutes() === 0 && currDate < endDate) {
                    endDate.setDate(endDate.getDate() - 1);
                }

                while (currDate <= endDate) {
                    const year = currDate.getFullYear();
                    const month = String(currDate.getMonth() + 1).padStart(2, '0');
                    const day = String(currDate.getDate()).padStart(2, '0');
                    const dateKey = `${year}-${month}-${day}`;

                    if (!scheduleByDate[dateKey]) scheduleByDate[dateKey] = {};

                    targetCols.forEach(col_id => {
                        if (!scheduleByDate[dateKey][col_id]) scheduleByDate[dateKey][col_id] = [];
                        scheduleByDate[dateKey][col_id].push(ev);
                    });

                    currDate.setDate(currDate.getDate() + 1);
                }
            });

            const scheduleContainer = document.getElementById(targetContainerId);
            scheduleContainer.innerHTML = '';

            if (Object.keys(scheduleByDate).length === 0) {
                let msg = "No scheduled activities for the next 7 days.";
                if (isPagination && currentStartDate && currentEndDate) {
                    const sStr = currentStartDate.toLocaleDateString(undefined, { weekday: 'long', month: 'short', day: 'numeric' });
                    const eStr = currentEndDate.toLocaleDateString(undefined, { weekday: 'long', month: 'short', day: 'numeric' });
                    if (sStr === eStr) {
                        msg = `No scheduled activities for ${sStr}.`;
                    } else {
                        msg = `No scheduled activities for ${sStr} to ${eStr}.`;
                    }
                }
                scheduleContainer.innerHTML = `<p class="text-center text-gray-500 text-xl mt-20">${msg}</p>`;
                return;
            }

            // Sort dates
            let sortedDates = Object.keys(scheduleByDate).sort((a, b) => new Date(a) - new Date(b));
            if (dateFilter) {
                sortedDates = sortedDates.filter(d => d === dateFilter);
                if (sortedDates.length === 0) {
                    scheduleContainer.innerHTML = `<p class="text-center text-gray-500 text-xl mt-20">No scheduled activities for ${dateFilter}.</p>`;
                    return;
                }
            }

            sortedDates.forEach(date => {
                const colsObj = scheduleByDate[date];

                function isPassengerTask(ev) {
                    return (localAssignments && localAssignments[ev.id]) ||
                        (data.ghost_assignments && data.ghost_assignments[ev.id]) ||
                        (data.unassigned && data.unassigned.includes(ev.id)) ||
                        (data.no_location && data.no_location.includes(ev.id));
                }

                // Step 1: Removed min/max passenger time filtering so all driver events are shown as busy blocks

                // Step 2: Removed filtering of driver-only events

                // Get all columns that should be rendered in the timeline
                // Ghost (suggested extra driver) ids are exactly "ghost_N".
                // A bare 'g' prefix check misclassified real drivers whose id
                // happens to start with g, hiding their column on empty days.
                const isGhostCol = (id) => id.startsWith('ghost_');
                // Column order: primary drivers first, then secondary, ghosts
                // always last; priority (1 = highest) within each group,
                // alphabetical by name within the same priority.
                const colSortKey = (id) => {
                    const d = driversMap[id] || {};
                    const group = (d.group || 'primary').toLowerCase();
                    return {
                        group: group === 'primary' ? 0 : (group === 'secondary' ? 1 : 2),
                        pri: Number.isFinite(d.priority_index) ? d.priority_index : 999,
                        name: (d.name || id).toLowerCase()
                    };
                };
                let colIds = Object.keys(driversMap).sort((a, b) => {
                    if (isGhostCol(a) !== isGhostCol(b)) return isGhostCol(a) ? 1 : -1;
                    const ka = colSortKey(a), kb = colSortKey(b);
                    if (ka.group !== kb.group) return ka.group - kb.group;
                    if (ka.pri !== kb.pri) return ka.pri - kb.pri;
                    return ka.name.localeCompare(kb.name);
                }).filter(id => {
                    // Background-trip banners are injected into EVERY column for
                    // context, so they must not count as "having a schedule" —
                    // otherwise drivers made unavailable by a rule (zero real
                    // events) pop back into view on trip days.
                    const hasRealEvents = colsObj[id] && colsObj[id].some(e => e.event_type !== 'background_trip');
                    // Always hide ghost drivers if they have zero events for this day
                    if (isGhostCol(id)) {
                        return hasRealEvents;
                    }
                    // For regular drivers in read-only mode, hide empty columns
                    if (readOnly) {
                        return hasRealEvents;
                    }
                    return true;
                });

                const isSolving = (data.solving_dates && data.solving_dates.includes(date)) || (typeof localSolvingDates !== 'undefined' && localSolvingDates.has(date));
                if (colIds.length === 0 && !isSolving) {
                    return; // Skip rendering this entire date block if there are no columns
                }


                const dayContainer = document.createElement('div');
                dayContainer.className = "relative border border-gray-700/30 rounded-xl p-4 mb-6 bg-gray-800/10 overflow-hidden flex flex-col";

                const formattedDateTitle = formatDateStr(date);
                const dateHeader = document.createElement('div');
                dateHeader.className = "bg-gray-800 border-t border-gray-700 py-2.5 px-4 mb-4 shadow-md rounded-lg flex items-center justify-between";

                let aiBadgeHTML = '';
                if (data.ai_metadata && data.ai_metadata[date] && !readOnly) {
                    const meta = data.ai_metadata[date];
                    if (meta.ai_status === 'evaluating') {
                        aiBadgeHTML = `<span class="bg-gray-700 text-gray-300 text-[10px] font-bold px-2 py-0.5 rounded ml-3 flex items-center border border-gray-500"><svg class="w-3 h-3 mr-1 animate-spin" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg> AI Evaluating...</span>`;
                    } else if (meta.ai_status === 'suggests_alternative') {
                        aiBadgeHTML = `<button onclick="openAIOptionsModal('${date}')" class="bg-indigo-600 hover:bg-indigo-500 text-white text-[10px] font-bold px-2 py-0.5 rounded ml-3 flex items-center shadow-md transition-colors"><svg class="w-3 h-3 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path></svg> AI Suggestion</button>`;
                    } else if (meta.ai_status === 'approved_default') {
                        aiBadgeHTML = `<button onclick="openAIOptionsModal('${date}')" class="bg-green-700 hover:bg-green-600 text-green-100 text-[10px] font-bold px-2 py-0.5 rounded ml-3 flex items-center shadow-md transition-colors" title="AI reviewed this schedule"><svg class="w-3 h-3 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg> AI Approved</button>`;
                    } else if (!meta.ai_status) {
                        aiBadgeHTML = `<span class="bg-gray-800 text-gray-500 text-[10px] font-bold px-2 py-0.5 rounded ml-3 flex items-center border border-gray-700 cursor-help" title="AI is idle. Go to Settings -> General and click 'Synthesize AI Rules' to generate themes and activate AI evaluation."><svg class="w-3 h-3 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.618 5.984A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016zM12 9v2m0 4h.01"></path></svg> AI Idle</span>`;
                    }
                }

                dateHeader.innerHTML = `<div class="flex items-center"><h2 class="schedule-date-title text-base font-bold text-blue-200 uppercase tracking-widest leading-none">${formattedDateTitle}</h2>${aiBadgeHTML}</div>`;
                dayContainer.appendChild(dateHeader);

                // --- Timeline Constants & Logic ---
                const PIXELS_PER_MINUTE = 1.3;
                // A leg pill needs vertical room or it lands on the event block.
                // This used to be written as `distance > 10`, which QUIETLY DROPPED
                // the pill: at 1.3px/min a two-minute drive plus the standard
                // five-minute buffer is 9.1px, so every drive under about three
                // minutes drew nothing at all and the event appeared with no way
                // to have got there. It is a LAYOUT floor, not a test of whether
                // the drive exists -- so short legs now draw at this height and
                // reach up over the gap instead of vanishing.
                const MIN_LEG_PILL_PX = 26;
                const GAP_HEIGHT = 15; // 40px height for the "..." condensed gap

                // Helper: floor to hour
                function floorToHour(dateStr) {
                    const d = new Date(dateStr);
                    d.setMinutes(0, 0, 0);
                    return d;
                }

                // Helper: ceil to hour
                function ceilToHour(dateStr) {
                    const d = new Date(dateStr);
                    if (d.getMinutes() > 0 || d.getSeconds() > 0) {
                        d.setHours(d.getHours() + 1, 0, 0, 0);
                    }
                    return d;
                }

                // Helper: format duration
                function formatDuration(totalMins) {
                    if (totalMins < 60) return `${totalMins}m`;
                    const h = Math.floor(totalMins / 60);
                    const m = totalMins % 60;
                    return m > 0 ? `${h}h ${m}m` : `${h}h`;
                }

                function getHomeIcon(loc) {
                    if (!loc) return `<svg class="w-3 h-3 inline-block mx-0.5" fill="currentColor" viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>`;
                    const l = loc.toLowerCase();
                    if (l.includes("hotel") || l.includes("resort") || l.includes("motel") || l.includes("suites") || l.includes("lodge") || l.includes(" inn") || l.startsWith("inn ") || l.includes("hyatt") || l.includes("hilton") || l.includes("ritz") || l.includes("marriott")) {
                        return `<svg class="w-3 h-3 inline-block mx-0.5" fill="currentColor" viewBox="0 0 24 24"><path d="M7 13c1.66 0 3-1.34 3-3S8.66 7 7 7s-3 1.34-3 3 1.34 3 3 3zm12-6h-8v7H3V5H1v15h2v-3h18v3h2v-9c0-2.21-1.79-4-4-4z"/></svg>`;
                    }
                    else if (l.includes("airbnb") || l.includes("vrbo") || l.includes("rental")) {
                        return `<svg class="w-3 h-3 inline-block mx-0.5" fill="currentColor" viewBox="0 0 24 24"><path d="M12.65 10A5.99 5.99 0 007 6c-3.31 0-6 2.69-6 6s2.69 6 6 6a5.99 5.99 0 005.65-4H17v4h4v-4h2v-4H12.65zM7 14c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2z"/></svg>`;
                    }
                    return `<svg class="w-3 h-3 inline-block mx-0.5" fill="currentColor" viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>`;
                }

                let allEventsForDate = [];
                colIds.forEach(c_id => {
                    if (colsObj[c_id]) {
                        colsObj[c_id].forEach(e => {
                            const isDriverOnlyEv = !(localAssignments && localAssignments[e.id]) &&
                                !(data.ghost_assignments && data.ghost_assignments[e.id]) &&
                                !(data.unassigned && data.unassigned.includes(e.id)) &&
                                !(data.no_location && data.no_location.includes(e.id));
                            const durationMins = (new Date(e.end) - new Date(e.start)) / 60000;
                            if (e.event_type !== 'background_trip' && !e.all_day && durationMins < 1430) {
                                allEventsForDate.push(e);
                            }
                        });
                    }
                });

                // Active periods
                let activePeriods = allEventsForDate.map(e => {
                    return {
                        start: floorToHour(e.start).getTime(),
                        end: ceilToHour(e.end).getTime()
                    };
                });

                // Extend timeline backward for initial travel from home
                colIds.forEach(c_id => {
                    if (colsObj[c_id]) {
                        colsObj[c_id].forEach(ev => {
                            if (ev.event_type === 'background_trip') return;
                            const isAssignedToThisColumn = (localAssignments && localAssignments[ev.id] === c_id) || (data.ghost_assignments && data.ghost_assignments[ev.id] === c_id) || (c_id === 'unassigned' && data.unassigned && data.unassigned.includes(ev.id)) || (c_id === 'no_location' && data.no_location && data.no_location.includes(ev.id));
                            if (!isAssignedToThisColumn) return;

                            const initEdge = localInitialEdges[c_id] ? localInitialEdges[c_id][ev.id] : null;
                            if (initEdge && initEdge.travel_mins > 0) {
                                const targetEvent = allEventsForDate.find(e => e.id === initEdge.to_event);
                                if (targetEvent) {
                                    const departureTime = new Date(targetEvent.start).getTime() - (initEdge.travel_mins + 5) * 60000;
                                    const departureHour = floorToHour(new Date(departureTime).toISOString()).getTime();
                                    activePeriods.push({ start: departureHour, end: floorToHour(targetEvent.start).getTime() });
                                }
                            }

                            const finalEdge = localFinalEdges[c_id] ? localFinalEdges[c_id][ev.id] : null;
                            if (finalEdge && finalEdge.travel_mins > 0) {
                                const targetEvent = allEventsForDate.find(e => e.id === finalEdge.from_event);
                                if (targetEvent) {
                                    const arriveTime = new Date(targetEvent.end).getTime() + (finalEdge.travel_mins + 5) * 60000;
                                    const arriveHour = ceilToHour(new Date(arriveTime).toISOString()).getTime();
                                    activePeriods.push({ start: ceilToHour(targetEvent.end).getTime(), end: arriveHour });
                                }
                            }
                        });
                    }
                });

                activePeriods.sort((a, b) => a.start - b.start);

                let hasBgTrip = false;
                colIds.forEach(c_id => {
                    if (colsObj[c_id] && colsObj[c_id].some(e => e.event_type === 'background_trip')) {
                        hasBgTrip = true;
                    }
                });

                if (hasBgTrip && activePeriods.length > 0) {
                    activePeriods.unshift({
                        start: activePeriods[0].start - 3600000,
                        end: activePeriods[0].start
                    });
                }

                let blocks = [];
                if (activePeriods.length > 0) {
                    let currentBlock = activePeriods[0];
                    for (let i = 1; i < activePeriods.length; i++) {
                        let p = activePeriods[i];
                        if (p.start <= currentBlock.end) {
                            currentBlock.end = Math.max(currentBlock.end, p.end);
                        } else {
                            blocks.push(currentBlock);
                            currentBlock = p;
                        }
                    }
                    blocks.push(currentBlock);
                }

                let currentY = 0;
                blocks.forEach(b => {
                    b.startY = currentY;
                    const durationMins = (b.end - b.start) / 60000;
                    b.pixelHeight = durationMins * PIXELS_PER_MINUTE;
                    b.endY = b.startY + b.pixelHeight;
                    currentY = b.endY + GAP_HEIGHT;
                });

                const totalHeight = blocks.length > 0 ? blocks[blocks.length - 1].endY + 20 : 0;

                function getTimeY(dateStr) {
                    const t = new Date(dateStr).getTime();
                    if (blocks.length === 0) return 0;
                    if (t <= blocks[0].start) return 0;

                    for (let i = 0; i < blocks.length; i++) {
                        const b = blocks[i];
                        if (t >= b.start && t <= b.end) {
                            const offsetMins = (t - b.start) / 60000;
                            return b.startY + (offsetMins * PIXELS_PER_MINUTE);
                        }
                        if (i < blocks.length - 1) {
                            const nextB = blocks[i + 1];
                            if (t > b.end && t < nextB.start) {
                                // In a gap, map it proportionally inside the GAP_HEIGHT
                                const gapDuration = nextB.start - b.end;
                                const gapOffset = t - b.end;
                                return b.endY + (gapOffset / gapDuration) * GAP_HEIGHT;
                            }
                        }
                    }
                    return blocks[blocks.length - 1].endY;
                }

                // Build HTML
                const mainWrapper = document.createElement('div');
                mainWrapper.className = "flex flex-col gap-4 mt-0";

                if (data.duplicate_groups) {
                    const daySuggestions = data.duplicate_groups.filter(g => g.date === date);
                    if (daySuggestions.length > 0) {
                        const suggDiv = document.createElement('div');
                        suggDiv.className = "space-y-3 mb-2";
                        suggDiv.innerHTML = daySuggestions.map(group => {
                            let eventsHtml = '';
                            if (group.event_ids) {
                                eventsHtml = '<div class="mt-3 flex flex-col gap-1.5 w-full">';
                                group.event_ids.forEach(eid => {
                                    const ev = currentEventsMap[eid];
                                    if (ev) {
                                        const calMetas = ev.calendar_ids.map(c => data.calendar_metadata && data.calendar_metadata[c] ? data.calendar_metadata[c] : { backgroundColor: '#3B82F6', summary: 'Calendar' });
                                        const evColor = calMetas[0].backgroundColor;
                                        const summaries = calMetas.map(m => m.summary).join(' + ');

                                        eventsHtml += `
                                            <div class="px-2 py-1.5 border-l-4 rounded bg-gray-900/60 shadow-sm flex items-center justify-between"
                                                 style="border-color: ${evColor} !important;">
                                                <div class="flex items-center gap-2 overflow-hidden flex-1">
                                                    <div class="text-[9px] uppercase tracking-wider font-bold opacity-70 whitespace-nowrap" style="color: ${evColor}">${summaries}</div>
                                                    <div class="font-bold text-[11px] text-white leading-tight truncate flex items-center gap-1">
                                                      <span class="truncate">${ev.title}</span>
                                                  </div>
                                                </div>
                                                <div class="text-gray-400 text-[10px] font-medium whitespace-nowrap ml-2">${formatTime(ev.start)} - ${formatTime(ev.end)}</div>
                                            </div>
                                        `;
                                    }
                                });
                                eventsHtml += '</div>';
                            }

                            return `
                                <div class="bg-blue-900/40 border border-blue-500/50 p-4 rounded-xl flex items-start justify-between shadow-md">
                                    <div class="flex items-start flex-1 mr-4">
                                        <svg class="w-6 h-6 text-blue-400 mt-0.5 mr-3 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                                        <div class="w-full">
                                            <h4 class="text-blue-300 font-bold text-lg leading-tight">Duplicate Mutually Exclusive Events</h4>
                                            <p class="text-blue-200/80 text-sm mt-1">We noticed multiple options for <strong>${group.keyword}</strong> today.</p>
                                            <p class="text-blue-200/80 text-sm mt-1">Would you like to create a global rule? This will automatically pick the best option and ignore the rest for all current and future instances.</p>
                                            ${eventsHtml}
                                        </div>
                                    </div>
                                    <div class="flex-shrink-0 flex items-center h-full gap-2">
                                        <button onclick="createRule('any', '${encodeURIComponent(JSON.stringify(group.original_titles))}', 'duplicate', 0, 'both', this, 'schedule_all', '${group.time_period}', '${encodeURIComponent(JSON.stringify(group.passenger_ids || []))}')" class="bg-gray-600 hover:bg-gray-500 text-white px-4 py-2 rounded-lg shadow-md font-bold text-sm transition-colors h-full flex-shrink-0">Dismiss (Schedule All)</button>
                                        <button onclick="createRule('any', '${encodeURIComponent(JSON.stringify(group.original_titles))}', 'duplicate', 0, 'both', this, 'schedule_one', '${group.time_period}', '${encodeURIComponent(JSON.stringify(group.passenger_ids || []))}')" class="bg-blue-600 hover:bg-blue-500 text-white px-4 py-2 rounded-lg shadow-md font-bold text-sm transition-colors h-full flex-shrink-0">Create Global Rule (Schedule One)</button>
                                    </div>
                                </div>
                            `;
                        }).join('');
                        mainWrapper.appendChild(suggDiv);
                    }
                }

                const wrapper = document.createElement('div');
                wrapper.className = "flex-1 flex flex-wrap gap-3";

                colIds.forEach(c_id => {
                    let colInfo = { name: "Unknown", color_code: "#4a5568" };
                    if (driversMap[c_id]) colInfo = driversMap[c_id];

                    // Build absolute overlays for Time Lines inside THIS specific driver block!
                    let absoluteOverlays = '';
                    blocks.forEach((b, index) => {
                        let t = b.start;
                        while (t <= b.end) {
                            const y = b.startY + ((t - b.start) / 60000) * PIXELS_PER_MINUTE;
                            const d = new Date(t);
                            const timeLabel = d.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });

                            absoluteOverlays += `
                                <div class="absolute left-0 w-full flex items-center z-0 pointer-events-none" style="top: ${y}px; transform: translateY(-50%);">
                                    <div class="text-[10px] text-gray-400 absolute -top-2 left-1 bg-gray-800 px-1 rounded font-mono border border-gray-700 shadow-sm z-20">${timeLabel}</div>
                                    <div class="w-full border-t border-gray-700"></div>
                                </div>
                            `;
                            t += 3600000; // +1 hour
                        }

                        if (index < blocks.length - 1) {
                            const gapY = b.endY;
                            absoluteOverlays += `
                                <div class="absolute left-0 w-full flex items-center justify-center z-0 pointer-events-none bg-gray-700" style="top: ${gapY}px; height: ${GAP_HEIGHT}px;">
                                    <div class="text-gray-500 font-bold tracking-widest text-lg leading-none -mt-2">...</div>
                                </div>
                            `;
                        }
                    });

                    // Add current time line
                    const nowTime = new Date().getTime();
                    const nowY = getTimeY(nowTime);
                    if (nowY > 0) {
                        absoluteOverlays += `
                            <div class="absolute left-0 w-full flex items-center z-30 pointer-events-none" style="top: ${nowY}px; transform: translateY(-50%);">
                                <div class="w-full border-t-2 border-red-500 shadow-[0_0_8px_rgba(239,68,68,0.5)] relative">
                                    <div class="absolute left-0 top-1/2 transform -translate-y-1/2 w-2 h-2 bg-red-500 rounded-full shadow-sm"></div>
                                </div>
                            </div>
                        `;
                    }

                    const colEvents = (colsObj[c_id] || []).sort((a, b) => new Date(a.start) - new Date(b.start));
                    const uniqueColEventsMap = {};
                    colEvents.forEach(e => uniqueColEventsMap[e.id] = e);
                    const uniqueColEvents = Object.values(uniqueColEventsMap);

                    const evColData = {};
                    const cols = [];
                    uniqueColEvents.forEach(ev => {
                        if (ev.event_type === 'background_trip' || !isPassengerTask(ev)) {
                            evColData[ev.id] = { colIndex: 0, totalCols: 1 };
                            return;
                        }
                        let placed = false;
                        for (let i = 0; i < cols.length; i++) {
                            let lastEv = cols[i][cols[i].length - 1];
                            if (new Date(ev.start) >= new Date(lastEv.end)) {
                                cols[i].push(ev);
                                evColData[ev.id] = { colIndex: i };
                                placed = true;
                                break;
                            }
                        }
                        if (!placed) {
                            cols.push([ev]);
                            evColData[ev.id] = { colIndex: cols.length - 1 };
                        }
                    });

                    uniqueColEvents.forEach(ev => {
                        if (ev.event_type === 'background_trip' || !isPassengerTask(ev)) return;

                        const visited = new Set();
                        const queue = [ev];
                        visited.add(ev.id);

                        let maxColIndex = evColData[ev.id].colIndex;

                        while (queue.length > 0) {
                            const current = queue.shift();
                            uniqueColEvents.forEach(otherEv => {
                                if (otherEv.event_type !== 'background_trip' && isPassengerTask(otherEv) && !visited.has(otherEv.id)) {
                                    if (new Date(current.start) < new Date(otherEv.end) && new Date(current.end) > new Date(otherEv.start)) {
                                        visited.add(otherEv.id);
                                        queue.push(otherEv);
                                        maxColIndex = Math.max(maxColIndex, evColData[otherEv.id].colIndex);
                                    }
                                }
                            });
                        }
                        evColData[ev.id].totalCols = maxColIndex + 1;
                    });

                    let colEventsHtml = '';
                    uniqueColEvents.forEach((ev, index) => {
                        const startY = getTimeY(ev.start);
                        const endY = getTimeY(ev.end);
                        const height = Math.max(endY - startY, 20);

                        const evOptional = !!((ev.app_config || {}).is_optional);
                        const evDecision = ev.optional_decision || null;
                        let badgeHtml = '';
                        let borderClass = 'border-gray-700 hover:border-gray-500';
                        if (ev.canceled) {
                            // Canceled: out of the solve like a skip, drawn
                            // struck-through with its reason — the record IS
                            // the point (never silently vanished).
                            borderClass = 'border-gray-600 hover:border-gray-500 opacity-60';
                            badgeHtml = `<div class="absolute -top-2 -right-2 bg-gray-700 text-gray-200 text-[9px] font-bold px-1.5 py-0.5 rounded shadow-lg uppercase tracking-wider z-10" title="${(ev.cancel_reason || '').replace(/"/g, '&quot;')}">Canceled</div>`;
                        } else if (evOptional && evDecision === 'skip') {
                            // Decided 'skip': excluded from the solve entirely
                            // (never in `unassigned`) — worn calmly as skipped.
                            borderClass = 'border-purple-500/60 hover:border-purple-400';
                            badgeHtml = '<div class="absolute -top-2 -right-2 bg-purple-700 text-purple-100 text-[9px] font-bold px-1.5 py-0.5 rounded shadow-lg uppercase tracking-wider z-10">Skipped today</div>';
                        } else if (unassigned && unassigned.includes(ev.id) && c_id !== 'unassigned') {
                            if (evOptional && evDecision !== 'attend') {
                                // Dropped-first is the DESIGN for an optional
                                // event — a calm note, never the red siren.
                                // An attend-decided occurrence keeps the red
                                // badge: somebody promised a kid.
                                borderClass = 'border-purple-500/60 hover:border-purple-400';
                                badgeHtml = '<div class="absolute -top-2 -right-2 bg-purple-700 text-purple-100 text-[9px] font-bold px-1.5 py-0.5 rounded shadow-lg uppercase tracking-wider z-10">Skipped · optional</div>';
                            } else {
                                borderClass = 'border-red-500 hover:border-red-400';
                                badgeHtml = '<div class="absolute -top-2 -right-2 bg-red-600 text-white text-[9px] font-bold px-1.5 py-0.5 rounded shadow-lg uppercase tracking-wider z-10">No Driver</div>';
                            }
                        }

                        let isAssignedToThisColumn = (localAssignments && localAssignments[ev.id] === c_id) || (ghost_assignments && ghost_assignments[ev.id] === c_id) || (c_id === 'unassigned' && unassigned && unassigned.includes(ev.id)) || (c_id === 'no_location' && no_location && no_location.includes(ev.id));
                        if (data.driver_events && data.driver_events[c_id] && data.driver_events[c_id].includes(ev.id)) {
                            isAssignedToThisColumn = true;
                        }
                        const isDriverOnly = !isAssignedToThisColumn;

                        let leftStyle = '28px';
                        let widthStyle = 'calc(100% - 32px)';

                        if (ev.event_type !== 'background_trip' && isPassengerTask(ev) && evColData[ev.id] && evColData[ev.id].totalCols > 1) {
                            const cIndex = evColData[ev.id].colIndex;
                            const tCols = evColData[ev.id].totalCols;
                            const colWidth = `((100% - 32px) / ${tCols})`;
                            leftStyle = `calc(28px + ${colWidth} * ${cIndex})`;
                            widthStyle = `calc(${colWidth} - 2px)`;
                        }

                        const safeCalendarIds = ev.calendar_ids || [];
                        const isErrand = ev.event_type === 'errand';
                        const errandIcon = `<svg class="w-3 h-3 inline-block mr-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z"></path></svg>`;
                        const calMetas = safeCalendarIds.length > 0 ? safeCalendarIds.map(c => calendar_metadata && calendar_metadata[c] ? calendar_metadata[c] : { backgroundColor: '#3B82F6', summary: 'Calendar' }) : [{ backgroundColor: '#F59E0B', summary: isErrand ? errandIcon + ev.title : 'System' }];
                        const evColor = calMetas[0].backgroundColor;
                        const colorDots = isErrand ? '' : calMetas.map(m => `<div class="w-2.5 h-2.5 rounded-full mr-1 shadow-sm border border-black/20" style="background-color: ${m.backgroundColor};"></div>`).join('');
                        const summaries = calMetas.map(m => m.summary).join(' + ');

                        const dragAttr = readOnly ? '' : `draggable="true" ondragstart="drag(event, '${ev.id}', '${c_id}')"`;

                        let computedOrigin = currentData.home_location || '';
                        let lateMins = 0;
                        if (index > 0) {
                            const prevEv = uniqueColEvents[index - 1];
