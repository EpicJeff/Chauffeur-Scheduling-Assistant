                                            <div class="flex items-center">
                                                <span class="${getPillStyle(state1)} text-[10px] px-2 py-0.5 rounded-full border shadow-sm font-mono uppercase flex items-center shrink-0">
                                                    ${getPillIcon(state1)}${iconCar}${formatDuration(edge.home_waypoint.to_home_mins)}${iconArrow}${iconHome}for ${formatDuration(edge.home_waypoint.layover_mins)}
                                                </span>
                                                ${iconArrow}
                                                <span class="${getPillStyle(state2)} text-[10px] px-2 py-0.5 rounded-full border shadow-sm font-mono uppercase flex items-center shrink-0">
                                                    ${getPillIcon(state2)}${iconCar}${formatDuration(edge.home_waypoint.from_home_mins)}${iconArrow}${iconPerson}Pickup
                                                </span>
                                                ${iconArrow}
                                                <span class="${getPillStyle(state3)} text-[10px] px-2 py-0.5 rounded-full border shadow-sm font-mono uppercase flex items-center shrink-0">
                                                    ${getPillIcon(state3)}${iconCar}${formatDuration(edge.pickup_waypoint.from_pickup_mins)}
                                                </span>
                                            </div>
                                        `);
                                        }
                                        pills.push(`<span class="text-[9px] text-gray-400 font-bold uppercase drop-shadow-sm -my-0.5">Leave at ${formatTime(leaveHomeDate.toISOString())}</span>`);
                                    } else if (edge.home_waypoint) {
                                        const bufferMins = 5 + (edge.buffer_before_mins || 0);
                                        const driveFromHome = edge.home_waypoint.from_home_mins;
                                        const leaveHomeDate = new Date(new Date(nextEv.start).getTime() - (driveFromHome + bufferMins) * 60000);

                                        const state1 = getEdgeStateExact(`route_${ev.id}_1`);
                                        const state2 = getEdgeStateExact(`route_${ev.id}_2`);
                                        pills.push(`
                                        <div class="flex items-center">
                                            <span class="${getPillStyle(state1)} text-[10px] px-2 py-0.5 rounded-full border shadow-sm font-mono uppercase flex items-center shrink-0">
                                                ${getPillIcon(state1)}${iconCar}${formatDuration(edge.home_waypoint.to_home_mins)}${iconArrow}${iconHome}for ${formatDuration(edge.home_waypoint.layover_mins)}
                                            </span>
                                            ${iconArrow}
                                            <span class="${getPillStyle(state2)} text-[10px] px-2 py-0.5 rounded-full border shadow-sm font-mono uppercase flex items-center shrink-0">
                                                ${getPillIcon(state2)}${iconCar}${formatDuration(edge.home_waypoint.from_home_mins)}
                                            </span>
                                        </div>
                                    `);
                                        pills.push(`<span class="text-[9px] text-gray-400 font-bold uppercase drop-shadow-sm -my-0.5">Leave at ${formatTime(leaveHomeDate.toISOString())}</span>`);
                                    } else if (edge.pickup_waypoint) {
                                        const state1 = getEdgeStateExact(`route_${ev.id}_1`);
                                        const state2 = getEdgeStateExact(`route_${ev.id}_2`);
                                        pills.push(`
                                        <div class="flex items-center">
                                            <span class="${getPillStyle(state1)} text-[10px] px-2 py-0.5 rounded-full border shadow-sm font-mono uppercase flex items-center shrink-0" title="Pickup at ${edge.pickup_waypoint.pickup_event_title}">
                                                ${getPillIcon(state1)}${iconCar}${formatDuration(edge.pickup_waypoint.to_pickup_mins)}${iconArrow}${iconPerson}Pickup
                                            </span>
                                            ${iconArrow}
                                            <span class="${getPillStyle(state2)} text-[10px] px-2 py-0.5 rounded-full border shadow-sm font-mono uppercase flex items-center shrink-0">
                                                ${getPillIcon(state2)}${iconCar}${formatDuration(edge.pickup_waypoint.from_pickup_mins)}
                                            </span>
                                        </div>
                                    `);
                                    }

                                    if (pills.length === 0) {
                                        const gapMinutes = Math.round((new Date(nextEv.start) - new Date(ev.end)) / 60000);
                                        const downTime = gapMinutes - edge.travel_mins;

                                        let pillText = `${iconCar}${formatDuration(edge.travel_mins)}${trafficWarn}`;
                                        if (downTime > 0) {
                                            pillText += ` <span class="text-blue-500 ml-1 text-[9px] font-bold">(${iconHourglass}${formatDuration(downTime)})</span>`;
                                        }

                                        const state = getEdgeStateExact(baseRouteId);
                                        pills.push(`
                                        <span class="${getPillStyle(state)} text-[10px] px-2 py-0.5 rounded-full border shadow-sm font-mono uppercase flex items-center">
                                            ${getPillIcon(state)}${pillText}
                                        </span>
                                    `);
                                    }

                                    colEventsHtml += `
                                    <div class="absolute left-1/2 transform -translate-x-1/2 flex flex-col items-center justify-center z-20 pointer-events-none" 
                                         style="top: ${endY}px; height: ${distance}px; width: 100%;">
                                        <div class="w-px h-full bg-blue-500/30 absolute z-0"></div>
                                        <div class="flex flex-col gap-1 items-center z-10 relative">
                                            ${pills.join('')}
                                        </div>
                                    </div>
                                `;
                                } else {
                                    const iconCar = `<svg class="w-3 h-3 inline-block mr-0.5" fill="currentColor" viewBox="0 0 24 24"><path d="M18.92 6.01C18.72 5.42 18.16 5 17.5 5h-11c-.66 0-1.21.42-1.42 1.01L3 12v8c0 .55.45 1 1 1h1c.55 0 1-.45 1-1v-1h12v1c0 .55.45 1 1 1h1c.55 0 1-.45 1-1v-8l-2.08-5.99zM6.85 7h10.29l1.08 3.11H5.77L6.85 7zM19 17H5v-5h14v5zM7.5 16c.83 0 1.5-.67 1.5-1.5S8.33 13 7.5 13 6 13.67 6 14.5 6.67 16 7.5 16zm9 0c.83 0 1.5-.67 1.5-1.5s-.67-1.5-1.5-1.5-1.5.67-1.5 1.5.67 1.5 1.5 1.5z"/></svg>`;
                                    const baseRouteId = `route_${ev.id}_${nextEv.id}`;
                                    const state = getEdgeStateExact(baseRouteId);
                                    colEventsHtml += `
                                    <div class="absolute left-1/2 transform -translate-x-1/2 -translate-y-1/2 flex items-center justify-center z-20 pointer-events-none" 
                                         style="top: ${endY}px;">
                                        <span class="${getPillStyle(state)} text-[10px] px-2 py-0.5 rounded-full border shadow-sm font-mono uppercase flex items-center">
                                            ${getPillIcon(state)}${iconCar}${formatDuration(edge.travel_mins)}${trafficWarn}
                                        </span>
                                    </div>
                                `;
                                }
                            }
                        }

                        // Final travel pill after last event
                        if (isAssignedToThisColumn && localFinalEdges[c_id] && localFinalEdges[c_id][ev.id]) {
                            const finalEdge = localFinalEdges[c_id] ? localFinalEdges[c_id][ev.id] : null;
                            if (finalEdge && finalEdge.from_event === ev.id && finalEdge.travel_mins > 0) {
                                const arriveDate = new Date(new Date(ev.end).getTime() + (finalEdge.travel_mins + (finalEdge.buffer_after_mins || 0)) * 60000);
                                const arriveStr = formatTime(arriveDate.toISOString());
                                const arriveY = getTimeY(arriveDate.toISOString());
                                const distance = arriveY - endY;

                                const iconCar = `<svg class="w-3 h-3 inline-block mr-0.5" fill="currentColor" viewBox="0 0 24 24"><path d="M18.92 6.01C18.72 5.42 18.16 5 17.5 5h-11c-.66 0-1.21.42-1.42 1.01L3 12v8c0 .55.45 1 1 1h1c.55 0 1-.45 1-1v-1h12v1c0 .55.45 1 1 1h1c.55 0 1-.45 1-1v-8l-2.08-5.99zM6.85 7h10.29l1.08 3.11H5.77L6.85 7zM19 17H5v-5h14v5zM7.5 16c.83 0 1.5-.67 1.5-1.5S8.33 13 7.5 13 6 13.67 6 14.5 6.67 16 7.5 16zm9 0c.83 0 1.5-.67 1.5-1.5s-.67-1.5-1.5-1.5-1.5.67-1.5 1.5.67 1.5 1.5 1.5z"/></svg>`;
                                const iconHome = getHomeIcon(finalEdge.dropoff_waypoint ? finalEdge.dropoff_waypoint.driver_home_location : finalEdge.driver_home_location);
                                const iconArrow = `<span class="mx-0.5 text-[8px] opacity-70">➔</span>`;
                                const trafficWarn = finalEdge.delay_mins > 3 ? `<span class="ml-1 text-yellow-400 text-[9px] font-bold" title="${finalEdge.delay_mins}min traffic delay">⚠</span>` : '';

                                let pillsHtml = '';
                                if (finalEdge.dropoff_waypoint) {
                                    const state1 = getEdgeStateExact(`final_${ev.id}_1`);
                                    const state2 = getEdgeStateExact(`final_${ev.id}`);
                                    pillsHtml = `
                                        <span class="${getPillStyle(state1)} text-[10px] px-2 py-0.5 rounded-full border shadow-md font-mono uppercase flex items-center shrink-0">
                                            ${getPillIcon(state1)}${iconCar}${formatDuration(finalEdge.dropoff_waypoint.to_global_home_mins)}${trafficWarn}${iconArrow}<svg class="w-3 h-3 inline-block mx-0.5" fill="currentColor" viewBox="0 0 24 24"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/></svg>
                                        </span>
                                        ${iconArrow}
                                        <span class="${getPillStyle(state2)} text-[10px] px-2 py-0.5 rounded-full border shadow-md font-mono uppercase flex items-center shrink-0">
                                            ${getPillIcon(state2)}${iconCar}${formatDuration(finalEdge.dropoff_waypoint.travel_mins)}${trafficWarn}
                                        </span>
                                    `;
                                } else {
                                    const state = getEdgeStateExact(`final_${ev.id}`);
                                    pillsHtml = `
                                        <span class="${getPillStyle(state)} text-[10px] px-2 py-0.5 rounded-full border shadow-md font-mono uppercase flex items-center shrink-0">
                                            ${getPillIcon(state)}${iconCar}${formatDuration(finalEdge.travel_mins)}${trafficWarn}${iconArrow}${iconHome}
                                        </span>
                                    `;
                                }

                                const finalDrawPx = Math.max(distance, MIN_LEG_PILL_PX);
                                if (distance > 0) {
                                    colEventsHtml += `
                                        <div class="absolute left-1/2 transform -translate-x-1/2 flex flex-col items-center justify-start pt-1.5 z-20 pointer-events-none"
                                             style="top: ${endY}px; height: ${finalDrawPx}px; width: 100%;">
                                            <div class="w-px h-full bg-blue-500/30 absolute top-0 z-0"></div>
                                            <div class="flex flex-col gap-0.5 items-center z-10 relative">
                                                <div class="flex items-center">
                                                    ${pillsHtml}
                                                </div>
                                                <span class="text-[9px] text-gray-400 font-bold uppercase drop-shadow-sm">Arrive at ${arriveStr}</span>
                                            </div>
                                        </div>
                                    `;
                                }
                            }
                        }
                    });

                    const dropAttr = readOnly ? '' : `${readOnly ? '' : `ondragover="allowDrop(event)" ondrop="drop(event, '${c_id}')"`}`;
                    const driverHtml = `
                        <div id="col-${c_id}" class="flex-1 min-w-[200px] bg-gray-900 rounded-lg overflow-hidden shadow-xl border border-gray-700 flex flex-col" ${dropAttr}>
                            <div class="px-2 py-1.5 font-black text-sm text-white shadow-md flex justify-center items-center bg-gray-800 border-b-4" style="border-bottom-color: ${colInfo.color_code}">
                                <div class="w-2.5 h-2.5 rounded-full mr-2 shadow-[0_0_8px_currentColor]" style="background-color: ${colInfo.color_code}; color: ${colInfo.color_code}"></div>
                                ${colInfo.name}
                            </div>
                            <div class="relative w-full overflow-hidden" style="height: ${totalHeight}px;">
                                ${absoluteOverlays}
                                ${colEventsHtml}
                            </div>
                        </div>
                    `;
                    wrapper.innerHTML += driverHtml;
                });

                // --- Sidebar for Unassigned / No Location ---
                if (!readOnly) {
                    const sidebar = document.createElement('div');
                    sidebar.className = "w-full flex flex-col gap-2 mt-2";
                    let sidebarHtml = '';

                    ['unassigned', 'no_location'].forEach(c_id => {
                        if (!colsObj[c_id] || colsObj[c_id].length === 0) {
                            if (c_id === 'unassigned') {
                                sidebarHtml += `
                                    <div class="bg-gray-800 rounded-lg border border-dashed border-gray-600 p-3 flex flex-row items-center justify-center text-gray-500 font-bold transition-colors hover:bg-gray-700 text-sm"
                                         ondragover="allowDrop(event)" ondrop="drop(event, '${c_id}')">
                                        <svg class="w-4 h-4 mr-2 opacity-50" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
                                        Drop here to Unassign
                                    </div>
                                `;
                            }
                            return;
                        }

                        let colInfo = { name: "Unassigned", color_code: "#EF4444" };
                        if (c_id === 'no_location') colInfo = { name: "No Location", color_code: "#EAB308" };

                        let colEventsHtml = '';
                        colsObj[c_id].forEach((ev) => {
                            const calMetas = ev.calendar_ids.map(c => calendar_metadata && calendar_metadata[c] ? calendar_metadata[c] : { backgroundColor: '#3B82F6', summary: 'Calendar' });
                            const evColor = calMetas[0].backgroundColor;
                            const summaries = calMetas.map(m => m.summary).join(' + ');

                            const isEvaluating = currentData && currentData.evaluating && currentData.evaluating.includes(ev.id);
                            const evalClasses = isEvaluating ? 'opacity-50 animate-pulse !pointer-events-none' : '';
                            colEventsHtml += `
                                <div id="event-${ev.id}" draggable="true" ondragstart="drag(event, '${ev.id}', '${c_id}')" onclick="openEventModal('${ev.id}')" 
                                     class="px-2 py-1.5 border-l-4 rounded bg-gray-900 hover:bg-gray-800 transition-colors cursor-pointer group shadow-sm flex items-center justify-between ${evalClasses}"
                                     style="border-color: ${evColor} !important;">
                                    <div class="flex items-center gap-2 overflow-hidden flex-1">
                                        <div class="text-[9px] uppercase tracking-wider font-bold opacity-70 whitespace-nowrap" style="color: ${evColor}">${summaries}</div>
                                        <div class="font-bold text-[11px] text-white leading-tight group-hover:text-blue-300 transition-colors truncate flex items-center gap-1">
                                          ${c_id === 'unassigned' ? '<svg class="w-3.5 h-3.5 text-yellow-500 animate-pulse flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path></svg>' : ''}
                                          <span class="truncate">${ev.title}</span>
                                      </div>
                                    </div>
                                    <div class="text-gray-400 text-[10px] font-medium whitespace-nowrap ml-2">${formatTime(ev.start)} - ${formatTime(ev.end)}</div>
                                </div>
                            `;
                        });

                        sidebarHtml += `
                            <div class="bg-gray-800/80 rounded-lg border border-gray-700 overflow-hidden shadow-md"
                                 ondragover="allowDrop(event)" ondrop="drop(event, '${c_id}')">
                                <div class="px-2 py-1 text-[11px] font-black uppercase tracking-wider text-white bg-gray-800 border-b-2 flex items-center" style="border-bottom-color: ${colInfo.color_code}">
                                    <div class="w-1.5 h-1.5 rounded-full mr-1.5" style="background-color: ${colInfo.color_code}"></div>
                                    ${colInfo.name} <span class="ml-auto text-gray-500 font-mono">${colsObj[c_id].length}</span>
                                </div>
                                <div class="p-1.5 flex flex-col gap-1.5 min-h-[40px]">
                                    ${colEventsHtml}
                                </div>
                            </div>
                        `;
                    });
                    sidebar.innerHTML = sidebarHtml;
                    mainWrapper.appendChild(wrapper);
                    mainWrapper.appendChild(sidebar);
                } else {
                    mainWrapper.appendChild(wrapper);
                }

                dayContainer.appendChild(mainWrapper);

                if (!options.isModal && ((data.solving_dates && data.solving_dates.includes(date)) || (typeof localSolvingDates !== 'undefined' && localSolvingDates.has(date)))) {
                    const overlay = document.createElement('div');

                    overlay.className = "absolute inset-0 bg-gray-950/60 backdrop-blur-[1px] z-40 flex items-center justify-center pointer-events-auto transition-opacity duration-300";
                    overlay.innerHTML = `
                        <div class="flex items-center gap-3 bg-gray-800 border border-blue-500/30 px-5 py-3 rounded-xl shadow-2xl">
                            <svg class="animate-spin h-5 w-5 text-blue-400" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                                <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                            </svg>
                            <span class="text-xs font-bold text-blue-100 uppercase tracking-widest animate-pulse">Updating Schedule...</span>
                        </div>
                    `;
                    dayContainer.appendChild(overlay);
                }

                scheduleContainer.appendChild(dayContainer);
            });
        }
    // Named, for the surfaces that did not inherit the global.
    window.ScheduleTimeline = { render: renderSchedule };
</script>
