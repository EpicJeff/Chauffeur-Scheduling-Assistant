<!-- Music Assistant control surface. Included by app.html (dedicated Music
     tab) and map.html. Control + search only — playback stays on HA/MA
     players; the page is never an audio endpoint. -->
<div id="music-widget" class="bg-gray-900 border border-gray-800 rounded-xl p-3 shadow-lg flex flex-col min-h-0">
    <div class="flex items-center gap-2 mb-3">
        <span class="text-lg">🎵</span>
        <select id="mw-player" onchange="mwSelectPlayer(this.value)"
            class="flex-1 bg-gray-800 border border-gray-700 rounded-lg px-2 py-1.5 text-sm text-white font-bold focus:outline-none">
            <option value="">No players found</option>
        </select>
    </div>

    <div id="mw-nowplaying" class="flex items-center gap-3 mb-3" style="display: none">
        <img id="mw-art" class="w-16 h-16 rounded-xl object-cover bg-gray-800 shadow-md" alt=""
            onerror="_mwArtError(this)">
        <div class="flex-1 min-w-0">
            <div id="mw-title" class="text-white font-bold text-base truncate"></div>
            <div id="mw-artist" class="text-gray-400 text-sm truncate"></div>
        </div>
    </div>

    <div class="flex items-center gap-2 mb-1">
        <button onclick="mwCommand('previous')" class="p-2 rounded-full bg-gray-800 text-gray-300 active:bg-gray-700">
            <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
        </button>
        <button id="mw-playpause" onclick="mwTogglePlay()" class="p-2.5 rounded-full bg-blue-600 text-white active:bg-blue-700">
            <svg id="mw-icon-play" class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
            <svg id="mw-icon-pause" class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24" style="display: none"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
        </button>
        <button onclick="mwCommand('next')" class="p-2 rounded-full bg-gray-800 text-gray-300 active:bg-gray-700">
            <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 24 24"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg>
        </button>
        <input id="mw-volume" type="range" min="0" max="1" step="0.01" oninput="mwVolume(this.value)"
            class="flex-1 accent-blue-500">
    </div>

    <div class="mt-2">
        <input id="mw-search" type="text" placeholder="Search music…" autocomplete="off"
            oninput="mwSearchDebounced()" onkeydown="if(event.key==='Enter'){event.preventDefault();mwSearch();}"
            class="w-full bg-gray-800 border border-gray-700 rounded-lg px-3 py-2 text-sm text-white placeholder-gray-500 focus:outline-none focus:border-blue-500">
    </div>
    <div id="mw-results" class="mt-2 rounded-xl overflow-hidden border border-gray-700/60 divide-y divide-gray-800 max-h-[45vh] overflow-y-auto" style="display: none"></div>

    <div id="mw-favorites-section" style="display: none">
        <div class="text-[11px] font-black uppercase tracking-widest text-gray-500 mt-3 mb-2">Favorites</div>
        <div id="mw-favorites" class="flex gap-3 overflow-x-auto no-scrollbar pb-1"></div>
    </div>
    <div id="mw-fav-tracks-section" style="display: none">
        <div class="text-[11px] font-black uppercase tracking-widest text-gray-500 mt-3 mb-2">Favorite Songs</div>
        <div id="mw-fav-tracks" class="rounded-xl overflow-hidden border border-gray-700/60 divide-y divide-gray-800"></div>
    </div>
</div>
<script>
    let _mwPlayers = [];
    let _mwSelected = localStorage.getItem('chauffeur_music_player') || '';
    let _mwTimer = null;
    let _mwVolDebounce = null;
    let _mwSearchDebounce = null;
    const _mwArtErrorsShown = new Set();

    // --- "This phone" Sendspin player (the PWA as a real MA endpoint) ---
    const MW_PHONE = '__phone__';
    const _mwPhone = { player: null, active: false, state: null, connecting: false,
                       retries: 0, reconnectTimer: null, everConnected: false };

    function _mwScheduleReconnect() {
        if (_mwPhone.reconnectTimer || _mwSelected !== MW_PHONE) return;
        if (_mwPhone.retries >= 6) {
            _mwToast('Phone player lost its connection — re-select "This phone" to retry.');
            return;
        }
        const delay = Math.min(15000, 1500 * Math.pow(2, _mwPhone.retries));
        _mwPhone.retries += 1;
        _mwPhone.reconnectTimer = setTimeout(() => {
            _mwPhone.reconnectTimer = null;
            if (_mwSelected === MW_PHONE && !_mwPhone.player && !_mwPhone.connecting
                && document.visibilityState === 'visible') {
                mwStartPhonePlayer();
            }
        }, delay);
    }

    document.addEventListener('visibilitychange', () => {
        // iOS suspends the socket when the page backgrounds; resume promptly.
        if (document.visibilityState === 'visible' && _mwSelected === MW_PHONE
            && !_mwPhone.player && !_mwPhone.connecting) {
            _mwPhone.retries = 0;
            mwStartPhonePlayer();
        }
    });

    function _mwPhoneName() {
        if (typeof membersData !== 'undefined' && typeof selectedMemberId !== 'undefined') {
            const me = (membersData || []).find(m => m.id === selectedMemberId);
            if (me && me.name) return `${me.name}'s phone`;
        }
        return 'Chauffeur phone';
    }

    function _mwToast(msg) {
        console.warn('[phone-player]', msg);
        if (typeof showGlobalAlert === 'function') showGlobalAlert(msg);
    }

    async function mwStartPhonePlayer() {
        if (_mwPhone.player || _mwPhone.connecting) return;
        if (!window.SendspinPlayer) {
            _mwToast('Phone player library not loaded yet — try again in a moment.');
            return;
        }
        _mwPhone.connecting = true;
        try {
            // Player identity is per member-per-device: "Lily's phone" and
            // "Dad's phone" are distinct MA players on the same handset.
            const memberKey = (typeof selectedMemberId !== 'undefined' && selectedMemberId) || 'device';
            const idKey = 'chauffeur_sendspin_id::' + memberKey;
            let pid = localStorage.getItem(idKey);
            if (!pid) {
                pid = 'chauffeur-' + (crypto.randomUUID ? crypto.randomUUID() : Math.random().toString(36).slice(2));
                localStorage.setItem(idKey, pid);
            }
            const wsUrl = new URL(`${_mwApiBase}api/sendspin/ws`, location.href)
                .href.replace(/^http/, 'ws');
            const socket = new WebSocket(wsUrl);
            socket.binaryType = 'arraybuffer';
            socket.addEventListener('close', (e) => {
                if (_mwPhone.active) {
                    _mwPhone.active = false;
                    _mwPhone.player = null;
                    // Quietly self-heal; only bother the user when it's hopeless
                    // (relay refused: reason set) or retries run out.
                    if (e.reason) _mwToast(`Phone player disconnected: ${e.reason}`);
                    mwRefresh();
                    _mwScheduleReconnect();
                }
            });
            const player = new window.SendspinPlayer({
                playerId: pid,
                clientName: _mwPhoneName(),
                baseUrl: location.origin,
                webSocket: socket,
                correctionMode: 'quality-local',
                onStateChange: (state) => {
                    _mwPhone.state = state;
                    if (_mwSelected === MW_PHONE) mwRenderPhoneState();
                },
            });
            // unlock() needs the user gesture that selected the option.
            if (typeof player.unlock === 'function') {
                try { await player.unlock(); } catch (e) { /* reconnects run outside a gesture */ }
            }
            if (typeof player.connect === 'function') await player.connect();
            _mwPhone.player = player;
            _mwPhone.active = true;
            if (!_mwPhone.everConnected) {
                _mwPhone.everConnected = true;
                _mwToast('This phone is now a Music Assistant player 🎉');
            } else if (_mwPhone.retries > 0) {
                console.info('[phone-player] reconnected');
            }
            _mwPhone.retries = 0;
        } catch (e) {
            _mwPhone.player = null;
            _mwPhone.active = false;
            if (_mwPhone.retries === 0) {
                _mwToast('Phone player failed: ' + (e && e.message ? e.message : e));
            }
            _mwScheduleReconnect();
        } finally {
            _mwPhone.connecting = false;
            mwRefresh();
        }
    }

    function _mwPhonePlaying() {
        // sendspin-js onStateChange: { isPlaying, volume, muted, playerState,
        // serverState, groupState } (dist/types.d.ts, v3.2.1)
        const s = _mwPhone.state || {};
        if (typeof s.isPlaying === 'boolean') return s.isPlaying;
        return (s.groupState && s.groupState.playback_state) === 'playing';
    }

    function mwRenderPhoneState() {
        const s = _mwPhone.state || {};
        // Metadata lives at serverState.metadata: {title, artist, album, artwork_url}
        const md = (s.serverState && s.serverState.metadata) || {};
        const np = document.getElementById('mw-nowplaying');
        const title = md.title || '';
        const artist = md.artist || '';
        if (np) {
            if (title || artist) {
                np.style.display = 'flex';
                document.getElementById('mw-title').textContent = title;
                document.getElementById('mw-artist').textContent =
                    artist + (md.album ? (artist ? ' · ' : '') + md.album : '');
                const art = document.getElementById('mw-art');
                if (md.artwork_url && typeof md.artwork_url === 'string') {
                    art.src = _mwProxied(md.artwork_url);
                    art.style.display = 'block';
                } else {
                    art.style.display = 'none';
                }
            } else {
                np.style.display = 'none';
            }
        }
        const playing = _mwPhonePlaying();
        document.getElementById('mw-icon-play').style.display = playing ? 'none' : 'block';
        document.getElementById('mw-icon-pause').style.display = playing ? 'block' : 'none';
        const vol = document.getElementById('mw-volume');
        const v = (typeof s.volume === 'number') ? s.volume : null;
        if (vol && v !== null && document.activeElement !== vol) {
            vol.value = v > 1 ? v / 100 : v;
        }
    }

    function _mwNorm(s) {
        // MA->HA naming normalizes apostrophes/case/punctuation differently
        // per version; compare on letters+digits only.
        return String(s || '').toLowerCase().replace(/[^a-z0-9]/g, '');
    }

    function _mwPhoneEntity() {
        // Once registered, MA exposes the phone to HA as a media_player named
        // after our clientName (possibly normalized).
        const want = _mwNorm(_mwPhoneName());
        return _mwPlayers.find(p => {
            const got = _mwNorm(p.name) || _mwNorm(p.entity_id.replace('media_player.', ''));
            return got === want || got.includes(want) || want.includes(got);
        }) || null;
    }

    // Broken artwork: hide the ugly broken-image icon and surface WHY once
    // per URL (phones have no devtools; this is the field diagnostic).
    async function _mwArtError(img) {
        img.style.display = 'none';
        const url = img.src;
        if (_mwArtErrorsShown.has(url)) return;
        _mwArtErrorsShown.add(url);
        let msg = 'Artwork failed: network error';
        try {
            const r = await fetch(url);
            const txt = (await r.text()).slice(0, 140);
            msg = `Artwork failed (HTTP ${r.status}): ${txt}`;
        } catch (e) { }
        console.warn(msg, url);
        if (typeof showGlobalAlert === 'function') showGlobalAlert(msg);
    }

    const _mwApiBase = window.location.pathname.endsWith('/') ? '../' : '';
    const _MW_TYPE_ICON = { track: '🎵', album: '💿', artist: '🎤', playlist: '📻', radio: '📡' };

    function _mwPlayerIcon(p) {
        if (p.device_class === 'tv') return '📺';
        if (p.device_class === 'receiver') return '🎚️';
        if (p.device_class === 'speaker') return '🔊';
        const n = `${p.entity_id} ${p.name}`.toLowerCase();
        if (/\btv\b|television|shield|roku|apple_tv|appletv/.test(n)) return '📺';
        if (/echo|alexa|nest|home_mini|homepod|sonos|speaker/.test(n)) return '🔊';
        if (/group|everywhere|all\b/.test(n)) return '🏠';
        return '🔊';
    }

    function _mwEsc(s) {
        return String(s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;')
            .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    function _mwProxied(url) {
        // https loads directly; http:// (MA's LAN image proxy) is mixed
        // content on an https page — iOS blocks it silently — so it goes
        // through the add-on's image proxy, like now-playing art.
        return url.startsWith('https://')
            ? url
            : `${_mwApiBase}api/ha/image64/${btoa(url).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '')}`;
    }

    function _mwImage(item) {
        // MA serializes an image url on most items; only trust absolute urls.
        const img = item.image || item.image_url ||
            (item.metadata && item.metadata.images && item.metadata.images[0] && item.metadata.images[0].path);
        return (typeof img === 'string' && img.startsWith('http')) ? _mwProxied(img) : null;
    }

    function _mwSubtitle(item) {
        const artists = (item.artists || []).map(a => a.name).join(', ');
        const album = item.album && item.album.name;
        if (artists && album) return `${artists} · ${album}`;
        if (artists) return artists;
        if (item.owner) return item.owner;
        return '';
    }

    function _mwCurrent() {
        return _mwPlayers.find(p => p.entity_id === _mwSelected) || null;
    }

    async function mwRefresh() {
        try {
            const res = await fetch(`${_mwApiBase}api/ha/media_players`);
            if (!res.ok) return;
            _mwPlayers = await res.json();
        } catch (e) { return; }

        // Prefer the logged-in member's configured player on first load.
        if (!_mwSelected && typeof membersData !== 'undefined' && typeof selectedMemberId !== 'undefined') {
            const me = (membersData || []).find(m => m.id === selectedMemberId);
            if (me && me.media_player_entity) _mwSelected = me.media_player_entity;
        }
        if (!_mwSelected && _mwPlayers.length) _mwSelected = _mwPlayers[0].entity_id;

        // Selected player may have been filtered out (e.g. MA-only list).
        if (_mwSelected && _mwSelected !== MW_PHONE && _mwPlayers.length
            && !_mwPlayers.some(p => p.entity_id === _mwSelected)) {
            _mwSelected = _mwPlayers[0].entity_id;
        }
        const sel = document.getElementById('mw-player');
        if (sel) {
            // Hide the phone's own HA entity from the remote list — "This
            // phone" is its canonical entry.
            const phoneEnt = _mwPhoneEntity();
            const remote = _mwPlayers.filter(p => !phoneEnt || p.entity_id !== phoneEnt.entity_id);
            const phoneLabel = _mwPhone.connecting ? '📱 This phone (connecting…)'
                : `📱 This phone (${_mwPhoneName().replace(/'s phone$/, '')})${_mwPhone.active ? ' ●' : ''}`;
            const phoneOption = window.SendspinPlayer
                ? `<option value="${MW_PHONE}" ${_mwSelected === MW_PHONE ? 'selected' : ''}>${phoneLabel}</option>`
                : '';
            const remoteOptions = remote.map(p =>
                `<option value="${_mwEsc(p.entity_id)}" ${p.entity_id === _mwSelected ? 'selected' : ''}>${_mwPlayerIcon(p)} ${_mwEsc(p.name)}</option>`).join('');
            sel.innerHTML = (phoneOption + remoteOptions)
                || '<option value="">No players found</option>';
        }
        if (_mwSelected === MW_PHONE) {
            mwRenderPhoneState();
            return;
        }
        const cur = _mwCurrent();
        const np = document.getElementById('mw-nowplaying');
        if (cur && (cur.media_title || cur.media_artist)) {
            np.style.display = 'flex';
            document.getElementById('mw-title').textContent = cur.media_title || '';
            document.getElementById('mw-artist').textContent = cur.media_artist || '';
            const art = document.getElementById('mw-art');
            if (cur.entity_picture) {
                // Only absolute https URLs load directly. HA-relative paths
                // resolve on the wrong origin, and absolute http:// URLs
                // (MA's LAN image proxy) are blocked as mixed content on an
                // https page (iOS Safari blocks silently) — both go through
                // the add-on's image proxy, base64url-encoded.
                const pic = cur.entity_picture;
                const src = pic.startsWith('http')
                    ? _mwProxied(pic)
                    : `${_mwApiBase}api/ha/image64/${btoa(pic).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '')}`;
                if (art.getAttribute('src') !== src) {
                    art.src = src;
                    art.style.display = 'block';
                } else if (!_mwArtErrorsShown.has(art.src)) {
                    art.style.display = 'block';
                }
            } else { art.style.display = 'none'; }
        } else if (np) {
            np.style.display = 'none';
        }
        const playing = cur && cur.state === 'playing';
        document.getElementById('mw-icon-play').style.display = playing ? 'none' : 'block';
        document.getElementById('mw-icon-pause').style.display = playing ? 'block' : 'none';
        const vol = document.getElementById('mw-volume');
        if (vol && cur && typeof cur.volume_level === 'number' && document.activeElement !== vol) {
            vol.value = cur.volume_level;
        }
    }

    function mwSelectPlayer(entityId) {
        _mwSelected = entityId;
        localStorage.setItem('chauffeur_music_player', entityId);
        if (entityId === MW_PHONE) mwStartPhonePlayer();
        mwRefresh();
    }

    async function mwCommand(command, extra = {}) {
        if (!_mwSelected) return;
        if (_mwSelected === MW_PHONE) {
            const p = _mwPhone.player;
            if (!p) {
                _mwToast('Phone player is reconnecting — try again in a second.');
                if (!_mwPhone.connecting) mwStartPhonePlayer();
                return;
            }
            try {
                if (command === 'volume_set' && typeof p.setVolume === 'function') {
                    p.setVolume(Math.round((extra.volume || 0) * 100));
                } else if (typeof p.sendCommand === 'function') {
                    p.sendCommand(command === 'previous' ? 'previous'
                        : command === 'next' ? 'next' : command);
                }
            } catch (e) { _mwToast('Command failed: ' + e.message); }
            return;
        }
        try {
            await fetch(`${_mwApiBase}api/ha/media_players/${encodeURIComponent(_mwSelected)}/command`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ command, ...extra })
            });
            setTimeout(mwRefresh, 600);
        } catch (e) { }
    }

    function mwTogglePlay() {
        if (_mwSelected === MW_PHONE) {
            mwCommand(_mwPhonePlaying() ? 'pause' : 'play');
            return;
        }
        const cur = _mwCurrent();
        mwCommand(cur && cur.state === 'playing' ? 'pause' : 'play');
    }

    function mwVolume(v) {
        clearTimeout(_mwVolDebounce);
        _mwVolDebounce = setTimeout(() => mwCommand('volume_set', { volume: parseFloat(v) }), 500);
    }

    function mwSearchDebounced() {
        clearTimeout(_mwSearchDebounce);
        const q = document.getElementById('mw-search').value.trim();
        if (!q) { document.getElementById('mw-results').style.display = 'none'; return; }
        _mwSearchDebounce = setTimeout(mwSearch, 450);
    }

    function _mwResultRow(item, fallbackType) {
        const type = item.media_type || fallbackType;
        const img = _mwImage(item);
        const sub = _mwSubtitle(item);
        const artHtml = img
            ? `<img src="${_mwEsc(img)}" loading="lazy" class="w-12 h-12 rounded-lg object-cover bg-gray-800 shrink-0" alt="">`
            : `<div class="w-12 h-12 rounded-lg bg-gray-800 flex items-center justify-center text-xl shrink-0">${_MW_TYPE_ICON[type] || '🎵'}</div>`;
        return `<button onclick="mwPlay('${_mwEsc(item.uri)}', '${_mwEsc(type)}')"
            class="w-full text-left px-3 py-2.5 bg-gray-900 hover:bg-gray-800 active:bg-gray-700 flex items-center gap-3">
            ${artHtml}
            <span class="min-w-0 flex-1">
                <span class="block text-[15px] text-white font-bold truncate">${_mwEsc(item.name)}</span>
                ${sub ? `<span class="block text-xs text-gray-400 truncate">${_mwEsc(sub)}</span>` : ''}
            </span>
            <span class="text-[10px] font-black uppercase tracking-wider text-gray-500 bg-gray-800 border border-gray-700 rounded px-1.5 py-0.5 shrink-0">${_mwEsc(type)}</span>
        </button>`;
    }

    async function mwSearch() {
        const input = document.getElementById('mw-search');
        const box = document.getElementById('mw-results');
        const q = input.value.trim();
        if (!q) { box.style.display = 'none'; return; }
        box.style.display = 'block';
        box.innerHTML = '<div class="p-3 text-gray-500 text-sm bg-gray-900">Searching…</div>';
        try {
            const res = await fetch(`${_mwApiBase}api/music/search?q=${encodeURIComponent(q)}&limit=8`);
            if (!res.ok) {
                const err = await res.json().catch(() => ({}));
                box.innerHTML = `<div class="p-3 text-red-400 text-sm bg-gray-900">${_mwEsc(err.detail || 'Search failed')}</div>`;
                return;
            }
            const data = await res.json();
            if (input.value.trim() !== q) return; // stale response
            const rows = [];
            [['tracks', 'track'], ['albums', 'album'], ['playlists', 'playlist'], ['artists', 'artist'], ['radio', 'radio']].forEach(([key, type]) => {
                (data[key] || []).slice(0, 5).forEach(item => rows.push(_mwResultRow(item, type)));
            });
            box.innerHTML = rows.join('') || '<div class="p-3 text-gray-500 text-sm bg-gray-900">No results</div>';
        } catch (e) {
            box.innerHTML = '<div class="p-3 text-red-400 text-sm bg-gray-900">Search failed</div>';
        }
    }

    async function _mwFetchFavorites(type, limit) {
        try {
            const res = await fetch(`${_mwApiBase}api/music/favorites?media_type=${type}&limit=${limit}`);
            if (!res.ok) return [];
            const data = await res.json();
            return data.items || data[type + 's'] || [];
        } catch (e) { return []; }
    }

    async function mwLoadFavorites() {
        const section = document.getElementById('mw-favorites-section');
        const shelf = document.getElementById('mw-favorites');
        const tracksSection = document.getElementById('mw-fav-tracks-section');
        const tracksBox = document.getElementById('mw-fav-tracks');
        if (!section || !shelf) return;
        const [playlists, albums, tracks] = await Promise.all([
            _mwFetchFavorites('playlist', 12),
            _mwFetchFavorites('album', 12),
            _mwFetchFavorites('track', 8),
        ]);
        const tiles = playlists.concat(albums).slice(0, 12);
        if (tiles.length) {
            section.style.display = 'block';
            shelf.innerHTML = tiles.map(item => {
                const img = _mwImage(item);
                const type = item.media_type || 'playlist';
                const artHtml = img
                    ? `<img src="${_mwEsc(img)}" loading="lazy" class="w-20 h-20 rounded-xl object-cover bg-gray-800 shadow-md" alt="">`
                    : `<div class="w-20 h-20 rounded-xl bg-gray-800 flex items-center justify-center text-2xl shadow-md">${_MW_TYPE_ICON[type] || '📻'}</div>`;
                return `<button onclick="mwPlay('${_mwEsc(item.uri)}', '${_mwEsc(type)}')" class="w-20 shrink-0 text-left active:opacity-70">
                    ${artHtml}
                    <span class="block text-[11px] text-gray-300 font-bold truncate mt-1">${_mwEsc(item.name)}</span>
                </button>`;
            }).join('');
        } else {
            section.style.display = 'none';
        }
        if (tracksSection && tracksBox) {
            if (tracks.length) {
                tracksSection.style.display = 'block';
                tracksBox.innerHTML = tracks.map(t => _mwResultRow(t, 'track')).join('');
            } else {
                tracksSection.style.display = 'none';
            }
        }
    }

    async function mwPlay(uri, mediaType) {
        document.getElementById('mw-results').style.display = 'none';
        document.getElementById('mw-search').value = '';
        if (!_mwSelected) return;
        let target = _mwSelected;
        if (target === MW_PHONE) {
            // Play requests go through MA targeting the phone's HA entity,
            // which appears shortly after the Sendspin client registers.
            const ent = _mwPhoneEntity();
            if (!ent) {
                if (!_mwPhone.active) {
                    _mwToast('Phone player is not connected — re-select "This phone" from the player list.');
                } else {
                    // Registered over Sendspin, but MA hides new players from
                    // HA by default — needs a one-time toggle per device.
                    const all = await fetch(`${_mwApiBase}api/ha/media_players?ma_only=false`)
                        .then(r => r.json()).catch(() => []);
                    console.warn('[phone-player] looking for', _mwPhoneName(),
                        'among players:', all.map(p => `${p.name} (${p.entity_id})`));
                    _mwToast(`One-time setup: in Music Assistant → Settings → Players → "${_mwPhoneName()}", enable "Expose this player to Home Assistant". Then try again.`);
                }
                return;
            }
            target = ent.entity_id;
        }
        try {
            await fetch(`${_mwApiBase}api/music/play`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ entity_id: target, media_id: uri, media_type: mediaType })
            });
            setTimeout(mwRefresh, 1200);
        } catch (e) { }
    }

    function startMusicWidget() {
        mwRefresh();
        mwLoadFavorites();
        if (_mwTimer) clearInterval(_mwTimer);
        _mwTimer = setInterval(() => {
            const el = document.getElementById('music-widget');
            if (document.visibilityState === 'visible' && el && el.offsetParent !== null) mwRefresh();
        }, 10000);
    }

    function _mwStopPhonePlayer() {
        if (_mwPhone.reconnectTimer) {
            clearTimeout(_mwPhone.reconnectTimer);
            _mwPhone.reconnectTimer = null;
        }
        _mwPhone.retries = 0;
        const p = _mwPhone.player;
        _mwPhone.player = null;
        _mwPhone.active = false;
        _mwPhone.state = null;
        if (p) {
            try { if (typeof p.disconnect === 'function') p.disconnect(); } catch (e) { }
        }
    }

    // Called by app.html when the logged-in member changes: the phone's MA
    // identity follows the member, so re-register under the new name/id.
    function mwOnMemberChanged() {
        if (!_mwPhone.player && !_mwPhone.connecting && _mwSelected !== MW_PHONE) return;
        _mwStopPhonePlayer();
        if (_mwSelected === MW_PHONE) {
            mwStartPhonePlayer();
        } else {
            mwRefresh();
        }
    }

    window.addEventListener('pagehide', () => _mwStopPhonePlayer());
</script>
<script type="module">
    // sendspin-js (Apache-2.0) — the official browser client MA's own web
    // player uses. Loaded as ESM from CDN, consistent with the no-build stack.
    try {
        const mod = await import('https://cdn.jsdelivr.net/npm/@sendspin/sendspin-js@3.2.1/+esm');
        window.SendspinPlayer = mod.SendspinPlayer || mod.default;
        if (window.SendspinPlayer && typeof mwRefresh === 'function') mwRefresh();
    } catch (e) {
        console.warn('sendspin-js failed to load; "This phone" player unavailable', e);
    }
</script>
