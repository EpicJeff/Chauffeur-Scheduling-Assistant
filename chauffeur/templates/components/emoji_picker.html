     actually FOR — a wall panel with no keyboard, and a phone in one hand —

                        cursor: pointer; text-align: center;
                    }
                    .ep-btn:hover, .ep-btn:focus { background: rgba(255,255,255,.12); outline: none; }
                    .ep-none { padding: 1.25rem .75rem; font-size: .8rem; opacity: .6; text-align: center; }
                    .ep-foot {
                        border-top: 1px solid #374151; padding: .4rem .5rem;
                        display: flex; gap: .4rem; align-items: center;
                    }
                    .ep-clear {
                        font-size: .7rem; font-weight: 700; border-radius: .4rem;
                        padding: .3rem .55rem; background: rgba(255,255,255,.07);
                        border: 0; color: inherit; cursor: pointer;
                    }
                </style>
                <div id="emoji-picker-back"></div>
                <div id="emoji-picker" role="dialog" aria-label="Pick an emoji">
                    <input id="emoji-picker-search" type="text" autocomplete="off"
                        placeholder="Search — car, cake, dog…">
                    <div id="emoji-picker-body"></div>
                    <div class="ep-foot">
                        <button type="button" class="ep-clear" id="emoji-picker-clear">Clear</button>
                        <span style="flex:1"></span>
                        <button type="button" class="ep-clear" id="emoji-picker-close">Close</button>
                    </div>
                </div>`;
            document.body.appendChild(root);
            root.querySelector('#emoji-picker-back').addEventListener('click', close);
            root.querySelector('#emoji-picker-close').addEventListener('click', close);
            // Clearing is a real answer for every field this opens from — an
            // icon override reverts to the type's own, an avatar goes back to
            // initials — and there is no way to type "nothing" into a picker.
            root.querySelector('#emoji-picker-clear').addEventListener('click', () => {
                if (state && state.onPick) state.onPick('');
                close();
            });
            const search = root.querySelector('#emoji-picker-search');
            search.addEventListener('input', () => draw(search.value));
            search.addEventListener('keydown', ev => {
                if (ev.key === 'Escape') close();
            });
            root.querySelector('#emoji-picker-body').addEventListener('click', ev => {
                const btn = ev.target.closest('.ep-btn');
                if (!btn || !state) return;
                const e = btn.getAttribute('data-e');
                remember(e);
                if (state.onPick) state.onPick(e);
                if (!state.multi) close();
                else draw(search.value);   // the recents row moves under the thumb
            });
            return root;
        }

        function gridHtml(items) {
            return '<div class="ep-grid">' + items.map(x =>
                `<button type="button" class="ep-btn" data-e="${esc(x)}"
                     title="${esc(x)}">${x}</button>`).join('') + '</div>';
        }

        function draw(query) {
            const body = document.getElementById('emoji-picker-body');
            if (!body) return;
            const q = String(query || '').trim().toLowerCase();
            if (q) {
                // Name match only — searching the GLYPHS would mean typing an
                // emoji to find an emoji, which is the problem this exists to
                // solve. Ranked so a whole word beats a fragment: "car" should
                // lead with 🚗 and not with a scorecard.
                const hits = [];
                for (const g of GROUPS) {
                    for (const it of g.items) {
                        const i = it.q.indexOf(q);
                        if (i < 0) continue;
                        const whole = new RegExp(`\\b${q.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')}\\b`)
                            .test(it.q);
                        hits.push({ e: it.e, rank: (whole ? 0 : 1) * 100 + i });
                    }
                }
                hits.sort((a, b) => a.rank - b.rank);
                const seen = new Set();
                const list = hits.map(h => h.e).filter(e => {
                    if (seen.has(e)) return false;
                    seen.add(e);
                    return true;
                });
                body.innerHTML = list.length
                    ? `<div class="ep-head">${list.length} match${list.length > 1 ? 'es' : ''}</div>`
                      + gridHtml(list)
                    : `<div class="ep-none">Nothing matches “${esc(q)}”.</div>`;
                return;
            }
            const mine = recent();
            body.innerHTML =
                (mine.length ? '<div class="ep-head">Recent</div>' + gridHtml(mine) : '')
                + GROUPS.map(g => `<div class="ep-head">${g.name}</div>`
                    + gridHtml(g.items.map(i => i.e))).join('');
        }

        // Beside the field, and pushed back on screen rather than off the
        // edge: these fields sit in narrow editor columns and in the right
        // half of a chat bubble, so "below and left-aligned" alone puts the
        // panel half off a phone every time.
        function place(anchor) {
            const el = document.getElementById('emoji-picker');
            const r = anchor && anchor.getBoundingClientRect
                ? anchor.getBoundingClientRect() : null;
            const w = el.offsetWidth, h = el.offsetHeight;
            const pad = 8;
            let left = r ? r.left : (window.innerWidth - w) / 2;
            let top = r ? r.bottom + 6 : (window.innerHeight - h) / 2;
            if (left + w > window.innerWidth - pad) left = window.innerWidth - w - pad;
            if (left < pad) left = pad;
            // Above the field when there is no room under it — the usual case
            // for a row near the bottom of a long editor.
            if (r && top + h > window.innerHeight - pad) {
                top = Math.max(pad, r.top - h - 6);
            }
            el.style.left = Math.round(left) + 'px';
            el.style.top = Math.round(top) + 'px';
        }

        function close() {
            state = null;
            const root = document.getElementById('emoji-picker-root');
            if (root) root.style.display = 'none';
        }

        function open(anchor, onPick, opts) {
            const root = shell();
            root.style.display = '';
            state = { onPick: onPick, multi: !!(opts && opts.multi), anchor: anchor };
            const search = document.getElementById('emoji-picker-search');
            search.value = '';
            draw('');
            place(anchor);
            // Focus only where a keyboard exists. Focusing a text field on a
            // wall panel pops the on-screen keyboard over the grid somebody
            // opened the picker to avoid using.
            if (!document.documentElement.hasAttribute('data-panel')) {
                setTimeout(() => search.focus(), 10);
            }
        }

        window.EmojiPicker = { open: open, close: close, recent: recent };

        document.addEventListener('keydown', ev => {
            if (ev.key === 'Escape' && state) close();
        });
        window.addEventListener('resize', () => {
            if (state) place(state.anchor);
        });
    })();
</script>
