<!-- The family map as a PAGE shows it: one map filling its container, a row of
     chips above it for the people Home Assistant knows only by zone, and the
     four global functions the including pages have always called.

     The drawing itself moved to `family_map_core.html` when the wall board's
     map tile needed the same markers from a different data source and without
     the drag handlers. This file is now that factory bound to this page's two
     elements — included by map.html (dashboard page) and app.html (PWA Map
     tab). Leaflet is still lazy-loaded from a CDN on the first
     initFamilyMap() call, so pages that never open the map pay nothing. -->
{% include 'components/family_map_core.html' %}
<div class="w-full h-full flex flex-col min-h-0">
    <div id="family-map-chips" class="flex gap-2 flex-wrap p-2 bg-gray-900 border-b border-gray-800 shrink-0 empty:hidden"></div>
    <div id="family-map" class="flex-1 min-h-[300px] z-0 bg-gray-800"></div>
</div>
<script>
    let _fmInstance = null;

    function _fmEnsureInstance() {
        if (!_fmInstance) {
            _fmInstance = FamilyMap.create(document.getElementById('family-map'), {
                chipsEl: document.getElementById('family-map-chips')
            });
        }
        return _fmInstance;
    }

    async function initFamilyMap(focusMemberId = null) {
        const inst = _fmEnsureInstance();
        await inst.ensure();
        await inst.refresh(null, focusMemberId);
    }

    async function refreshFamilyMap(focusMemberId = null) {
        if (!_fmInstance || !_fmInstance.map) return;
        await _fmInstance.refresh(null, focusMemberId);
    }

    function startFamilyMapPolling() {
        _fmEnsureInstance().startPolling(20000);
    }

    function stopFamilyMapPolling() {
        if (_fmInstance) _fmInstance.stopPolling();
    }
</script>
